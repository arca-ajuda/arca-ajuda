<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATL ARCAKIDS — ARCA d'Ajuda</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --teal:#0F6E56;--teal-d:#085041;--teal-l:#E1F5EE;--teal-m:#1D9E75;
    --coral:#D85A30;--coral-l:#FAECE7;--coral-d:#712B13;
    --amber:#BA7517;--amber-l:#FAEEDA;--amber-d:#633806;
    --blue:#185FA5;--blue-l:#E6F1FB;
    --text:#1F2A2E;--text-2:#5C6B70;--text-3:#93A0A4;
    --bg:#F5F7F6;--bg2:#EDF1EF;--card:#FFFFFF;--line:#E3E9E6;
    --radius:10px;--radius-lg:14px;--border:1px solid var(--line);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px}
  .hidden{display:none!important}

  #login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0F6E56,#085041);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}
  #login-card{background:#fff;border-radius:18px;padding:30px 26px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
  #login-card h1{font-size:20px;color:var(--teal-d);text-align:center;margin-bottom:2px}
  #login-card .sub{text-align:center;color:var(--text-2);font-size:12.5px;margin-bottom:20px}
  #login-card label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:12px 0 4px}
  #login-card input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:9px;padding:11px 14px;font-size:14px;font-weight:600}
  .btn-primary{background:var(--teal);color:#fff;width:100%;margin-top:18px}
  .btn-primary:hover{background:var(--teal-d)}
  .btn-ghost{background:none;color:var(--teal);border:1.5px solid var(--teal);width:100%;margin-top:9px}
  .btn-link{background:none;border:none;color:var(--text-2);font-size:12.5px;text-decoration:underline;margin-top:14px;width:100%}
  #login-msg{margin-top:12px;font-size:12.5px;text-align:center;min-height:16px}

  #app{display:none}
  header#top{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
  header#top .brand{font-weight:800;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  header#top select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 10px;font-weight:600;max-width:240px}
  header#top select option{color:#111}
  header#top .spacer{flex:1}
  .top-btn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600}
  .top-btn:hover{background:rgba(255,255,255,.28)}
  #cloud-pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.16)}

  nav#tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:var(--card);border-bottom:var(--border);padding:11px 12px;position:sticky;top:53px;z-index:40}
  nav#tabs button{--c:#0F6E56;border:1.5px solid transparent;border-radius:22px;padding:8px 15px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .15s ease;background:color-mix(in srgb, var(--c) 13%, #fff);color:var(--c)}
  nav#tabs button:hover{background:color-mix(in srgb, var(--c) 24%, #fff);transform:translateY(-1px)}
  nav#tabs button.active{background:var(--c);color:#fff;box-shadow:0 4px 10px color-mix(in srgb, var(--c) 45%, transparent)}
  nav#tabs button:nth-child(1){--c:#0F6E56}
  nav#tabs button:nth-child(2){--c:#185FA5}
  nav#tabs button:nth-child(3){--c:#B8791C}
  nav#tabs button:nth-child(4){--c:#7A3FB0}
  nav#tabs button:nth-child(5){--c:#D85A30}
  nav#tabs button:nth-child(6){--c:#1D9E75}
  nav#tabs button:nth-child(7){--c:#3B57A5}
  nav#tabs button:nth-child(8){--c:#C0398B}
  nav#tabs button:nth-child(9){--c:#C77A0A}
  nav#tabs button:nth-child(10){--c:#556074}
  nav#tabs button:nth-child(11){--c:#6B7A70}

  main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
  .section{display:none}
  .section.active{display:block}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .metric{background:var(--card);border:var(--border);border-radius:var(--radius-lg);padding:14px 16px}
  .metric .lbl{font-size:11.5px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .metric .val{font-size:24px;font-weight:800;margin-top:3px}
  .metric .sub{font-size:11.5px;color:var(--text-2);margin-top:2px}
  .val.green{color:var(--teal)} .val.red{color:var(--coral)} .val.blue{color:var(--blue)} .val.amber{color:var(--amber)}

  .card{background:var(--card);border:var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .card-title{font-size:15px;font-weight:700}
  .muted{color:var(--text-2);font-size:12.5px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-3);font-weight:700}
  tbody tr:hover{background:var(--bg2)}
  td.right,th.right{text-align:right}
  .table-wrap{overflow-x:auto}

  .btn-sm{border:none;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600}
  .btn-add{background:var(--teal);color:#fff}
  .btn-add:hover{background:var(--teal-d)}
  .btn-edit{background:var(--blue-l);color:var(--blue)}
  .btn-del{background:var(--coral-l);color:var(--coral-d)}
  .btn-neutral{background:var(--bg2);color:var(--text-2)}
  .chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .chip.green{background:var(--teal-l);color:var(--teal-d)}
  .chip.red{background:var(--coral-l);color:var(--coral-d)}
  .chip.amber{background:var(--amber-l);color:var(--amber-d)}
  .chip.blue{background:var(--blue-l);color:var(--blue)}

  .empty{padding:26px;text-align:center;color:var(--text-3);font-size:13px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filters input,.filters select{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}

  .overlay{position:fixed;inset:0;background:rgba(15,30,26,.5);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;z-index:200;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:600px;box-shadow:0 24px 60px rgba(0,0,0,.3);margin:auto}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:var(--border)}
  .modal-head .t{font-size:16px;font-weight:700}
  .modal-close{background:none;border:none;font-size:22px;color:var(--text-3);line-height:1}
  .modal-body{padding:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .fg{margin-bottom:12px}
  .fg label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:4px}
  .fg input,.fg select,.fg textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
  .fg textarea{resize:vertical;min-height:56px}
  .modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:var(--border);flex-wrap:wrap}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{border:1.5px solid var(--line);background:var(--card);color:var(--text-2);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600}
  .seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .sem-check{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
  .subt{font-size:12px;font-weight:700;color:var(--teal-d);text-transform:uppercase;letter-spacing:.4px;margin:4px 0 8px}

  /* calendário de dias */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
  .cal .h{font-size:10px;text-align:center;color:var(--text-3);font-weight:700;padding:2px}
  .cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:12px;border:1px solid var(--line);cursor:pointer;user-select:none}
  .cal .d.off{opacity:.28;cursor:default;border-color:transparent}
  .cal .d.na{opacity:.4;cursor:default;background:var(--bg2)}
  .cal .d.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
  .cal-mes{font-size:12.5px;font-weight:700;margin:10px 0 2px;color:var(--text-2)}
  .cal-flow{display:flex;flex-wrap:wrap;gap:14px}
  .cal-block{width:150px}
  .cal.mini{gap:2px;margin-top:2px}
  .cal.mini .d{font-size:10.5px;border-radius:5px}
  .cal.mini .h{font-size:9px}
  .cal.mini .cal-mes,.cal-block .cal-mes{font-size:11px;margin:0 0 2px}
  .subt2{font-size:12.5px;font-weight:700;color:var(--text);margin:2px 0 4px}
  .tag-nota{display:inline-block;margin-left:5px;background:#FFC400;color:#4A3400;font-weight:700;font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid #C79000;vertical-align:middle}
  .tag-lembrete{display:inline-block;margin-left:5px;background:#FF5A3C;color:#fff;font-weight:700;font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid #C0341C;vertical-align:middle}
  .mapa-wrap{overflow:auto;max-height:70vh;border:var(--border);border-radius:10px}
  table.mapa{border-collapse:separate;border-spacing:0;font-size:11px;min-width:100%}
  table.mapa th,table.mapa td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
  table.mapa th.wk{background:var(--teal-l);color:var(--teal-d);font-weight:700;padding:4px 2px;font-size:10.5px;position:sticky;top:0;z-index:3;white-space:nowrap}
  table.mapa th.dcol{background:var(--bg2);color:var(--text-2);padding:3px 0;min-width:30px;position:sticky;top:24px;z-index:3;font-weight:700}
  table.mapa th.dcol .lt{font-size:9px;color:var(--text-3);font-weight:600}
  table.mapa .stick{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;padding:5px 10px;min-width:150px;box-shadow:1px 0 0 var(--line)}
  table.mapa th.corner{z-index:5;background:var(--bg2)}
  table.mapa td.nm{font-size:12px;font-weight:600;white-space:nowrap}
  table.mapa td.cell{width:30px;height:26px}
  table.mapa td.cell.on{background:var(--teal)}
  table.mapa td.cell.on::after{content:"●";color:#fff;font-size:9px}
  table.mapa tr.totrow td{position:sticky;top:48px;z-index:2}
  table.mapa td.cnt{font-weight:800;color:var(--teal-d);height:26px}
  table.mapa tr.totrow td.stick{background:var(--card);z-index:4}
  .info{background:var(--blue-l);border:1px solid #cfe3f7;color:var(--blue);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px}

  #ajuda-fab{position:fixed;right:20px;bottom:20px;z-index:180;background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;border:none;border-radius:30px;padding:12px 18px;font-size:14px;font-weight:800;box-shadow:0 8px 22px rgba(15,110,86,.45);cursor:grab;user-select:none;touch-action:none;display:none}
  #ajuda-fab:hover{filter:brightness(1.06)}
  #ajuda-fab:active{cursor:grabbing}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1F2A2E;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:500;opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}
  #toast.err{background:var(--coral-d)}
  @media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-card">
    <h1>☀️ ATL ARCAKIDS</h1>
    <div class="sub">Gestão do ATL — ARCA d'Ajuda</div>
    <label>Email</label>
    <input type="email" id="lg-email" autocomplete="username" placeholder="atl.arcakids@gmail.com">

  <main>

<script>
/* ============================================================
   ATL ARCAKIDS — app autónoma (ARCA d'Ajuda)
   localStorage + espelho na cloud (Supabase, tabela atl_dados)
   ============================================================ */
const SUPA_URL = 'https://yfsyifypsrqnwkqkfrnm.supabase.co';
const SUPA_KEY = 'sb_publishable_AkzlMeHlYHDyl0HzeC7_qg__j_Y6C9W';

const LS = {
  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = n => '€ ' + (Number(n)||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid = () => 'x'+Math.random().toString(36).slice(2,9)+(performance.now()|0).toString(36);
const FORMAS_PAG = ['','Numerário','Cartão Pré-Pago (MB)','MB Way','Transferência','Multibanco (Entidade/Ref)','Cheque'];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_SEM=['D','S','T','Q','Q','S','S'];
const DIAS_SEM_FULL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
// feriados nacionais fixos (MM-DD) + Madeira (07-01, 12-26)
const FERIADOS=['01-01','04-25','05-01','06-10','08-15','10-05','11-01','12-01','12-08','12-25','07-01','12-26'];
let _toastT=null;
function toast(msg, ok=true){ const t=$('toast'); t.textContent=msg; t.className='show'+(ok?'':' err'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.className='',2600); }

/* ---------- Supabase auth ---------- */
let supaSession = LS.get('atl_supa_session');
let modoLocal = LS.get('atl_modo_local') || false;
async function supaAuthLogin(email, password){
  const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{ method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY}, body: JSON.stringify({email,password}) });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description||data.msg||data.error||'Email ou palavra-passe incorretos.');
  supaSession = data; LS.set('atl_supa_session', supaSession); return data;
}
async function supaSignup(email, password){
  const res = await fetch(`${SUPA_URL}/auth/v1/signup`,{ method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY}, body: JSON.stringify({email,password}) });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error_description||data.msg||data.error||'Não foi possível criar a conta.');
  if(data.access_token){ supaSession=data; LS.set('atl_supa_session', supaSession); } return data;
}
async function supaFetch(path, method='GET', body=null, extra=null){
  const headers={'apikey':SUPA_KEY,'Content-Type':'application/json'};
  headers['Authorization']='Bearer '+((supaSession&&supaSession.access_token)||SUPA_KEY);
  if(method!=='GET') headers['Prefer']='return=representation';
  if(extra) Object.assign(headers, extra);
  const opts={method,headers}; if(body) opts.body=JSON.stringify(body);
  const res=await fetch(`${SUPA_URL}/rest/v1/${path}`, opts);
  const text=await res.text(); if(!res.ok) throw new Error(text||('Erro '+res.status));
  return text?JSON.parse(text):null;
}
const CLOUD_ON = () => !modoLocal && supaSession && supaSession.access_token;
function ehChaveAtl(k){ return typeof k==='string' && k.indexOf('atl_')===0 && k!=='atl_supa_session' && k!=='atl_modo_local'; }
let _fila = Promise.resolve();
function cloudGuardar(chave, valor){
  if(!CLOUD_ON()) return;
  _fila = _fila.then(()=>supaFetch('atl_dados','POST',{chave, valor, atualizado_em:new Date().toISOString()},{'Prefer':'resolution=merge-duplicates'})).then(()=>marcaCloud(true)).catch(e=>{ console.warn('cloud guardar',chave,e); marcaCloud(false); });
}
function cloudApagar(chave){ if(!CLOUD_ON()) return; _fila=_fila.then(()=>supaFetch('atl_dados?chave=eq.'+encodeURIComponent(chave),'DELETE')).catch(e=>console.warn('cloud apagar',chave,e)); }
function save(k,v){ LS.set(k,v); if(ehChaveAtl(k)) cloudGuardar(k,v); }
function del(k){ LS.del(k); if(ehChaveAtl(k)) cloudApagar(k); }

// estrutura de preços (tudo editável, varia de ano para ano)
function precosDefault(){
  const packs = [1,2,3,4,5,6,7,8,9].map(n=>({id:uid(), label:n+(n===1?' semana':' semanas'), semanas:n, avulso:false, preco:0, descontoArca:0}));
  return {
    inscricoes:[ {id:uid(), label:'1 dia (avulso)', semanas:0, avulso:true, preco:0, descontoArca:0}, ...packs ],
    precoMes:0, descontoArcaMes:0,
    descontoIrmao:{tipo:'€', valor:0},
    campanhas:[],
    atividades:['Piscina','IlhaPark','Museu','Canoagem'].map(n=>({id:uid(),nome:n,preco:0})),
    alimentacaoDiaria:{almoco:0, lancheManha:0, lancheTarde:0},
    outros:['Seguro','Seguro acidentes pessoais','Camisola / t-shirt'].map(n=>({id:uid(),nome:n,preco:0})),
  };
}
function normalizaPrecos(p){
  p = p||{};
  if(!Array.isArray(p.inscricoes)||!p.inscricoes.length) p.inscricoes = precosDefault().inscricoes;
  p.inscricoes.forEach(x=>{ if(!x.id) x.id=uid(); if(x.descontoArca==null) x.descontoArca=0; });
  if(p.precoMes==null) p.precoMes=0; if(p.descontoArcaMes==null) p.descontoArcaMes=0;
  if(!p.descontoIrmao||typeof p.descontoIrmao!=='object') p.descontoIrmao={tipo:'€', valor:(p.descontoIrmaos||0)};
  if(!Array.isArray(p.campanhas)) p.campanhas=[];
  if(!Array.isArray(p.atividades)) p.atividades=precosDefault().atividades;
  if(!p.alimentacaoDiaria||typeof p.alimentacaoDiaria!=='object') p.alimentacaoDiaria={almoco:0,lancheManha:0,lancheTarde:0};
  if(!Array.isArray(p.outros)) p.outros=precosDefault().outros;
  p.atividades.forEach(x=>{ if(!x.id) x.id=uid(); });
  p.outros.forEach(x=>{ if(!x.id) x.id=uid(); });
  p.campanhas.forEach(x=>{ if(!x.id) x.id=uid(); });
  return p;
}

/* ---------- períodos: dias úteis, semanas ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function isFeriado(d){ return FERIADOS.includes(pad2(d.getMonth()+1)+'-'+pad2(d.getDate())); }
function isDiaUtil(d){ const w=d.getDay(); return w>=1 && w<=5 && !isFeriado(d); }
function parseD(s){ if(!s) return null; const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
// datas úteis (Date) de um período qualquer
function diasUteisDe(ed){
  if(!ed||!ed.dataInicio||!ed.dataFim) return [];
  const ini=parseD(ed.dataInicio), fim=parseD(ed.dataFim); const out=[];
  let d=new Date(ini); let guard=0;
  while(d<=fim && guard<400){ if(isDiaUtil(d)) out.push(new Date(d)); d.setDate(d.getDate()+1); guard++; }
  return out;
}
function semanasDe(ed){
  const dias=diasUteisDe(ed); if(!dias.length) return [];
  const semanas=[]; let atual=null;
  dias.forEach(d=>{ if(!atual){ atual={dias:[]}; } atual.dias.push(d); if(d.getDay()===5){ semanas.push(atual); atual=null; } });
  if(atual) semanas.push(atual);
  return semanas.map((s,i)=>{ const a=s.dias[0], b=s.dias[s.dias.length-1];
    return { id:'S'+(i+1), num:i+1, label:'Semana '+(i+1), periodo: `${a.getDate()}/${a.getMonth()+1} a ${b.getDate()}/${b.getMonth()+1}`, dias: s.dias.map(isoDate) }; });
}
function mesesDe(ed){ const dias=diasUteisDe(ed); const set=[];
  dias.forEach(d=>{ const key=d.getFullYear()+'-'+d.getMonth(); if(!set.find(x=>x.key===key)) set.push({key, mes:d.getMonth(), ano:d.getFullYear(), nome:MESES[d.getMonth()]+' '+d.getFullYear()}); });
  return set; }
// versões do período ativo
function diasUteisPeriodo(){ return diasUteisDe(getEdicao()); }
function semanasPeriodo(){ return semanasDe(getEdicao()); }
function mesesPeriodo(){ return mesesDe(getEdicao()); }

let _ajudaInit=false;
function initAjudaFab(){
  const fab=$('ajuda-fab'); if(!fab) return; fab.style.display='inline-flex';
  const pos=LS.get('atl_ajuda_pos'); if(pos&&pos.left!=null){ fab.style.left=pos.left+'px'; fab.style.top=pos.top+'px'; fab.style.right='auto'; fab.style.bottom='auto'; }
  if(_ajudaInit) return; _ajudaInit=true;
  let drag=false, moved=false, sx=0, sy=0, ox=0, oy=0;
  const down=e=>{ drag=true; moved=false; const p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY; const r=fab.getBoundingClientRect(); ox=r.left; oy=r.top; };
  const move=e=>{ if(!drag) return; const p=e.touches?e.touches[0]:e; const dx=p.clientX-sx, dy=p.clientY-sy; if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true; let nl=ox+dx, nt=oy+dy; nl=Math.max(4,Math.min(window.innerWidth-fab.offsetWidth-4,nl)); nt=Math.max(4,Math.min(window.innerHeight-fab.offsetHeight-4,nt)); fab.style.left=nl+'px'; fab.style.top=nt+'px'; fab.style.right='auto'; fab.style.bottom='auto'; if(e.cancelable)e.preventDefault(); };
  const up=()=>{ if(!drag) return; drag=false; if(moved){ const r=fab.getBoundingClientRect(); LS.set('atl_ajuda_pos',{left:Math.round(r.left),top:Math.round(r.top)}); } };
  fab.addEventListener('mousedown',down); document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  fab.addEventListener('touchstart',down,{passive:true}); document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up);
  fab.addEventListener('click',()=>{ if(!moved) abrirAjuda(); });
}

function popularEdicoes(){
  const sel=$('ed-sel'); sel.innerHTML='';
  if(!edicoes.length){ const o=document.createElement('option'); o.value=''; o.textContent='(sem períodos)'; sel.appendChild(o); return; }
  edicoes.forEach(e=>{ const o=document.createElement('option'); o.value=e.id; o.textContent=`${e.nome}${e.ano?' · '+e.ano:''}`; if(e.id===edicaoAtiva)o.selected=true; sel.appendChild(o); });
  const oa=document.createElement('option'); oa.value=ANO; oa.textContent='📅 Todo o ano (todos os períodos)'; if(edicaoAtiva===ANO)oa.selected=true; sel.appendChild(oa);
}
function onEdicaoChange(id){ edicaoAtiva=id; save('atl_edicao_ativa', id); renderAtual(); }

function abrirModalEdicao(ed){
  if(ed && ed.id===ANO) ed=null; // não se edita a vista anual
  const e = ed||{nome:'',ano:new Date().getFullYear(),dataInicio:'',dataFim:''};
  modal('Período do ATL', `
    <div class="info">Define o ATL pelas <b>datas</b>. As semanas e os dias úteis (sem fins de semana nem feriados) são gerados automaticamente.</div>
    <div class="grid2">
      <div class="fg"><label>Nome *</label><input id="e-nome" value="${esc(e.nome)}" placeholder="Ex: ATL de Verão"></div>
      <div class="fg"><label>Ano</label><input id="e-ano" type="number" value="${esc(e.ano)}"></div>
    </div>
    <div class="grid2">
      <div class="fg"><label>Data de início *</label><input id="e-ini" type="date" value="${esc(e.dataInicio)}"></div>
      <div class="fg"><label>Data de fim *</label><input id="e-fim" type="date" value="${esc(e.dataFim)}"></div>
    </div>`,
    [ ed?{txt:'Eliminar',cls:'btn-del',fn:()=>eliminarEdicao(ed.id)}:null,
      {txt:'Guardar',cls:'btn-add',fn:()=>guardarEdicao(ed?ed.id:null)} ]);
}
function guardarEdicao(id){
  const nome=$('e-nome').value.trim(); if(!nome){ toast('Dá um nome ao período.',false); return; }
  const ini=$('e-ini').value, fim=$('e-fim').value;
  if(ini&&fim&&parseD(ini)>parseD(fim)){ toast('A data de fim tem de ser depois do início.',false); return; }
  const obj={ id:id||uid(), nome, ano:parseInt($('e-ano').value)||'', dataInicio:ini, dataFim:fim };
  if(id){ const i=edicoes.findIndex(e=>e.id===id); if(i>=0) edicoes[i]=obj; } else edicoes.push(obj);
  edicaoAtiva = obj.id; save('atl_edicoes', edicoes); save('atl_edicao_ativa', edicaoAtiva);
  if(!id) setD(dadosVazios());
  fecharModal(); popularEdicoes(); renderAtual(); toast('Período guardado.');
}
function eliminarEdicao(id){
  const e=edicoes.find(x=>x.id===id); const nome=e?e.nome:'';
  // aviso duplo
  if(!confirm(`⚠️ ATENÇÃO\n\nVais eliminar o período "${nome}" e TODOS os seus dados (inscrições, despesas, receitas, funcionários…).\n\nEsta ação NÃO pode ser desfeita. Continuar?`)) return;
  const t=prompt(`Confirmação final.\n\nEscreve APAGAR (em maiúsculas) para eliminar definitivamente o período "${nome}":`);
  if((t||'').trim().toUpperCase()!=='APAGAR'){ toast('Cancelado — o período NÃO foi eliminado.'); return; }
  edicoes = edicoes.filter(x=>x.id!==id); del('atl_ed_'+id);
  if(edicaoAtiva===id) edicaoAtiva = edicoes[0]?edicoes[0].id:null;
  save('atl_edicoes', edicoes); save('atl_edicao_ativa', edicaoAtiva);
  fecharModal(); popularEdicoes(); renderAtual(); toast('Período eliminado.');
}

function precisaEdicao(el){
  if(edicaoAtiva) return false;
  el.innerHTML = `<div class="card"><div class="empty">Ainda não tens nenhum período do ATL.<br><br><button class="btn btn-primary" style="width:auto;padding:10px 18px" onclick="abrirModalEdicao()">+ Criar primeiro período</button></div></div>`;

}

/* ---------- totais ---------- */
function totais(){
  const d=getD();
  const totInscrito = d.criancas.reduce((s,c)=>s+(+c.valor||0),0);
  const totPago = d.criancas.reduce((s,c)=>s+(+c.pago||0),0);
  const outrasRec = d.receitas.reduce((s,r)=>s+(+r.valor||0),0);
  const despLancadas = d.despesas.reduce((s,x)=>s+(+x.valor||0),0);
  const custoEquipa = d.equipa.reduce((s,m)=>s+(+m.remuneracao||0),0);
  let custoAtiv, custoAlim;
  if(modoAno()){ custoAlim=edicoes.reduce((s,e)=>s+custoAlimentacaoPeriodo(e.id),0); custoAtiv=edicoes.reduce((s,e)=>s+custoAtividadesPeriodo(e.id),0); }
  else { custoAlim=custoAlimentacaoTotal(); custoAtiv=custoAtividadesTotal(); }
  const totDesp = despLancadas + custoEquipa + custoAtiv + custoAlim;
  const recTotal = totPago + outrasRec;
  return { d, totInscrito, totPago, outrasRec, despLancadas, custoEquipa, custoAtiv, custoAlim, totDesp, recTotal, pendente: Math.max(0, totInscrito-totPago), saldo: recTotal-totDesp };
}

function lerValoresDoDOM(){
  const d=getD(); const p=d.precos;
  document.querySelectorAll('[data-pk]').forEach(inp=>{ const pk=p.inscricoes.find(x=>x.id===inp.dataset.pk); if(!pk) return; const f=inp.dataset.f; pk[f]= f==='label'?inp.value : (parseFloat(inp.value)||0); });
  document.querySelectorAll('[data-cm]').forEach(inp=>{ const cm=p.campanhas.find(x=>x.id===inp.dataset.cm); if(!cm) return; const f=inp.dataset.f; if(f==='descontoPct')cm[f]=parseFloat(inp.value)||0; else if(f==='semanas')cm[f]=inp.value===''?'':(+inp.value); else cm[f]=inp.value; });
  document.querySelectorAll('[data-ex]').forEach(inp=>{ const grp=inp.dataset.ex; const a=p[grp].find(x=>x.id===inp.dataset.id); if(!a) return; a[inp.dataset.f]= inp.dataset.f==='preco'?(parseFloat(inp.value)||0):inp.value; });
  const dt=$('di-tipo'), dv=$('di-valor'); if(dt&&dv) p.descontoIrmao={tipo:dt.value, valor:parseFloat(dv.value)||0};
  const pmp=$('pm-preco'), pma=$('pm-arca'); if(pmp) p.precoMes=parseFloat(pmp.value)||0; if(pma) p.descontoArcaMes=parseFloat(pma.value)||0;
  const aa=$('al-almoco'), alm=$('al-lm'), alt=$('al-lt'); if(aa) p.alimentacaoDiaria={almoco:parseFloat(aa.value)||0, lancheManha:parseFloat(alm.value)||0, lancheTarde:parseFloat(alt.value)||0};
  return d;
}

function delPacote(id){ const d=lerValoresDoDOM(); d.precos.inscricoes=d.precos.inscricoes.filter(x=>x.id!==id); setD(d); renderPrecos(); }
function addCampanha(){ const d=lerValoresDoDOM(); d.precos.campanhas.push({id:uid(),nome:'Campanha',semanas:'',descontoPct:10,dataLimite:''}); setD(d); renderPrecos(); }
function delCampanha(id){ const d=lerValoresDoDOM(); d.precos.campanhas=d.precos.campanhas.filter(x=>x.id!==id); setD(d); renderPrecos(); }

function delExtra(grupo,id){ const d=lerValoresDoDOM(); d.precos[grupo]=d.precos[grupo].filter(x=>x.id!==id); setD(d); renderPrecos(); }

// preços por unidade
function precoDiaAvulso(){ const a=(getD().precos.inscricoes||[]).find(x=>x.avulso); return a?(+a.preco||0):0; }
function precoSemanas(n){ if(n<=0)return 0; const insc=getD().precos.inscricoes||[]; const e=insc.find(x=>!x.avulso&&+x.semanas===n); if(e)return +e.preco||0; const one=insc.find(x=>!x.avulso&&+x.semanas===1); return n*((one?+one.preco:0)||0); }
function descArcaSemanas(n){ if(n<=0)return 0; const e=(getD().precos.inscricoes||[]).find(x=>!x.avulso&&+x.semanas===n); return e?(+e.descontoArca||0):0; }
// campanha aplicável (pela contagem de semanas marcadas)
function campanhaAplicavel(c, ctx){
  const p=getD().precos; const dins = c.dataInscricao || hoje(); const nSem = ctx?ctx.semanas:(c.semanasSel||[]).length;
  return (p.campanhas||[]).find(cm=>{
    if(cm.dataLimite && dins > cm.dataLimite) return false;
    if(cm.semanas!=='' && cm.semanas!=null && +cm.semanas!==+nSem) return false;
    return true;
  });
}
// decomposição do valor
function breakdown(c){
  const p=getD().precos;
  const nDias=(c.avulsoDias||[]).length, nSem=(c.semanasSel||[]).length, nMes=(c.mesesSel||[]).length;
  const subtotal = nDias*precoDiaAvulso() + precoSemanas(nSem) + nMes*(+p.precoMes||0);
  // candidatos a desconto (não acumuláveis)
  const dAtleta = c.atleta ? (descArcaSemanas(nSem) + nMes*(+p.descontoArcaMes||0)) : 0;
  const di=p.descontoIrmao||{};
  const dIrmao = c.temIrmao ? (di.tipo==='%'? subtotal*((+di.valor||0)/100) : di.tipo==='€/semana'? (+di.valor||0)*nSem : (+di.valor||0)) : 0;
  let desconto=0, descontoLabel='';
  if(c.atleta && c.temIrmao){ if(dAtleta>=dIrmao){desconto=dAtleta;descontoLabel='atleta (o mais vantajoso)';} else {desconto=dIrmao;descontoLabel='irmão (o mais vantajoso)';} }
  else if(c.atleta){ desconto=dAtleta; descontoLabel='atleta'; }
  else if(c.temIrmao){ desconto=dIrmao; descontoLabel='irmão'; }
  let total = subtotal - desconto;
  let campanhaTxt='';
  const camp=campanhaAplicavel(c,{semanas:nSem});
  if(camp && (+camp.descontoPct||0)){ const dc=subtotal*((+camp.descontoPct||0)/100); total-=dc; campanhaTxt='−'+camp.descontoPct+'% '+(esc(camp.nome||'campanha')); }
  desconto = Math.round(desconto*100)/100;
  total = Math.max(0, Math.round(total*100)/100);
  return {subtotal:Math.round(subtotal*100)/100, desconto, descontoLabel, total, campanhaTxt, pendente:(c.atleta||c.temIrmao)&&!c.descontoVerificado};
}
function calcValor(c){ return breakdown(c).total; }
// conjunto de dias (iso) que uma criança frequenta: avulso + semanas + meses
function diasDaCriancaEm(c, semanas, diasUteis){
  const set=new Set(c.avulsoDias||[]);
  (c.semanasSel||[]).forEach(sid=>{ const s=semanas.find(x=>x.id===sid); if(s) s.dias.forEach(d=>set.add(d)); });
  if((c.mesesSel||[]).length){ diasUteis.forEach(d=>{ if((c.mesesSel||[]).includes(d.getMonth())) set.add(isoDate(d)); }); }
  return set;
}
function diasDaCrianca(c){ return diasDaCriancaEm(c, semanasPeriodo(), diasUteisPeriodo()); }
// ---------- custos automáticos: alimentação e atividades ----------
function precoDiaAlimentacaoDe(p){ const a=(p&&p.alimentacaoDiaria)||{}; return (+a.almoco||0)+(+a.lancheManha||0)+(+a.lancheTarde||0); }
function precoDiaAlimentacao(){ return precoDiaAlimentacaoDe(getD().precos); }
function custoAlimentacaoTotal(){ const d=getD(); const pd=precoDiaAlimentacao(); if(!pd) return 0; return d.criancas.reduce((s,c)=>s+pd*diasDaCrianca(c).size,0); }
// crianças do grupo QUE ESTÃO PRESENTES na data da atividade (se não estão, não contam)
function nCriancasAtividade(a){ const d=getD(); const grupo=a.grupo||'Todos'; return d.criancas.filter(c=>{ if(grupo!=='Todos' && (c.grupo||'')!==grupo) return false; return a.data && diasDaCrianca(c).has(a.data); }).length; }
function custoAtividade(a){ return (+a.precoCrianca||0)*nCriancasAtividade(a); }
function custoAtividadesTotal(){ return getD().atividades.reduce((s,a)=>s+custoAtividade(a),0); }
// versões por período (para a vista anual)
function custoAlimentacaoPeriodo(edId){
  const ed=edicoes.find(e=>e.id===edId); const d=LS.get('atl_ed_'+edId); if(!ed||!d) return 0;
  const p=normalizaPrecos(d.precos||{}); const pd=precoDiaAlimentacaoDe(p); if(!pd) return 0;
  const sem=semanasDe(ed), du=diasUteisDe(ed);
  return (d.criancas||[]).reduce((s,c)=>s+pd*diasDaCriancaEm(c,sem,du).size,0);
}
function custoAtividadesPeriodo(edId){
  const ed=edicoes.find(e=>e.id===edId); const d=LS.get('atl_ed_'+edId); if(!ed||!d) return 0;
  const sem=semanasDe(ed), du=diasUteisDe(ed);
  return (d.atividades||[]).reduce((s,a)=>{ const grupo=a.grupo||'Todos';
    const n=(d.criancas||[]).filter(c=>{ if(grupo!=='Todos'&&(c.grupo||'')!==grupo) return false; return a.data && diasDaCriancaEm(c,sem,du).has(a.data); }).length;
    return s+(+a.precoCrianca||0)*n; },0);
}

function renderMapaOcupacao(){

  const maxC = Math.max(1, ...Object.values(countDia));

// lista de crianças por semana (interseção dos dias frequentados com a semana)
function criancasPorSemana(){

function comprimirFicheiro(file){
  return new Promise(res=>{
    if(!file) return res(null);
    if(!(file.type||'').startsWith('image/')){ if(file.size>3*1024*1024){ toast('“'+file.name+'” é grande demais — envia uma foto.',false); return res(null); } const r=new FileReader(); r.onload=e=>res({name:file.name,dataUrl:e.target.result}); r.onerror=()=>res(null); r.readAsDataURL(file); return; }
    const r=new FileReader(); r.onload=e=>{ const orig=e.target.result; const img=new Image(); img.onload=()=>{ try{ const max=1200; let w=img.width,h=img.height; if(w>max||h>max){ if(w>=h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } } const cv=document.createElement('canvas'); cv.width=w||1; cv.height=h||1; cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); res({name:file.name.replace(/\.[^.]+$/,'')+'.jpg', dataUrl:cv.toDataURL('image/jpeg',0.55)}); }catch(err){ res({name:file.name, dataUrl:orig}); } }; img.onerror=()=>res({name:file.name, dataUrl:orig}); img.src=orig; }; r.onerror=()=>res(null); r.readAsDataURL(file);
  });
}

function renderBlocosInsc(){
  const box=$('c-blocos'); if(!box) return;
  const semanas=semanasPeriodo(), meses=mesesPeriodo();
  box.innerHTML = `
    <div class="subt2">🗓️ Dias avulso</div>

    ${semanas.length? semanas.map(s=>`<label class="sem-check"><input type="checkbox" class="ck-sem" value="${s.id}" ${(_cCur.semanasSel||[]).includes(s.id)?'checked':''} onchange="onSemanaSelChange()"> ${s.label} <span class="muted">(${s.periodo})</span></label>`).join('') : '<div class="muted">Sem semanas — define as datas do período.</div>'}
    <div class="subt2" style="margin-top:12px">🈷️ Meses inteiros</div>
    ${meses.length? meses.map(m=>`<label class="sem-check"><input type="checkbox" class="ck-mes" value="${m.mes}" ${(_cCur.mesesSel||[]).includes(m.mes)?'checked':''} onchange="onMesSelChange()"> ${m.nome}</label>`).join('') : '<div class="muted">Sem meses no período.</div>'}`;
}
function onSemanaSelChange(){ _cCur.semanasSel=[...document.querySelectorAll('.ck-sem:checked')].map(x=>x.value); atualizaSugestao(true); }
function onMesSelChange(){ _cCur.mesesSel=[...document.querySelectorAll('.ck-mes:checked')].map(x=>+x.value); atualizaSugestao(true); }
function calendarioDias(sel){
  const dias=diasUteisPeriodo(); if(!dias.length) return '<div class="muted">Sem dias úteis — define as datas do período.</div>';
  const porMes={};
  dias.forEach(d=>{ const k=d.getFullYear()+'-'+d.getMonth(); (porMes[k]=porMes[k]||[]).push(d); });
  const uteisSet=new Set(dias.map(isoDate));
  let h='<div class="cal-flow">';
  Object.keys(porMes).forEach(k=>{
    const arr=porMes[k]; const first=arr[0]; const y=first.getFullYear(), mo=first.getMonth();
    h+=`<div class="cal-block"><div class="cal-mes">${MESES[mo].slice(0,3)} ${y}</div><div class="cal mini">`;
    for(let i=0;i<7;i++) h+=`<div class="h">${DIAS_SEM[i]}</div>`;
    const primeiro=new Date(y,mo,1); const offset=primeiro.getDay(); const ndias=new Date(y,mo+1,0).getDate();
    for(let i=0;i<offset;i++) h+='<div class="d off"></div>';
    for(let dia=1;dia<=ndias;dia++){ const iso=y+'-'+pad2(mo+1)+'-'+pad2(dia); const util=uteisSet.has(iso); const on=sel.includes(iso);
      h+=`<div class="d ${util?(on?'on':''):'na'}" ${util?`onclick="toggleDia('${iso}')"`:''}>${dia}</div>`; }
    h+='</div></div>';
  });
  return h+'</div>';
}
function toggleDia(iso){ _cCur.avulsoDias=_cCur.avulsoDias||[]; const i=_cCur.avulsoDias.indexOf(iso); if(i>=0)_cCur.avulsoDias.splice(i,1); else _cCur.avulsoDias.push(iso); $('c-cal').innerHTML=calendarioDias(_cCur.avulsoDias); atualizaSugestao(true); }
function atualizaSugestao(preencher){
  const s=$('c-sugestao'); const vi=$('c-valor'); if(!s) return;
  const b=breakdown(_cCur);
  // preenche automaticamente o "valor a pagar" (a não ser que a admin o tenha alterado à mão)
  if(preencher && !_valorManual && vi){ vi.value = b.total>0? b.total : ''; }
  const pub=$('c-valor-pub'); if(pub){ pub.textContent=fmt(b.total); if(vi) vi.value=b.total; }
  if(b.subtotal<=0 && !b.desconto){ s.innerHTML='<span class="muted">Marca dias, semanas ou meses para calcular.</span>'; return; }
  const parts=['subtotal '+fmt(b.subtotal)];
  if(b.desconto>0) parts.push('−'+fmt(b.desconto)+' '+b.descontoLabel);
  if(b.campanhaTxt) parts.push(b.campanhaTxt);
  const dif = vi && (parseFloat(vi.value)||0)!==b.total;
  s.innerHTML=`Valor calculado: <b>${fmt(b.total)}</b>${dif?` <button type="button" class="btn-sm btn-neutral" style="padding:2px 6px" onclick="aplicarSugestao()">usar este valor</button>`:''}<div style="margin-top:2px">${parts.join(' · ')}</div>`;
  if(_modalCriancaNovo) capturarRascunhoInsc();
}
function aplicarSugestao(){ _valorManual=false; $('c-valor').value = calcValor(_cCur); atualizaSugestao(false); }

function renderDespesasAlimentacao(){
  const d=getD(); const p=d.precos.alimentacaoDiaria||{}; const pd=precoDiaAlimentacao();

  if(!dias.length) return `<div class="card"><div class="empty">Este período não tem datas. Define-as no período.</div></div>`;
  const att=d.criancas.map(diasDaCrianca);
  const rows=dias.map(dt=>{ const iso=isoDate(dt); const n=att.filter(s=>s.has(iso)).length; return {iso,n,custo:n*pd}; });

  const total=rows.reduce((s,r)=>s+r.custo,0);
  const totalCriancasDia=rows.reduce((s,r)=>s+r.n,0);
  return `
    <div class="cards">

    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">🍽️ Alimentação por dia</div>${pd===0?'<span class="chip amber">Define os valores em Valores → Alimentação diária</span>':''}</div>
      <div class="muted" style="margin-bottom:10px">Calcula-se sozinho: <b>nº de crianças presentes nesse dia × ${fmt(pd)}</b> (almoço + 2 lanches).</div>
      ${!comGente.length?'<div class="empty">Sem crianças inscritas em nenhum dia ainda.</div>':
      `<div class="table-wrap"><table><thead><tr><th>Dia</th><th class="right">Nº crianças</th><th class="right">€/criança</th><th class="right">Custo do dia</th></tr></thead><tbody>
      ${comGente.map(r=>`<tr><td>${esc(fmtData(r.iso))} <span class="muted">${DIAS_SEM_FULL[parseD(r.iso).getDay()]}</span></td><td class="right">${r.n}</td><td class="right">${fmt(pd)}</td><td class="right"><b>${fmt(r.custo)}</b></td></tr>`).join('')}
      <tr><td><b>TOTAL</b></td><td class="right"><b>${totalCriancasDia}</b></td><td></td><td class="right"><b>${fmt(total)}</b></td></tr>
      </tbody></table></div>`}
    </div>`;
}
// junta tudo: Despesas (manual) + Funcionários + Alimentação (calc/dia) + Atividades (calc)
function itensDespesa(){
  if(modoAno()) return itensDespesaAno();
  const d=getD(); const out=[];
  (d.despesas||[]).forEach(x=>out.push({data:x.data||'', valor:+x.valor||0, cat:x.cat||'Outros', desc:x.desc||'', tipo:'Despesa'}));
  (d.equipa||[]).forEach(m=>{ if(+m.remuneracao||0) out.push({data:'', valor:+m.remuneracao||0, cat:'Funcionários', desc:((m.cargo||'')+' '+(m.nome||'')).trim(), tipo:'Funcionário'}); });
  const pd=precoDiaAlimentacao();
  if(pd){ const att=d.criancas.map(diasDaCrianca); diasUteisPeriodo().forEach(dt=>{ const iso=isoDate(dt); const n=att.filter(s=>s.has(iso)).length; if(n) out.push({data:iso, valor:n*pd, cat:'Alimentação', desc:n+' criança(s) × '+fmt(pd), tipo:'Alimentação'}); }); }
  (d.atividades||[]).forEach(a=>{ const v=custoAtividade(a); if(v) out.push({data:a.data||'', valor:v, cat:'Atividades / Visitas', desc:(a.nome||'')+' ('+(a.grupo||'Todos')+' · '+nCriancasAtividade(a)+' crianças)', tipo:'Atividade'}); });
  return out;
}
function itensDespesaAno(){
  const out=[];
  edicoes.forEach(e=>{ const d=LS.get('atl_ed_'+e.id); if(!d) return; const nome=e.nome+(e.ano?(' '+e.ano):'');
    (d.despesas||[]).forEach(x=>out.push({data:x.data||'', valor:+x.valor||0, cat:x.cat||'Outros', desc:x.desc||'', tipo:'Despesa', _ed:nome}));
    (d.equipa||[]).forEach(m=>{ if(+m.remuneracao||0) out.push({data:'', valor:+m.remuneracao||0, cat:'Funcionários', desc:((m.cargo||'')+' '+(m.nome||'')).trim(), tipo:'Funcionário', _ed:nome}); });
    const fa=custoAlimentacaoPeriodo(e.id); if(fa) out.push({data:'', valor:fa, cat:'Alimentação', desc:'(calculado) '+nome, tipo:'Alimentação', _ed:nome});
    const at=custoAtividadesPeriodo(e.id); if(at) out.push({data:'', valor:at, cat:'Atividades / Visitas', desc:'(calculado) '+nome, tipo:'Atividade', _ed:nome});
  });
  return out;
}
function mesLabel(k){ if(k==='Sem data') return 'Sem data'; const p=k.split('-'); return MESES[(+p[1])-1]+' '+p[0]; }
function renderDespesasResumo(){
  const itens=itensDespesa();
  if(!itens.length) return '<div class="card"><div class="empty">Ainda não há despesas lançadas. Regista em Despesas, Atividades ou Funcionários.</div></div>';
  const total=itens.reduce((s,x)=>s+x.valor,0);
  const soma=(arr)=>arr.reduce((s,x)=>s+x.valor,0);
  // por categoria
  const porCat={}; itens.forEach(x=>porCat[x.cat]=(porCat[x.cat]||0)+x.valor);
  const catRows=Object.keys(porCat).sort((a,b)=>porCat[b]-porCat[a]);
  // por mês
  const porMes={}; itens.forEach(x=>{ const k=x.data?x.data.slice(0,7):'Sem data'; porMes[k]=(porMes[k]||0)+x.valor; });
  const mesRows=Object.keys(porMes).sort();
  // por semana (do período)
  const semanas=semanasPeriodo();
  const allWeek=new Set(); semanas.forEach(s=>s.dias.forEach(dd=>allWeek.add(dd)));
  const semRows=semanas.map(s=>{ const set=new Set(s.dias); return {label:s.label, periodo:s.periodo, v:itens.reduce((a,x)=>a+((x.data&&set.has(x.data))?x.valor:0),0)}; });
  const semSemData=itens.filter(x=>!x.data||( x.data && !allWeek.has(x.data))).reduce((a,x)=>a+x.valor,0);
  // por dia
  const porDia={}; itens.forEach(x=>{ const k=x.data||'Sem data'; porDia[k]=(porDia[k]||0)+x.valor; });
  const diaRows=Object.keys(porDia).sort((a,b)=> a==='Sem data'?1:b==='Sem data'?-1:a.localeCompare(b));
  const barra=(v)=>`<div style="height:6px;border-radius:4px;background:var(--coral);opacity:.85;width:${total>0?Math.max(3,Math.round(100*v/total)):0}%"></div>`;
  return `
    <div class="cards">
      <div class="metric" style="border-color:var(--coral)"><div class="lbl">Total de despesas</div><div class="val red">${fmt(total)}</div><div class="sub">${itens.length} lançamento(s)</div></div>
      <div class="metric"><div class="lbl">Média por dia com gastos</div><div class="val">${fmt(diaRows.filter(k=>k!=='Sem data').length? soma(itens.filter(x=>x.data))/diaRows.filter(k=>k!=='Sem data').length : 0)}</div></div>
      <div class="metric"><div class="lbl">Categorias com gastos</div><div class="val blue">${catRows.length}</div></div>
    </div>
    <div class="card"><div class="card-title">Por categoria</div>
      <div class="table-wrap"><table><thead><tr><th>Categoria</th><th style="width:120px"></th><th class="right">Total</th></tr></thead><tbody>
        ${catRows.map(c=>`<tr><td><span class="chip blue">${esc(c)}</span></td><td>${barra(porCat[c])}</td><td class="right"><b>${fmt(porCat[c])}</b></td></tr>`).join('')}
        <tr><td><b>TOTAL</b></td><td></td><td class="right"><b>${fmt(total)}</b></td></tr>
      </tbody></table></div>
    </div>
    <div class="card"><div class="card-title">Por mês</div>
      <div class="table-wrap"><table><thead><tr><th>Mês</th><th class="right">Total</th></tr></thead><tbody>
        ${mesRows.map(k=>`<tr><td>${esc(mesLabel(k))}</td><td class="right"><b>${fmt(porMes[k])}</b></td></tr>`).join('')}
      </tbody></table></div>
    </div>
    ${semanas.length?`<div class="card"><div class="card-title">Por semana ${modoAno()?'<span class="muted">(do período selecionado — escolhe um período p/ semanas)</span>':''}</div>
      <div class="table-wrap"><table><thead><tr><th>Semana</th><th>Período</th><th class="right">Total</th></tr></thead><tbody>
        ${semRows.map(s=>`<tr><td><b>${s.label}</b></td><td class="muted">${s.periodo}</td><td class="right"><b>${fmt(s.v)}</b></td></tr>`).join('')}
        ${semSemData>0?`<tr><td class="muted">Sem data / fora das semanas</td><td></td><td class="right">${fmt(semSemData)}</td></tr>`:''}
      </tbody></table></div>
    </div>`:''}
    <div class="card"><div class="card-title">Por dia</div>
      <div class="table-wrap"><table><thead><tr><th>Dia</th><th class="right">Total</th></tr></thead><tbody>
        ${diaRows.map(k=>`<tr><td>${k==='Sem data'?'<span class="muted">Sem data (ex.: funcionários)</span>':esc(fmtData(k))}</td><td class="right"><b>${fmt(porDia[k])}</b></td></tr>`).join('')}
      </tbody></table></div>
    </div>`;
}

function getConta(){ const c=LS.get('atl_conta')||{movimentos:[]}; if(!Array.isArray(c.movimentos)) c.movimentos=[]; return c; }
function setConta(c){ save('atl_conta', c); }
function saldoConta(){ return getConta().movimentos.reduce((s,m)=>s+(+m.valor||0),0); }
const CONTA_TIPOS=[ {t:'Depósito do cofre', sinal:1}, {t:'Transferência recebida', sinal:1}, {t:'Transferência enviada', sinal:-1}, {t:'Levantamento', sinal:-1}, {t:'Pagamento / débito', sinal:-1}, {t:'Outra entrada', sinal:1}, {t:'Outra saída', sinal:-1} ];
function renderConta(){
  const el=$('sec-conta'); const c=getConta();
  const movs=c.movimentos.slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a._i||0)-(b._i||0));
  let run=0; const linhas=movs.map(m=>{ run+=(+m.valor||0); return {m,saldo:run}; });
  const saldo=saldoConta();
  const entradas=movs.filter(m=>(+m.valor||0)>0).reduce((s,m)=>s+m.valor,0);
  const saidas=movs.filter(m=>(+m.valor||0)<0).reduce((s,m)=>s+m.valor,0);
  el.innerHTML=`
    <div class="cards">
      <div class="metric" style="border-color:var(--teal)"><div class="lbl">Saldo da conta bancária</div><div class="val ${saldo>=0?'green':'red'}">${fmt(saldo)}</div><div class="sub">${movs.length} movimento(s)</div></div>
      <div class="metric"><div class="lbl">Entradas</div><div class="val green">${fmt(entradas)}</div></div>
      <div class="metric"><div class="lbl">Saídas</div><div class="val red">${fmt(Math.abs(saidas))}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">🏦 Conta bancária</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn-sm btn-neutral" onclick="acertarSaldo()">✏️ Acertar saldo</button><button class="btn-sm btn-add" onclick="abrirModalMovConta()">+ Movimento</button></div></div>
      <div class="muted" style="margin-bottom:10px">Regista aqui os <b>depósitos do cofre</b> e as <b>transferências</b>. Usa <b>“Acertar saldo”</b> para pôr o valor que tens neste momento na conta (ex.: pelo extrato do banco).</div>
      ${!movs.length?'<div class="empty">Sem movimentos. Começa por “Acertar saldo” para pôr o valor atual da conta.</div>':
      `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Nota</th><th class="right">Valor</th><th class="right">Saldo</th><th></th></tr></thead><tbody>
      ${linhas.slice().reverse().map(({m,saldo})=>`<tr><td>${esc(fmtData(m.data)||'')}</td><td>${esc(m.tipo||'')}</td><td class="muted">${esc(m.desc||'')}</td><td class="right" style="color:${(+m.valor||0)>=0?'var(--teal)':'var(--coral)'};font-weight:700">${(+m.valor||0)>=0?'+':''}${fmt(m.valor)}</td><td class="right">${fmt(saldo)}</td>
        <td class="right"><button class="btn-sm btn-del" onclick="eliminarMovConta('${m.id}')">🗑️</button></td></tr>`).join('')}
      </tbody></table></div>`}
    </div>`;
}
function acertarSaldo(){
  const atual=saldoConta();
  modal('✏️ Acertar saldo da conta', `
    <div class="info">Escreve o valor que tens <b>neste momento</b> na conta bancária (ex.: pelo extrato). O programa cria um ajuste automático para acertar. Saldo atual registado: <b>${fmt(atual)}</b>.</div>
    <div class="grid2"><div class="fg"><label>Saldo atual real (€)</label><input id="ac-valor" type="number" step="0.01" value="${esc(atual)}"></div>
      <div class="fg"><label>Data</label><input id="ac-data" type="date" value="${hoje()}"></div></div>`,
    [ {txt:'Guardar',cls:'btn-add',fn:()=>{ const novo=parseFloat($('ac-valor').value); if(isNaN(novo)){ toast('Indica o valor.',false); return; } const dif=Math.round((novo-saldoConta())*100)/100; const c=getConta(); c.movimentos.push({id:uid(),_i:Date.now(),data:$('ac-data').value||hoje(),tipo:'Acerto de saldo',desc:'Saldo definido manualmente',valor:dif}); setConta(c); fecharModal(); renderConta(); toast('Saldo acertado.'); }} ]);
}
function abrirModalMovConta(){
  modal('Novo movimento da conta', `
    <div class="grid2"><div class="fg"><label>Tipo</label><select id="mv-tipo" onchange="mvSinalAuto()">${CONTA_TIPOS.map(x=>`<option>${x.t}</option>`).join('')}</select></div>
      <div class="fg"><label>Data</label><input id="mv-data" type="date" value="${hoje()}"></div></div>
    <div class="grid2"><div class="fg"><label>Sentido</label><select id="mv-sinal"><option value="1">Entrada (+)</option><option value="-1">Saída (−)</option></select></div>
      <div class="fg"><label>Valor (€)</label><input id="mv-valor" type="number" step="0.01" min="0"></div></div>
    <div class="fg"><label>Nota</label><input id="mv-nota" placeholder="Ex.: depósito do cofre da semana 1"></div>`,
    [ {txt:'Guardar',cls:'btn-add',fn:guardarMovConta} ]);
  mvSinalAuto();

function mvSinalAuto(){ const t=$('mv-tipo').value; const cfg=CONTA_TIPOS.find(x=>x.t===t); const s=$('mv-sinal'); if(cfg&&s) s.value=String(cfg.sinal); }
function guardarMovConta(){
  const v=parseFloat($('mv-valor').value); if(isNaN(v)||v<0){ toast('Indica um valor.',false); return; }
  const sinal=parseInt($('mv-sinal').value)||1; const c=getConta();
  c.movimentos.push({id:uid(),_i:Date.now(),data:$('mv-data').value||hoje(),tipo:$('mv-tipo').value,desc:$('mv-nota').value.trim(),valor:Math.round(v*sinal*100)/100});
  setConta(c); fecharModal(); renderConta(); toast('Movimento registado.');
}
function eliminarMovConta(id){ if(!confirm('Eliminar este movimento?'))return; const c=getConta(); c.movimentos=c.movimentos.filter(m=>m.id!==id); setConta(c); renderConta(); toast('Movimento eliminado.'); }

/* ---------- Lembrete de fecho de mês ---------- */
function verificarFimMes(){
  const t=new Date(); const y=t.getFullYear(), m=t.getMonth(), day=t.getDate();
  const lastDay=new Date(y,m+1,0).getDate();
  let alvo=null;
  if(day>=lastDay-2) alvo={y,m};
  else if(day<=7){ const pm=new Date(y,m-1,1); alvo={y:pm.getFullYear(),m:pm.getMonth()}; }
  if(!alvo) return;
  const key=alvo.y+'-'+pad2(alvo.m+1);
  if((LS.get('atl_lembreteMes')||'')===key) return;
  setTimeout(()=>lembreteFimMes(key, alvo), 600);
}
function lembreteFimMes(key, alvo){
  modal('📅 Fecho do mês — '+MESES[alvo.m]+' '+alvo.y, `
    <div class="info">Chegou o fim do mês. Convém <b>imprimir todos os movimentos de ${MESES[alvo.m]} ${alvo.y}</b> (receitas, despesas e conta) para arquivo.</div>
    <button class="btn btn-primary" style="width:auto;padding:11px 20px" onclick="imprimirMovimentosMes('${key}')">🖨️ Imprimir movimentos do mês</button>`,
    [ {txt:'✔️ Já tratei (não mostrar até ao próximo mês)',cls:'btn-neutral',fn:()=>{ save('atl_lembreteMes',key); fecharModal(); toast('Ok, até ao próximo mês.'); }} ]);
}
function imprimirMovimentosMes(key){
  const ed=getEdicao()||{}; const d=getD(); const conta=getConta();
  const noMes=x=>((x.data||'').slice(0,7)===key);
  const desp=(d.despesas||[]).filter(noMes); const rec=(d.receitas||[]).filter(noMes); const movs=(conta.movimentos||[]).filter(noMes);
  const tD=desp.reduce((s,x)=>s+(+x.valor||0),0), tR=rec.reduce((s,x)=>s+(+x.valor||0),0);
  const tabela=(tit,rows,cols)=> `<div class="sec">${tit}</div>`+(rows.length?`<table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p>Sem registos.</p>');
  const body=`<h1>Movimentos do mês — ${MESES[+key.slice(5,7)-1]} ${key.slice(0,4)}</h1>
    <div style="font-size:12px;color:#555;margin-bottom:6px">${esc(ed.nome||'')}${ed.ano?(' · '+ed.ano):''}</div>
    ${tabela('Receitas ('+fmt(tR)+')', rec, [['Data',r=>esc(fmtData(r.data))],['Categoria',r=>esc(r.cat||'')],['Descrição',r=>esc(r.desc||'')],['Valor',r=>fmt(r.valor)]])}
    ${tabela('Despesas ('+fmt(tD)+')', desp, [['Data',r=>esc(fmtData(r.data))],['Categoria',r=>esc(r.cat||'')],['Descrição',r=>esc(r.desc||'')],['Valor',r=>fmt(r.valor)]])}
    ${tabela('Conta bancária', movs, [['Data',r=>esc(fmtData(r.data))],['Tipo',r=>esc(r.tipo||'')],['Nota',r=>esc(r.desc||'')],['Valor',r=>((+r.valor||0)>=0?'+':'')+fmt(r.valor)]])}
    <div class="sec">Resumo</div><table><tr><th>Total receitas</th><td>${fmt(tR)}</td></tr><tr><th>Total despesas</th><td>${fmt(tD)}</td></tr><tr><th>Saldo atual da conta</th><td>${fmt(saldoConta())}</td></tr></table>`;
  abrirImpressao('Movimentos '+key, body);
}

function guardarCfg(){ const c=getCfg(); c.emailEnvio=$('cf-envio').value.trim(); c.emailNotif=$('cf-notif').value.trim(); c.emailDrive=$('cf-drive').value.trim(); setCfg(c); toast('Emails guardados.'); }
function carregarLogo(input){ const f=input.files&&input.files[0]; if(!f) return; if(f.size>2*1024*1024){ toast('Imagem muito grande (máx ~2 MB).',false); input.value=''; return; } const rd=new FileReader(); rd.onload=e=>{ const c=getCfg(); c.logo=e.target.result; setCfg(c); toast('Logótipo guardado.'); renderDefinicoes(); }; rd.readAsDataURL(f); }
function guardarAssoc(){ const c=getCfg(); const a=$('cf-assoc'); if(a) c.assocNome=a.value.trim()||"ARCA d'Ajuda"; const m=$('cf-morada'); if(m)c.assocMorada=m.value.trim(); const n=$('cf-nif'); if(n)c.assocNif=n.value.trim(); const ct=$('cf-contacto'); if(ct)c.assocContacto=ct.value.trim(); setCfg(c); toast('Guardado.'); renderDefinicoes(); }
function removerLogo(){ const c=getCfg(); c.logo=''; setCfg(c); toast('Logótipo removido.'); renderDefinicoes(); }
async function atualizarConta(){
  if(modoLocal || !CLOUD_ON()){ toast('Entra numa conta primeiro.',false); return; }
  const email=$('ac-email').value.trim(), pass=$('ac-pass').value; const body={}; if(email) body.email=email; if(pass) body.password=pass;
  if(!body.email && !body.password){ toast('Nada para alterar.',false); return; }
  try{ await fetch(`${SUPA_URL}/auth/v1/user`,{ method:'PUT', headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+supaSession.access_token}, body:JSON.stringify(body) }).then(async r=>{ const j=await r.json(); if(!r.ok) throw new Error(j.msg||j.error_description||'Falha.'); return j; });
    toast('Acesso atualizado.'); renderDefinicoes();
  }catch(e){ toast(e.message||'Falha ao atualizar.',false); }
}

/* ============================================================
   MODAL genérico
   ============================================================ */
function modal(title, bodyHTML, botoes){
  $('ov-title').textContent=title; $('ov-body').innerHTML=bodyHTML;
  const foot=$('ov-foot'); foot.innerHTML='';
  (botoes||[]).filter(Boolean).forEach(b=>{ const btn=document.createElement('button'); btn.className='btn-sm '+(b.cls||'btn-neutral'); btn.textContent=b.txt; btn.onclick=b.fn; foot.appendChild(btn); });
  const cancel=document.createElement('button'); cancel.className='btn-sm btn-neutral'; cancel.textContent='Cancelar'; cancel.onclick=fecharModal; foot.appendChild(cancel);
  $('ov').classList.add('open');
}
function fecharModal(){ $('ov').classList.remove('open'); _modalCriancaNovo=false; }
// clicar fora NÃO fecha (evita perder o que se está a escrever) — só fecha no × ou em Cancelar
$('ov').addEventListener('click', e=>{ if(e.target.id==='ov'){ const t=$('toast'); t.textContent='Usa "Cancelar" ou o × para fechar (assim não perdes o que escreveste).'; t.className='show'; clearTimeout(_toastT); _toastT=setTimeout(()=>t.className='',2600); } });
</script>
