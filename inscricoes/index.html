var LS_KEY = "arca_inscricoes_v1";

var Store = {
  refresh: function(formKey){
    state.loaded[formKey] = true;
    renderSidebar();
    if(state.view.name==="home") renderHome();
    if(state.view.name==="list" && state.view.formKey===formKey) renderList(formKey);
    if(state.view.name==="saved" && state.view.formKey===formKey) renderSaved(formKey, state.view.id);
  },

  /* ---------- local (localStorage) ---------- */
  localRead: function(){
    try{
      var raw = window.localStorage.getItem(LS_KEY);
      if(!raw) return {criancas:[], adultos:[], socios:[]};
      var parsed = JSON.parse(raw);
      return {
        criancas: parsed.criancas || [],
        adultos: parsed.adultos || [],
        socios: parsed.socios || []
      };
    }catch(e){ return {criancas:[], adultos:[], socios:[]}; }
  },
  localWrite: function(){
    if(state.storeMode!=="local" && state.storeMode!=="supa") return true;
    try{
      window.localStorage.setItem(LS_KEY, JSON.stringify({
        criancas: state.records.criancas,
        adultos: state.records.adultos,
        socios: state.records.socios,
        savedAt: new Date().toISOString()
      }));
      return true;
    }catch(e){
      state.storeMode = "memoria";
      return false;
    }
  },
  newId: function(){
    return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  },

  /* ---------- API comum ---------- */
  guardarDepoisDeMudar: function(formKey){
    if(state.storeMode==="supa") supaAgendarGravacao();
    Store.localWrite();
    Store.refresh(formKey);
  },
  add: function(formKey, payload){
    var ft = FORM_TYPES[formKey];
    if(state.storeMode==="cloud"){
      return state.db.collection(ft.collection).add(payload).then(function(ref){ return ref.id; });
    }
    if(state.storeMode==="supa"){
      var row = {
        epoca_ano: payload.epocaAno || null, numero_inscricao: payload.numeroInscricao || null,
        status: payload.status || "novo", origem: payload.origem || "app", dados: payload
      };
      return supaFetch(ft.collection, "POST", row).then(function(res){
        var novaLinha = res && res[0];
        var id = novaLinha ? novaLinha.id : Store.newId();
        var rec = Object.assign({id:id}, payload);
        state.records[formKey] = [rec].concat(state.records[formKey]);
        Store.localWrite();
        Store.refresh(formKey);
        return id;
      });
    }
    var id = Store.newId();
    var rec = Object.assign({id:id}, payload);
    state.records[formKey] = [rec].concat(state.records[formKey]);
    Store.guardarDepoisDeMudar(formKey);
    return Promise.resolve(id);
  },
  update: function(formKey, id, patch){
    var ft = FORM_TYPES[formKey];
    if(state.storeMode==="cloud"){
      return state.db.collection(ft.collection).doc(id).update(patch);
    }
    if(state.storeMode==="supa"){
      var existente = state.records[formKey].filter(function(r){ return r.id===id; })[0] || {};
      var mesclado = Object.assign({}, existente, patch);
      var row = {
        epoca_ano: mesclado.epocaAno || null, numero_inscricao: mesclado.numeroInscricao || null,
        status: mesclado.status || "novo", origem: mesclado.origem || existente.origem || "app",
        updated_at: new Date().toISOString(), dados: mesclado
      };
      return supaFetch(ft.collection + "?id=eq." + encodeURIComponent(id), "PATCH", row).then(function(){
        state.records[formKey] = state.records[formKey].map(function(r){ return r.id===id ? mesclado : r; });
        Store.localWrite();
        Store.refresh(formKey);
      });
    }
    state.records[formKey] = state.records[formKey].map(function(r){
      return r.id===id ? Object.assign({}, r, patch) : r;
    });
    Store.guardarDepoisDeMudar(formKey);
    return Promise.resolve();
  },
  remove: function(formKey, id){
    var ft = FORM_TYPES[formKey];
    if(state.storeMode==="cloud"){
      return state.db.collection(ft.collection).doc(id).delete();
    }
    if(state.storeMode==="supa"){
      return supaFetch(ft.collection + "?id=eq." + encodeURIComponent(id), "DELETE").then(function(){
        state.records[formKey] = state.records[formKey].filter(function(r){ return r.id!==id; });
        Store.localWrite();
        Store.refresh(formKey);
      });
    }
    state.records[formKey] = state.records[formKey].filter(function(r){ return r.id!==id; });
    Store.guardarDepoisDeMudar(formKey);
    return Promise.resolve();
  },
  /* linha da tabela -> objeto "achatado" como o resto do código espera */
  linhaParaRegisto: function(row){
    var rec = Object.assign({}, row.dados || {});
    rec.id = row.id;
    rec.numeroInscricao = row.numero_inscricao || rec.numeroInscricao;
    rec.epocaAno = row.epoca_ano || rec.epocaAno;
    rec.createdAt = row.created_at || rec.createdAt;
    rec.updatedAt = row.updated_at || rec.updatedAt;
    rec.status = row.status || rec.status || "confirmado";
    rec.origem = row.origem || rec.origem || "app";
    return rec;
  },
  carregarRegistosSupa: function(formKey){
    var ft = FORM_TYPES[formKey];
    return supaFetch(ft.collection + "?order=created_at.desc&limit=1000").then(function(rows){
      state.records[formKey] = (rows || []).map(Store.linhaParaRegisto);
      state.loaded[formKey] = true;
    });
  },
  /* Fichas guardadas antes de existirem as tabelas próprias (viviam num
     único bloco em config_app) — passa-as para lá uma única vez. Não
     apaga o bloco antigo, só deixa de ser a fonte usada pela aplicação. */
  migrarFichasAntigas: function(){
    return supaLer().then(function(valor){
      var tarefas = FORM_ORDER.map(function(k){
        var antigos = (valor && valor[k]) || [];
        if(!antigos.length) return Promise.resolve(0);
        var jaTem = {};
        state.records[k].forEach(function(r){ jaTem[(r.epocaAno||"")+"|"+(r.numeroInscricao||"")+"|"+(r.nomeAtleta||r.atlNome||"")] = true; });
        var porMigrar = antigos.filter(function(r){
          return !jaTem[(r.epocaAno||"")+"|"+(r.numeroInscricao||"")+"|"+(r.nomeAtleta||r.atlNome||"")];
        });
        var ft = FORM_TYPES[k];
        return porMigrar.reduce(function(p, rec){
          return p.then(function(){
            var row = {
              epoca_ano: rec.epocaAno || null, numero_inscricao: rec.numeroInscricao || null,
              status: rec.status || "confirmado", origem: "app", dados: rec
            };
            if(rec.createdAt) row.created_at = rec.createdAt;
            return supaFetch(ft.collection, "POST", row);
          });
        }, Promise.resolve()).then(function(){ return porMigrar.length; });
      });
      return Promise.all(tarefas);
    }).then(function(counts){
      var total = counts.reduce(function(a,b){ return a+b; }, 0);
      return Promise.all(FORM_ORDER.map(Store.carregarRegistosSupa)).then(function(){
        renderSidebar();
        if(state.view.name==="list") renderList(state.view.formKey);
        if(state.view.name==="home") renderHome();
        return total;
      });
    });
  },

  /* ---------- Supabase ---------- */
  startSupa: function(){
    state.storeMode = "supa";
    state.sync = "ok";
    // mostra já o que estiver guardado neste dispositivo, para abrir depressa
    var localData = Store.localRead();
    FORM_ORDER.forEach(function(k){ state.records[k] = localData[k] || []; });
    try{ var rawDef = window.localStorage.getItem(LS_SETTINGS); if(rawDef) state.settings = JSON.parse(rawDef); }catch(e){}
    applyBranding(); rebuildFormTypes();

    var carregarDefinicoes = supaLer().then(function(valor){
      if(valor && valor.definicoes) state.settings = valor.definicoes;
      applyBranding();
      rebuildFormTypes();
      return supaGravarConfigPublica().catch(function(){});
    });
    var carregarRegistos = Promise.all(FORM_ORDER.map(Store.carregarRegistosSupa));

    return Promise.all([carregarDefinicoes, carregarRegistos]).then(function(){
      Store.localWrite();
      renderSidebar();
      navTo(state.view.name==="login" ? {name:"home"} : state.view);
      atualizarEstadoLigacao();
    }).catch(function(err){
      if(err && (err.code===401 || String(err.message).indexOf("sessão")>-1 || String(err.message).indexOf("nao_autorizado")>-1)){
        supaLimparSessao();
        navTo({name:"login"});
        return;
      }
      // sem rede: fica a trabalhar com o que está no dispositivo
      state.sync = "erro";
      FORM_ORDER.forEach(function(k){ state.loaded[k] = true; });
      renderSidebar();
      navTo(state.view);
      atualizarEstadoLigacao();
    });
  },

  attachCloud: function(formKey){
    var ft = FORM_TYPES[formKey];
    state.db.collection(ft.collection).orderBy("createdAt","desc").limit(500).onSnapshot(function(snap){
      state.records[formKey] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      Store.refresh(formKey);
    }, function(err){ console.error("db error", formKey, err); });
  },

  startLocal: function(){
    var canStore = true;
    try{ window.localStorage.setItem("__arca_test","1"); window.localStorage.removeItem("__arca_test"); }
    catch(e){ canStore = false; }
    state.storeMode = canStore ? "local" : "memoria";
    var data = canStore ? Store.localRead() : {criancas:[], adultos:[], socios:[]};
    FORM_ORDER.forEach(function(k){
      state.records[k] = data[k] || [];
      state.loaded[k] = true;
    });
    loadSettings();
    renderSidebar();
    navTo(state.view);
  },

  /* ---------- cópia de segurança ---------- */
  exportBackup: function(){
    var payload = {
      aplicacao: "ARCA d'Ajuda — Fichas de inscrição",
      versao: 1,
      exportadoEm: new Date().toISOString(),
      criancas: state.records.criancas,
      adultos: state.records.adultos,
      socios: state.records.socios,
      definicoes: {config: getConfig(), driveFolderId: state.settings.driveFolderId, driveAtivo: state.settings.driveAtivo}
    };
    Downloader.save("arca_copia_seguranca_"+todayISO()+".json", JSON.stringify(payload,null,2), "application/json");
  },
  importBackup: function(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var parsed = JSON.parse(reader.result);
        var added = 0;
        FORM_ORDER.forEach(function(k){
          var incoming = parsed[k] || [];
          var existing = {};
          state.records[k].forEach(function(r){ existing[r.id] = true; });
          incoming.forEach(function(r){
            if(!r.id) r.id = Store.newId();
            if(!existing[r.id]){ state.records[k].push(r); added++; }
          });
          state.records[k].sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
        });
        Store.localWrite();
        if(parsed.definicoes && parsed.definicoes.config && !state.settings.config){
          saveSettings({config: parsed.definicoes.config}).catch(function(){});
        }
        renderSidebar();
        navTo({name:"home"});
        alertBanner(added + " ficha(s) importadas da cópia de segurança.");
      }catch(e){
        alertBanner("Não foi possível ler o ficheiro de cópia de segurança.");
      }
    };
    reader.readAsText(file);
  }
};

/* ============================================================
   DESCARREGAR FICHEIROS (nuvem ou navegador)
   ============================================================ */
var Downloader = {
  save: function(filename, content, mime){
    if(state.downloads){
      return state.downloads.save({filename:filename, data:content});
    }
    try{
      var blob = new Blob([content], {type: mime || "text/plain;charset=utf-8"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
      return Promise.resolve({status:"saved"});
    }catch(e){
      return Promise.reject({code:"unavailable", message:"Descarregamento indisponível nesta janela."});
    }
  },
  available: function(){
    return !!state.downloads || state.storeMode!=="cloud";
  }
};

/* ============================================================
   ARRANQUE
   ============================================================ */
function init(){
  renderSidebar();
  renderHome();

  if(!window.claude || !window.claude.use){
    // fora da Claude: base de dados da associação (Supabase), como as outras aplicações
    if(SUPA_URL && SUPA_KEY){
      supaLerSessao();
      if(supaSession && supaSession.refresh_token){
        state.storeMode = "supa";
        Store.startSupa();
      } else {
        state.storeMode = "supa";
        navTo({name:"login"});
      }
      return;
    }
    Store.startLocal();
    return;
  }

  var settled = false;
  var fallback = setTimeout(function(){
    if(!settled){ settled = true; Store.startLocal(); }
  }, 10000);

  window.claude.use("db").then(function(db){
    if(settled) return;
    settled = true; clearTimeout(fallback);
    if(!db){ Store.startLocal(); return; }
    state.db = db;
    state.storeMode = "cloud";
    FORM_ORDER.forEach(Store.attachCloud);
    loadSettings();
    renderSidebar();
    navTo(state.view);
  }).catch(function(){
    if(settled) return;
    settled = true; clearTimeout(fallback);
    Store.startLocal();
  });

  window.claude.use("downloads").then(function(d){
    state.downloads = d;
    if(state.view.name==="list") renderList(state.view.formKey);
  }).catch(function(){});

  window.claude.use("mcp").then(function(m){
    state.mcp = m;
    if(state.view.name==="list") renderList(state.view.formKey);
    if(state.view.name==="settings") renderSettings();
  }).catch(function(){});
}

document.addEventListener("change", function(e){
  if(e.target && e.target.id==="importFile" && e.target.files && e.target.files[0]){
    Store.importBackup(e.target.files[0]);
    e.target.value = "";
  }
});

init();
})();
</script>
