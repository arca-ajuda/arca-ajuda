<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscrições — ARCA d Ajuda</title>
<style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:14px;color-scheme:light dark}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Inscrições ARCA d'Ajuda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f2f4ec;
  --surface:#ffffff;
  --surface-2:#e8ede1;
  --ink:#16241c;
  --ink-muted:#54634f;
  --border:#d6ddc9;
  --border-strong:#c1cab0;
  --primary:#1f6b48;
  --primary-dark:#123c29;
  --primary-contrast:#f2fbf4;
  --accent:#c8871f;
  --accent-dark:#9c6a17;
  --danger:#a8442d;
  --danger-bg:#f7e6e0;
  --focus:#2f8f63;
  --c-criancas:#b8781f;
  --c-criancas-bg:#f6ecd9;
  --c-adultos:#1f6b48;
  --c-adultos-bg:#e2eee3;
  --c-socios:#2b6e8a;
  --c-socios-bg:#e2eef3;
  --shadow: 0 1px 2px rgba(20,30,20,.06), 0 8px 24px -12px rgba(20,30,20,.18);
  --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --font-body:'Archivo', 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10201a;
    --surface:#16281f;
    --surface-2:#1c3226;
    --ink:#eef1ea;
    --ink-muted:#a9baa6;
    --border:#2c4536;
    --border-strong:#3a5943;
    --primary:#4bab7c;
    --primary-dark:#2f7a56;
    --primary-contrast:#0d1e15;
    --accent:#e3ad4c;
    --accent-dark:#c08a2e;
    --danger:#e2836a;
    --danger-bg:#3a241d;
    --focus:#5fc496;
    --c-criancas:#e3ad4c;
    --c-criancas-bg:#3a2f18;
    --c-adultos:#4bab7c;
    --c-adultos-bg:#1b3327;
    --c-socios:#5fb0d1;
    --c-socios-bg:#17303b;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#10201a;
  --surface:#16281f;
  --surface-2:#1c3226;
  --ink:#eef1ea;
  --ink-muted:#a9baa6;
  --border:#2c4536;
  --border-strong:#3a5943;
  --primary:#4bab7c;
  --primary-dark:#2f7a56;
  --primary-contrast:#0d1e15;
  --accent:#e3ad4c;
  --accent-dark:#c08a2e;
  --danger:#e2836a;
  --danger-bg:#3a241d;
  --focus:#5fc496;
  --c-criancas:#e3ad4c;
  --c-criancas-bg:#3a2f18;
  --c-adultos:#4bab7c;
  --c-adultos-bg:#1b3327;
  --c-socios:#5fb0d1;
  --c-socios-bg:#17303b;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.5;
}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;}
a{color:var(--primary);}
button{font-family:inherit;}
::selection{background:var(--accent);color:#1a1204;}

.tabular{font-variant-numeric:tabular-nums;}
.mono{font-family:var(--font-mono);}

/* ---------- app shell ---------- */
#appRoot{display:flex;flex-direction:column;min-height:100vh;}

.topbar{
  display:flex;align-items:center;gap:14px;
  padding:14px 22px;background:var(--primary-dark);color:var(--primary-contrast);
  border-bottom:3px solid var(--accent);
}
.topbar .crest{
  width:38px;height:38px;border-radius:50%;background:var(--accent);color:#241a08;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
  font-weight:800;font-size:16px;flex:none;overflow:hidden;
}
.topbar .crest.has-logo{background:#fff;border-radius:8px;width:auto;height:42px;padding:3px 6px;}
.topbar .crest img{max-height:36px;max-width:150px;display:block;object-fit:contain;}
.logo-drop{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  border:1px dashed var(--border-strong);border-radius:12px;padding:16px;background:var(--bg);
}
.logo-preview{
  width:150px;height:100px;border-radius:8px;background:#fff;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;
}
.logo-preview img{max-width:138px;max-height:88px;object-fit:contain;}
.logo-preview .empty{font-size:11px;color:#8a948a;text-align:center;padding:6px;}
.file-btn{position:relative;overflow:hidden;display:inline-flex;}
.file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0;}
.ps-logo{max-height:38px;max-width:120px;object-fit:contain;display:block;}
.topbar .titles{display:flex;flex-direction:column;gap:1px;min-width:0;}
.topbar h1{font-size:20px;color:#fff;line-height:1.1;}
.topbar .sub{font-size:11.5px;color:#cfe4d6;letter-spacing:.02em;}
.topbar .meta{
  margin-left:auto;text-align:right;font-family:var(--font-mono);font-size:10.5px;
  color:#bcd9c7;line-height:1.5;white-space:nowrap;
}

.shell{display:flex;flex:1;min-height:0;}

.sidebar{
  width:230px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  padding:18px 14px;display:flex;flex-direction:column;gap:22px;
}
.nav-group-label{
  font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-muted);margin:0 0 8px 4px;
}
.nav-list{display:flex;flex-direction:column;gap:5px;}
.nav-btn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 10px;border-radius:9px;border:1px solid transparent;background:none;
  color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:600;
}
.nav-btn:hover{background:var(--surface-2);}
.nav-btn.active{background:var(--surface-2);border-color:var(--border-strong);}
.nav-btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
}
.dot{width:10px;height:10px;border-radius:50%;flex:none;}
.nav-count{
  margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);
  background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:1px 7px;
}
.sidebar-footer{
  margin-top:auto;padding-top:14px;border-top:1px solid var(--border);
  font-size:10.8px;color:var(--ink-muted);line-height:1.6;
}

.main{flex:1;min-width:0;padding:26px 30px 60px;overflow-y:auto;}
.main-inner{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:22px;}

.status-banner{
  border:1px solid var(--border-strong);background:var(--surface-2);border-radius:10px;
  padding:10px 14px;font-size:12.5px;color:var(--ink-muted);display:flex;gap:8px;align-items:center;
}
.status-banner.warn{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
.status-banner .pulse{width:8px;height:8px;border-radius:50%;background:var(--focus);flex:none;}
.status-banner.warn .pulse{background:var(--danger);}

/* ---------- home ---------- */
.hero-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.hero-row h2{font-size:26px;color:var(--ink);}
.hero-row p{margin:4px 0 0;color:var(--ink-muted);font-size:13.5px;max-width:60ch;}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
.type-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
}
.type-card .bar{height:6px;}
.type-card .body{padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px;flex:1;}
.type-card h3{font-size:19px;}
.type-card p{margin:0;color:var(--ink-muted);font-size:12.5px;line-height:1.5;min-height:38px;}
.type-card .count{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted);}
.type-card .count b{color:var(--ink);font-size:15px;}
.btn{
  appearance:none;border:1px solid transparent;border-radius:9px;padding:9px 14px;
  font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{background:var(--primary);color:var(--primary-contrast);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:none;border-color:var(--border-strong);color:var(--ink);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:none;border-color:var(--danger);color:var(--danger);}
.btn-danger:hover{background:var(--danger-bg);}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.summary-strip{
  display:flex;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 18px;
}
.summary-item{display:flex;flex-direction:column;gap:2px;}
.summary-item .n{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1;}
.summary-item .l{font-size:11px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em;}

/* ---------- form ---------- */
.form-header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:3px solid var(--type-color, var(--primary));
}
.form-header h2{font-size:24px;}
.form-header .badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--type-bg);color:var(--type-color);
  margin-bottom:6px;
}
.form-header .fees{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted);}

.section{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;
  box-shadow:var(--shadow);
}
.section h3{
  font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--type-color,var(--primary));
  margin-bottom:14px;padding-bottom:8px;border-bottom:1px dashed var(--border-strong);
}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px;}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;}
.field.span2{grid-column:span 2;}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-muted);}
.field label .req{color:var(--danger);margin-left:2px;}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=date],.field textarea{
  border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;background:var(--bg);
  color:var(--ink);font-size:13.5px;font-family:var(--font-body);width:100%;
}
.field input:focus,.field textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus);}
.field.invalid input,.field.invalid textarea{border-color:var(--danger);}
.field .err{font-size:11px;color:var(--danger);display:none;}
.field input.readonly{background:var(--surface-2);color:var(--ink-muted);font-family:var(--font-mono);}
.drive-pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border-radius:20px;background:var(--c-socios-bg);color:var(--c-socios);text-decoration:none;
}
.drive-pill.pending{background:var(--surface-2);color:var(--ink-muted);}
.field.invalid .err{display:block;}
.check-grid.invalid,.radio-row.invalid,.consent-item.invalid{
  border-left:3px solid var(--danger);padding-left:10px;border-radius:3px;background:var(--danger-bg);
}
.note-block{
  grid-column:1/-1;font-size:12px;color:var(--ink-muted);background:var(--surface-2);
  border-radius:8px;padding:9px 12px;line-height:1.5;
}
.check-grid{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;}
.check-item{display:flex;align-items:center;gap:7px;font-size:13px;}
.check-item input{width:16px;height:16px;accent-color:var(--type-color,var(--primary));flex:none;}
.check-item input.outra-input{width:auto;height:auto;margin-left:4px;min-width:150px;max-width:220px;border:1px solid var(--border-strong);border-radius:7px;padding:5px 8px;background:var(--bg);color:var(--ink);font-size:13px;font-family:var(--font-body);}
.check-item input.outra-input:disabled{opacity:.5;}
.radio-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px;}
.radio-item{display:flex;align-items:center;gap:7px;font-size:13px;}
.radio-item input{width:16px;height:16px;accent-color:var(--type-color,var(--primary));}
.declaration-text{
  grid-column:1/-1;font-size:11.8px;color:var(--ink-muted);white-space:pre-line;line-height:1.6;
  max-height:180px;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;
}
.consent-item{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;}
.consent-item>.check-item{font-weight:600;}
.channels{display:flex;flex-wrap:wrap;gap:14px;margin-left:24px;}

.form-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:4px;}

/* ---------- desconto ---------- */
.field input[type=number]{
  border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;background:var(--bg);
  color:var(--ink);font-size:13.5px;font-family:var(--font-mono);width:100%;
}
.desconto-box{
  grid-column:1/-1;border:1px dashed var(--border-strong);border-radius:10px;padding:12px 14px;
  background:var(--surface-2);display:flex;flex-direction:column;gap:10px;
}
.desconto-head{display:flex;flex-direction:column;gap:3px;}
.desconto-head .lead{font-size:12.5px;font-weight:700;color:var(--type-color,var(--primary));}
.desconto-head .hint{font-size:11.5px;color:var(--ink-muted);line-height:1.45;max-width:70ch;}
.desconto-linhas{display:flex;flex-direction:column;gap:8px;}
.desc-linha{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;}
.desc-linha .check-item{font-weight:600;}
.desc-linha input[type=text]{
  flex:1;min-width:200px;max-width:360px;border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;
  background:var(--bg);color:var(--ink);font-size:13px;font-family:var(--font-body);
}
.desc-linha input[type=text]:disabled{opacity:.5;}
.desconto-total{font-size:13px;padding-top:6px;border-top:1px solid var(--border);}
.desconto-total .muted{color:var(--ink-muted);font-size:12px;}
.desconto-total s{color:var(--ink-muted);}
.desc-sugestoes{display:none;flex-direction:column;gap:6px;}
.sug{
  display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;
  font-size:12.5px;background:var(--c-socios-bg);color:var(--ink);border-radius:8px;padding:8px 10px;
}
.acerto-pill{
  display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
  border:1px solid var(--danger);color:var(--danger);background:var(--danger-bg);cursor:pointer;font-family:var(--font-body);
}
.cfg-table td{padding:6px 10px;}
.cfg-table input[type=text]{
  width:100%;border:1px solid var(--border-strong);border-radius:7px;padding:6px 9px;background:var(--bg);
  color:var(--ink);font-size:13px;font-family:var(--font-body);
}
.cfg-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);}
.cfg-usada{display:block;font-size:10.5px;color:var(--ink-muted);margin-top:2px;}

/* ---------- list ---------- */
.list-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.list-toolbar input[type=search]{
  flex:1;min-width:180px;border:1px solid var(--border-strong);border-radius:9px;padding:9px 12px;
  background:var(--surface);color:var(--ink);font-size:13.5px;
}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);
  padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.num-input{
  width:74px;border:1px solid var(--border);border-radius:6px;padding:4px 6px;background:var(--bg);
  color:var(--ink);font-family:var(--font-mono);font-size:12px;
}
.row-actions{display:flex;gap:6px;flex-wrap:nowrap;}
.empty-state{padding:34px 20px;text-align:center;color:var(--ink-muted);font-size:13px;}

/* ---------- print modal ---------- */
.print-modal{
  display:none;position:fixed;inset:0;z-index:80;align-items:flex-start;justify-content:center;
  overflow:auto;padding:32px 16px;
}
.print-modal.open{display:flex;}
.print-modal-backdrop{position:fixed;inset:0;background:rgba(10,16,12,.55);}
.print-modal-panel{position:relative;z-index:1;width:min(760px,100%);}
.print-toolbar{
  display:flex;justify-content:space-between;align-items:center;background:var(--surface);
  border:1px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;padding:10px 14px;
}
.print-toolbar span{font-size:12px;color:var(--ink-muted);}
.print-sheet{
  background:#ffffff;color:#161616;padding:26px 30px;border:1px solid var(--border);
  border-radius:0 0 12px 12px;font-family:var(--font-body);font-size:11px;line-height:1.4;
}
.print-sheet h4{font-family:var(--font-display);font-size:19px;margin:0;color:#161616;}
.ps-row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;}
.ps-row h4{font-size:16px;line-height:1.1;}
.ps-hd{border-bottom:2px solid #161616;padding-bottom:5px;margin-bottom:8px;}
.ps-badge-row{text-align:center;margin:2px 0 1px;}
.ps-badge{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;border:1px solid #161616;border-radius:20px;padding:1px 8px;}
.ps-brand{display:flex;align-items:center;gap:9px;}
.ps-sec{margin-top:5px;}
.ps-sec h5{font-size:10px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #999;padding-bottom:2px;margin:0 0 4px;}
.ps-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 16px;}
.ps-item{display:flex;gap:5px;font-size:11px;}
.ps-item b{font-weight:700;}
.ps-check{font-size:10.5px;margin:1px 0;}
.ps-grid .ps-check,.ps-grid .ps-note{grid-column:1/-1;}
.ps-note{font-size:9px;line-height:1.28;color:#444;margin-top:4px;white-space:pre-line;}
.ps-grid.blank{gap:4px 15px;}
.ps-item.blank{align-items:flex-end;gap:6px;}
.ps-item.blank .ps-line{flex:1;border-bottom:1px dotted #333;min-height:11px;min-width:60px;}
.ps-item.blank.wide{grid-column:1/-1;}
.ps-boxes{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px 16px;font-size:10.5px;}
.ps-boxes .lead{flex-basis:100%;font-weight:700;}
.ps-dateline{font-family:inherit;letter-spacing:.05em;}
.ps-sign{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;}
.ps-foot{margin-top:10px;border-top:1px solid #999;padding-top:4px;font-size:9px;color:#555;text-align:center;}

@page{size:A4;margin:12mm 10mm;}
@media print{
  body>*:not(.print-modal){display:none !important;}
  .print-modal{position:static !important;inset:auto;padding:0;display:block !important;}
  .print-modal-backdrop,.print-toolbar{display:none !important;}
  .print-modal-panel{width:auto;}
  .print-sheet{border:none;border-radius:0;padding:0;}
}

@media screen and (max-width:820px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;gap:14px;border-right:none;border-bottom:1px solid var(--border);}
  .sidebar>div{flex:1 1 160px;}
  .sidebar-footer{display:none;}
  .main{padding:18px 14px 50px;}
  .print-modal{padding:12px 8px;}
  .print-sheet{padding:20px 18px;}

function numOr(v, d){ var n = parseFloat(String(v===undefined||v===null? "" : v).replace(",", ".")); return isNaN(n) ? d : n; }
function fmtEuro(n){
  n = numOr(n, 0);
  var s = (Math.round(n*100)/100).toFixed(2).replace(".", ",");
  if(s.slice(-3)===",00") s = s.slice(0,-3);
  return s + "€";
}

/* Configuração em vigor: predefinida + o que estiver guardado nas definições */
function getConfig(){
  var c = (state && state.settings && state.settings.config) || {};
  var out = {
    epoca: (c.epoca || CONFIG_PREDEFINIDA.epoca),
    precoNova: numOr(c.precoNova, CONFIG_PREDEFINIDA.precoNova),
    precoRenov: numOr(c.precoRenov, CONFIG_PREDEFINIDA.precoRenov),
    desconto: numOr(c.desconto, CONFIG_PREDEFINIDA.desconto),
    textoDesconto: (c.textoDesconto!==undefined ? c.textoDesconto : CONFIG_PREDEFINIDA.textoDesconto),
    notaAulas: (c.notaAulas!==undefined ? c.notaAulas : CONFIG_PREDEFINIDA.notaAulas),
    atividades: Array.isArray(c.atividades) ? c.atividades : CONFIG_PREDEFINIDA.atividades
  };
  out.atividades = out.atividades.map(function(a){
    return {nome:String(a.nome||"").trim(), criancas:!!a.criancas, adultos:!!a.adultos, socios:!!a.socios};
  }).filter(function(a){ return a.nome; });
  return out;
}
function atividadesPara(formKey){
  return getConfig().atividades.filter(function(a){ return a[formKey]; }).map(function(a){ return a.nome; });
}
function opcoesTipoInscricao(){
  var c = getConfig();
  return ["Renovação ("+fmtEuro(c.precoRenov)+")", "Nova inscrição ("+fmtEuro(c.precoNova)+")"];
}
/* Preço base a partir do texto guardado na ficha (funciona também com fichas antigas) */
function precoBaseDe(tipoInscricao){
  var c = getConfig();
  var t = String(tipoInscricao||"").toLowerCase();
  if(!t) return null;
  var m = t.match(/\(([\d.,]+)\s*€\)/);
  if(m) return numOr(m[1], null);
  if(t.indexOf("renov")===0) return c.precoRenov;
  if(t.indexOf("nova")===0) return c.precoNova;
  return null;
}
function temDesconto(rec){ return !!(rec && (rec.descIrmao || rec.descOutra)); }
function calcularValores(rec){
  var c = getConfig();
  var base = precoBaseDe(rec.tipoInscricao);
  var desc = temDesconto(rec) ? c.desconto : 0;
  if(base===null) return {base:null, desconto:desc, pagar:null};
  return {base:base, desconto:desc, pagar:Math.max(0, Math.round((base-desc)*100)/100)};
}

        ]}

    },
    adultos: {
      key:"adultos", label:"Adultos", singular:"Ficha de Inscrição — Adultos",

        autorizacoesSection("aluno"),
        {title:"Assinatura", fields:[
          {id:"nomeAssinatura", label:"Nome (assinatura)", type:"text", required:true, span:2},
          {id:"dataAssinatura", label:"Data", type:"date", required:true, today:true}
        ]}
      ]
    },
    socios: {
      key:"socios", label:"Sócio Atleta", singular:"Ficha de Inscrição — Sócio Atleta",

      fees:false,
      sections:[
        secInscricao("socios", false),
        {title:"Dados do atleta", fields: identityFields("atl", {profissao:true, telemovelSos:true, telReq:true, emailReq:true})},
        {title:"Regalias de sócio", fields:[

        {title:"Assinatura", fields:[
          {id:"nomeAssinatura", label:"Nome (assinatura)", type:"text", required:true, span:2},

/* ============================================================
   UTIL
   ============================================================ */
function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  var p = iso.split("-");
  if(p.length!==3) return esc(iso);
  return p[2]+"/"+p[1]+"/"+p[0];
}
function fmtDateTime(iso){
  if(!iso) return "—";
  try{
    var d = new Date(iso);
    return d.toLocaleDateString("pt-PT")+" "+d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
  }catch(e){ return esc(iso); }
}
function allFields(formType){
  var out = [];
  formType.sections.forEach(function(s){ s.fields.forEach(function(f){ out.push(f); }); });
  return out;
}
function fieldById(formType, id){
  var found = null;
  allFields(formType).forEach(function(f){ if(f.id===id) found=f; });
  return found;
}
function displayValue(formType, field, rec){
  var v = rec[field.id];
  if(field.type==="modalidades"){
    var sel = (rec[field.id+"__opts"]||[]).slice();
    if(rec[field.id+"__outra"]) sel.push(rec[field.id+"__outra"]);
    return sel.length? sel.join(", ") : "—";
  }
  if(field.type==="checkbox") return v? "Sim":"Não";
  if(field.type==="date") return fmtDate(v);
  return (v===undefined||v===null||v==="")? "—" : v;
}

   RENDER: HOME

      + '<div style="display:flex;gap:8px;margin-top:4px;">'

function renderDbBanner(){
  if(state.storeMode==="cloud") return "";
  if(state.storeMode==="loading"){
    return '<div class="status-banner"><span class="pulse"></span> A preparar a aplicação…</div>';
  }
  if(state.storeMode==="supa"){
    if(state.sync==="erro"){
      return '<div class="status-banner warn"><span class="pulse"></span> Sem ligação à base de dados da associação. Podes continuar a trabalhar — as fichas ficam neste dispositivo e sobem assim que a ligação voltar.</div>';
    }
    return "";
  }
  if(state.storeMode==="local"){
    return '<div class="status-banner"><span class="pulse"></span> As inscrições são guardadas neste computador. Usa "Cópia de segurança" na barra lateral para gravar um ficheiro com todas as fichas.</div>';
  }
  return '<div class="status-banner warn"><span class="pulse"></span> Este navegador não permite guardar dados — as fichas ficam disponíveis só até fechares a janela. Podes na mesma preencher, imprimir e exportar.</div>';
}

   RENDER: FORM
   ============================================================ */
function fieldHtml(formType, field, values){
  values = values || {};
  if(field.type==="static"){
    return '<div class="note-block'+(field.full?"":"")+'">'+esc(field.text)+'</div>';
  }
  var reqMark = field.required? ' <span class="req">*</span>' : "";
  var span = field.span===2 ? " span2":"";

  if(field.type==="checkbox"){
    var checked = values[field.id]? "checked":"";
    var out = '<div class="consent-item" data-field="'+field.id+'">'
      + '<label class="check-item"><input type="checkbox" name="'+field.id+'" '+checked+'> '+esc(field.label)+reqMark+'</label>';
    if(field.channels){
      var opts = values[field.channels.id]||[];
      out += '<div class="channels">' + field.channels.options.map(function(o){
        var c = opts.indexOf(o)>-1 ? "checked":"";
        return '<label class="check-item"><input type="checkbox" name="'+field.channels.id+'" value="'+esc(o)+'" '+c+'> '+esc(o)+'</label>';
      }).join("") + '</div>';
    }
    out += '</div>';
    return out;
  }

  if(field.type==="radio"){
    return '<div class="radio-row" data-field="'+field.id+'"><span style="font-size:11.5px;font-weight:600;color:var(--ink-muted);margin-right:6px;">'+esc(field.label)+reqMark+'</span>'
      + field.options.map(function(o){
          var c = values[field.id]===o ? "checked":"";
          return '<label class="radio-item"><input type="radio" name="'+field.id+'" value="'+esc(o)+'" '+c+'> '+esc(o)+'</label>';
        }).join("") + '</div>';
  }

  if(field.type==="modalidades"){
    var sel = values[field.id+"__opts"] || [];
    var outraVal = values[field.id+"__outra"] || "";
    var tipoInput = field.single ? "radio" : "checkbox";
    // uma ficha antiga pode ter uma modalidade que já não está na lista: mantém-se visível
    var opcoes = field.options.slice();
    sel.forEach(function(o){ if(opcoes.indexOf(o)<0) opcoes.push(o); });
    var out2 = '<div class="check-grid" data-field="'+field.id+'">'
      + '<div style="flex-basis:100%;font-size:11.5px;font-weight:600;color:var(--ink-muted);">'+esc(field.label)+reqMark+'</div>'
      + (opcoes.length ? "" : '<div style="flex-basis:100%;font-size:12px;color:var(--danger);">Sem atividades configuradas para esta ficha — adiciona-as em Definições.</div>')
      + opcoes.map(function(o){
          var c = sel.indexOf(o)>-1 ? "checked":"";
          return '<label class="check-item"><input type="'+tipoInput+'" name="'+field.id+'__opt" value="'+esc(o)+'" '+c+'> '+esc(o)+'</label>';
        }).join("")
      + '<label class="check-item"><input type="'+tipoInput+'" name="'+(field.single? field.id+'__opt' : field.id+'__hasOutra')+'" value="__outra__" '+(outraVal? "checked":"")+' data-outra-toggle="'+field.id+'"> Outra'
      + '<input type="text" class="outra-input" name="'+field.id+'__outraText" placeholder="qual?" value="'+esc(outraVal)+'" '+(outraVal? "":"disabled")+'>'
      + '</label>'
      + '</div>';
    return out2;
  }

  if(field.type==="desconto"){
    var cfg = getConfig();
    var irmao = !!values.descIrmao, outra = !!values.descOutra;
    return '<div class="desconto-box" data-field="desconto" id="descontoBox">'
      + '<div class="desconto-head"><span class="lead">Desconto de '+esc(fmtEuro(cfg.desconto))+' na inscrição'+'</span>'
      + (cfg.textoDesconto ? '<span class="hint">'+esc(cfg.textoDesconto)+'</span>' : '')
      + '</div>'
      + '<div id="descSugestoes" class="desc-sugestoes"></div>'
      + '<div class="desconto-linhas">'
      + '<div class="desc-linha"><label class="check-item"><input type="checkbox" name="descIrmao" '+(irmao?"checked":"")+'> Tem irmão/irmã inscrito(a) na ARCA</label>'
      + '<input type="text" name="descIrmaoNome" placeholder="nome ou nº de inscrição do irmão/irmã" value="'+esc(values.descIrmaoNome)+'" '+(irmao?"":"disabled")+'></div>'
      + '<div class="desc-linha"><label class="check-item"><input type="checkbox" name="descOutra" '+(outra?"checked":"")+'> Já está inscrito(a) noutra atividade da ARCA</label>'
      + '<input type="text" name="descOutraQual" placeholder="qual atividade / nº de inscrição" value="'+esc(values.descOutraQual)+'" '+(outra?"":"disabled")+'></div>'
      + '</div>'
      + '<div class="desconto-total" id="descontoTotal"></div>'
      + '</div>';
  }

  // text / tel / email / date
  var val = esc(values[field.id]);
  var ph = field.placeholder? ' placeholder="'+esc(field.placeholder)+'"':"";
  var ro = field.readonly? ' readonly class="readonly"':"";
  return '<div class="field'+span+'" data-field="'+field.id+'">'
    + '<label>'+esc(field.label)+reqMark+'</label>'
    + '<input type="'+field.type+'" name="'+field.id+'" value="'+val+'"'+ph+ro+'>'
    + '<span class="err">Campo obrigatório</span>'
    + '</div>';
}

function renderForm(formKey, editRecord){
  var ft = FORM_TYPES[formKey];
  var values = editRecord ? editRecord : {};
  var isEdit = !!(editRecord && editRecord.id);

  var html = "";
  var notaAulasTxt = getConfig().notaAulas;
  html += '<div class="form-header" style="--type-color:var('+ft.colorVar+');--type-bg:var('+ft.bgVar+');">'
    + '<div><span class="badge">'+ (isEdit? "A editar":"Nova inscrição") +'</span><h2>'+esc(ft.singular)+'</h2>'
    + (notaAulasTxt ? '<p style="margin:2px 0 0;font-size:11.5px;color:var(--ink-muted);">'+esc(notaAulasTxt)+'</p>' : '')
    + (formKey==="socios" && !isEdit ? '<p style="margin:2px 0 0;font-size:11.5px;color:var(--ink-muted);">Ao guardar, cria-se automaticamente o sócio na plataforma de sócios (ou reaproveita-se o nº existente, se o NIF já lá estiver) — o nº atribuído é o nº de sócio.</p>' : '')
    + '</div>'
    + '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">'
    + (ft.fees? '<div class="fees">'+esc(feesTexto())+'</div>' : '')
    + '<button type="button" class="btn btn-ghost btn-sm" data-blank="'+formKey+'">🖶 Ficha em branco</button>'
    + '</div></div>';

  html += renderDbBanner();

  html += '<form id="regForm" data-form-key="'+formKey+'" data-edit-id="'+(isEdit? esc(editRecord.id):"")+'">';

  ft.sections.forEach(function(sec){
    html += '<div class="section" style="--type-color:var('+ft.colorVar+')"><h3>'+esc(sec.title)+'</h3><div class="field-grid">';
    sec.fields.forEach(function(f){
      var v = Object.assign({}, values);
      if(f.today && !v[f.id]) v[f.id] = todayISO();
      if(f.defaultValue && !isEdit && !v[f.id]) v[f.id] = f.defaultValue;
      html += fieldHtml(ft, f, v);
    });
    html += '</div></div>';
  });

  html += '<div class="form-actions">'
    + '<button type="button" class="btn btn-ghost" data-nav="home">Cancelar</button>'
    + '<button type="submit" class="btn btn-primary">'+(isEdit? "Guardar alterações":"Guardar inscrição")+'</button>'
    + '</div>';
  html += '</form>';

  document.getElementById("app").innerHTML = html;

  var formEl = document.getElementById("regForm");

  // "Outra" modalidade: com escolha única (radio) o campo de texto liga/desliga
  // conforme a opção selecionada no grupo
  formEl.querySelectorAll('input[name="modalidade__opt"], [data-outra-toggle]').forEach(function(inp){
    inp.addEventListener("change", function(){
      var grid = inp.closest(".check-grid"); if(!grid) return;
      var toggle = grid.querySelector('[data-outra-toggle]');
      var txt = grid.querySelector('input[type=text]');
      if(!toggle || !txt) return;
      txt.disabled = !toggle.checked;
      if(!toggle.checked) txt.value=""; else if(inp===toggle) txt.focus();
    });
  });

  if(ft.fees){
    ligarDesconto(formKey, formEl, isEdit ? editRecord.id : null);
  }

  formEl.addEventListener("submit", function(e){
    e.preventDefault();
    handleSubmitForm(formKey, e.target);
  });
}

/* ---------- Desconto: caixas, total ao vivo e deteção automática ---------- */
function normTxt(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
}
function normDigits(s){ return String(s||"").replace(/\D/g,""); }
function nomeAtletaDe(rec){ return rec.nomeAtleta || rec.atlNome || ""; }
function modalidadeDe(rec){
  var sel = (rec.modalidade__opts||[]).slice();
  if(rec.modalidade__outra) sel.push(rec.modalidade__outra);
  return sel.join(", ");
}
function nifAtletaDe(rec){ return normDigits(rec.nifAtleta || rec.atlNif); }

/* Procura nas fichas guardadas (crianças e adultos) fichas do mesmo atleta
   e fichas de irmãos (mesmo encarregado de educação). */
function procurarRelacionadas(formKey, dados, excluirId){
  var nome = normTxt(dados.nomeAtleta || dados.atlNome);
  var nif = normDigits(dados.nifAtleta || dados.atlNif);
  var encNif = normDigits(dados.encNif), encEmail = normTxt(dados.encEmail), encTel = normDigits(dados.encTelemovel);
  var encNome = normTxt(dados.encNome);
  var mesmoAtleta = [], irmaos = [];
  ["criancas","adultos"].forEach(function(k){
    state.records[k].forEach(function(r){
      if(excluirId && r.id===excluirId) return;
      var rNome = normTxt(nomeAtletaDe(r)), rNif = nifAtletaDe(r);
      var igualAtleta = (nif && rNif && nif===rNif) || (nome && nome.length>5 && rNome===nome);
      if(igualAtleta){ mesmoAtleta.push({key:k, rec:r}); return; }
      if(k!=="criancas") return;
      var rEncNif = normDigits(r.encNif), rEncEmail = normTxt(r.encEmail), rEncTel = normDigits(r.encTelemovel), rEncNome = normTxt(r.encNome);
      var mesmoEnc = (encNif && rEncNif && encNif===rEncNif)
        || (encEmail && rEncEmail && encEmail===rEncEmail)
        || (encTel && rEncTel && encTel.length>=9 && encTel===rEncTel)
        || (encNome && encNome.length>8 && rEncNome===encNome);
      if(mesmoEnc && rNome && rNome!==nome) irmaos.push({key:k, rec:r});
    });
  });
  return {mesmoAtleta:mesmoAtleta, irmaos:irmaos};
}

function ligarDesconto(formKey, formEl, editId){
  var cfg = getConfig();
  var cbIrmao = formEl.querySelector('input[name="descIrmao"]');
  var cbOutra = formEl.querySelector('input[name="descOutra"]');
  var txtIrmao = formEl.querySelector('input[name="descIrmaoNome"]');
  var txtOutra = formEl.querySelector('input[name="descOutraQual"]');
  var totalEl = document.getElementById("descontoTotal");
  var sugEl = document.getElementById("descSugestoes");
  if(!cbIrmao || !cbOutra) return;

  function atualizarTotal(){
    var tipo = formEl.querySelector('input[name="tipoInscricao"]:checked');
    var rec = {tipoInscricao: tipo? tipo.value : "", descIrmao: cbIrmao.checked, descOutra: cbOutra.checked};
    var v = calcularValores(rec);
    txtIrmao.disabled = !cbIrmao.checked; if(!cbIrmao.checked) txtIrmao.value = "";
    txtOutra.disabled = !cbOutra.checked; if(!cbOutra.checked) txtOutra.value = "";
    if(v.base===null){
      totalEl.innerHTML = '<span class="muted">Escolhe o tipo de inscrição para ver o valor a pagar.</span>';
      return;
    }
    if(v.desconto>0){
      totalEl.innerHTML = 'Valor a pagar: <s>'+esc(fmtEuro(v.base))+'</s> − '+esc(fmtEuro(v.desconto))+' de desconto = <b>'+esc(fmtEuro(v.pagar))+'</b>';
    } else {
      totalEl.innerHTML = 'Valor a pagar: <b>'+esc(fmtEuro(v.base))+'</b>';
    }
  }

  var sugTimer = null;
  function atualizarSugestoes(){
    if(sugTimer) clearTimeout(sugTimer);
    sugTimer = setTimeout(function(){
      var dados = {};
      formEl.querySelectorAll('input[type=text],input[type=tel],input[type=email]').forEach(function(i){ if(i.name) dados[i.name] = i.value; });
      var rel = procurarRelacionadas(formKey, dados, editId);
      var html = "";
      rel.mesmoAtleta.slice(0,3).forEach(function(m){
        html += '<div class="sug"><span>Já existe uma ficha de <b>'+esc(nomeAtletaDe(m.rec))+'</b> — '+esc(modalidadeDe(m.rec)||"sem modalidade")
          + (m.rec.numeroInscricao? ' (nº '+esc(m.rec.numeroInscricao)+')':'')+(m.rec.epocaAno? ', época '+esc(m.rec.epocaAno):'')+'.</span>'
          + (cbOutra.checked ? '' : '<button type="button" class="btn btn-ghost btn-sm" data-sug="outra" data-txt="'+esc((modalidadeDe(m.rec)||"")+(m.rec.numeroInscricao? " (nº "+m.rec.numeroInscricao+")":""))+'">Marcar desconto (outra atividade)</button>')
          + '</div>';
      });
      rel.irmaos.slice(0,3).forEach(function(m){
        html += '<div class="sug"><span>Mesmo encarregado de educação: <b>'+esc(nomeAtletaDe(m.rec))+'</b> — '+esc(modalidadeDe(m.rec)||"sem modalidade")
          + (m.rec.numeroInscricao? ' (nº '+esc(m.rec.numeroInscricao)+')':'')+'. Será irmão/irmã?</span>'
          + (cbIrmao.checked ? '' : '<button type="button" class="btn btn-ghost btn-sm" data-sug="irmao" data-txt="'+esc(nomeAtletaDe(m.rec)+(m.rec.numeroInscricao? " (nº "+m.rec.numeroInscricao+")":""))+'">Marcar desconto (irmão)</button>')
          + '</div>';
      });
      sugEl.innerHTML = html;
      sugEl.style.display = html ? "flex" : "none";
    }, 350);
  }

  formEl.addEventListener("change", function(e){
    if(e.target.name==="tipoInscricao" || e.target.name==="descIrmao" || e.target.name==="descOutra"){ atualizarTotal(); atualizarSugestoes(); }
  });
  formEl.addEventListener("input", function(e){
    var n = e.target.name || "";
    if(/^(nomeAtleta|nifAtleta|atlNome|atlNif|encNome|encNif|encEmail|encTelemovel)$/.test(n)) atualizarSugestoes();
  });
  sugEl.addEventListener("click", function(e){
    var b = e.target.closest("[data-sug]"); if(!b) return;
    if(b.getAttribute("data-sug")==="irmao"){ cbIrmao.checked = true; txtIrmao.disabled = false; txtIrmao.value = b.getAttribute("data-txt")||""; }
    else { cbOutra.checked = true; txtOutra.disabled = false; txtOutra.value = b.getAttribute("data-txt")||""; }
    atualizarTotal(); atualizarSugestoes();
  });

  atualizarTotal();
  atualizarSugestoes();
}

function collectFormData(formType, formEl){
  var data = {};
  var missing = [];
  allFields(formType).forEach(function(f){
    if(f.type==="static") return;
    if(f.type==="checkbox"){
      var el = formEl.querySelector('input[name="'+f.id+'"]');
      data[f.id] = !!(el && el.checked);
      if(f.required && !data[f.id]) missing.push(f.id);
      if(f.channels){
        var chosen = [];
        formEl.querySelectorAll('input[name="'+f.channels.id+'"]:checked').forEach(function(c){ chosen.push(c.value); });
        data[f.channels.id] = chosen;
      }
      return;
    }
    if(f.type==="radio"){
      var r = formEl.querySelector('input[name="'+f.id+'"]:checked');
      data[f.id] = r ? r.value : "";
      if(f.required && !data[f.id]) missing.push(f.id);
      return;
    }
    if(f.type==="modalidades"){
      var opts = [];
      formEl.querySelectorAll('input[name="'+f.id+'__opt"]:checked').forEach(function(c){ if(c.value!=="__outra__") opts.push(c.value); });
      var outraEl = formEl.querySelector('[data-outra-toggle="'+f.id+'"]');
      var outraChecked = !!(outraEl && outraEl.checked);
      var outraText = formEl.querySelector('input[name="'+f.id+'__outraText"]').value.trim();
      data[f.id+"__opts"] = opts;
      data[f.id+"__outra"] = outraChecked ? outraText : "";
      if(f.required && opts.length===0 && !(outraChecked && outraText)) missing.push(f.id);
      return;
    }
    if(f.type==="desconto"){
      var ci = formEl.querySelector('input[name="descIrmao"]'), co = formEl.querySelector('input[name="descOutra"]');
      data.descIrmao = !!(ci && ci.checked);
      data.descOutra = !!(co && co.checked);
      data.descIrmaoNome = data.descIrmao ? (formEl.querySelector('input[name="descIrmaoNome"]').value.trim()) : "";
      data.descOutraQual = data.descOutra ? (formEl.querySelector('input[name="descOutraQual"]').value.trim()) : "";
      // valores fixados no momento da gravação (se os preços mudarem depois, a ficha mantém o que foi cobrado)
      var tipoEl = formEl.querySelector('input[name="tipoInscricao"]:checked');
      var vals = calcularValores({tipoInscricao: tipoEl? tipoEl.value:"", descIrmao:data.descIrmao, descOutra:data.descOutra});
      data.valorBase = vals.base; data.valorDesconto = vals.desconto; data.valorPagar = vals.pagar;
      return;
    }
    var input = formEl.querySelector('[name="'+f.id+'"]');
    var val = input ? input.value.trim() : "";
    data[f.id] = val;
    if(f.required && !val) missing.push(f.id);
  });
  return {data:data, missing:missing};
}

function markInvalid(formEl, missingIds){
  formEl.querySelectorAll(".invalid").forEach(function(el){ el.classList.remove("invalid"); });
  var firstEl = null;
  missingIds.forEach(function(id){
    var wrap = formEl.querySelector('[data-field="'+id+'"]');
    if(wrap){ wrap.classList.add("invalid"); if(!firstEl) firstEl = wrap; }
  });
  if(firstEl) firstEl.scrollIntoView({behavior:"smooth", block:"center"});
}

function handleSubmitForm(formKey, formEl){
  var ft = FORM_TYPES[formKey];
  var res = collectFormData(ft, formEl);
  if(res.missing.length){
    markInvalid(formEl, res.missing);
    return;
  }
  var editId = formEl.getAttribute("data-edit-id");
  var payload = res.data;
  var btn = formEl.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = "A guardar…";

  var promise;
  if(editId){
    payload.updatedAt = new Date().toISOString();
    promise = Store.update(formKey, editId, payload).then(function(){ return editId; });
  } else if(formKey==="socios"){
    // O nº de inscrição do Sócio Atleta É o nº de sócio: cria (ou reaproveita)
    // o sócio diretamente na plataforma de sócios, na mesma base de dados.
    btn.textContent = "A criar sócio na plataforma de sócios…";
    payload.createdAt = new Date().toISOString();
    payload.origem = "app";
    promise = sincronizarSocioAtleta(payload).then(function(info){
      payload.numeroInscricao = String(info.num);
      payload.socioNum = info.num;
      payload.socioReaproveitado = !!info.reaproveitado;
      payload.socioSyncFalhou = false;
      payload.status = "confirmado";
      btn.textContent = "A guardar…";
      return Store.add(formKey, payload);
    }).catch(function(err){
      // não bloqueia a inscrição: guarda com um número provisório local
      // e assinala para regularizar mais tarde
      console.warn("sync sócio falhou", err);
      payload.socioSyncFalhou = true;
      payload.socioSyncErro = (err && err.message) ? err.message : "erro desconhecido";
      payload.status = "novo"; // fica na lista de "por confirmar"
      btn.textContent = "A atribuir número provisório…";
      return assignNumero(payload.epocaAno).then(function(numero){
        payload.numeroInscricao = numero;
        btn.textContent = "A guardar…";
        return Store.add(formKey, payload);
      });
    });
  } else {
    payload.createdAt = new Date().toISOString();
    payload.origem = "app";
    payload.status = "confirmado";
    btn.textContent = "A atribuir número…";
    promise = assignNumero(payload.epocaAno).then(function(numero){
      payload.numeroInscricao = numero;
      btn.textContent = "A guardar…";
      return Store.add(formKey, payload);
    });
  }
  promise.then(function(newId){
    var acertos = [];
    if(!editId && payload.descIrmao) acertos = marcarAcertoIrmaos(formKey, payload, newId);
    navTo({name:"saved", formKey:formKey, id: editId || newId, novo: !editId, acertos: acertos});
  }).catch(function(err){
    btn.disabled = false; btn.textContent = editId? "Guardar alterações":"Guardar inscrição";
    alertBanner("Não foi possível guardar: " + (err && err.message ? err.message : "erro desconhecido") + ". Tenta novamente.");
  });
}

/* ============================================================
   LIGAÇÃO COM A PLATAFORMA DE SÓCIOS (mesma base de dados Supabase,
   tabela "socios"). Uma ficha de Sócio Atleta cria — ou, se o NIF já
   existir, reaproveita — um registo lá, com tipo "ATLETA".
   ============================================================ */
function socioEncontradoPorNif(nif){
  if(!nif) return Promise.resolve(null);
  return supaFetch("socios?nif=eq." + encodeURIComponent(nif) + "&select=num,nome&limit=1")
    .then(function(rows){ return (rows && rows.length) ? rows[0] : null; });
}
function proximoNumSocio(){
  return supaFetch("socios?select=num&order=num.desc&limit=1").then(function(rows){
    var maior = (rows && rows.length && rows[0].num) ? parseInt(rows[0].num, 10) : 0;
    return (isNaN(maior) ? 0 : maior) + 1;
  });
}
function sincronizarSocioAtleta(payload){
  if(state.storeMode !== "supa"){
    return Promise.reject(new Error("Sincronização com a plataforma de sócios só está disponível na versão online."));
  }
  var nif = normDigits(payload.atlNif);
  return socioEncontradoPorNif(nif).then(function(existente){
    if(existente){
      return {num: existente.num, reaproveitado: true, nomeExistente: existente.nome};
    }
    return proximoNumSocio().then(function(num){
      var row = {
        num: num, nome: payload.atlNome || "", sexo: null, nif: nif || null, tipo: "ATLETA",
        data_inscricao: todayISO(), data_pagamento: null, periodo_quota: null, validade_quota: null,
        estado: "ATIVO", tel: payload.atlTelemovel || null, morada: payload.atlMorada || null,
        cp: payload.atlCodPostal || null, email: payload.atlEmail || null, quota: null,
        situacao: "EM DIA", obs: "Criado automaticamente pela ficha de inscrição (Sócio Atleta).",
        isento: false, aceita_email: false, aceita_sms: false
      };
      return supaFetch("socios", "POST", row).then(function(){
        return {num: num, reaproveitado: false};
      });
    });
  });
}

/* Quando o 2.º irmão se inscreve, a ficha do 1.º (paga sem desconto) fica
   assinalada com um acerto pendente, para o professor regularizar. */
function marcarAcertoIrmaos(formKey, payload, novoId){
  var cfg = getConfig();
  var rel = procurarRelacionadas(formKey, payload, novoId);
  var marcados = [];
  rel.irmaos.forEach(function(m){
    var r = m.rec;
    if(temDesconto(r) || r.acertoPendente) return;
    if((r.epocaAno||"") !== (payload.epocaAno||"")) return; // só na mesma época
    var acerto = {valor: cfg.desconto, motivo: "irmão inscrito depois: " + nomeAtletaDe(payload), em: new Date().toISOString()};
    Store.update(m.key, r.id, {acertoPendente: acerto}).catch(function(){});
    marcados.push({key:m.key, nome:nomeAtletaDe(r), numero:r.numeroInscricao||"", valor:cfg.desconto});
  });
  return marcados;
}

function estadoSocioTexto(rec){
  if(rec.status==="confirmado") return "Sócio confirmado" + (rec.origem==="publico" ? " · via link público" : "");
  return "Por confirmar" + (rec.origem==="publico" ? " · link público" : "");
}
function valorTexto(rec){
  if(rec.valorPagar===undefined || rec.valorPagar===null){
    var b = precoBaseDe(rec.tipoInscricao);
    return b===null ? "—" : fmtEuro(b);
  }
  var t = fmtEuro(rec.valorPagar);
  if(rec.valorDesconto>0) t += " (c/ desc.)";
  if(rec.acertoPendente) t += " · acerto " + fmtEuro(rec.acertoPendente.valor) + " pendente";
  return t;
}
function cellValue(rec, col){
  if(col.f==="valor") return valorTexto(rec);
  if(col.f==="estadoSocio") return estadoSocioTexto(rec);
  if(col.f==="modalidade"){
    var sel = (rec.modalidade__opts||[]).slice();
    if(rec.modalidade__outra) sel.push(rec.modalidade__outra);
    return sel.join(", ") || "—";
  }
  var v = rec[col.f];
  if(col.date) return fmtDate(v);
  if(col.dt) return fmtDateTime(v);
  return (v===undefined||v===null||v==="") ? "—" : v;
}

function exportCsv(formKey, recs){
  var cols = tableColumnsFor(formKey);
  var headerRow = cols.map(function(c){ return c.h; });
  var lines = [headerRow.map(csvEsc).join(",")];
  recs.forEach(function(r){
    lines.push(cols.map(function(c){ return csvEsc(cellValue(r,c)); }).join(","));
  });
  var csv = "﻿" + lines.join("\r\n");
  var btn = document.getElementById("exportCsvBtn");
  btn.disabled = true; var orig = btn.textContent; btn.textContent = "A preparar…";
  Downloader.save("arca_"+formKey+"_"+todayISO()+".csv", csv, "text/csv;charset=utf-8")
    .then(function(){ btn.textContent = "Exportado ✓"; setTimeout(function(){ btn.textContent=orig; btn.disabled=false; }, 1800); })
    .catch(function(err){
      btn.disabled=false; btn.textContent = orig;
      if(err && err.code!=="declined") alertBanner("Não foi possível exportar: " + err.message);
    });
}
function csvEsc(v){
  v = (v===undefined||v===null)? "" : String(v);
  if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}

    btn.textContent = "Confirmar?";
    setTimeout(function(){
      if(btn.isConnected){ btn.removeAttribute("data-armed"); btn.textContent="Apagar"; }

  }
}

/* ============================================================
   NÚMERO DE INSCRIÇÃO (sequência única por época)
   ============================================================ */
function epocaKey(epoca){
  return String(epoca||"sem-epoca").replace(/[^A-Za-z0-9]+/g,"-").slice(0,40) || "sem-epoca";
}
function formatNumero(n){
  return (n<1000 ? ("00"+n).slice(-3) : String(n));
}
function maiorNumeroLocal(epoca){
  var maior = 0;
  FORM_ORDER.forEach(function(k){
    state.records[k].forEach(function(r){
      if((r.epocaAno||"") !== epoca) return;
      var n = parseInt(String(r.numeroInscricao||"").replace(/\D/g,""),10);
      if(!isNaN(n) && n>maior) maior = n;
    });
  });
  return maior;
}
/* Na nuvem usa-se um contador com trinco curto, para dois computadores
   a inscrever ao mesmo tempo não receberem o mesmo número. */
function assignNumero(epoca, tentativa){
  tentativa = tentativa || 0;
  if(state.storeMode!=="cloud"){
    return Promise.resolve(formatNumero(maiorNumeroLocal(epoca)+1));
  }
  var ref = state.db.doc("contadores/" + epocaKey(epoca));
  var holder = state.sessionId || (state.sessionId = "s"+Math.random().toString(36).slice(2,10));
  return ref.acquire({holder:holder, ttlMs:6000}).then(function(res){
    if(!res.acquired){
      if(tentativa >= 3) return formatNumero(maiorNumeroLocal(epoca)+1);
      return new Promise(function(r){ setTimeout(r, 500 + Math.random()*600); })
        .then(function(){ return assignNumero(epoca, tentativa+1); });
    }
    return ref.get().then(function(snap){
      var atual = (snap.exists && snap.data() && snap.data().ultimo) || 0;
      var base = Math.max(atual, maiorNumeroLocal(epoca));
      var proximo = base + 1;
      return ref.set({ultimo: proximo, epoca: epoca, atualizadoEm: new Date().toISOString()})
        .then(function(){ return formatNumero(proximo); });
    });
  }).catch(function(){
    return formatNumero(maiorNumeroLocal(epoca)+1);
  });
}

  if(code==="needs_reauth") return "A ligação ao Google Drive expirou. Volta a ligá-la em Definições → Conectores no claude.ai.";

  if(code==="blocked_by_policy" || code==="approval_required") return "O acesso ao Google Drive não foi autorizado nesta janela.";
  if(code==="tool_error") return "O Google Drive recusou o pedido: " + (err.message||"erro");

function guardarNaDrive(formKey, id){
  var ft = FORM_TYPES[formKey];
  var rec = state.records[formKey].filter(function(r){ return r.id===id; })[0];
  if(!rec) return Promise.reject({code:"bad_request", message:"ficha não encontrada"});
  if(!state.mcp) return Promise.reject({code:"server_not_connected", message:"sem conector"});

  var nome = rec.nomeAtleta || rec.atlNome || "sem nome";
  var titulo = (rec.numeroInscricao ? rec.numeroInscricao + " — " : "") + nome + " (" + ft.label + ")";
  var corpo = '<html><head><meta charset="utf-8"></head><body>'
    + '<style>' + SHEET_CSS + '</style>'
    + '<div class="print-sheet">' + buildPrintSheet(formKey, rec) + '</div></body></html>';

  return state.mcp.callTool(DRIVE_SERVER, "create_file", {
    title: titulo,
    contentMimeType: "text/html",
    textContent: corpo,
    parentId: drivePastaId()
  }).then(function(res){
    var f = res && res.payload;
    if(!f || !f.id) throw {code:"upstream_error", message:"resposta inesperada do Drive"};
    return Store.update(formKey, id, {driveFileId: f.id, driveUrl: f.viewUrl || "", driveEm: new Date().toISOString()})
      .then(function(){ return f; });
  });
}

function processLogoFile(file, onDone, onError){
  if(!file.type || file.type.indexOf("image/")!==0){
    onError("O ficheiro tem de ser uma imagem (PNG, JPG ou WEBP).");
    return;
  }
  var reader = new FileReader();
  reader.onerror = function(){ onError("Não foi possível ler a imagem."); };
  reader.onload = function(){
    var img = new Image();
    img.onerror = function(){ onError("Não foi possível abrir a imagem."); };
    img.onload = function(){
      var max = 420;
      var w = img.width, h = img.height;
      var scale = Math.min(1, max/Math.max(w,h));
      var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw; canvas.height = ch;
      canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
      var out = canvas.toDataURL("image/png");
      if(out.length > 150000){
        var flat = document.createElement("canvas");
        flat.width = cw; flat.height = ch;
        var fx = flat.getContext("2d");
        fx.fillStyle = "#ffffff"; fx.fillRect(0,0,cw,ch);
        fx.drawImage(img, 0, 0, cw, ch);
        out = flat.toDataURL("image/jpeg", 0.85);
      }
      if(out.length > 200000){ onError("A imagem é demasiado grande. Usa um logótipo mais pequeno."); return; }
      onDone(out);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function lerConfigDoEcra(){
  var atividades = [];
  document.querySelectorAll('#cfgAtivBody tr').forEach(function(tr){
    var nome = tr.querySelector('.cfg-nome').value.trim();
    var a = {nome:nome, criancas:false, adultos:false, socios:false};
    tr.querySelectorAll('.cfg-chk').forEach(function(ch){ a[ch.getAttribute("data-k")] = ch.checked; });
    atividades.push(a);
  });
  return {
    epoca: document.getElementById("cfgEpoca").value.trim(),
    precoNova: numOr(document.getElementById("cfgPrecoNova").value, CONFIG_PREDEFINIDA.precoNova),
    precoRenov: numOr(document.getElementById("cfgPrecoRenov").value, CONFIG_PREDEFINIDA.precoRenov),
    desconto: numOr(document.getElementById("cfgDesconto").value, CONFIG_PREDEFINIDA.desconto),
    textoDesconto: document.getElementById("cfgTextoDesconto").value.trim(),
    notaAulas: document.getElementById("cfgNota").value.trim(),
    atividades: atividades
  };
}

function redesenharConfig(){
  var sec = document.getElementById("cfgFichas");
  if(!sec) return;
  var tmp = document.createElement("div");
  tmp.innerHTML = renderConfigFichasHtml();
  sec.replaceWith(tmp.firstChild);
  ligarConfigFichas();
}

function ligarConfigFichas(){
  var sec = document.getElementById("cfgFichas");
  if(!sec) return;

  sec.addEventListener("click", function(e){
    var mv = e.target.closest("[data-cfg-move]");
    if(mv){
      configRascunho = lerConfigDoEcra();
      var tr = mv.closest("tr"), i = parseInt(tr.getAttribute("data-idx"),10), d = parseInt(mv.getAttribute("data-cfg-move"),10);
      var j = i + d;
      if(j<0 || j>=configRascunho.atividades.length) return;
      var t = configRascunho.atividades[i]; configRascunho.atividades[i] = configRascunho.atividades[j]; configRascunho.atividades[j] = t;
      redesenharConfig();
      return;
    }
    var del = e.target.closest("[data-cfg-del]");
    if(del){
      var trd = del.closest("tr"), idx = parseInt(trd.getAttribute("data-idx"),10);
      var nome = trd.querySelector('.cfg-nome').value.trim();
      var usada = contarFichasComAtividade(nome);
      if(usada && del.getAttribute("data-armed")!=="1"){
        del.setAttribute("data-armed","1");
        del.textContent = "Usada em "+usada+" ficha"+(usada>1?"s":"")+" — remover?";
        setTimeout(function(){ if(del.isConnected){ del.removeAttribute("data-armed"); del.textContent="Remover"; } }, 4000);
        return;
      }
      configRascunho = lerConfigDoEcra();
      configRascunho.atividades.splice(idx,1);
      redesenharConfig();
      return;
    }
    if(e.target.id==="cfgAddBtn"){
      configRascunho = lerConfigDoEcra();
      configRascunho.atividades.push({nome:"", criancas:false, adultos:false, socios:false});
      redesenharConfig();
      var inputs = document.querySelectorAll('#cfgAtivBody .cfg-nome');
      if(inputs.length) inputs[inputs.length-1].focus();
      return;
    }
    if(e.target.id==="cfgResetBtn"){
      if(e.target.getAttribute("data-armed")!=="1"){
        e.target.setAttribute("data-armed","1"); e.target.textContent = "Confirmar reposição?";
        var rb = e.target;
        setTimeout(function(){ if(rb.isConnected){ rb.removeAttribute("data-armed"); rb.textContent = "Repor valores iniciais"; } }, 4000);
        return;
      }
      configRascunho = JSON.parse(JSON.stringify(CONFIG_PREDEFINIDA));
      redesenharConfig();
      return;
    }
    if(e.target.id==="cfgSaveBtn"){
      var btn = e.target, msg = document.getElementById("cfgMsg");
      var cfg = lerConfigDoEcra();
      cfg.atividades = cfg.atividades.filter(function(a){ return a.nome; });
      // nomes repetidos
      var vistos = {}, dup = null;
      cfg.atividades.forEach(function(a){ var k = normTxt(a.nome); if(vistos[k]) dup = a.nome; vistos[k] = true; });
      if(dup){ msg.style.color = "var(--danger)"; msg.textContent = 'A atividade "'+dup+'" está repetida.'; return; }
      if(!cfg.epoca){ msg.style.color = "var(--danger)"; msg.textContent = "Indica a época / ano letivo."; return; }
      btn.disabled = true; btn.textContent = "A guardar…";
      saveSettings({config: cfg}).then(function(){
        configRascunho = null;
        btn.textContent = "Guardado ✓";
        msg.style.color = "var(--c-socios)";
        msg.textContent = "Fichas atualizadas. As próximas fichas já usam estes valores e atividades.";
        setTimeout(function(){ if(state.view.name==="settings") renderSettings(); }, 1200);
      }).catch(function(err){
        btn.disabled = false; btn.textContent = "Guardar fichas de inscrição";
        msg.style.color = "var(--danger)"; msg.textContent = "Não foi possível guardar: " + (err.message||"erro");
      });
      return;
    }
  });
}

function navTo(view){
  if(view.name!=="settings") configRascunho = null;
  state.view = view;
  renderSidebar();
  if(view.name==="home") renderHome();
  else if(view.name==="form") renderForm(view.formKey, view.editRecord);
  else if(view.name==="list") renderList(view.formKey);
  else if(view.name==="saved") renderSaved(view.formKey, view.id);
  else if(view.name==="settings") renderSettings();
  else if(view.name==="login") renderLogin();
}

document.addEventListener("click", function(e){
  var navBtn = e.target.closest("[data-nav]");
  if(navBtn){
    var name = navBtn.getAttribute("data-nav");
    var key = navBtn.getAttribute("data-key");
    navTo({name:name, formKey:key});
    return;
  }
  var printBtn = e.target.closest("[data-print]");
  if(printBtn){ openPrint(printBtn.getAttribute("data-print"), printBtn.getAttribute("data-id")); return; }

  var blankBtn = e.target.closest("[data-blank]");
  if(blankBtn){ openBlankPrint(blankBtn.getAttribute("data-blank")); return; }

  var editBtn = e.target.closest("[data-edit]");
  if(editBtn){
    var fk = editBtn.getAttribute("data-edit"), id = editBtn.getAttribute("data-id");
    var rec = state.records[fk].filter(function(r){ return r.id===id; })[0];
    if(rec) navTo({name:"form", formKey:fk, editRecord:rec});
    return;
  }
  var driveBtn = e.target.closest("[data-drive]");
  if(driveBtn){
    var dk = driveBtn.getAttribute("data-drive"), did = driveBtn.getAttribute("data-id");
    driveBtn.disabled = true; var oldTxt = driveBtn.textContent; driveBtn.textContent = "A enviar…";
    guardarNaDrive(dk, did).catch(function(err){
      driveBtn.disabled = false; driveBtn.textContent = oldTxt;
      alertBanner(driveErroTexto(err));
    });
    return;
  }
  var socioRetryBtn = e.target.closest("[data-socio-retry]");
  if(socioRetryBtn){
    var srk = socioRetryBtn.getAttribute("data-socio-retry"), srid = socioRetryBtn.getAttribute("data-id");
    var srec = state.records[srk].filter(function(r){ return r.id===srid; })[0];
    if(!srec) return;
    socioRetryBtn.disabled = true; socioRetryBtn.textContent = "A tentar…";
    sincronizarSocioAtleta(srec).then(function(info){
      return Store.update(srk, srid, {
        numeroInscricao: String(info.num), socioNum: info.num,
        socioReaproveitado: !!info.reaproveitado, socioSyncFalhou: false, socioSyncErro: null
      });
    }).then(function(){
      if(state.view.name==="saved") renderSaved(srk, srid);
    }).catch(function(err){
      socioRetryBtn.disabled = false; socioRetryBtn.textContent = "Tentar criar sócio novamente";
      alertBanner("Continua a não ser possível: " + (err && err.message ? err.message : "erro desconhecido"));
    });
    return;
  }
  var confirmarSocioBtn = e.target.closest("[data-confirmar-socio]");
  if(confirmarSocioBtn){
    var csk = confirmarSocioBtn.getAttribute("data-confirmar-socio"), csid = confirmarSocioBtn.getAttribute("data-id");
    var csrec = state.records[csk].filter(function(r){ return r.id===csid; })[0];
    if(!csrec) return;
    confirmarSocioBtn.disabled = true; var csOldTxt = confirmarSocioBtn.textContent; confirmarSocioBtn.textContent = "A confirmar…";
    sincronizarSocioAtleta(csrec).then(function(info){
      return Store.update(csk, csid, {
        status: "confirmado",
        numeroInscricao: String(info.num), socioNum: info.num,
        socioReaproveitado: !!info.reaproveitado, socioSyncFalhou: false, socioSyncErro: null
      });
    }).then(function(){
      if(state.view.name==="list") renderList(csk);
      else if(state.view.name==="saved") renderSaved(csk, csid);
    }).catch(function(err){
      confirmarSocioBtn.disabled = false; confirmarSocioBtn.textContent = csOldTxt;
      alertBanner("Não foi possível confirmar o sócio: " + (err && err.message ? err.message : "erro desconhecido"));
    });
    return;
  }
  var acertoBtn = e.target.closest("[data-acerto]");
  if(acertoBtn){
    if(acertoBtn.getAttribute("data-armed")==="1"){
      var ak = acertoBtn.getAttribute("data-acerto"), aid = acertoBtn.getAttribute("data-id");
      var arec = state.records[ak].filter(function(r){ return r.id===aid; })[0];
      var hist = (arec && arec.acertoPendente) ? Object.assign({}, arec.acertoPendente, {regularizadoEm:new Date().toISOString()}) : null;
      Store.update(ak, aid, {acertoPendente:null, acertoRegularizado:hist}).catch(function(err){ alertBanner("Não foi possível atualizar: "+err.message); });
    } else {
      acertoBtn.setAttribute("data-armed","1"); acertoBtn.textContent = "Regularizado?";
      setTimeout(function(){ if(acertoBtn.isConnected){ acertoBtn.removeAttribute("data-armed"); renderList(state.view.formKey); } }, 3000);
    }
    return;
  }
  var delBtn = e.target.closest("[data-del]");
  if(delBtn){ handleDeleteClick(delBtn, delBtn.getAttribute("data-del"), delBtn.getAttribute("data-id")); return; }

  if(e.target.id==="sairBtn"){ sairDaConta(); return; }
  if(e.target.closest("[data-close-print]")){ closePrint(); return; }
  if(e.target.id==="downloadSheetBtn"){ downloadCurrentSheet(); return; }
  if(e.target.id==="doPrintBtn"){
    try{ window.print(); }
    catch(err){ downloadCurrentSheet(); }
    return;
  }
});

var SUPA_URL = "https://yfsyifypsrqnwkqkfrnm.supabase.co";

var CHAVE_DADOS = "inscricoes_dados";
var LS_SESSAO = "inscricoes_supa_session";

var supaSession = null;
var supaExisteNaCloud = false;
var supaTimer = null;

function supaGuardarSessao(s){
  supaSession = s;
  try{ window.localStorage.setItem(LS_SESSAO, JSON.stringify(s)); }catch(e){}
}
function supaLerSessao(){
  try{
    var raw = window.localStorage.getItem(LS_SESSAO);
    if(raw) supaSession = JSON.parse(raw);
  }catch(e){}
  return supaSession;
}
function supaLimparSessao(){
  supaSession = null;
  try{ window.localStorage.removeItem(LS_SESSAO); }catch(e){}
}

function supaLogin(email, password){
  return fetch(SUPA_URL + "/auth/v1/token?grant_type=password", {
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPA_KEY},
    body: JSON.stringify({email:email, password:password})
  }).then(function(res){ return res.json(); }).then(function(data){
    if(!data || !data.access_token){
      throw new Error(data && (data.error_description || data.msg || data.error) || "Não foi possível entrar.");
    }
    data.obtido_em = Date.now();
    supaGuardarSessao(data);
    return data;
  });
}

function supaRenovar(){
  var rt = supaSession && supaSession.refresh_token;
  if(!rt) return Promise.reject(new Error("sem sessão"));
  return fetch(SUPA_URL + "/auth/v1/token?grant_type=refresh_token", {
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPA_KEY},
    body: JSON.stringify({refresh_token: rt})
  }).then(function(res){ return res.json(); }).then(function(data){
    if(!data || !data.access_token) throw new Error("sessão expirada");
    data.obtido_em = Date.now();
    supaGuardarSessao(data);
    return data;
  });
}

function supaTokenValido(){
  if(!supaSession || !supaSession.access_token) return false;
  var validade = (supaSession.obtido_em || 0) + ((supaSession.expires_in || 3600) * 1000) - 60000;
  return Date.now() < validade;
}

function supaFetch(path, method, body){
  method = method || "GET";
  var pedir = function(){
    var headers = {"apikey": SUPA_KEY, "Authorization": "Bearer " + supaSession.access_token};
    var opts = {method: method, headers: headers};
    if(method !== "GET"){
      headers["Content-Type"] = "application/json";
      headers["Prefer"] = "return=representation";
      opts.body = JSON.stringify(body);
    }
    return fetch(SUPA_URL + "/rest/v1/" + path, opts).then(function(res){
      if(res.status === 401) { var e = new Error("nao_autorizado"); e.code = 401; throw e; }
      if(!res.ok) return res.text().then(function(t){ throw new Error(t || ("erro " + res.status)); });
      return res.status === 204 ? null : res.json();
    });
  };
  if(supaTokenValido()) return pedir().catch(function(err){
    if(err.code !== 401) throw err;
    return supaRenovar().then(pedir);
  });
  return supaRenovar().then(pedir);
}

function supaLer(){
  return supaFetch("config_app?chave=eq." + encodeURIComponent(CHAVE_DADOS) + "&select=valor")
    .then(function(rows){
      if(rows && rows.length){
        supaExisteNaCloud = true;
        return rows[0].valor || {};
      }
      supaExisteNaCloud = false;
      return {};
    });
}

/* As fichas em si (criancas/adultos/socios) vivem nas tabelas registos_*
   desde que passámos a suportar o link público; este bloco em config_app
   guarda só as Definições (época, preços, atividades, logótipo, Drive). */
function supaGravar(){
  var valor = {
    definicoes: state.settings,
    gravadoEm: new Date().toISOString()
  };
  var p = supaExisteNaCloud
    ? supaFetch("config_app?chave=eq." + encodeURIComponent(CHAVE_DADOS), "PATCH", {valor: valor})
    : supaFetch("config_app", "POST", {chave: CHAVE_DADOS, valor: valor});
  return p.then(function(){
    supaExisteNaCloud = true;
    return supaGravarConfigPublica();
  }).then(function(){
    state.sync = "ok";
    atualizarEstadoLigacao();
  }).catch(function(err){
    state.sync = "erro";
    atualizarEstadoLigacao();
    throw err;
  });
}

/* Cópia SÓ dos dados não sensíveis (época, preços, atividades, desconto,
   logótipo) que o link público consegue ler sem login, para mostrar os
   valores certos. Nunca inclui fichas nem dados pessoais. */
var CHAVE_CONFIG_PUBLICA = "config_publica_fichas";
function supaGravarConfigPublica(){
  var c = getConfig();
  var valor = {
    epoca: c.epoca, precoNova: c.precoNova, precoRenov: c.precoRenov, desconto: c.desconto,
    textoDesconto: c.textoDesconto, notaAulas: c.notaAulas, atividades: c.atividades,
    logo: state.settings.logo || null
  };
  return supaFetch("config_app?chave=eq." + CHAVE_CONFIG_PUBLICA, "PATCH", {valor: valor}).then(function(rows){
    if(!rows || !rows.length){
      return supaFetch("config_app", "POST", {chave: CHAVE_CONFIG_PUBLICA, valor: valor});
    }
  });
}

/* grava com pequeno atraso, para várias alterações seguidas darem um só pedido */
function supaAgendarGravacao(){
  state.sync = "a-gravar";
  atualizarEstadoLigacao();
  if(supaTimer) clearTimeout(supaTimer);

   ARMAZENAMENTO — nuvem (Claude), Supabase ou computador local
