<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão das Salas — ARCA d'Ajuda</title>
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --teal:#0E9C7C;--teal-d:#076B54;--teal-l:#DFF7EF;
    --coral:#D85A30;--coral-l:#FAECE7;--coral-d:#712B13;
    --amber:#BA7517;--amber-l:#FAEEDA;--amber-d:#633806;
    --text:#1B2A3D;--text-2:#556377;--text-3:#8C98A8;
    --bg:#F3F6F5;--card:#FFFFFF;--line:#DDE6E2;
    --radius:10px;--radius-lg:14px;--border:1px solid var(--line);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
  .hidden{display:none!important}
  .muted{color:var(--text-2)}
  .small{font-size:12px}
  .mono{font-variant-numeric:tabular-nums;white-space:nowrap}
  .right{text-align:right}
  .center{text-align:center}

  /* ---- LOGIN ---- */
  #login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0E9C7C,#076B54);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}
  #login-card{background:#fff;border-radius:18px;padding:30px 26px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
  #login-card h1{font-size:20px;color:var(--teal-d);text-align:center;margin-bottom:2px}
  #login-card .sub{text-align:center;color:var(--text-2);font-size:12.5px;margin-bottom:20px}
  #login-card label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:12px 0 4px}
  #login-card input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px}
  #login-msg{margin-top:12px;font-size:12.5px;text-align:center;min-height:16px}
  #login-msg.err{color:var(--coral-d)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:9px;padding:9px 13px;font-size:13.5px;font-weight:600;background:#fff;border:1.5px solid var(--line);color:var(--text)}
  .btn:hover{background:var(--bg)}
  .btn-primary{background:var(--teal);color:#fff;border-color:var(--teal)}
  .btn-primary:hover{background:var(--teal-d);border-color:var(--teal-d)}
  .btn-danger{background:none;color:var(--coral-d);border-color:var(--coral)}
  .btn-danger:hover{background:var(--coral-l)}
  .btn-sm{padding:5px 9px;font-size:12px;border-radius:7px}
  .btn-block{width:100%;margin-top:18px;padding:11px 14px;font-size:14px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* ---- APP ---- */
  #app{display:none;min-height:100vh}
  aside#side{width:232px;flex-shrink:0;background:linear-gradient(160deg,var(--teal),var(--teal-d));color:#fff;display:flex;flex-direction:column;gap:10px;padding:14px 12px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;z-index:50}
  .side-foot{flex-shrink:0}
  aside#side .brand{font-weight:800;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;justify-content:center;padding:4px 0 6px}
  .side-geral{display:flex;align-items:center;justify-content:center;gap:5px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.34);border-radius:9px;padding:8px 10px;font-weight:800;font-size:12px}
  .side-geral:hover{background:rgba(255,255,255,.30)}
  .side-ano{background:rgba(255,255,255,.14);border-radius:9px;padding:8px 10px;font-size:12px;line-height:1.4}
  .side-ano b{font-size:13px}
  nav#tabs{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
  nav#tabs button{text-align:left;border:none;border-left:5px solid rgba(255,255,255,.5);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:800;background:rgba(255,255,255,.92);color:var(--teal-d);transition:all .12s ease}
  nav#tabs button:hover{background:#fff}
  nav#tabs button.active{background:#fff;border-left-color:var(--amber);box-shadow:0 3px 9px rgba(0,0,0,.2)}
  .side-foot{margin-top:auto;display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:12px}
  #cloud-pill{background:rgba(255,255,255,.18);border-radius:99px;padding:4px 10px;font-weight:700;cursor:pointer}
  .side-icon{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;width:32px;height:30px;font-size:14px}
  .side-icon:hover{background:rgba(255,255,255,.3)}
  #content{flex:1;min-width:0}
  main{padding:20px 22px 60px;max-width:1500px}
  .section{display:none}.section.active{display:block}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .page-head h2{font-size:22px;color:var(--teal-d);letter-spacing:-.01em}
  .page-head p{color:var(--text-2);font-size:13px;margin-top:2px}
  .card{background:var(--card);border:var(--border);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,20,10,.03)}
  .card h3{font-size:15px;color:var(--teal-d);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--card);border:var(--border);border-radius:var(--radius);padding:12px 14px}
  .kpi .n{font-size:22px;font-weight:800;color:var(--teal-d);line-height:1.1}
  .kpi .l{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  #cloud-banner{position:fixed;top:0;left:0;right:0;z-index:300;background:#C0392B;color:#fff;text-align:center;font-weight:800;font-size:13px;padding:9px 14px;line-height:1.35;box-shadow:0 2px 10px rgba(0,0,0,.28)}
  body.com-banner #app{padding-top:38px}
  .kpi .n.sm{font-size:14px;line-height:1.35}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1F2A2E;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:500;opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}#toast.err{background:var(--coral-d)}

  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);background:#F7FAF9;white-space:nowrap}
  tr.total td{font-weight:800;background:var(--teal-l)}
  tr.dim td{color:var(--text-3)}
  .table-wrap{overflow-x:auto}
  input.cell{width:100%;min-width:60px;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#FFFBEA}
  input.cell.wide{min-width:140px}
  input.cell.num{max-width:90px;text-align:right}
  select.cell{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#FFFBEA}
  input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}

  /* ---- MAPA ---- */
  #side-paleta[hidden]{display:none!important}
  #side-paleta{background:rgba(255,255,255,.12);border-radius:9px;padding:8px 8px 6px;display:flex;flex-direction:column;gap:4px;min-height:0;flex:1 1 auto;overflow:auto}
  #side-paleta .lbl{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;opacity:.9;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
  #side-paleta .lbl button{background:rgba(255,255,255,.25);border:none;color:#fff;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:800}
  #side-paleta .sp{display:flex;align-items:center;gap:6px;border-radius:7px;padding:2px 7px;font-size:11.5px;font-weight:700;color:#1b1b1b;cursor:pointer;border:2px solid transparent;line-height:1.2}
  #side-paleta .sp.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
  #side-paleta .sp .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #side-paleta .sp .lapis{opacity:.6;font-size:11px}
  #side-paleta .sp:hover .lapis{opacity:1}
  #side-paleta .sp.eraser{background:#fff;color:var(--text-2)}
  #side-paleta .sp.eraser.sel{border-color:var(--coral)}
  .paleta-sticky{position:sticky;top:6px;z-index:60;background:rgba(255,255,255,.97);border:var(--border);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.10);backdrop-filter:blur(4px)}
  body.com-banner .paleta-sticky{top:44px}
  .paleta-sticky{padding:5px 10px;top:4px}
  .paleta-sticky .palette{gap:4px}
  .paleta-sticky .chip{padding:1px 7px;font-size:10.5px;border-width:1.5px}
  .paleta-sticky .chip .lapis{font-size:9px;margin-left:3px}
  .paleta-sticky .btn-sm{padding:2px 8px;font-size:11px}
  .paleta-sticky .sel-atual{font-size:11px}
  .paleta-sticky .sel-atual{font-size:12px;color:var(--text-2);margin-left:auto}
  .palette{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{border:2px solid transparent;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;color:#1b1b1b}
  .chip.sel{border-color:#1B2A3D;box-shadow:0 0 0 2px #fff inset}
  .chip.eraser{background:#fff;border-color:var(--line);color:var(--text-2)}
  .chip.eraser.sel{border-color:var(--coral)}
  .salas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px}
  @media(max-width:1100px){.salas-grid{grid-template-columns:1fr}}
  table.mapa{table-layout:fixed;user-select:none}
  table.mapa th,table.mapa td{padding:0;border:1px solid var(--line);text-align:center;height:22px;font-size:11px;line-height:1.1;overflow:hidden}
  table.mapa th{background:var(--teal-l);color:var(--teal-d);height:28px;font-size:11px}
  table.mapa td.hora{background:#F7FAF9;color:var(--text-2);font-weight:600;font-size:10.5px;width:44px}
  table.mapa td.slot{cursor:cell;font-weight:700;color:#1b1b1b}
  table.mapa td.slot:hover{outline:2px solid var(--teal);outline-offset:-2px}
  table.mapa tr.hora-cheia td{border-top-color:#B9C7C1}
  table.mapa td.slot.first{border-top:2px solid rgba(0,0,0,.35)}
  .legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

  /* ---- CALENDÁRIO ---- */
  .meses{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .mes{background:var(--card);border:var(--border);border-radius:var(--radius);padding:10px 12px}
  .mes h4{font-size:13px;color:var(--teal-d);margin-bottom:6px;display:flex;justify-content:space-between}
  .mes .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center}
  .mes .dias .h{color:var(--text-3);font-weight:700;font-size:10px}
  .mes .dias .d{border-radius:5px;padding:4px 0;cursor:pointer;border:1px solid transparent}
  .mes .dias .d:hover{border-color:var(--teal)}
  .mes .dias .d.fim{color:var(--text-3);background:#F3F6F5}
  .mes .dias .d.fechado{background:var(--coral-l);color:var(--coral-d);text-decoration:line-through}
  .mes .dias .d.forcado{outline:2px solid var(--amber);outline-offset:-2px}
  .mes .dias .d.vazio{visibility:hidden}

  /* ---- FOLHA COMPLETA ---- */
  .folha{background:#fff;border:var(--border);border-radius:var(--radius-lg);padding:16px 18px;font-size:11px;color:#111;user-select:none}
  .folha .ed{user-select:text;cursor:text;border-bottom:1px dashed transparent;min-width:12px;display:inline-block}
  .folha .ed:hover,.folha .ed:focus{border-bottom-color:var(--teal);background:#FFFBEA;outline:none}
  .folha .fh{text-align:center;border-bottom:2px solid #222;padding-bottom:5px;margin-bottom:6px}
  .folha .fh h1{font-size:12.5px;font-weight:800}
  .folha .fh .sub{font-size:10px;color:#444}
  .folha h2.ft{font-size:14px;text-align:center;margin:4px 0 8px;color:#111;letter-spacing:.02em}
  .folha .mapas{display:grid;gap:8px;align-items:start}
  .folha .campos{display:flex;flex-direction:column;gap:8px}
  .folha table.fm{table-layout:fixed;width:100%;border-collapse:collapse}
  .folha table.fm th,.folha table.fm td{border:1px solid #999;padding:0 1px;text-align:center;font-size:8.5px;height:15px;line-height:1.05;overflow:hidden;white-space:nowrap}
  .folha table.fm th{background:#DFF7EF;font-weight:800;height:17px;font-size:8px}
  .folha table.fm th.sala{background:#0E9C7C;color:#fff;font-size:11px;height:20px}
  .folha table.fm th.sala .ed{color:#fff}
  .folha table.fm td.h{background:#f2f2f2;font-weight:700;width:58px;color:#333;font-size:7.5px}
  .folha table.fm td.h .fim{color:#777;font-weight:600}
  .folha table.fm td.slot{cursor:cell;font-weight:700;font-size:7.5px;letter-spacing:-.2px}
  .folha table.fm td.slot:hover{outline:2px solid var(--teal);outline-offset:-2px}
  .folha table.fm td.slot.first{border-top:1.5px solid #222}
  .folha table.ft{width:100%;border-collapse:collapse}
  .folha table.ft th,.folha table.ft td{border:1px solid #999;padding:2px 4px;font-size:9.5px;text-align:center;white-space:nowrap}
  .folha table.ft th{background:#DFF7EF;font-weight:800}
  .folha table.ft th.l,.folha table.ft td.l{text-align:left}
  .folha table.ft tr.tot td{font-weight:800;background:#f4f4f4}
  .folha .atvs-wrap{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .folha table.atvs tr.prof td{font-size:8.5px;color:#1B2A3D;font-weight:600;height:16px}
  .folha table.atvs .ed{display:block;min-height:10px}
  .folha table.atvs .ed:empty:before{content:attr(data-ph);color:#aaa;font-weight:400;font-style:italic}
  .folha table.atvs td.fed{cursor:pointer}
  .folha table.atvs td.fed:hover{outline:2px solid var(--teal);outline-offset:-2px}
  .folha table.atvs{table-layout:fixed}
  .folha table.atvs td{white-space:normal;word-break:break-word;font-size:8.5px;padding:2px 2px}
  .folha table.atvs td.fed{font-size:7.5px}
  .folha table.atvs td.fed.sim{color:#076B54;font-weight:700}
  .folha table.atvs td.fed.nao{color:#B8360F}
  .folha .rodape-grid{display:grid;gap:8px;margin-top:8px;align-items:start}
  .folha .aviso-box{border:1px solid #999;padding:4px 6px;font-size:9.5px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;text-align:center;font-weight:700}
  .folha .aviso-box .atencao{color:#B8360F;font-weight:800}
  .folha .obs{margin-top:8px;border:1px solid #999;padding:4px 8px;min-height:44px;font-size:10px}
  .folha .obs b{display:block;margin-bottom:2px}
  .folha .obs .ed{display:block;min-height:26px;white-space:pre-wrap}
  .folha-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  @media screen and (max-width:1100px){.folha .mapas{grid-template-columns:1fr!important}.folha .rodape-grid{grid-template-columns:1fr 1fr!important}}

  .modal.ajuda{max-width:640px;max-height:88vh;overflow:auto}
  .modal .subt{font-weight:800;color:var(--teal-d);margin:10px 0 4px;font-size:13px}
  .modal ul{margin:0 0 6px 18px;font-size:13px;line-height:1.6}

  /* ---- MODAL ATIVIDADE ---- */
  .chip .lapis{margin-left:5px;opacity:.55;font-size:11px}
  .chip:hover .lapis{opacity:1}
  #modal-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:400;display:none;align-items:center;justify-content:center;padding:16px}
  #modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:14px;padding:20px 22px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal h3{color:var(--teal-d);font-size:16px;margin-bottom:12px}
  .modal label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:10px 0 4px}
  .modal input[type=text],.modal select{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px}
  .modal .acoes{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
  .modal .aviso{font-size:12px;color:var(--coral-d);margin-top:8px}

  /* ---- PRINT ---- */
  #print-area{display:none}
  @media print{
    @page{size:A4 landscape;margin:8mm}
    body.print-folha>*{display:none!important}
    body.print-folha #app{display:block!important;padding:0!important}
    body.print-folha aside#side,body.print-folha .folha-tools,body.print-folha .page-head,body.print-folha #cloud-banner{display:none!important}
    body.print-folha #content,body.print-folha main{display:block!important;padding:0!important;max-width:none}
    body.print-folha .section{display:none!important}
    body.print-folha #sec-folha{display:block!important}
    body.print-folha{background:#fff}
    #modal-bg{display:none!important}
    body.print-folha #sec-folha .card{display:none!important}
    body.print-folha .folha{border:none;border-radius:0;padding:0;zoom:.78}
    body.print-folha .folha table.fm th,body.print-folha .folha table.fm td{height:13px}
    body.print-folha .folha .mapas{grid-template-columns:repeat(var(--ncol,3),1fr)!important}
    body.print-folha .paleta-sticky{display:none!important}
    body.print-folha .folha table.atvs .ed:empty:before{content:''}
    body.print-folha .folha .rodape-grid{grid-template-columns:2.4fr 1fr 2.2fr 1.6fr!important}
    body.print-folha .folha .ed{border-bottom:none!important;background:none!important}
    body.print-folha .folha table.fm td.slot:hover{outline:none}
    body:not(.print-folha)>*{display:none!important}
    body:not(.print-folha) #print-area{display:block!important;font-size:12px;color:#000}
    #print-area h1{font-size:16px;margin-bottom:2px}
    #print-area .ph{border-bottom:2px solid #000;margin-bottom:10px;padding-bottom:6px}
    #print-area table{font-size:11px}
    #print-area th,#print-area td{border:1px solid #999;padding:4px 6px}
    #print-area th{background:#eee;color:#000}
    #print-area .pf{margin-top:14px;font-size:10px;color:#444;border-top:1px solid #999;padding-top:5px}
  }
  @media(max-width:760px){
    #app{flex-direction:column}
    aside#side{position:static;height:auto;width:100%}
    main{padding:14px}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-card">
    <h1>🏠 GESTÃO DAS SALAS</h1>
    <div class="sub">Mapa de ocupação e pagamentos — ARCA d'Ajuda</div>
    <label>Email</label>
    <input type="email" id="lg-email" autocomplete="username" placeholder="conta da associação">
    <label>Palavra-passe</label>
    <input type="password" id="lg-pass" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')fazerLogin()">
    <button class="btn btn-primary btn-block" onclick="fazerLogin()">Entrar</button>
    <div id="login-msg"></div>
    <div class="muted" style="margin-top:14px;font-size:12px;text-align:center;line-height:1.5">Entra com a <b>mesma conta da associação</b> que usas no ATL. Os dados ficam guardados e sincronizados em todos os computadores.</div>
    <div class="center" style="margin-top:12px"><a href="../" class="small muted">⬅️ Voltar ao menu geral</a></div>
  </div>
</div>

<div id="cloud-banner" style="display:none"></div>

<div id="app">
  <aside id="side">
    <div class="brand">🏠 SALAS ARCA</div>
    <a class="side-geral" href="../" title="Voltar ao menu geral da ARCA d'Ajuda">⬅️ Menu geral</a>
    <div class="side-ano">Ano letivo<br><select id="ano-sel" onchange="selecionarAno(this.value)" style="width:100%;margin-top:4px;padding:5px 6px;border-radius:7px;border:none;font-weight:800;color:var(--teal-d)"></select><button class="btn btn-sm" style="width:100%;margin-top:6px" onclick="novoAnoDialogo()">+ Novo ano letivo</button><span id="side-ano-txt" hidden></span></div>
    <nav id="tabs">

let _refreshing=null, _ultimoErroCloud='';
async function supaRefresh(){
  const rt = supaSession && supaSession.refresh_token; if(!rt) return false;
  if(_refreshing) return _refreshing;

    try{ const res=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`,{ method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY}, body:JSON.stringify({refresh_token:rt}) });
      const data=await res.json();
      if(res.ok && data.access_token){ supaSession=data; LS.set('salas_supa_session', supaSession); return true; }
      if(res.status===400||res.status===401||res.status===403){ _ultimoErroCloud='sessão expirada'; sessaoExpirou(); } }

  const ok=await _refreshing; _refreshing=null; return ok;
}
let _ultimaOp='';
async function supaFetch(path, method='GET', body=null, extra=null, _retry){
  _ultimaOp=method+' '+path.split('?')[0];
  const headers={'apikey':SUPA_KEY,'Content-Type':'application/json'};
  headers['Authorization']='Bearer '+((supaSession&&supaSession.access_token)||SUPA_KEY);
  if(method!=='GET') headers['Prefer']='return=representation';
  if(extra) Object.assign(headers, extra);
  const opts={method,headers}; if(body) opts.body=JSON.stringify(body);
  let res; try{ res=await fetch(`${SUPA_URL}/rest/v1/${path}`, opts); }catch(e){ throw new Error('sem resposta da rede em '+_ultimaOp+' (internet, firewall ou bloqueador)'); }

    if(await supaRefresh()) return supaFetch(path, method, body, extra, true);

}

async function cloudLer(){

function normalizar(v){
  const base=dadosIniciais();

  d.acertos=Array.isArray(d.acertos)?d.acertos:[]; d.assoc=Object.assign({},base.assoc,d.assoc||{}); d.rotulos=Object.assign({},base.rotulos,d.rotulos||{}); d.txt=Object.assign({},base.txt,d.txt||{}); d.dias=Array.isArray(d.dias)&&d.dias.length===7?d.dias:DIAS_DEF.slice(); d.diasS=Array.isArray(d.diasS)&&d.diasS.length===7?d.diasS:DIAS_S_DEF.slice(); DIAS=d.dias; DIAS_S=d.diasS; d.salas.forEach(x=>{ if(!x.base) x.base='semana'; if(!x.tipo) x.tipo='sala'; if(x.cobrar===undefined) x.cobrar=true; });
  if((Number(v.versao)||1)<3 && !d.salas.some(x=>x.tipo==='campo')){ base.salas.filter(x=>x.tipo==='campo').forEach(x=>{ d.salas.push(x); d.mapa[x.id]=base.mapa[x.id]; }); base.atividades.forEach(a=>{ if(!d.atividades.some(b=>b.nome===a.nome)) d.atividades.push(a); }); }
  d.versao=3;
  return d;
}

function horasDia(salaId, atvId){

// células ocupadas que não estão visíveis no mapa (fora do horário ou com outro passo)
function ocupacoesInvisiveis(){
  const out=[]; D.salas.forEach(s=>{ const vis=new Set(slots(s).map(String)); const m=D.mapa[s.id]||{}; for(let d=0;d<7;d++){ const dd=m[d]||{}; for(const k in dd){ if(!vis.has(k)) out.push({sala:s,dia:d,h:Number(k),atv:atv(dd[k])}); } } });
  return out;
}
function limparInvisiveis(){ const inv=ocupacoesInvisiveis(); inv.forEach(x=>{ delete D.mapa[x.sala.id][x.dia][String(x.h)]; }); guardar(); renderAll(); toast(inv.length? inv.length+' ocupações escondidas removidas.' : 'Não há ocupações escondidas.'); }
function detalheAtividade(atvId){ // texto: onde está marcada
  const partes=[]; D.salas.forEach(s=>{ const hd=horasDia(s.id,atvId); const t=hd.map((v,k)=>v>0?DIAS_S[k]+' '+fmtH(v)+'h':null).filter(Boolean); if(t.length) partes.push(s.nome+': '+t.join(', ')); });
  return partes.join(' | ')||'sem ocupação';
}
function blocoDuracao(sid,d,hr){ const id=celula(sid,d,hr); if(!id) return 0; let a=hr, b=hr; while(celula(sid,d,Math.round((a-PASSO())*100)/100)===id) a=Math.round((a-PASSO())*100)/100; while(celula(sid,d,Math.round((b+PASSO())*100)/100)===id) b=Math.round((b+PASSO())*100)/100; return Math.round((b-a+PASSO())*100)/100; }
function horasEspaco(sid){ return D.atividades.reduce((a,x)=>a+horasDia(sid,x.id).reduce((p,q)=>p+q,0),0); }
function precoAplicado(s, atvId, horasSemana){
  const manual=D.precoManual[s.id+'|'+atvId];
  if(manual!==undefined && manual!=='' && manual!==null && !isNaN(Number(manual))) return {preco:Number(manual), escalao:'manual'};
  if(horasSemana<=0) return {preco:0, escalao:''};
  return precoTabela(s, horasSemana);
}
function precoTabela(s,hs,horasAula){ // base 'semana': horas semanais na sala; base 'aula': horas de cada aula (dia)
  const ref = s.base==='aula' ? (horasAula!==undefined?horasAula:hs) : hs;
  const red = ref >= Number(s.limiar||2);
  return {preco:red?Number(s.p2)||0:Number(s.p1)||0, escalao:red?D.rotulos.p2:D.rotulos.p1};
}
// linhas de detalhe: por sala × atividade com horas>0 (ou preço manual definido)
function detalhe(){
  const rows=[];
  D.salas.filter(s=>s.cobrar).forEach(s=>D.atividades.forEach(a=>{
    const hd=horasDia(s.id,a.id); const hs=hd.reduce((x,y)=>x+y,0);
    if(hs<=0) return;
    const pa=precoAplicado(s,a.id,hs);
    let valorDia, precoTxt=pa.preco, escalao=pa.escalao;
    if(s.base==='aula' && pa.escalao!=='manual'){ const ps=hd.map(h=>h>0?precoTabela(s,hs,h):null); valorDia=hd.map((h,i)=>h>0?h*ps[i].preco:0); const uniq=[...new Set(ps.filter(Boolean).map(x=>x.preco))]; precoTxt=uniq.length===1?uniq[0]:null; escalao=[...new Set(ps.filter(Boolean).map(x=>x.escalao))].join(' / '); }
    else valorDia=hd.map(h=>h*pa.preco);
    rows.push({sala:s, atv:a, horasDia:hd, horasSemana:hs, preco:precoTxt, escalao, valorSemana:valorDia.reduce((x,y)=>x+y,0), valorDia});
  }));
  return rows;
}
// calendário
function parseD(s){ const p=(s||'').split('-'); return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])); }
function isoD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function diaSemana(d){ return (d.getDay()+6)%7; } // 0=2ª … 6=Dom
function meses(){ // 12 meses a partir do início
  const ini=parseD(D.inicio); const out=[];
  for(let i=0;i<D.nMeses;i++){ const d=new Date(ini.getFullYear(), ini.getMonth()+i, 1); out.push({ym:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), ano:d.getFullYear(), mes:d.getMonth(), nome:MESES[d.getMonth()]+' '+d.getFullYear(), curto:MESES[d.getMonth()].slice(0,3)+' '+String(d.getFullYear()).slice(2)}); }
  return out;
}
function fechadoPorPeriodo(iso){ return D.fechados.some(f=>f.inicio && f.fim && f.inicio<=iso && iso<=f.fim); }
function temAulas(iso){ const a=D.ajustes[iso]; if(a==='A') return true; if(a==='S') return false; return !fechadoPorPeriodo(iso); }
function sessoesMes(ano,mes){ // [7] nº de dias com aulas por dia da semana
  const out=[0,0,0,0,0,0,0]; const n=new Date(ano,mes+1,0).getDate();
  for(let d=1; d<=n; d++){ const dt=new Date(ano,mes,d); if(temAulas(isoD(dt))) out[diaSemana(dt)]++; }
  return out;
}
function acertoTotal(atvId, ym){ return D.acertos.filter(x=>x.atvId===atvId && x.ym===ym).reduce((a,x)=>a+(Number(x.valor)||0),0); }
function valorMes(row, ses){ return row.valorDia.reduce((acc,v,i)=>acc+v*ses[i],0); }

function eliminarAtividade(id, btn){
  if(btn.dataset.armed!=='1'){ btn.dataset.armed='1'; btn.textContent='Confirmar eliminação?'; setTimeout(()=>{ if(btn.isConnected){ btn.dataset.armed=''; btn.textContent='🗑 Eliminar'; } },3500); return; }
  D.salas.forEach(s=>{ const m=D.mapa[s.id]||{}; for(const d in m){ for(const k in m[d]){ if(m[d][k]===id) delete m[d][k]; } } });
  D.atividades=D.atividades.filter(a=>a.id!==id); D.acertos=D.acertos.filter(x=>x.atvId!==id); Object.keys(D.precoManual).forEach(k=>{ if(k.endsWith('|'+id)) delete D.precoManual[k]; });

}

let brush = null; // id da atividade | 'eraser'
let painting=false, paintValue=null;
function renderMapa(){
  if(!brush || (brush!=='eraser' && !atv(brush))) brush = D.atividades[0]?D.atividades[0].id:'eraser';
  const det=detalhe();
  const totalH=det.reduce((a,r)=>a+r.horasSemana,0), totalV=det.reduce((a,r)=>a+r.valorSemana,0);
  let h=`<div class="page-head"><div><h2>Mapa de ocupação das salas</h2><p>Escolhe a atividade em cima e clica (ou arrasta) nas meias-horas para ocupar. Cada linha vai da hora de Início à hora de Fim (ex.: uma aula das 17:30 às 18:30 = linhas 17:30 e 18:00). Cada célula = ${D.passo} minutos; uma aula de 1 hora = ${Math.round(60/D.passo)} célula(s). Para libertar, usa a borracha ou clica de novo com a mesma atividade.</p></div>

  h+=`<div class="paleta-sticky">${paletaHtml(renderMapa)}</div>`;
  h+=`<div class="salas-grid">`;

    h+=`<div class="card" style="margin:0"><h3><span>${esc(s.nome)}</span><span class="small muted">${fmtH(horasEspaco(s.id))} h/semana${s.cobrar?' · '+fmt(s.p1)+' / '+fmt(s.p2)+' por hora':' · sem cobrança'}</span></h3><div class="table-wrap"><table class="mapa" data-sala="${s.id}"><thead><tr><th style="width:40px">Início</th><th style="width:40px">Fim</th>`;
    DIAS_S.forEach(d=>h+=`<th>${d}</th>`); h+=`</tr></thead><tbody>`;
    slots(s).forEach((hr,idx)=>{
      h+=`<tr class="${Number.isInteger(hr)?'hora-cheia':''}"><td class="hora">${horaTxt(hr)}</td><td class="hora" style="color:#888">${horaTxt(hr+PASSO())}</td>`;
      for(let d=0; d<7; d++){
        const id=celula(s.id,d,hr); const a=id?atv(id):null;
        const prev=celula(s.id,d,Math.round((hr-PASSO())*100)/100);
        const first=a && prev!==id;
        h+=`<td class="slot ${first?'first':''}" data-d="${d}" data-h="${hr}" style="${a?'background:'+esc(a.cor):''}" title="${a?esc(a.nome)+' · '+horaTxt(hr)+'–'+horaTxt(hr+PASSO())+' ('+fmtH(blocoDuracao(s.id,d,hr))+'h seguidas)':horaTxt(hr)+'–'+horaTxt(hr+PASSO())}">${a&&first?esc(a.nome):''}</td>`;
      }
      h+=`</tr>`;
    });
    h+=`</tbody></table></div></div>`;
  });
  h+=`</div>`;

  h+=`<div class="card" style="margin-top:16px"><h3>Horas semanais por atividade</h3><div class="table-wrap"><table><thead><tr><th>Atividade</th><th>Federada</th>`;

  D.atividades.forEach(a=>{
    const rows=det.filter(r=>r.atv.id===a.id); if(!D.salas.some(s=>horasDia(s.id,a.id).some(v=>v>0))) return;
    h+=`<tr><td><span class="legend"><span><i style="background:${esc(a.cor)}"></i>${esc(a.nome)}</span></span><div class="small muted">${esc(detalheAtividade(a.id))}</div></td><td>${a.federada?'Federada':'Não federada'}</td>`;
    D.salas.forEach(s=>{ const hh=horasDia(s.id,a.id).reduce((p,q)=>p+q,0); h+=`<td class="right mono">${hh>0?fmtH(hh):'—'}</td>`; });
    h+=`<td class="right mono"><b>${fmtH(D.salas.reduce((x,s)=>x+horasDia(s.id,a.id).reduce((p,q)=>p+q,0),0))}</b></td><td class="right mono"><b>${fmt(rows.reduce((x,r)=>x+r.valorSemana,0))}</b></td></tr>`;
  });
  h+=`<tr class="total"><td colspan="2">TOTAL</td>`; D.salas.forEach(s=>h+=`<td class="right mono">${fmtH(horasEspaco(s.id))}</td>`);
  h+=`<td class="right mono">${fmtH(D.salas.reduce((x,s)=>x+horasEspaco(s.id),0))}</td><td class="right mono">${fmt(totalV)}</td></tr></tbody></table></div><p class="small muted" style="margin-top:8px">${esc(D.assoc.nota)}</p></div>`;
  $('sec-mapa').innerHTML=h;
  ligarPintura('#sec-mapa table.mapa', renderMapa);
}
let _afterPaint=null, _ultimoToque=0;
function ligarPintura(sel, after){
  document.querySelectorAll(sel).forEach(tb=>{
    const sid=tb.dataset.sala;
    tb.addEventListener('mousedown',e=>{ if(_ultimoToque && Date.now()-_ultimoToque<800) return; const td=e.target.closest('td.slot'); if(!td) return; e.preventDefault(); painting=true; _afterPaint=after; const cur=celula(sid,+td.dataset.d,+td.dataset.h); paintValue = (brush==='eraser'||cur===brush)? null : brush; aplicar(sid,td); });
    tb.addEventListener('mouseover',e=>{ if(!painting) return; const td=e.target.closest('td.slot'); if(td) aplicar(sid,td); });
    tb.addEventListener('mouseleave',()=>{ if(painting){ painting=false; guardar(); (_afterPaint||renderMapa)(); } });
    tb.addEventListener('touchstart',e=>{ _ultimoToque=Date.now(); const td=e.target.closest('td.slot'); if(!td) return; _afterPaint=after; const cur=celula(sid,+td.dataset.d,+td.dataset.h); paintValue=(brush==='eraser'||cur===brush)?null:brush; aplicar(sid,td); },{passive:true});
  });
}
document.addEventListener('mouseup',()=>{ if(painting){ painting=false; guardar(); (_afterPaint||renderMapa)(); } });
document.addEventListener('touchend',()=>{ if(_afterPaint){ guardar(); _afterPaint(); _afterPaint=null; } },{passive:true});
function aplicar(sid,td){ const d=+td.dataset.d, hr=+td.dataset.h; if(celula(sid,d,hr)===paintValue) return; setCelula(sid,d,hr,paintValue); const a=paintValue?atv(paintValue):null; td.style.background=a?a.cor:''; td.textContent=a?a.nome:''; }

function imprimirMapa(){
  let h=cabecalhoPrint('Mapa de ocupação das salas');

    slots(s).forEach(hr=>{ h+=`<tr><td>${horaTxt(hr)}–${horaTxt(hr+PASSO())}</td>`; for(let d=0;d<7;d++){ const a=atv(celula(s.id,d,hr)||''); h+=`<td style="${a?'background:'+esc(a.cor):''}">${a?esc(a.nome):''}</td>`; } h+=`</tr>`; });
    h+=`</tbody></table>`;

function edSala(id,k,v){ const s=sala(id); if(!s) return; s[k]= (k==='nome')? (v.trim()||s.nome) : ((k==='base'||k==='tipo'||k==='cobrar')? v : (k==='horaIni'||k==='horaFim')? (v===''?null:Number(v)) : Number(v)); guardar(); renderDefinicoes(); }

function addAcerto(ym){ D.acertos.push({id:uid(), ym, atvId:(D.atividades[0]||{}).id, desc:'', valor:0}); guardar(); renderPagamentos(); }
function edAcerto(id,k,v){ const x=D.acertos.find(y=>y.id===id); if(!x) return; x[k]= k==='valor'?Number(v)||0:v; guardar(); renderPagamentos(); }
function delAcerto(id){ D.acertos=D.acertos.filter(y=>y.id!==id); guardar(); renderPagamentos(); }
function exportarCSV(){
  const ms=meses(), det=detalhe(); const sep=';'; const num=n=>(Number(n)||0).toFixed(2).replace('.',',');
  const lines=[['Atividade','Sala','Horas/semana','Escalao','Preco/hora','Valor/semana',...ms.map(m=>m.nome),'Total ano'].join(sep)];
  det.forEach(r=>{ const vals=ms.map(m=>valorMes(r,sessoesMes(m.ano,m.mes))); lines.push([r.atv.nome,r.sala.nome,num(r.horasSemana),r.escalao,num(r.preco),num(r.valorSemana),...vals.map(num),num(vals.reduce((a,b)=>a+b,0))].join(sep)); });
  D.acertos.forEach(x=>{ const a=atv(x.atvId); const vals=ms.map(m=>m.ym===x.ym?Number(x.valor)||0:0); lines.push([(a?a.nome:'—')+' (acerto: '+x.desc+')','',0,'acerto',0,0,...vals.map(num),num(Number(x.valor)||0)].join(sep)); });
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pagamentos_salas_'+$('side-ano-txt').textContent.replace('/','-')+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

  h+=`<div class="row" style="margin-bottom:14px;gap:6px">${[['cfg-ano','📅 Ano letivo'],['cfg-salas','🏠 Salas e preços'],['cfg-atividades','🎽 Atividades'],['cfg-manuais','🏷️ Preços manuais'],['cfg-assoc','🏛️ Associação'],['cfg-mapa','🕗 Horário do mapa'],['cfg-dias','📆 Dias da semana'],['cfg-anos','📚 Anos letivos'],['cfg-cloud','☁️ Cloud'],['cfg-copia','💾 Cópia'],['cfg-escondidas','🧹 Escondidas']].map(x=>`<a class="btn btn-sm" href="#${x[0]}" onclick="document.getElementById('${x[0]}').scrollIntoView({behavior:'smooth'});return false">${x[1]}</a>`).join('')}</div>`;
  const fimAno=(()=>{ const i=parseD(D.inicio); const f=new Date(i.getFullYear(), i.getMonth()+D.nMeses-1, 1); return f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0'); })();
  h+=`<div class="card" id="cfg-ano"><h3>Ano letivo ${esc(ALL.atual)}</h3><div class="row"><label>Começa em <input type="date" class="cell" style="width:auto" value="${esc(D.inicio)}" onchange="D.inicio=this.value||D.inicio;guardar();renderAll()"></label><label>e acaba em <input type="month" class="cell" style="width:auto" value="${fimAno}" onchange="setFimAno(this.value)"></label><span class="small muted">(${D.nMeses} meses: ${esc(meses()[0].nome)} a ${esc(meses()[meses().length-1].nome)})</span></div><p class="small muted" style="margin-top:8px">Os feriados e pausas definem-se no Calendário. O nome do ano (ex.: 2025/26) vem da data de início.</p></div>`;
  h+=htmlPrecos();
  h+=`<div class="card" id="cfg-assoc"><h3>Dados da associação (cabeçalho das impressões)</h3><div class="table-wrap"><table><tbody>
    <tr><td style="width:180px">Nome</td><td><input class="cell" value="${esc(D.assoc.nome)}" onchange="D.assoc.nome=this.value;guardar()"></td></tr>
    <tr><td>NIPC</td><td><input class="cell" value="${esc(D.assoc.nipc)}" onchange="D.assoc.nipc=this.value;guardar()"></td></tr>
    <tr><td>Morada</td><td><input class="cell" value="${esc(D.assoc.morada)}" onchange="D.assoc.morada=this.value;guardar()"></td></tr>
    <tr><td>Contacto</td><td><input class="cell" value="${esc(D.assoc.contacto)}" onchange="D.assoc.contacto=this.value;guardar()"></td></tr>
    <tr><td>Nota no mapa</td><td><input class="cell" value="${esc(D.assoc.nota)}" onchange="D.assoc.nota=this.value;guardar()"></td></tr>
    <tr><td>Valor inscrição — nova</td><td><input class="cell" value="${esc(D.assoc.inscNova||'')}" onchange="D.assoc.inscNova=this.value;guardar()"></td></tr>
    <tr><td>Valor inscrição — renovação</td><td><input class="cell" value="${esc(D.assoc.inscRenov||'')}" onchange="D.assoc.inscRenov=this.value;guardar()"></td></tr>
    <tr><td>Nota junto ao preçário</td><td><input class="cell" value="${esc(D.assoc.notaMapa||'')}" onchange="D.assoc.notaMapa=this.value;guardar()"></td></tr>
    <tr><td>Aviso (rodapé da folha)</td><td><input class="cell" value="${esc(D.assoc.aviso||'')}" onchange="D.assoc.aviso=this.value;guardar()"></td></tr>
    <tr><td>Rodapé das impressões</td><td><input class="cell" value="${esc(D.assoc.rodape)}" onchange="D.assoc.rodape=this.value;guardar()"></td></tr></tbody></table></div></div>`;
  h+=`<div class="card" id="cfg-dias"><h3>Nomes dos dias da semana</h3><div class="row">${DIAS.map((d,i)=>`<label class="small muted">${DIAS_DEF[i]}<br><input class="cell" style="width:90px" value="${esc(d)}" onchange="D.dias[${i}]=this.value||'${DIAS_DEF[i]}';guardar()"> <input class="cell" style="width:52px" value="${esc(DIAS_S[i])}" title="abreviatura" onchange="D.diasS[${i}]=this.value||'${DIAS_S_DEF[i]}';guardar()"></label>`).join('')}</div></div>`;
  h+=`<div class="card" id="cfg-anos"><h3><span>Anos letivos</span><button class="btn btn-sm" onclick="novoAnoDialogo()">+ Novo ano</button></h3><div class="table-wrap"><table><thead><tr><th>Ano</th><th>Início</th><th class="right">Atividades no mapa</th><th class="right">Horas/semana</th><th></th></tr></thead><tbody>${listaAnos().map(k=>{ const e=ALL.anos[k]; const st=comOutroAno(e,()=>({n:D.atividades.filter(a=>D.salas.some(s=>horasDia(s.id,a.id).some(v=>v>0))).length, h:D.salas.reduce((x,s)=>x+horasEspaco(s.id),0)})); return `<tr ${k===ALL.atual?'style="background:var(--teal-l)"':''}><td><b>${esc(k)}</b>${k===ALL.atual?' <span class="small muted">(atual)</span>':''}</td><td>${esc(e.inicio)}</td><td class="right mono">${st.n}</td><td class="right mono">${fmtH(st.h)}</td><td>${k===ALL.atual?'':`<button class="btn btn-sm" onclick="selecionarAno('${esc(k)}')">Abrir</button> `}<button class="btn btn-sm btn-danger" onclick="eliminarAno('${esc(k)}',this)">Eliminar</button></td></tr>`; }).join('')}</tbody></table></div><p class="small muted" style="margin-top:8px">Cada ano tem o seu mapa, preçário, feriados e pagamentos. O seletor do menu lateral muda de ano; a comparação está em Pagamentos.</p></div>`;
  h+=`<div class="card" id="cfg-mapa"><h3>Horário do mapa</h3><div class="row"><label>Das <input type="number" class="cell num" min="0" max="23" value="${D.horaIni}" onchange="D.horaIni=Math.max(0,Math.min(23,Number(this.value)||8));if(D.horaFim<=D.horaIni)D.horaFim=D.horaIni+1;guardar();renderDefinicoes()">h</label><label>às <input type="number" class="cell num" min="1" max="24" value="${D.horaFim}" onchange="D.horaFim=Math.max(D.horaIni+1,Math.min(24,Number(this.value)||22));guardar();renderDefinicoes()">h</label>
    <label>Célula de <select class="cell" onchange="D.passo=Number(this.value);guardar();renderDefinicoes()"><option value="15" ${D.passo===15?'selected':''}>15 min</option><option value="30" ${D.passo===30?'selected':''}>30 min</option><option value="60" ${D.passo===60?'selected':''}>60 min</option></select></label></div><p class="small muted" style="margin-top:8px">Ocupações fora deste intervalo deixam de ser visíveis no mapa (não são apagadas). Se mudar a célula para 60 min, ocupações que começam à meia hora deixam de ser visíveis — use 30 min para o horário atual.</p></div>`;
  const inv=ocupacoesInvisiveis();
  h+=`<div class="card" id="cfg-escondidas"><h3>Ocupações escondidas</h3><p class="small muted" style="margin-bottom:8px">Células marcadas fora do horário visível de um espaço (ou com outra duração de célula). Não contam para as horas nem para os pagamentos, mas convém limpá-las.</p>${inv.length?`<div class="table-wrap"><table><thead><tr><th>Espaço</th><th>Dia</th><th>Hora</th><th>Atividade</th></tr></thead><tbody>${inv.map(x=>`<tr><td>${esc(x.sala.nome)}</td><td>${DIAS_S[x.dia]}</td><td>${horaTxt(x.h)}</td><td>${esc(x.atv?x.atv.nome:'?')}</td></tr>`).join('')}</tbody></table></div><button class="btn btn-danger" style="margin-top:8px" onclick="limparInvisiveis()">Remover estas ${inv.length} ocupações</button>`:'<p class="small muted">Nenhuma — está tudo visível no mapa.</p>'}</div>`;
  h+=`<div class="card" id="cfg-cloud"><h3>Ligação à cloud</h3><p class="small muted" style="margin-bottom:8px">Conta: ${esc((supaSession&&supaSession.user&&supaSession.user.email)||'—')} · Dados guardados na tabela <code>config_app</code> (chave <code>${CHAVE_DADOS}</code>).</p><div class="row"><button class="btn" onclick="testarCloud()">🔎 Testar ligação</button><button class="btn" onclick="sincronizarAgora()">☁️ Sincronizar agora</button></div><pre id="cloud-diag" class="small" style="white-space:pre-wrap;margin-top:8px;background:#F7FAF9;padding:8px;border-radius:8px;display:none"></pre></div>`;
  h+=`<div class="card" id="cfg-copia"><h3>Cópia de segurança</h3><div class="row"><button class="btn" onclick="exportarJSON()">⭳ Descarregar cópia (JSON)</button><label class="btn">⭱ Repor de uma cópia <input type="file" accept="application/json" style="display:none" onchange="importarJSON(this.files[0])"></label></div><p class="small muted" style="margin-top:8px">Última alteração: ${D.atualizado?new Date(D.atualizado).toLocaleString('pt-PT'):'—'} · Sessão: ${esc((supaSession&&supaSession.user&&supaSession.user.email)||'—')}</p></div>`;
  h+=`<div class="card"><h3>Repor dados iniciais</h3><p class="small muted" style="margin-bottom:8px">Volta ao horário 2025/26 original, preçário e feriados pré-carregados. Apaga todas as alterações.</p><button class="btn btn-danger" id="btn-reset" onclick="resetDados(this)">Repor dados iniciais</button></div>`;
  $('sec-definicoes').innerHTML=h;
}
async function testarCloud(){
  const out=[]; const el=$('cloud-diag'); el.style.display='block'; el.textContent='A testar…';
  try{ const r=await fetch(`${SUPA_URL}/auth/v1/user`,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+((supaSession&&supaSession.access_token)||'')}}); out.push('Sessão: HTTP '+r.status+(r.ok?' ✔':' ✘ (entra outra vez)')); }catch(e){ out.push('Sessão: sem resposta da rede ✘'); }
  try{ const rows=await supaFetch(`config_app?chave=eq.${CHAVE_DADOS}&select=chave`); out.push('Leitura config_app: ✔ '+(rows&&rows.length?'registo existe':'ainda sem registo (será criado ao guardar)')); }catch(e){ out.push('Leitura config_app: ✘ '+e.message); }
  try{ await new Promise((res,rej)=>{ _fila=_fila.then(async()=>{ try{ if(_existeNaCloud) await supaFetch(`config_app?chave=eq.${CHAVE_DADOS}`,'PATCH',{valor:JSON.stringify(ALL)}); else { await supaFetch('config_app','POST',{chave:CHAVE_DADOS,valor:JSON.stringify(ALL)}); _existeNaCloud=true; } res(); }catch(e){ rej(e); } }); }); out.push('Escrita config_app: ✔'); marcaCloud(true); }catch(e){ out.push('Escrita config_app: ✘ '+e.message); }
  el.textContent=out.join('\n');
}
function setFimAno(v){ if(!v) return; const i=parseD(D.inicio); const [y,m]=v.split('-').map(Number); const n=(y-i.getFullYear())*12+(m-1-i.getMonth())+1; if(n<1||n>24){ toast('O fim tem de ser entre 1 e 24 meses depois do início.',false); renderDefinicoes(); return; } D.nMeses=n; guardar(); renderDefinicoes(); }
function exportarJSON(){ const blob=new Blob([JSON.stringify(ALL,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='salas_arca_'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); }
function importarJSON(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ try{ ALL=normalizarTudo(JSON.parse(r.result)); ativarAno(); guardar(); renderAll(); toast('Cópia reposta.'); }catch(e){ toast('Ficheiro inválido.',false); } }; r.readAsText(file); }
function resetDados(btn){ if(btn.dataset.armed!=='1'){ btn.dataset.armed='1'; btn.textContent='Confirmar? (apaga tudo)'; setTimeout(()=>{ if(btn.isConnected){ btn.dataset.armed=''; btn.textContent='Repor dados iniciais'; } },3500); return; } const e=dadosIniciais(); e.inicio=D.inicio; ALL.anos[ALL.atual]=normalizar(e); ativarAno(); guardar(); renderAll(); toast('Dados iniciais repostos neste ano.'); }

/* ============================================================
   ARRANQUE
   ============================================================ */
async function entrarApp(){
  $('login-screen').style.display='none'; $('app').style.display='flex';
  ALL = normalizarTudo(LS.get(CHAVE_DADOS)); ativarAno();
  renderAll(); showTab('folha'); initAjudaFab();
  marcaCloud(null);
  try{
    const v=await cloudLer();
    if(v){ ALL=normalizarTudo(v); ativarAno(); LS.set(CHAVE_DADOS,ALL); renderAll(); }
    else { cloudGuardar(ALL); }
    marcaCloud(true);
  }catch(e){ console.warn('cloud ler',e); _ultimoErroCloud=(e&&e.message)||''; marcaCloud(false); }
}
(function init(){
  if(supaSession && supaSession.access_token){ entrarApp(); }
})();
</script>
</body>
