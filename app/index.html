 const datasMudaram = antigo ? (antigo.dataInicio!==ini || antigo.dataFim!==fim) : false;\n  const obj={ id:id||uid(), nome, ano:parseInt($('e-ano').value)||'', dataInicio:ini, dataFim:fim };\n  if(id){ const i=edicoes.findIndex(e=>e.id===id); if(i>=0) edicoes[i]=obj; } else edicoes.push(obj);\n  edicaoAtiva = obj.id; save('atl_edicoes', edicoes); save('atl_edicao_ativa', edicaoAtiva);\n  if(obj.ano){ anoFiltro=String(obj.ano); LS.set('atl_ano_filtro', anoFiltro); }\n  let escaloesRefeitos=false;\n  if(!id){ const dd=dadosVazios(); if(obj.dataInicio&&obj.dataFim){ dd.precos.inscricoes=escaloesDoPeriodo(obj, dd.precos.inscricoes); escaloesRefeitos=true; } setD(dd); }\n  else if(datasMudaram && obj.dataInicio && obj.dataFim){ const d=getD(); d.precos.inscricoes=escaloesDoPeriodo(obj, d.precos.inscricoes); setD(d); escaloesRefeitos=true; }\n  publicarConfigPublica(true);\n  fecharModal(); popularEdicoes(); renderAtual();\n  toast('Período guardado.'+(escaloesRefeitos?' Escalões atualizados para as datas (define/confere os preços em 🏷️ Valores).':''));\n}\nfunction eliminarEdicao(id){\n  const e=edicoes.find(x=>x.id===id); const nome=e?e.nome:'';\n  // aviso duplo\n  if(!confirm(`⚠️ ATENÇÃO\\n\\nVais eliminar o período \"${nome}\" e TODOS os seus dados (inscrições, despesas, receitas, funcionários…).\\n\\nEsta ação NÃO pode ser desfeita. Continuar?`)) return;\n  const t=prompt(`Confirmação final.\\n\\nEscreve APAGAR (em maiúsculas) para eliminar definitivamente o período \"${nome}\":`);\n  if((t||'').trim().toUpperCase()!=='APAGAR'){ toast('Cancelado — o período NÃO foi eliminado.'); return; }\n  edicoes = edicoes.filter(x=>x.id!==id); del('atl_ed_'+id);\n  if(edicaoAtiva===id) edicaoAtiva = edicoes[0]?edicoes[0].id:null;\n  save('atl_edicoes', edicoes); save('atl_edicao_ativa', edicaoAtiva);\n  fecharModal(); popularEdicoes(); renderAtual(); toast('Período eliminado.');\n}\n\n/* ============================================================\n   NAVEGAÇÃO\n   ============================================================ */\nlet tabAtual='dashboard';\nfunction showTab(t){\n  tabAtual=t;\n  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));\n  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));\n  $('sec-'+t).classList.add('active'); renderAtual();\n  if(t==='criancas') carregarPreInscricoesCloud();\n}\nconst TABS_SO_PERIODO=['semanas','mapa','precos']; // não fazem sentido na vista anual (datas/preços variam por período)\nfunction renderAtual(){\n  const banner=$('ano-banner'); if(banner) banner.classList.toggle('hidden', !modoAno());\n  if(modoAno() && TABS_SO_PERIODO.includes(tabAtual)){\n    const el=$('sec-'+tabAtual); if(el) el.innerHTML=`<div class=\"card\"><div class=\"empty\">Este ecrã é por período (as datas e os valores variam de período para período).<br><br>Escolhe um período específico no seletor de períodos (menu lateral) para o ver.<\/div><\/div>`;\n    popularEdicoes(); return;\n  }\n  const r={dashboard:renderDashboard,criancas:renderCriancas,semanas:renderSemanas,mapa:renderMapa,despesas:renderDespesas,receitas:renderReceitas,equipa:renderEquipa,atividades:renderAtividades,precos:renderPrecos,documentos:renderDocumentos,definicoes:renderDefinicoes}[tabAtual];\n  if(r) r(); popularEdicoes();\n}\nfunction precisaEdicao(el){\n  if(edicaoAtiva) return false;\n  el.innerHTML = `<div class=\"card\"><div class=\"empty\">Ainda não tens nenhum período do ATL.<br><br><button class=\"btn btn-primary\" style=\"width:auto;padding:10px 18px\" onclick=\"abrirModalEdicao()\">+ Criar primeiro período<\/button><\/div><\/div>`;\n  return true;\n}\n\n/* ---------- totais ---------- */\nfunction totais(){\n  const d=getD();\n  const ativas=criancasAtivas(d);\n  const totInscrito = ativas.reduce((s,c)=>s+(+c.valor||0),0);\n  const totPago = ativas.reduce((s,c)=>s+(+c.pago||0),0);\n  const outrasRec = d.receitas.reduce((s,r)=>s+(+r.valor||0),0);\n  const despLancadas = d.despesas.reduce((s,x)=>s+(+x.valor||0),0);\n  const custoEquipa = d.equipa.reduce((s,m)=>s+(+m.remuneracao||0),0);\n  let custoAtiv, custoAlim;\n  if(modoAno()){ custoAlim=edicoesFiltradas().reduce((s,e)=>s+custoAlimentacaoPeriodo(e.id),0); custoAtiv=edicoesFiltradas().reduce((s,e)=>s+custoAtividadesPeriodo(e.id),0); }\n  else { custoAlim=custoAlimentacaoTotal(); custoAtiv=custoAtividadesTotal(); }\n  const totDesp = despLancadas + custoEquipa + custoAtiv + custoAlim;\n  const recTotal = totPago + outrasRec;\n  return { d, totInscrito, totPago, outrasRec, despLancadas, custoEquipa, custoAtiv, custoAlim, totDesp, recTotal, pendente: Math.max(0, totInscrito-totPago), saldo: recTotal-totDesp };\n}\n\n/* ============================================================\n   DASHBOARD\n   ============================================================ */\nlet chartRV=null;\nfunction renderDashboard(){\n  const el=$('sec-dashboard'); if(precisaEdicao(el)) return;\n  const t=totais(); const d=t.d; const ed=getEdicao(); const nSem=semanasPeriodo().length; const nDias=diasUteisPeriodo().length;\n  el.innerHTML = `\n    <div class=\"cards\">\n      ${(()=>{ const io=getInscOnline(d); const insc=criancasAtivas(d).length; const canc=d.criancas.filter(c=>c.cancelada).length; const vagas=io.max>0?Math.max(0,io.max-nInscricoesAtuais(d)):null;\n        return `<div class=\"metric\"><div class=\"lbl\">Crianças<\/div><div class=\"val blue\">${insc}<\/div><div class=\"sub\">inscritas${io.max>0?` de ${io.max} vagas · <b>${vagas}<\/b> por preencher`:''}${canc?` · ${canc} cancelada(s)`:''}<\/div><\/div>`; })()}\n      <div class=\"metric\"><div class=\"lbl\">Receita prevista<\/div><div class=\"val\">${fmt(t.totInscrito)}<\/div><div class=\"sub\">Recebido: ${fmt(t.totPago)}<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Pendente<\/div><div class=\"val amber\">${fmt(t.pendente)}<\/div><div class=\"sub\">${criancasAtivas(d).filter(c=>(+c.valor||0)>(+c.pago||0)).length} por pagar<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Despesas<\/div><div class=\"val red\">${fmt(t.totDesp)}<\/div><div class=\"sub\">Gerais ${fmt(t.despLancadas)} · Funcion. ${fmt(t.custoEquipa)} · Aliment. ${fmt(t.custoAlim)} · Ativid. ${fmt(t.custoAtiv)}<\/div><\/div>\n      <div class=\"metric\" style=\"border-color:${t.saldo>=0?'var(--teal)':'var(--coral)'}\"><div class=\"lbl\">Saldo<\/div><div class=\"val ${t.saldo>=0?'green':'red'}\">${fmt(t.saldo)}<\/div><div class=\"sub\">${t.saldo>=0?'Lucro':'Prejuízo'}<\/div><\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\">${ed?esc(ed.nome):'ATL'}<\/div><div class=\"muted\">${modoAno()?`Soma de ${edicoes.length} período(s) do ano`:(ed&&ed.dataInicio?`${ed.dataInicio} → ${ed.dataFim} · ${nSem} semanas · ${nDias} dias úteis`:'Sem datas definidas — edita o período')}<\/div><\/div>\n      <div style=\"max-width:340px;margin:0 auto\"><canvas id=\"ch-rv\" height=\"200\"><\/canvas><\/div>\n    <\/div>\n    `;\n  try{ if(chartRV) chartRV.destroy();\n    chartRV = new Chart($('ch-rv'), { type:'doughnut', data:{ labels:['Recebido','Pendente','Despesas'], datasets:[{ data:[t.totPago, t.pendente, t.totDesp], backgroundColor:['#2E77C2','#BA7517','#D85A30'], borderWidth:0 }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{font:{size:11}}}} } });\n  }catch(e){}\n}\n\n/* ============================================================\n   VALORES DO ATL (tudo editável, por período)\n   ============================================================ */\nfunction renderPrecos(){\n  const el=$('sec-precos'); if(precisaEdicao(el)) return;\n  const d=getD(); const p=d.precos; const di=p.descontoIrmao||{tipo:'€',valor:0};\n  el.innerHTML=`\n    <div class=\"info\">Todos os valores são deste período e <b>totalmente editáveis<\/b> — muda-os de ano para ano à vontade. O que definires aqui é usado para calcular automaticamente o valor de cada inscrição.<\/div>\n\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\">🎫 Inscrições<\/div><div style=\"display:flex;gap:6px;flex-wrap:wrap\"><button class=\"btn-sm btn-neutral\" title=\"Cria os escalões certos para as datas deste período\" onclick=\"gerarEscaloesPeriodo()\">🔄 Gerar para este período<\/button><button class=\"btn-sm btn-add\" onclick=\"addPacote()\">+ Escalão<\/button><\/div><\/div>\n      <div class=\"muted\" style=\"margin-bottom:10px\">Escalões <b>deste período<\/b>: <b>1 dia (avulso)<\/b> — está sempre —, <b>1, 2, 3… semanas<\/b> (conforme as semanas inteiras do período) e o <b>Total<\/b> (tudo: as semanas + os dias soltos). Só defines os preços. Quem escolhe os dias paga sempre pelo melhor encaixe: 5 dias de uma semana contam como <b>1 semana<\/b> (nunca 5 avulso) e quem leva tudo paga o <b>Total<\/b>. Usa <b>🔄 Gerar para este período<\/b> para (re)criar os escalões conforme as datas.<\/div>\n      <div class=\"table-wrap\"><table><thead><tr><th>Descrição<\/th><th class=\"right\">Preço (€)<\/th><th><\/th><\/tr><\/thead><tbody id=\"pk-body\">\n      ${p.inscricoes.map(pk=>`<tr>\n        <td><input data-pk=\"${pk.id}\" data-f=\"label\" value=\"${esc(pk.label)}\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px\">${pk.avulso?'<div class=\"muted\" style=\"margin-top:2px\">preço × nº de dias escolhidos<\/div>':''}<\/td>\n        <td class=\"right\"><input data-pk=\"${pk.id}\" data-f=\"preco\" type=\"number\" step=\"0.01\" value=\"${esc(pk.preco)}\" style=\"width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;text-align:right\"><\/td>\n        <td class=\"right\"><button class=\"btn-sm btn-del\" onclick=\"delPacote('${pk.id}')\">✕<\/button><\/td>\n      <\/tr>`).join('')}\n      <\/tbody><\/table><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"card-title\">🏷️ Descontos — atleta / irmão <span class=\"muted\" style=\"font-weight:600\">(não acumuláveis)<\/span><\/div>\n      <div class=\"muted\" style=\"margin:6px 0 10px\">Aplica-se <b>apenas um<\/b> (o mais vantajoso) — nunca os dois ao mesmo tempo. O valor é o mesmo e conta só por <b>semanas inteiras<\/b> (1 semana = este valor, 2 semanas = a dobrar, 3 = o triplo…); dias avulso ou semanas incompletas <b>não têm desconto<\/b>. O desconto por irmão só é válido se o irmão frequentar o ATL <b>no mesmo período<\/b>.<\/div>\n      <div class=\"grid2\">\n        <div class=\"fg\"><label>🏅 Atleta da ARCA d'Ajuda <span class=\"muted\">(€ por semana completa)<\/span><\/label><input id=\"pk-atleta\" type=\"number\" step=\"0.01\" value=\"${esc(p.descontoAtletaSemana)}\"><\/div>\n        <div class=\"fg\"><label>👧👦 Irmão no ATL <span class=\"muted\">(€ por semana completa)<\/span><\/label><input id=\"di-valor\" type=\"number\" step=\"0.01\" value=\"${esc(di.valor)}\"><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\">📣 Campanhas / promoções<\/div><button class=\"btn-sm btn-add\" onclick=\"addCampanha()\">+ Campanha<\/button><\/div>\n      <div class=\"muted\" style=\"margin-bottom:10px\">Desconto em % para quem se inscrever <b>até uma data<\/b>. Ex.: 10% para 4 semanas até 31/05; 20% para 8 semanas.<\/div>\n      ${!p.campanhas.length?'<div class=\"empty\" style=\"padding:14px\">Sem campanhas.<\/div>':\n      `<div class=\"table-wrap\"><table><thead><tr><th>Nome<\/th><th>Aplica-se a<\/th><th class=\"right\">Desconto %<\/th><th>Até (inclusive)<\/th><th><\/th><\/tr><\/thead><tbody>\n      ${p.campanhas.map(cm=>`<tr>\n        <td><input data-cm=\"${cm.id}\" data-f=\"nome\" value=\"${esc(cm.nome||'')}\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px\"><\/td>\n        <td><select data-cm=\"${cm.id}\" data-f=\"semanas\" style=\"padding:6px 8px;border:1px solid var(--line);border-radius:6px\">\n            <option value=\"\" ${cm.semanas===''||cm.semanas==null?'selected':''}>Todas<\/option>\n            ${p.inscricoes.filter(x=>!x.avulso).map(x=>`<option value=\"${x.semanas}\" ${(+cm.semanas===+x.semanas)?'selected':''}>${esc(x.label)}<\/option>`).join('')}\n          <\/select><\/td>\n        <td class=\"right\"><input data-cm=\"${cm.id}\" data-f=\"descontoPct\" type=\"number\" step=\"1\" value=\"${esc(cm.descontoPct)}\" style=\"width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;text-align:right\"><\/td>\n        <td><input data-cm=\"${cm.id}\" data-f=\"dataLimite\" type=\"date\" value=\"${esc(cm.dataLimite||'')}\" style=\"padding:6px 8px;border:1px solid var(--line);border-radius:6px\"><\/td>\n        <td class=\"right\"><button class=\"btn-sm btn-del\" onclick=\"delCampanha('${cm.id}')\">✕<\/button><\/td>\n      <\/tr>`).join('')}\n      <\/tbody><\/table><\/div>`}\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\">🎟️ Atividades (preços)<\/div><button class=\"btn-sm btn-add\" onclick=\"addExtra('atividades')\">+ Atividade<\/button><\/div>\n      <div class=\"table-wrap\"><table><tbody id=\"ativ-body\">\n      ${p.atividades.map(a=>linhaExtra('atividades',a)).join('')||'<tr><td class=\"muted\" style=\"padding:12px\">Sem atividades.<\/td><\/tr>'}\n      <\/tbody><\/table><\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"card-title\">🍽️ Alimentação diária (por criança)<\/div>\n      <div class=\"muted\" style=\"margin:6px 0 10px\">Valor por criança e por dia. O total é calculado automaticamente: (almoço + 2 lanches) × nº de dias que cada criança frequenta.<\/div>\n      <div class=\"grid3\">\n        <div class=\"fg\"><label>Almoço (€)<\/label><input id=\"al-almoco\" type=\"number\" step=\"0.01\" value=\"${esc((p.alimentacaoDiaria||{}).almoco)}\"><\/div>\n        <div class=\"fg\"><label>Lanche da manhã (€)<\/label><input id=\"al-lm\" type=\"number\" step=\"0.01\" value=\"${esc((p.alimentacaoDiaria||{}).lancheManha)}\"><\/div>\n        <div class=\"fg\"><label>Lanche da tarde (€)<\/label><input id=\"al-lt\" type=\"number\" step=\"0.01\" value=\"${esc((p.alimentacaoDiaria||{}).lancheTarde)}\"><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\">🛡️ Seguros e outros valores<\/div><button class=\"btn-sm btn-add\" onclick=\"addExtra('outros')\">+ Item<\/button><\/div>\n      <div class=\"muted\" style=\"margin-bottom:8px\">Espaço livre para acrescentar tudo o que precisares (seguros, material, camisolas…). Escreve o nome e o valor, e podes adicionar ou apagar linhas.<\/div>\n      <div class=\"table-wrap\"><table><tbody id=\"outros-body\">\n      ${p.outros.map(a=>linhaExtra('outros',a)).join('')||'<tr><td class=\"muted\" style=\"padding:12px\">Sem itens.<\/td><\/tr>'}\n      <\/tbody><\/table><\/div>\n    <\/div>\n\n    <div style=\"position:sticky;bottom:0;padding:12px 0\"><button class=\"btn btn-primary\" style=\"width:auto;padding:11px 22px\" onclick=\"guardarValores()\">💾 Guardar todos os valores<\/button><\/div>`;\n}\nfunction linhaExtra(grupo,a){\n  return `<tr>\n    <td><input data-ex=\"${grupo}\" data-id=\"${a.id}\" data-f=\"nome\" value=\"${esc(a.nome||'')}\" style=\"width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px\"><\/td>\n    <td class=\"right\" style=\"width:130px\"><input data-ex=\"${grupo}\" data-id=\"${a.id}\" data-f=\"preco\" type=\"number\" step=\"0.01\" value=\"${esc(a.preco)}\" style=\"width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;text-align:right\"><\/td>\n    <td class=\"right\" style=\"width:40px\"><button class=\"btn-sm btn-del\" onclick=\"delExtra('${grupo}','${a.id}')\">✕<\/button><\/td>\n  <\/tr>`;\n}\nfunction lerValoresDoDOM(){\n  const d=getD(); const p=d.precos;\n  document.querySelectorAll('[data-pk]').forEach(inp=>{ const pk=p.inscricoes.find(x=>x.id===inp.dataset.pk); if(!pk) return; const f=inp.dataset.f; pk[f]= f==='label'?inp.value : (parseFloat(inp.value)||0); });\n  document.querySelectorAll('[data-cm]').forEach(inp=>{ const cm=p.campanhas.find(x=>x.id===inp.dataset.cm); if(!cm) return; const f=inp.dataset.f; if(f==='descontoPct')cm[f]=parseFloat(inp.value)||0; else if(f==='semanas')cm[f]=inp.value===''?'':(+inp.value); else cm[f]=inp.value; });\n  document.querySelectorAll('[data-ex]').forEach(inp=>{ const grp=inp.dataset.ex; const a=p[grp].find(x=>x.id===inp.dataset.id); if(!a) return; a[inp.dataset.f]= inp.dataset.f==='preco'?(parseFloat(inp.value)||0):inp.value; });\n  const dv=$('di-valor'); if(dv) p.descontoIrmao={tipo:'€/semana', valor:parseFloat(dv.value)||0};\n  const pa=$('pk-atleta'); if(pa) p.descontoAtletaSemana=parseFloat(pa.value)||0;\n  const aa=$('al-almoco'), alm=$('al-lm'), alt=$('al-lt'); if(aa) p.alimentacaoDiaria={almoco:parseFloat(aa.value)||0, lancheManha:parseFloat(alm.value)||0, lancheTarde:parseFloat(alt.value)||0};\n  return d;\n}\nfunction guardarValores(){ const d=lerValoresDoDOM(); setD(d); publicarConfigPublica(true); toast('Valores guardados.'); }\nfunction addPacote(){ const d=lerValoresDoDOM(); d.precos.inscricoes.push({id:uid(),label:'Novo escalão',semanas:0,avulso:false,preco:0,descontoArca:0}); setD(d); renderPrecos(); }\nfunction gerarEscaloesPeriodo(){ if(guardaModoAno()) return; const ed=getEdicao(); if(!ed||!ed.dataInicio||!ed.dataFim){ toast('Define primeiro as datas do período (✏️ Editar).',false); return; }\n  const W=semanasDe(ed).length; const nDiasTot=diasUteisDe(ed).length;\n  if(!confirm('Gerar os escalões para este período?\\n\\n• 1 dia (avulso)\\n• 1 a '+W+' semana(s)\\n• Total (o período todo)\\n\\nOs preços já definidos são mantidos pelos nomes iguais. Continuar?')) return;\n  const d=lerValoresDoDOM(); d.precos.inscricoes=escaloesDoPeriodo(ed, d.precos.inscricoes); setD(d); renderPrecos(); publicarConfigPublica(true); toast('Escalões criados para este período ('+W+' semana(s), '+nDiasTot+' dias úteis).'); }\nfunction delPacote(id){ const d=lerValoresDoDOM(); d.precos.inscricoes=d.precos.inscricoes.filter(x=>x.id!==id); setD(d); renderPrecos(); }\nfunction addCampanha(){ const d=lerValoresDoDOM(); d.precos.campanhas.push({id:uid(),nome:'Campanha',semanas:'',descontoPct:10,dataLimite:''}); setD(d); renderPrecos(); }\nfunction delCampanha(id){ const d=lerValoresDoDOM(); d.precos.campanhas=d.precos.campanhas.filter(x=>x.id!==id); setD(d); renderPrecos(); }\nfunction addExtra(grupo){ const d=lerValoresDoDOM(); d.precos[grupo].push({id:uid(),nome:'',preco:0}); setD(d); renderPrecos(); }\nfunction delExtra(grupo,id){ const d=lerValoresDoDOM(); d.precos[grupo]=d.precos[grupo].filter(x=>x.id!==id); setD(d); renderPrecos(); }\n\n// gera os escalões que fazem sentido para as datas do período: 1 dia avulso (sempre) + 1..N semanas + Total\nfunction escaloesDoPeriodo(ed, existentes){\n  existentes = existentes||[];\n  const semanas = semanasDe(ed); const W = semanas.length;\n  const totalDias = diasUteisDe(ed).length; const weekDias = semanas.reduce((s,x)=>s+x.dias.length,0);\n  const leftover = totalDias - weekDias;\n  const prev = (lbl)=>{ const e=existentes.find(x=>x.label===lbl); return e?{preco:+e.preco||0, descontoArca:+e.descontoArca||0, id:e.id}:{preco:0, descontoArca:0, id:uid()}; };\n  const out=[];\n  { const v=prev('1 dia (avulso)'); out.push({id:v.id, label:'1 dia (avulso)', semanas:0, avulso:true, total:false, preco:v.preco, descontoArca:v.descontoArca}); }\n  for(let k=1;k<=W;k++){ const lbl=k+(k===1?' semana':' semanas'); const v=prev(lbl); out.push({id:v.id, label:lbl, semanas:k, avulso:false, total:false, preco:v.preco, descontoArca:v.descontoArca}); }\n  if(leftover>0){ const lbl = W>=1 ? ('Total ('+W+(W===1?' semana':' semanas')+' + '+leftover+(leftover===1?' dia':' dias')+')') : ('Total ('+leftover+(leftover===1?' dia':' dias')+')');\n    // tenta reaproveitar o preço de um \"Total\" anterior mesmo que o texto tenha mudado\n    let v=prev(lbl); if(!existentes.find(x=>x.label===lbl)){ const antTotal=existentes.find(x=>x.total); if(antTotal){ v={preco:+antTotal.preco||0, descontoArca:+antTotal.descontoArca||0, id:antTotal.id}; } }\n    out.push({id:v.id, label:lbl, semanas:W, avulso:false, total:true, preco:v.preco, descontoArca:v.descontoArca}); }\n  return out;\n}\n// preços por unidade\nfunction precoDiaAvulso(){ const a=(getD().precos.inscricoes||[]).find(x=>x.avulso); return a?(+a.preco||0):0; }\nfunction precoSemanas(n){ if(n<=0)return 0; const insc=getD().precos.inscricoes||[]; const e=insc.find(x=>!x.avulso&&+x.semanas===n); if(e)return +e.preco||0; const one=insc.find(x=>!x.avulso&&+x.semanas===1); return n*((one?+one.preco:0)||0); }\nfunction descArcaSemanas(n){ if(n<=0)return 0; const insc=getD().precos.inscricoes||[]; const e=insc.find(x=>!x.avulso&&+x.semanas===n); if(e)return +e.descontoArca||0; const one=insc.find(x=>!x.avulso&&+x.semanas===1); return n*((one?+one.descontoArca:0)||0); }\nfunction descArcaAvulso(){ const a=(getD().precos.inscricoes||[]).find(x=>x.avulso); return a?(+a.descontoArca||0):0; }\n// campanha aplicável (pela contagem de semanas marcadas)\nfunction campanhaAplicavel(c, ctx){\n  const p=getD().precos; const dins = c.dataInscricao || hoje(); const nSem = ctx?ctx.semanas:(c.semanasSel||[]).length;\n  return (p.campanhas||[]).find(cm=>{\n    if(cm.dataLimite && dins > cm.dataLimite) return false;\n    if(cm.semanas!=='' && cm.semanas!=null && +cm.semanas!==+nSem) return false;\n    return true;\n  });\n}\n// decomposição do valor\nfunction breakdown(c){\n  const p=getD().precos;\n  // decompõe SEMPRE em semanas inteiras + dias soltos (5 dias de uma semana = 1 semana, mais barato que 5 avulso)\n  const dec=decomporDiasCrianca(c);\n  const nSem=dec.fullWeeks, nDias=dec.avulsoDays;\n  const periodDias=diasUteisPeriodo().length;\n  const totalEsc=(p.inscricoes||[]).find(x=>x.total);\n  let subtotal;\n  if(totalEsc && dec.totalDias>0 && dec.totalDias===periodDias){\n    subtotal = +totalEsc.preco||0; // frequenta o período TODO → preço do escalão \"Total\"\n  } else {\n    subtotal = precoSemanas(nSem) + nDias*precoDiaAvulso();\n  }\n  // desconto de atleta: SÓ por semanas completas (2,5/semana × nº de semanas). Avulso ou semana incompleta = 0.\n  const dAtleta = c.atleta ? nSem*(+p.descontoAtletaSemana||0) : 0;\n  const di=p.descontoIrmao||{};\n  const dIrmao = c.temIrmao ? (di.tipo==='%'? subtotal*((+di.valor||0)/100) : di.tipo==='€/semana'? (+di.valor||0)*nSem : (+di.valor||0)) : 0;\n  let desconto=0, descontoLabel='';\n  if(c.atleta && c.temIrmao){ if(dAtleta>=dIrmao){desconto=dAtleta;descontoLabel='atleta (o mais vantajoso)';} else {desconto=dIrmao;descontoLabel='irmão (o mais vantajoso)';} }\n  else if(c.atleta){ desconto=dAtleta; descontoLabel='atleta'; }\n  else if(c.temIrmao){ desconto=dIrmao; descontoLabel='irmão'; }\n  let total = subtotal - desconto;\n  let campanhaTxt='';\n  const camp=campanhaAplicavel(c,{semanas:nSem});\n  if(camp && (+camp.descontoPct||0)){ const dc=subtotal*((+camp.descontoPct||0)/100); total-=dc; campanhaTxt='−'+camp.descontoPct+'% '+(esc(camp.nome||'campanha')); }\n  desconto = Math.round(desconto*100)/100;\n  total = Math.max(0, Math.round(total*100)/100);\n  return {subtotal:Math.round(subtotal*100)/100, desconto, descontoLabel, total, campanhaTxt, pendente:(c.atleta||c.temIrmao)&&!c.descontoVerificado};\n}\nfunction calcValor(c){ return breakdown(c).total; }\n// conjunto de dias (iso) que uma criança frequenta: avulso + semanas + meses\nfunction diasDaCriancaEm(c, semanas, diasUteis){\n  const set=new Set(c.avulsoDias||[]);\n  (c.semanasSel||[]).forEach(sid=>{ const s=semanas.find(x=>x.id===sid); if(s) s.dias.forEach(d=>set.add(d)); });\n  if((c.mesesSel||[]).length){ diasUteis.forEach(d=>{ if((c.mesesSel||[]).includes(d.getMonth())) set.add(isoDate(d)); }); }\n  return set;\n}\nfunction diasDaCrianca(c){ return diasDaCriancaEm(c, semanasPeriodo(), diasUteisPeriodo()); }\n// decompõe os dias frequentados em SEMANAS INTEIRAS + dias soltos (avulso),\n// mesmo que os dias tenham sido escolhidos um a um — 5 dias de uma semana contam como 1 semana (mais barato)\nfunction decomporDiasCriancaEm(c, semanas){\n  const attended = diasDaCriancaEm(c, semanas, diasUteisPeriodo());\n  const usados=new Set(); let fullWeeks=0;\n  (semanas||[]).forEach(s=>{ if(s.dias.length && s.dias.every(d=>attended.has(d))){ fullWeeks++; s.dias.forEach(d=>usados.add(d)); } });\n  let avulsoDays=0; attended.forEach(d=>{ if(!usados.has(d)) avulsoDays++; });\n  return {fullWeeks, avulsoDays, totalDias:attended.size};\n}\nfunction decomporDiasCrianca(c){ return decomporDiasCriancaEm(c, semanasPeriodo()); }\n// ---------- custos automáticos: alimentação e atividades ----------\nfunction precoDiaAlimentacaoDe(p){ const a=(p&&p.alimentacaoDiaria)||{}; return (+a.almoco||0)+(+a.lancheManha||0)+(+a.lancheTarde||0); }\nfunction precoDiaAlimentacao(){ return precoDiaAlimentacaoDe(getD().precos); }\nfunction custoAlimentacaoTotal(){ const d=getD(); const pd=precoDiaAlimentacao(); if(!pd) return 0; return criancasAtivas(d).reduce((s,c)=>s+pd*diasDaCrianca(c).size,0); }\n// crianças do grupo QUE ESTÃO PRESENTES na data da atividade (se não estão, não contam)\nfunction nCriancasAtividade(a){ const d=getD(); const grupo=a.grupo||'Todos'; return criancasAtivas(d).filter(c=>{ if(grupo!=='Todos' && (c.grupo||'')!==grupo) return false; return a.data && diasDaCrianca(c).has(a.data); }).length; }\nfunction custoAtividade(a){ return (+a.precoCrianca||0)*nCriancasAtividade(a); }\nfunction custoAtividadesTotal(){ return getD().atividades.reduce((s,a)=>s+custoAtividade(a),0); }\n// versões por período (para a vista anual)\nfunction custoAlimentacaoPeriodo(edId){\n  const ed=edicoes.find(e=>e.id===edId); const d=LS.get('atl_ed_'+edId); if(!ed||!d) return 0;\n  const p=normalizaPrecos(d.precos||{}); const pd=precoDiaAlimentacaoDe(p); if(!pd) return 0;\n  const sem=semanasDe(ed), du=diasUteisDe(ed);\n  return (d.criancas||[]).filter(c=>!c.cancelada).reduce((s,c)=>s+pd*diasDaCriancaEm(c,sem,du).size,0);\n}\nfunction custoAtividadesPeriodo(edId){\n  const ed=edicoes.find(e=>e.id===edId); const d=LS.get('atl_ed_'+edId); if(!ed||!d) return 0;\n  const sem=semanasDe(ed), du=diasUteisDe(ed);\n  return (d.atividades||[]).reduce((s,a)=>{ const grupo=a.grupo||'Todos';\n    const n=(d.criancas||[]).filter(c=>!c.cancelada).filter(c=>{ if(grupo!=='Todos'&&(c.grupo||'')!==grupo) return false; return a.data && diasDaCriancaEm(c,sem,du).has(a.data); }).length;\n    return s+(+a.precoCrianca||0)*n; },0);\n}\n\n/* ============================================================\n   SEMANAS (geradas automaticamente do período)\n   ============================================================ */\nfunction renderSemanas(){ const el=$('sec-semanas'); if(precisaEdicao(el)) return; el.innerHTML=renderSemanasConteudo(); }\nfunction renderSemanasConteudo(){\n  const semanas=semanasPeriodo(); const d=getD(); const meta=d.semanasMeta||{};\n  return `<div class=\"card\">\n    <div class=\"card-head\"><div class=\"card-title\">Semanas · ${semanas.length}<\/div><div class=\"muted\">Geradas automaticamente (só dias úteis)<\/div><\/div>\n    ${!semanas.length?'<div class=\"empty\">Sem dias úteis no período.<\/div>':\n    `<div class=\"table-wrap\"><table><thead><tr><th>Semana<\/th><th>Período<\/th><th>Dias úteis<\/th><th>Tema<\/th><th>Monitores<\/th><th><\/th><\/tr><\/thead><tbody>\n    ${semanas.map(s=>{ const m=meta[s.id]||{}; return `<tr><td><b>${s.label}<\/b><\/td><td>${s.periodo}<\/td><td>${s.dias.length}<\/td><td class=\"muted\">${esc(m.tema||'')}<\/td><td>${esc(m.monitores||'')}<\/td>\n      <td class=\"right\"><button class=\"btn-sm btn-edit\" onclick=\"editarMetaSemana('${s.id}')\">✏️ Tema<\/button><\/td><\/tr>`; }).join('')}\n    <\/tbody><\/table><\/div>`}\n  <\/div>`;\n}\nfunction editarMetaSemana(sid){\n  const d=getD(); const meta=(d.semanasMeta||{})[sid]||{};\n  modal('Semana — tema e monitores',`\n    <div class=\"fg\"><label>Tema<\/label><input id=\"sm-tema\" value=\"${esc(meta.tema||'')}\"><\/div>\n    <div class=\"fg\"><label>Monitores<\/label><input id=\"sm-mon\" value=\"${esc(meta.monitores||'')}\"><\/div>`,\n    [ {txt:'Guardar',cls:'btn-add',fn:()=>{ const dd=getD(); dd.semanasMeta=dd.semanasMeta||{}; dd.semanasMeta[sid]={tema:$('sm-tema').value.trim(),monitores:$('sm-mon').value.trim()}; setD(dd); fecharModal(); renderMapa(); toast('Semana atualizada.'); }} ]);\n}\n\n/* ============================================================\n   MAPA DE OCUPAÇÃO (crianças por dia)\n   ============================================================ */\nlet mapaView='ocupacao';\nfunction byNome(a,b){ return (a.nome||'').localeCompare(b.nome||''); }\nfunction fmtData(iso){ if(!iso) return ''; const p=String(iso).split('-'); if(p.length<3) return iso; return p[2]+'/'+p[1]+'/'+p[0]; }\nfunction idadeATL(c){ const a=idadeEm(c.nasc, refIdadeISO()); return a==null?'—':a+' anos'; }\nfunction renderMapa(){\n  const el=$('sec-mapa'); if(precisaEdicao(el)) return;\n  const ed=getEdicao();\n  if(!ed.dataInicio){ el.innerHTML=`<div class=\"card\"><div class=\"empty\">Este período não tem datas.<br><br><button class=\"btn btn-primary\" style=\"width:auto;padding:10px 18px\" onclick=\"abrirModalEdicao(getEdicao())\">✏️ Definir datas<\/button><\/div><\/div>`; return; }\n  const seg=`<div class=\"seg\" style=\"margin-bottom:14px\">\n    <button class=\"${mapaView==='semanas'?'on':''}\" onclick=\"mapaView='semanas';renderMapa()\">📅 Semanas<\/button>\n    <button class=\"${mapaView==='ocupacao'?'on':''}\" onclick=\"mapaView='ocupacao';renderMapa()\">📆 Ocupação por dia<\/button>\n    <button class=\"${mapaView==='nomes'?'on':''}\" onclick=\"mapaView='nomes';renderMapa()\">🧾 Nomes por semana<\/button>\n    <button class=\"${mapaView==='alergias'?'on':''}\" onclick=\"mapaView='alergias';renderMapa()\">🍽️ Alergias (cozinha)<\/button>\n    <button class=\"${mapaView==='obs'?'on':''}\" onclick=\"mapaView='obs';renderMapa()\">💊 Observações<\/button>\n    <button class=\"${mapaView==='grupos'?'on':''}\" onclick=\"mapaView='grupos';renderMapa()\">👥 Grupos<\/button><\/div>`;\n  let corpo;\n  if(mapaView==='semanas') corpo=renderSemanasConteudo();\n  else if(mapaView==='nomes') corpo=renderListaSemanal('nomes');\n  else if(mapaView==='alergias') corpo=renderListaSemanal('alergias');\n  else if(mapaView==='obs') corpo=renderListaSemanal('obs');\n  else if(mapaView==='grupos') corpo=renderListaGrupos();\n  else corpo=renderMapaOcupacao();\n  el.innerHTML = seg + corpo;\n}\n// listas por semana (nomes / alergias / observações) — impressão total ou semana a semana\nconst LISTAS={\n  nomes:{ icon:'🧾', titulo:'Mapa de nomes por semana', colH:'Validade doc.', val:c=>esc(fmtData(c.ccVal)||'—'), filtro:()=>true, subt:'nome completo, idade, NIF e validade do documento — para a seguradora, etc.', aviso:'' },\n  alergias:{ icon:'🍽️', titulo:'Lista de alergias / intolerâncias', colH:'Alergias / intolerâncias', val:c=>esc(c.alergias||''), filtro:c=>(c.alergias||'').trim(), subt:'crianças com alergias ou intolerâncias assinaladas', aviso:'<div class=\"info\" style=\"background:#FDECEA;border-color:#F0855F;color:#7a2e12\"><b>⚠️ Importante enviar à cozinha<\/b> — todas as sextas, ao final da tarde, a lista da semana seguinte.<\/div>' },\n  obs:{ icon:'💊', titulo:'Observações (medicação / cuidados especiais)', colH:'Observações', val:c=>esc(c.obs||''), filtro:c=>(c.obs||'').trim(), subt:'crianças com observações, medicação ou cuidados especiais', aviso:'' }\n};\nfunction gruposLista(kind){ const f=LISTAS[kind].filtro; return criancasPorSemana().map(g=>({ s:g.s, lista:g.lista.filter(f) })); }\nfunction tabelaListaHTML(kind,lista){ const cfg=LISTAS[kind];\n  return `<div class=\"table-wrap\"><table><thead><tr><th>Nome completo<\/th><th>Idade<\/th><th>NIF<\/th><th>${esc(cfg.colH)}<\/th><\/tr><\/thead><tbody>\n    ${lista.map(c=>`<tr><td><b>${esc(c.nome)}<\/b><\/td><td>${idadeATL(c)}<\/td><td>${esc(c.nif||'—')}<\/td><td>${cfg.val(c)}<\/td><\/tr>`).join('')}\n    <\/tbody><\/table><\/div>`;\n}\nfunction renderListaSemanal(kind){\n  const cfg=LISTAS[kind]; const grupos=gruposLista(kind);\n  let html=`${cfg.aviso}<div class=\"card\">\n    <div class=\"card-head\"><div class=\"card-title\">${cfg.icon} ${esc(cfg.titulo)}<\/div><button class=\"btn-sm btn-add\" onclick=\"imprimirListaSemanal('${kind}')\">🖨️ Imprimir tudo<\/button><\/div>\n    <div class=\"muted\" style=\"margin-bottom:6px\">Sempre atualizada (${cfg.subt}). Imprime <b>cada semana em separado<\/b> — envia-se uma a uma às entidades.<\/div>`;\n  if(!grupos.length){ html+='<div class=\"empty\">Sem semanas — define as datas do período.<\/div><\/div>'; return html; }\n  grupos.forEach((g,i)=>{\n    html+=`<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap\">\n      <div class=\"subt2\" style=\"margin:0\">${g.s.label} <span class=\"muted\">(${g.s.periodo}) · ${g.lista.length} criança(s)<\/span><\/div>\n      ${g.lista.length?`<button class=\"btn-sm btn-neutral\" onclick=\"imprimirListaSemanal('${kind}',${i})\">🖨️ Imprimir esta semana<\/button>`:''}<\/div>`;\n    html+= g.lista.length? tabelaListaHTML(kind,g.lista) : '<div class=\"muted\" style=\"padding:4px 0 6px\">Sem crianças nesta semana.<\/div>';\n  });\n  html+='<\/div>';\n  return html;\n}\nfunction imprimirListaSemanal(kind, idx){\n  const cfg=LISTAS[kind]; const ed=getEdicao()||{}; let grupos=gruposLista(kind);\n  if(idx!=null){ if(!grupos[idx]) return; grupos=[grupos[idx]]; }\n  let body='';\n  grupos.forEach(g=>{\n    body+=`<h2 style=\"font-size:14px;margin:16px 0 6px;border-bottom:2px solid #173F72;padding-bottom:3px;color:#173F72\">${esc(g.s.label)} (${esc(g.s.periodo)}) — ${g.lista.length} criança(s)<\/h2>`;\n    body+= g.lista.length? '<table><thead><tr><th>Nome completo<\/th><th>Idade<\/th><th>NIF<\/th><th>'+esc(cfg.colH)+'<\/th><\/tr><\/thead><tbody>'+g.lista.map(c=>`<tr><td>${esc(c.nome)}<\/td><td>${idadeATL(c)}<\/td><td>${esc(c.nif||'')}<\/td><td>${cfg.val(c)}<\/td><\/tr>`).join('')+'<\/tbody><\/table>' : '<p>Sem crianças.<\/p>';\n  });\n  const sufixo = idx!=null? ' — '+esc(grupos[0].s.label)+' ('+esc(grupos[0].s.periodo)+')' : '';\n  abrirImpressao(cfg.titulo+(idx!=null?(' '+grupos[0].s.label):''), `<h1>${esc(cfg.titulo)}<\/h1><div style=\"font-size:12px;color:#555;margin-bottom:8px\">${esc(ed.nome||'')}${ed.ano?(' · '+ed.ano):''}${sufixo}<\/div>${body}`);\n}\n// listas por grupo (G1 / G2) — para a seguradora, coordenação, etc.\nfunction criancasDoGrupo(g){ return criancasAtivas().filter(c=> g==='Sem'? !(c.grupo) : (c.grupo||'')===g).sort(byNome); }\nfunction primeiroUltimo(nome){ const p=(nome||'').trim().split(/\\s+/).filter(Boolean); if(!p.length) return ''; return p.length===1?p[0]:(p[0]+' '+p[p.length-1]); }\nfunction tabelaGrupoHTML(lista){ return `<div class=\"table-wrap\"><table><thead><tr><th>Nome completo<\/th><th>Idade<\/th><th>NIF<\/th><th>Validade<\/th><th>Enc. Educação<\/th><th>Contacto<\/th><th>Emergência (nome + tel)<\/th><\/tr><\/thead><tbody>\n  ${lista.map(c=>`<tr><td><b>${esc(c.nome)}<\/b><\/td><td>${idadeATL(c)}<\/td><td>${esc(c.nif||'—')}<\/td><td>${esc(fmtData(c.ccVal)||'—')}<\/td><td>${esc(primeiroUltimo(c.resp)||'—')}<\/td><td>${esc(c.tel||'—')}<\/td><td>${esc(c.emergencia||'—')}<\/td><\/tr>`).join('')}\n  <\/tbody><\/table><\/div>`; }\nfunction renderListaGrupos(){\n  const gs=[{k:'G1',lbl:'Grupo 1'},{k:'G2',lbl:'Grupo 2'}];\n  let html=`<div class=\"card\"><div class=\"card-title\">👥 Listas por grupo<\/div>\n    <div class=\"muted\" style=\"margin-bottom:6px\">Crianças de cada grupo (atribuído pela coordenação na lista de inscrições). Imprime o <b>Grupo 1<\/b> e o <b>Grupo 2<\/b> em separado — com logótipo e rodapé.<\/div>`;\n  gs.forEach(g=>{ const lista=criancasDoGrupo(g.k);\n    html+=`<div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap\">\n      <div class=\"subt2\" style=\"margin:0\">${g.lbl} <span class=\"muted\">· ${lista.length} criança(s)<\/span><\/div>\n      <button class=\"btn-sm btn-add\" onclick=\"imprimirGrupo('${g.k}')\">🖨️ Imprimir ${g.lbl}<\/button><\/div>`;\n    html+= lista.length? tabelaGrupoHTML(lista) : '<div class=\"muted\" style=\"padding:4px 0 6px\">Sem crianças neste grupo.<\/div>';\n  });\n  const semG=criancasDoGrupo('Sem');\n  if(semG.length){ html+=`<div class=\"subt2\" style=\"margin-top:16px\">⚠️ Sem grupo atribuído <span class=\"muted\">· ${semG.length} criança(s)<\/span><\/div>`+tabelaGrupoHTML(semG); }\n  html+='<\/div>'; return html;\n}\nfunction imprimirGrupo(g){\n  const lbl=g==='G1'?'Grupo 1':g==='G2'?'Grupo 2':'Sem grupo'; const lista=criancasDoGrupo(g); const ed=getEdicao()||{};\n  const body=lista.length? '<table><thead><tr><th>Nome completo<\/th><th>Idade<\/th><th>NIF<\/th><th>Validade<\/th><th>Enc. Educação<\/th><th>Contacto<\/th><th>Emergência (nome + tel)<\/th><\/tr><\/thead><tbody>'+lista.map(c=>`<tr><td>${esc(c.nome)}<\/td><td>${idadeATL(c)}<\/td><td>${esc(c.nif||'')}<\/td><td>${esc(fmtData(c.ccVal))}<\/td><td>${esc(primeiroUltimo(c.resp))}<\/td><td>${esc(c.tel||'')}<\/td><td>${esc(c.emergencia||'')}<\/td><\/tr>`).join('')+'<\/tbody><\/table>' : '<p>Sem crianças neste grupo.<\/p>';\n  abrirImpressao('Lista — '+lbl, `<h1>Lista de crianças — ${esc(lbl)}<\/h1><div style=\"font-size:12px;color:#555;margin-bottom:8px\">${esc(ed.nome||'')}${ed.ano?(' · '+ed.ano):''} · ${lista.length} criança(s)<\/div>${body}`);\n}\nfunction renderMapaOcupacao(){\n  const semanas=semanasPeriodo();\n  const semDe={}; semanas.forEach(s=>s.dias.forEach(iso=>semDe[iso]=s.label));\n  const colDias=diasUteisPeriodo().map(isoDate); // TODOS os dias úteis do período (não só as semanas inteiras)\n  // cabeçalhos agrupados: semanas inteiras + \"Dias soltos\" para os dias fora delas\n  const grupos=[]; colDias.forEach(iso=>{ const lbl=semDe[iso]||'Dias soltos'; const last=grupos[grupos.length-1]; if(last&&last.lbl===lbl) last.n++; else grupos.push({lbl,n:1}); });\n  const d=getD(); const criancas=criancasAtivas(d).slice().sort(byNome);\n  if(!colDias.length){ return '<div class=\"card\"><div class=\"empty\">Sem dias úteis no período.<\/div><\/div>'; }\n  const att = criancas.map(c=>({c, dias:diasDaCrianca(c)}));\n  const countDia = {}; colDias.forEach(iso=>{ countDia[iso]=att.filter(a=>a.dias.has(iso)).length; });\n  const maxC = Math.max(1, ...Object.values(countDia));\n  const totalPresencas = Object.values(countDia).reduce((s,x)=>s+x,0);\n  const pico = Math.max(0, ...Object.values(countDia));\n  const dd=iso=>{ const p=iso.split('-'); return (+p[2])+'/'+(+p[1]); };\n  const letra=iso=>DIAS_SEM[parseD(iso).getDay()];\n  const heat=n=> n<=0?'transparent':`rgba(29,158,117,${(0.18+0.62*n/maxC).toFixed(2)})`;\n  return `\n    <div class=\"cards\">\n      <div class=\"metric\"><div class=\"lbl\">Crianças inscritas<\/div><div class=\"val blue\">${criancas.length}<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Pico num dia<\/div><div class=\"val green\">${pico}<\/div><div class=\"sub\">máximo em simultâneo<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Presenças-dia<\/div><div class=\"val amber\">${totalPresencas}<\/div><div class=\"sub\">soma de todos os dias<\/div><\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\">📆 Mapa de ocupação<\/div><div class=\"muted\">Nº de crianças por dia · dias avulso + semanas + meses<\/div><\/div>\n      <div class=\"mapa-wrap\">\n        <table class=\"mapa\">\n          <thead>\n            <tr><th class=\"stick corner\"><\/th>${grupos.map(g=>`<th class=\"wk\" colspan=\"${g.n}\">${g.lbl}<\/th>`).join('')}<\/tr>\n            <tr><th class=\"stick corner\">Dia →<\/th>${colDias.map(iso=>`<th class=\"dcol\"><div>${dd(iso)}<\/div><div class=\"lt\">${letra(iso)}<\/div><\/th>`).join('')}<\/tr>\n          <\/thead>\n          <tbody>\n            <tr class=\"totrow\"><td class=\"stick\"><b>Nº de crianças<\/b><\/td>${colDias.map(iso=>{const n=countDia[iso];return `<td class=\"cnt\" style=\"background:${heat(n)}\">${n||''}<\/td>`;}).join('')}<\/tr>\n            ${criancas.length? att.map(a=>`<tr><td class=\"stick nm\">${esc(a.c.nome)}<\/td>${colDias.map(iso=>`<td class=\"cell ${a.dias.has(iso)?'on':''}\"><\/td>`).join('')}<\/tr>`).join('')\n              : `<tr><td class=\"stick nm muted\">Sem inscrições<\/td>${colDias.map(()=>'<td class=\"cell\"><\/td>').join('')}<\/tr>`}\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <div class=\"muted\" style=\"margin-top:8px\">Dica: a primeira linha (a verde) conta quantas crianças estão em cada dia; quanto mais escuro, mais crianças.<\/div>\n    <\/div>`;\n}\n// lista de crianças por semana (interseção dos dias frequentados com a semana)\nfunction criancasPorSemana(){\n  const semanas=semanasPeriodo(); const d=getD();\n  const att=criancasAtivas(d).map(c=>({c,dias:diasDaCrianca(c)}));\n  const grupos=semanas.map(s=>({ s, lista: att.filter(a=>s.dias.some(dia=>a.dias.has(dia))).map(a=>a.c).sort(byNome) }));\n  const cobertos=new Set(); semanas.forEach(s=>s.dias.forEach(x=>cobertos.add(x)));\n  const soltos=diasUteisPeriodo().map(isoDate).filter(iso=>!cobertos.has(iso));\n  if(soltos.length){ const lista=att.filter(a=>soltos.some(dia=>a.dias.has(dia))).map(a=>a.c).sort(byNome);\n    const a=soltos[0].split('-'), b=soltos[soltos.length-1].split('-');\n    grupos.push({ s:{id:'AVULSO', label:'Dias soltos', periodo:`${+a[2]}/${+a[1]} a ${+b[2]}/${+b[1]}`, dias:soltos}, lista }); }\n  return grupos;\n}\n\n/* ============================================================\n   INSCRIÇÕES / CRIANÇAS\n   ============================================================ */\nlet fCri={busca:'',pago:''};\nfunction filtraCri(){\n  const d=getD(); let lista=d.criancas.slice();\n  if(fCri.busca){ const q=fCri.busca.toLowerCase().trim(); lista=lista.filter(c=>(c.nome||'').toLowerCase().includes(q)||(c.resp||'').toLowerCase().includes(q)||String(c.numero||'')===q||(q.length>=3&&(c.nif||'').includes(q))); }\n  if(fCri.pago==='sim') lista=lista.filter(c=>!c.cancelada&&(+c.pago||0)>=(+c.valor||0)&&(+c.valor||0)>0);\n  if(fCri.pago==='nao') lista=lista.filter(c=>!c.cancelada&&(+c.pago||0)<(+c.valor||0));\n  // canceladas vão para o fim da lista\n  lista.sort((a,b)=> (a.cancelada?1:0)-(b.cancelada?1:0));\n  return lista;\n}\nfunction renderCriancas(){\n  const el=$('sec-criancas'); if(precisaEdicao(el)) return;\n  const d=getD(); const ed=getEdicao();\n  const cloudPend=(_preCloud||[]).filter(r=>!r.edicao_id||!ed||!ed.id||r.edicao_id===ed.id).map(r=>Object.assign({__src:'cloud', __rowId:r.id}, r.dados||{}));\n  const localPend=(d.preInscricoes||[]).map(p=>Object.assign({__src:'local'}, p));\n  const pend=cloudPend.concat(localPend);\n  const est=estadoLink(d); const cfg=getInscOnline(d); const vagas=cfg.max>0?Math.max(0,cfg.max-nInscricoesAtuais(d)):null;\n  const cardLink = modoAno()? '' : `<div class=\"card\">\n    <div class=\"card-head\"><div class=\"card-title\">🔗 Inscrições online (link para os pais)<\/div><span class=\"chip ${est.aberto?'green':'red'}\">${est.aberto?'ABERTO':'ENCERRADO'}<\/span><\/div>\n    <div class=\"muted\" style=\"margin-bottom:10px\">${est.aberto? `Os pais podem inscrever-se. ${cfg.max>0?`Vagas: <b>${vagas}<\/b> de ${cfg.max} (${nInscricoesAtuais(d)} ocupadas).`:'Sem limite de vagas definido.'}${cfg.prazo?` Prazo: <b>${fmtData(cfg.prazo)}<\/b>.`:''}` : `<b style=\"color:var(--coral-d)\">⛔ ${esc(est.motivo)}<\/b> Quem abrir o link vê a mensagem de inscrições encerradas.`}<\/div>\n    <div class=\"grid3\">\n      <div class=\"fg\"><label>Estado do link<\/label><select id=\"io-aberto\"><option value=\"1\" ${cfg.aberto?'selected':''}>Aberto (a receber)<\/option><option value=\"0\" ${!cfg.aberto?'selected':''}>Fechado manualmente<\/option><\/select><\/div>\n      <div class=\"fg\"><label>Prazo limite <span class=\"muted\">(fecha depois desta data)<\/span><\/label><input id=\"io-prazo\" type=\"date\" value=\"${esc(cfg.prazo)}\"><\/div>\n      <div class=\"fg\"><label>Nº máximo de inscrições <span class=\"muted\">(0 = sem limite)<\/span><\/label><input id=\"io-max\" type=\"number\" min=\"0\" step=\"1\" value=\"${esc(cfg.max)}\"><\/div>\n    <\/div>\n    <div class=\"muted\" style=\"margin-bottom:8px;font-size:12px\">${CLOUD_ON()?'A página pública mostra <b>este período<\/b>. Depois de mudares valores, datas ou definições do link, carrega em <b>Publicar página pública<\/b> para os pais verem a versão atualizada.':'⚠️ Estás em <b>modo local<\/b> — o link dos pais só funciona com sessão iniciada (cloud).'}<\/div>\n    <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:6px\">\n      <button class=\"btn-sm btn-add\" onclick=\"guardarInscOnline()\">💾 Guardar definições do link<\/button>\n      <button class=\"btn-sm btn-add\" onclick=\"publicarConfigPublica(false)\">🌐 Publicar página pública<\/button>\n      <button class=\"btn-sm btn-neutral\" onclick=\"copiarLinkInscricao()\">🔗 Copiar link p/ pais<\/button>\n      <button class=\"btn-sm btn-neutral\" onclick=\"abrirFichaPublica()\">👪 Pré-visualizar ficha<\/button>\n    <\/div><\/div>`;\n  const cardPre = pend.length? `<div class=\"card\" style=\"border:2px solid var(--amber)\">\n    <div class=\"card-head\"><div class=\"card-title\">📥 Pré-inscrições online · ${pend.length} por aprovar<\/div><\/div>\n    <div class=\"muted\" style=\"margin-bottom:10px\">Inscrições feitas pelos pais. Confirma os dados, atribui o grupo depois de aprovar e valida os descontos.<\/div>\n    <div class=\"table-wrap\"><table><thead><tr><th>Criança<\/th><th>Responsável<\/th><th>Inscrição<\/th><th>Pedidos<\/th><th>Anexos<\/th><th class=\"right\">Valor<\/th><th><\/th><\/tr><\/thead><tbody>\n    ${pend.map(p=>{ const ax=p.anexos||{}; const isCloud=p.__src==='cloud'; const ref=isCloud?p.__rowId:p.id;\n      const anexTag=(k,l)=> (ax[k]&&ax[k].dataUrl)?(isCloud?`<span class=\"chip green\" style=\"cursor:pointer\" onclick=\"verAnexoPreCloud('${ref}','${k}')\" title=\"Abrir\">✓ ${l}<\/span> `:`<span class=\"chip green\" style=\"cursor:pointer\" onclick=\"verAnexo('${ref}','${k}',true)\" title=\"Abrir\">✓ ${l}<\/span> `):`<span class=\"chip red\">✗ ${l}<\/span> `;\n      const aprovar=isCloud?`aprovarPreCloud('${ref}')`:`aprovarPreInscricao('${ref}')`;\n      const rejeitar=isCloud?`rejeitarPreCloud('${ref}')`:`rejeitarPreInscricao('${ref}')`;\n      return `<tr>\n      <td><b>${esc(p.nome)}<\/b> ${isCloud?'<span class=\"chip blue\" style=\"font-size:9.5px\">🌐 online<\/span>':''}${p.nasc?`<div class=\"muted\">${idade(p.nasc)}<\/div>`:''}<\/td>\n      <td>${esc(p.resp||'')}${p.tel?`<div class=\"muted\">${esc(p.tel)}<\/div>`:''}<\/td>\n      <td class=\"muted\">${esc(detalheInsc(p))}<\/td>\n      <td>${p.atleta?'<span class=\"chip blue\">🏅 atleta<\/span> ':''}${p.temIrmao?'<span class=\"chip amber\">👧👦 irmão<\/span>':''}${!p.atleta&&!p.temIrmao?'<span class=\"muted\">—<\/span>':''}<\/td>\n      <td style=\"font-size:10.5px\">${anexTag('comprovativo','compr.')}${anexTag('ccFrente','CC F')}${anexTag('ccVerso','CC V')}${(ax.comprovativo||ax.ccFrente||ax.ccVerso)?`<div style=\"margin-top:3px\"><button class=\"btn-sm btn-add\" style=\"padding:1px 6px;font-size:10px\" onclick=\"${isCloud?`imprimirTodosPreCloud('${ref}')`:`imprimirTodosAnexos('${ref}',true)`}\" title=\"Imprimir os 3 juntos\">🖨️ 3 juntos<\/button><\/div>`:''}<\/td>\n      <td class=\"right\">${fmt(p.valor)}<\/td>\n      <td class=\"right\" style=\"white-space:nowrap\"><button class=\"btn-sm btn-add\" onclick=\"${aprovar}\">✔️ Aprovar<\/button> <button class=\"btn-sm btn-del\" onclick=\"${rejeitar}\">✕<\/button><\/td>\n    <\/tr>`; }).join('')}\n    <\/tbody><\/table><\/div>\n  <\/div>`:'';\n  el.innerHTML = cardLink + cardPre + `<div class=\"card\">\n    <div class=\"card-head\"><div class=\"card-title\">Inscrições · ${criancasAtivas(d).length} criança(s)${d.criancas.filter(c=>c.cancelada).length?` <span class=\"muted\" style=\"font-weight:400\">(+${d.criancas.filter(c=>c.cancelada).length} cancelada(s))<\/span>`:''}<\/div>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap\">${modoAno()?'':'<button class=\"btn-sm btn-add\" onclick=\"abrirModalCrianca()\">+ Nova inscrição<\/button>'}<\/div><\/div>\n    <div class=\"filters\">\n      <input placeholder=\"🔍 procurar por Nº, nome, responsável ou NIF\" value=\"${esc(fCri.busca)}\" oninput=\"fCri.busca=this.value;renderCriancasTabela()\">\n      <select onchange=\"fCri.pago=this.value;renderCriancasTabela()\"><option value=\"\">Todas<\/option><option value=\"sim\" ${fCri.pago==='sim'?'selected':''}>Pagas<\/option><option value=\"nao\" ${fCri.pago==='nao'?'selected':''}>Por pagar<\/option><\/select>\n    <\/div>\n    <div id=\"cri-tabela\"><\/div>\n  <\/div>`;\n  renderCriancasTabela();\n}\n/* ---------- Ficha pública (pré-visualização) ---------- */\n// corpo da ficha (partilhado entre a pré-visualização da coordenação e a página pública dos pais)\nfunction fichaPublicaCamposHTML(){\n  const lim=limitesNasc(); const di=getD().precos.descontoIrmao||{};\n  const descIrmaoTxt = di.tipo==='€/semana'? `${fmt(di.valor)} por irmão, por cada semana inscrita` : di.tipo==='%'? `${di.valor}% por irmão` : `${fmt(di.valor)} por irmão`;\n  return `\n    <div class=\"subt\">Dados da criança<\/div>\n    <div class=\"grid2\">\n      <div class=\"fg\"><label>Nome completo *<\/label><input id=\"c-nome\"><\/div>\n      <div class=\"fg\"><label>Data de nascimento *<\/label><input id=\"c-nasc\" type=\"date\" min=\"${lim.min}\" max=\"${lim.max}\" oninput=\"verIdade()\"><div class=\"muted\" id=\"c-idade-info\" style=\"margin-top:3px\"><\/div><\/div>\n    <\/div>\n    <div class=\"fg\"><label>Tipo de documento<\/label><select id=\"c-cctipo\">${['Cartão de Cidadão','Passaporte','Outro'].map(o=>`<option>${o}<\/option>`).join('')}<\/select><\/div>\n    <div class=\"grid3\">\n      <div class=\"fg\"><label>Nº documento<\/label><input id=\"c-cc\"><\/div>\n      <div class=\"fg\"><label>NIF<\/label><input id=\"c-nif\"><\/div>\n      <div class=\"fg\"><label>Validade<\/label><input id=\"c-ccval\" type=\"date\"><\/div>\n    <\/div>\n    ${campoNota('c-alergias','Alergias / intolerâncias', '')}\n    ${campoNota('c-obs','Observações (medicação, cuidados especiais)', '')}\n    <div class=\"subt\">Encarregado de educação<\/div>\n    <div class=\"grid3\">\n      <div class=\"fg\"><label>Nome *<\/label><input id=\"c-resp\"><\/div>\n      <div class=\"fg\"><label>Parentesco<\/label><select id=\"c-parent\">${['','Pai','Mãe','Avó','Avô','Tutor(a)','Outro'].map(o=>`<option>${o}<\/option>`).join('')}<\/select><\/div>\n      <div class=\"fg\"><label>Telemóvel *<\/label><input id=\"c-tel\"><\/div>\n    <\/div>\n    <div class=\"grid2\">\n      <div class=\"fg\"><label>Email<\/label><input id=\"c-email\" type=\"email\"><\/div>\n      <div class=\"fg\"><label>Contacto de emergência (nome + tel) *<\/label><input id=\"c-emerg\"><\/div>\n    <\/div>\n    ${autorizadosHTML()}\n    <div class=\"subt\">Inscrição<\/div>\n    <div class=\"muted\" style=\"margin-bottom:8px\">Escolhe as semanas inteiras e, se precisares, junta dias avulso (ex.: 1 semana + 2 dias).<\/div>\n    <div id=\"c-blocos\"><\/div>\n    <div class=\"subt\">Descontos<\/div>\n    <div class=\"info\" style=\"background:#FFF3D6;border-color:#E6B800;color:#6b4e00\">\n      ⚠️ <b>Assinala apenas uma<\/b> das situações, e só se realmente se aplicar: o teu educando é <b>atleta da ARCA d'Ajuda<\/b>, ou tem um(a) <b>irmão(ã) a frequentar o ATL no mesmo período<\/b>.<br>\n      Nesse caso há um desconto de <b>${descIrmaoTxt}<\/b> (por cada irmão). Os descontos <b>não são acumuláveis<\/b> — aplica-se apenas <b>um<\/b> (o mais vantajoso).\n    <\/div>\n    <label class=\"sem-check\"><input type=\"radio\" name=\"c-desc\" value=\"nenhum\" checked onchange=\"setDescontoOpcao('nenhum')\"> ✅ Não se aplica — o meu educando <b>não é atleta da ARCA d'Ajuda<\/b> e <b>não tem irmão(ã)<\/b> a frequentar o ATL no mesmo período<\/label>\n    <label class=\"sem-check\"><input type=\"radio\" name=\"c-desc\" value=\"atleta\" onchange=\"setDescontoOpcao('atleta')\"> 🏅 É <b>atleta da ARCA d'Ajuda<\/b><\/label>\n    <label class=\"sem-check\"><input type=\"radio\" name=\"c-desc\" value=\"irmao\" onchange=\"setDescontoOpcao('irmao')\"> 👧👦 Tem <b>irmão(ã) a frequentar o ATL no mesmo período<\/b><\/label>\n    <div class=\"info\" style=\"background:#FDECEA;border-color:#F0855F;color:#7a2e12;margin-top:8px\">\n      <b>Importante:<\/b> qualquer desconto assinalado é <b>avaliado pela administração<\/b>. Se não corresponder à realidade, será <b>solicitado o pagamento do valor do desconto<\/b> e a <b>inscrição só fica concluída após esse pagamento<\/b>.\n    <\/div>\n    <div class=\"card\" style=\"background:var(--teal-l);border-color:#c9dcf3;margin-top:12px\">\n      <div style=\"font-size:13px;color:var(--teal-d)\">Valor a pagar<\/div>\n      <div style=\"font-size:26px;font-weight:800;color:var(--teal-d)\" id=\"c-valor-pub\">€ 0,00<\/div>\n      <input type=\"hidden\" id=\"c-valor\">\n      <div class=\"muted\" id=\"c-sugestao\" style=\"margin-top:2px\"><\/div>\n      <div class=\"muted\" style=\"margin-top:4px\">Os descontos serão confirmados pela coordenação. Pode pagar a pré-inscrição (40€) e o restante depois.<\/div>\n    <\/div>\n    <div class=\"subt\">Documentos a anexar <span style=\"color:var(--coral-d)\">*<\/span><\/div>\n    <div class=\"info\" style=\"background:#FDECEA;border-color:#F0855F;color:#7a2e12\">\n      <b>Obrigatório.<\/b> A inscrição só é enviada com os 3 documentos anexados. O Cartão de Cidadão tem de ser <b>o da criança<\/b> (não o do encarregado) — frente e verso.\n    <\/div>\n    <div class=\"fg\"><label>💳 Comprovativo de pagamento *<\/label><input id=\"c-anexo-comp\" type=\"file\" accept=\"image/*,application/pdf\"><\/div>\n    <div class=\"grid2\">\n      <div class=\"fg\"><label>🪪 CC da criança — frente *<\/label><input id=\"c-anexo-ccf\" type=\"file\" accept=\"image/*,application/pdf\"><\/div>\n      <div class=\"fg\"><label>🪪 CC da criança — verso *<\/label><input id=\"c-anexo-ccv\" type=\"file\" accept=\"image/*,application/pdf\"><\/div>\n    <\/div>`;\n}\nfunction abrirFichaPublica(){\n  _cCur={avulsoDias:[],semanasSel:[],mesesSel:[],atleta:false,temIrmao:false,dataInscricao:hoje()};\n  _valorManual=false; _modalCriancaNovo=false;\n  const _estL=estadoLink();\n  modal('👪 Ficha de Inscrição — ATL ARCAKIDS', `\n    ${_estL.aberto?'':`<div class=\"info\" style=\"background:#FDECEA;border-color:#F0855F;color:#7a2e12\"><b>⛔ Inscrições encerradas.<\/b> ${esc(_estL.motivo)}<br><span class=\"muted\">(Pré-visualização — o botão de envio está desativado enquanto estiver encerrado.)<\/span><\/div>`}\n    <div class=\"info\">Pré-visualização da ficha que os pais vão preencher. Idade permitida: <b>6 a 12 anos<\/b>. O valor é calculado automaticamente.<\/div>\n    ${fichaPublicaCamposHTML()}`,\n    [ {txt:'Enviar inscrição', cls:'btn-add', fn:guardarPreInscricao} ]);\n  renderBlocosInsc(); verIdade(); refDescontoRadio(); atualizaSugestaoPublica();\n}\n/* ============================================================\n   PÁGINA PÚBLICA DOS PAIS (link #inscricao, sem login)\n   ============================================================ */\nlet _cfgPublico=null;\nfunction estadoLinkPublico(link){ link=link||{};\n  if(link.aberto===false) return {aberto:false, motivo:'As inscrições estão encerradas.'};\n  if(link.prazo && hoje()>link.prazo) return {aberto:false, motivo:'O prazo de inscrição terminou ('+fmtData(link.prazo)+').'};\n  if(link.max>0 && (link.atuais||0)>=link.max) return {aberto:false, motivo:'As inscrições estão encerradas — as vagas estão preenchidas.'};\n  return {aberto:true, vagas: link.max>0?Math.max(0,link.max-(link.atuais||0)):null};\n}\nfunction pubHero(sub){ return `<div class=\"pub-hero\">☀️ ATL ARCAKIDS${sub?`<span class=\"pub-sub\">${esc(sub)}<\/span>`:''}<\/div>`; }\nasync function arrancarPublico(){\n  const ls=$('login-screen'); if(ls) ls.style.display='none';\n  const app=$('app'); if(app) app.style.display='none';\n  const pub=$('pub'); pub.style.display='block';\n  pub.innerHTML=`<div class=\"pub-wrap\">${pubHero('')}<div class=\"pub-card\"><div class=\"empty\">A carregar as inscrições…<\/div><\/div><\/div>`;\n  let cfg=null;\n  try{ const rows=await supaFetch('atl_publico?chave=eq.config&select=valor'); if(rows&&rows[0]) cfg=rows[0].valor; }\n  catch(e){ console.warn('config pública',e); }\n  if(!cfg){ pub.innerHTML=`<div class=\"pub-wrap\">${pubHero('')}<div class=\"pub-card\"><h2>Inscrições indisponíveis<\/h2><p>De momento não há um período de inscrições aberto online. Tenta novamente mais tarde ou contacta a ARCA d'Ajuda.<\/p><\/div><\/div>`; return; }\n  _cfgPublico=cfg;\n  // monta um período/dados temporários (na chave __PUB__, para não mexer nos dados reais) para os cálculos funcionarem\n  edicoes=[{id:'__PUB__', nome:cfg.nome||'ATL', ano:'', dataInicio:cfg.dataInicio||'', dataFim:cfg.dataFim||''}];\n  edicaoAtiva='__PUB__';\n  const dd=dadosVazios(); dd.precos=normalizaPrecos(cfg.precos||{}); dd.inscricaoOnline=cfg.link||{aberto:true};\n  LS.set('atl_ed___PUB__', dd);\n  renderPaginaPublica(cfg);\n}\nfunction renderPaginaPublica(cfg){\n  const pub=$('pub'); const est=estadoLinkPublico(cfg.link);\n  if(!est.aberto){\n    pub.innerHTML=`<div class=\"pub-wrap\">${pubHero(cfg.nome||'')}<div class=\"pub-card\"><div class=\"info\" style=\"background:#FDECEA;border-color:#F0855F;color:#7a2e12\"><b>⛔ Inscrições encerradas.<\/b> ${esc(est.motivo)}<\/div><p class=\"muted\">Para mais informações contacta a ARCA d'Ajuda.<\/p><\/div><\/div>`;\n    return;\n  }\n  _cCur={avulsoDias:[],semanasSel:[],mesesSel:[],atleta:false,temIrmao:false,dataInscricao:hoje()};\n  _valorManual=false; _modalCriancaNovo=false;\n  pub.innerHTML=`<div class=\"pub-wrap\">${pubHero('Ficha de Inscrição · '+(cfg.nome||''))}\n    <div class=\"pub-card\">\n      <div class=\"info\">Preenche a ficha do teu educando. Idade permitida: <b>6 a 12 anos<\/b>. O valor é calculado automaticamente.<\/div>\n      ${fichaPublicaCamposHTML()}\n      <div style=\"margin-top:16px\"><button class=\"btn btn-primary\" style=\"width:100%;padding:13px\" onclick=\"enviarInscricaoPublica()\">📨 Enviar inscrição<\/button><\/div>\n      <div class=\"pub-foot\">ARCA d'Ajuda · ATL ARCAKIDS<\/div>\n    <\/div><\/div>`;\n  renderBlocosInsc(); verIdade(); refDescontoRadio(); atualizaSugestaoPublica();\n}\nasync function enviarInscricaoPublica(){\n  const est=estadoLinkPublico(_cfgPublico&&_cfgPublico.link); if(!est.aberto){ toast('Inscrições encerradas: '+est.motivo,false); return; }\n  const nome=$('c-nome').value.trim(); if(!nome){ toast('Indica o nome da criança.',false); return; }\n  const resp=$('c-resp').value.trim(); const tel=$('c-tel').value.trim();\n  if(!resp||!tel){ toast('Indica o nome e o telemóvel do encarregado.',false); return; }\n  const nascV=$('c-nasc').value;\n  if(nascV){ const a=idadeEm(nascV, refIdadeISO()); if(a==null||a<6||a>12){ toast('Idade fora do limite (6 a 12 anos à data de início do ATL).',false); return; } }\n  _cCur.semanasSel=[...document.querySelectorAll('.ck-sem:checked')].map(x=>x.value);\n  _cCur.mesesSel=[];\n  const fComp=$('c-anexo-comp').files[0], fCcf=$('c-anexo-ccf').files[0], fCcv=$('c-anexo-ccv').files[0];\n  if(!fComp||!fCcf||!fCcv){ toast('Anexa os 3 documentos: comprovativo de pagamento e CC da criança (frente e verso). São obrigatórios.',false); return; }\n  toast('A enviar… aguarda um momento.');\n  const [comprovativo,ccFrente,ccVerso]=await Promise.all([ comprimirFicheiro(fComp), comprimirFicheiro(fCcf), comprimirFicheiro(fCcv) ]);\n  if(!comprovativo||!ccFrente||!ccVerso){ toast('Não consegui ler um dos anexos. Tenta com uma foto (JPG/PNG).',false); return; }\n  const obj={ submetido:hoje(), nome, nasc:nascV, ccTipo:$('c-cctipo').value, cc:$('c-cc').value.trim(), nif:$('c-nif').value.trim(), ccVal:$('c-ccval').value,\n    alergias:$('c-alergias').value.trim(), obs:$('c-obs').value.trim(),\n    resp, parentesco:$('c-parent').value, tel, email:$('c-email').value.trim(), emergencia:$('c-emerg').value.trim(),\n    dataInscricao:hoje(), avulsoDias:_cCur.avulsoDias||[], semanasSel:_cCur.semanasSel||[], mesesSel:[], autorizados:lerAutorizados(),\n    atleta:!!_cCur.atleta, temIrmao:!!_cCur.temIrmao, valor:calcValor(_cCur), anexos:{comprovativo,ccFrente,ccVerso} };\n  try{ await supaFetch('atl_preinscricoes','POST',{ edicao_id:(_cfgPublico&&_cfgPublico.edicaoId)||'', dados:obj, estado:'pendente' }, {'Prefer':'return=minimal'}); }\n  catch(e){ console.warn('enviar pré',e); toast('Falha ao enviar'+((e&&e.message)?(': '+String(e.message).replace(/\\s+/g,' ').slice(0,140)):'.')+' — se continuar, avisa a coordenação.',false); return; }\n  $('pub').innerHTML=`<div class=\"pub-wrap\">${pubHero('')}<div class=\"pub-card\" style=\"text-align:center\"><div style=\"font-size:52px;line-height:1\">✅<\/div><h2>Inscrição enviada!<\/h2><p>Recebemos a inscrição de <b>${esc(nome)}<\/b>. A coordenação vai validar os dados e os descontos e entrará em contacto.<\/p><p class=\"muted\">Obrigado! Já podes fechar esta página.<\/p><\/div><\/div>`;\n}\n/* ---------- coordenação: publicar a página pública e ler pré-inscrições da cloud ---------- */\nlet _preCloud=[];\nasync function publicarConfigPublica(silent){\n  if(!CLOUD_ON()){ if(!silent) toast('Para o link dos pais funcionar tens de entrar com a conta (não em modo local).',false); return false; }\n  if(modoAno()){ if(!silent) toast('Escolhe um período específico para publicar a página pública.',false); return false; }\n  const ed=getEdicao(); const d=getD();\n  if(!ed||!ed.dataInicio){ if(!silent) toast('Define as datas do período antes de publicar a página pública.',false); return false; }\n  const link=getInscOnline(d); link.atuais=nInscricoesAtuais(d);\n  const cfg={ edicaoId:ed.id, nome:ed.nome, dataInicio:ed.dataInicio, dataFim:ed.dataFim,\n    precos:{ inscricoes:d.precos.inscricoes, descontoIrmao:d.precos.descontoIrmao, campanhas:d.precos.campanhas, alimentacaoDiaria:d.precos.alimentacaoDiaria },\n    link, atualizado:new Date().toISOString() };\n  try{ await supaFetch('atl_publico','POST',{chave:'config', valor:cfg, atualizado_em:new Date().toISOString()},{'Prefer':'resolution=merge-duplicates'}); if(!silent) toast('Página pública atualizada. ✅'); return true; }\n  catch(e){ console.warn('publicar config',e); if(!silent) toast('Não consegui atualizar a página pública. Tenta de novo.',false); return false; }\n}\nasync function carregarPreInscricoesCloud(){\n  if(!CLOUD_ON()){ _preCloud=[]; return; }\n  try{ const rows=await supaFetch('atl_preinscricoes?select=id,criado_em,edicao_id,dados,estado&estado=eq.pendente&order=criado_em.asc'); _preCloud=rows||[]; }\n  catch(e){ console.warn('ler pré-inscrições',e); _preCloud=[]; return; }\n  if(tabAtual==='criancas') renderCriancas();\n}\nfunction verAnexoPreCloud(rowId,key){ const r=(_preCloud||[]).find(x=>x.id===rowId); const ax=r&&r.dados&&r.dados.anexos&&r.dados.anexos[key]; verAnexoData(key, ax, (r&&r.dados&&r.dados.nome)||''); }\nasync function aprovarPreCloud(rowId){ if(guardaModoAno()) return;\n  const row=(_preCloud||[]).find(r=>r.id===rowId); if(!row){ toast('Pré-inscrição não encontrada.',false); return; }\n  const p=row.dados||{}; const numero=proximoNumero();\n  const c=Object.assign({}, p, {id:uid(), numero, grupo:'', descontoVerificado:false, pago:0, pagamento:'', notaInscricao:'Inscrição feita online — validar dados e descontos.', lembrete:''});\n  delete c.submetido;\n  const d=getD(); d.criancas.push(c); setD(d);\n  try{ await supaFetch('atl_preinscricoes?id=eq.'+encodeURIComponent(rowId),'DELETE'); }catch(e){ console.warn(e); }\n  _preCloud=(_preCloud||[]).filter(r=>r.id!==rowId);\n  publicarConfigPublica(true);\n  renderCriancas(); toast('Pré-inscrição aprovada (Nº '+numero+'). Atribui o grupo e confirma os descontos.');\n}\nasync function rejeitarPreCloud(rowId){ if(!confirm('Rejeitar/eliminar esta pré-inscrição online?')) return;\n  try{ await supaFetch('atl_preinscricoes?id=eq.'+encodeURIComponent(rowId),'DELETE'); }catch(e){ console.warn(e); }\n  _preCloud=(_preCloud||[]).filter(r=>r.id!==rowId);\n  publicarConfigPublica(true);\n  renderCriancas(); toast('Pré-inscrição removida.');\n}\nfunction atualizaSugestaoPublica(){ atualizaSugestao(false); const v=calcValor(_cCur); const el=$('c-valor-pub'); if(el) el.textContent=fmt(v); }\nasync function guardarPreInscricao(){\n  const estL=estadoLink(); if(!estL.aberto){ toast('Inscrições encerradas: '+estL.motivo,false); return; }\n  const nome=$('c-nome').value.trim(); if(!nome){ toast('Indica o nome da criança.',false); return; }\n  const resp=$('c-resp').value.trim(); const tel=$('c-tel').value.trim();\n  if(!resp||!tel){ toast('Indica o nome e o telemóvel do encarregado.',false); return; }\n  const nascV=$('c-nasc').value;\n  if(nascV){ const a=idadeEm(nascV, refIdadeISO()); if(a==null||a<6||a>12){ toast('Idade fora do limite (6 a 12 anos à data de início do ATL).',false); return; } }\n  _cCur.semanasSel=[...document.querySelectorAll('.ck-sem:checked')].map(x=>x.value);\n  _cCur.mesesSel=[];\n  const fComp=$('c-anexo-comp').files[0], fCcf=$('c-anexo-ccf').files[0], fCcv=$('c-anexo-ccv').files[0];\n  if(!fComp||!fCcf||!fCcv){ toast('Anexa os 3 documentos: comprovativo de pagamento e CC da criança (frente e verso). São obrigatórios.',false); return; }\n  toast('A processar anexos…');\n  const [comprovativo,ccFrente,ccVerso]=await Promise.all([ comprimirFicheiro(fComp), comprimirFicheiro(fCcf), comprimirFicheiro(fCcv) ]);\n  if(!comprovativo||!ccFrente||!ccVerso){ toast('Não consegui ler um dos anexos. Tenta com uma foto (JPG/PNG) de cada documento.',false); return; }\n  const d=getD();\n  const obj={ id:uid(), submetido:hoje(), nome,\n    nasc:nascV, ccTipo:$('c-cctipo').value, cc:$('c-cc').value.trim(), nif:$('c-nif').value.trim(), ccVal:$('c-ccval').value,\n    alergias:$('c-alergias').value.trim(), obs:$('c-obs').value.trim(),\n    resp, parentesco:$('c-parent').value, tel, email:$('c-email').value.trim(), emergencia:$('c-emerg').value.trim(),\n    dataInscricao:hoje(), avulsoDias:_cCur.avulsoDias||[], semanasSel:_cCur.semanasSel||[], mesesSel:_cCur.mesesSel||[], autorizados:lerAutorizados(),\n    atleta:!!_cCur.atleta, temIrmao:!!_cCur.temIrmao, valor:calcValor(_cCur),\n    anexos:{ comprovativo, ccFrente, ccVerso } };\n  d.preInscricoes=d.preInscricoes||[]; d.preInscricoes.push(obj); setD(d);\n  fecharModal(); renderCriancas(); toast('Inscrição enviada! Fica a aguardar aprovação da coordenação. ✅');\n}\nfunction aprovarPreInscricao(id){\n  const d=getD(); const p=(d.preInscricoes||[]).find(x=>x.id===id); if(!p) return;\n  const numero=proximoNumero();\n  const c=Object.assign({}, p, {id:uid(), numero, grupo:'', descontoVerificado:false, pago:0, pagamento:'', notaInscricao:'Inscrição feita online — validar dados e descontos.', lembrete:''});\n  delete c.submetido;\n  d.criancas.push(c); d.preInscricoes=(d.preInscricoes||[]).filter(x=>x.id!==id); setD(d);\n  renderCriancas(); toast('Pré-inscrição aprovada (Nº '+numero+'). Atribui o grupo e confirma os descontos.');\n}\nfunction rejeitarPreInscricao(id){ if(!confirm('Rejeitar/eliminar esta pré-inscrição?'))return; const d=getD(); d.preInscricoes=(d.preInscricoes||[]).filter(x=>x.id!==id); setD(d); renderCriancas(); toast('Pré-inscrição removida.'); }\n/* ---------- descontos: escolha única (nenhum / atleta / irmão) ---------- */\nfunction setDescontoOpcao(v){ _cCur.atleta=(v==='atleta'); _cCur.temIrmao=(v==='irmao'); atualizaSugestao(true); }\nfunction refDescontoRadio(){ const v=_cCur.atleta?'atleta':_cCur.temIrmao?'irmao':'nenhum'; const el=document.querySelector('input[name=\"c-desc\"][value=\"'+v+'\"]'); if(el) el.checked=true; }\nfunction guardarInscOnline(){ if(guardaModoAno()) return; const d=getD(); d.inscricaoOnline={ aberto: $('io-aberto').value==='1', prazo: $('io-prazo').value||'', max: parseInt($('io-max').value)||0 }; setD(d); publicarConfigPublica(true); renderCriancas(); toast('Definições do link guardadas.'); }\nfunction copiarLinkInscricao(){ publicarConfigPublica(true); const url='https://arca-ajuda.github.io/arca-ajuda/atl/#inscricao'; if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast('🔗 Link copiado! Envia aos pais.')).catch(()=>prompt('Copia o link da inscrição:', url)); } else prompt('Copia o link da inscrição:', url); }\n/* ---------- anexos: comprimir imagem (baixa qualidade) e ver ---------- */\nfunction comprimirFicheiro(file){\n  return new Promise(res=>{\n    if(!file) return res(null);\n    if(!(file.type||'').startsWith('image/')){ if(file.size>3*1024*1024){ toast('“'+file.name+'” é grande demais — envia uma foto.',false); return res(null); } const r=new FileReader(); r.onload=e=>res({name:file.name,dataUrl:e.target.result}); r.onerror=()=>res(null); r.readAsDataURL(file); return; }\n    const r=new FileReader(); r.onload=e=>{ const orig=e.target.result; const img=new Image(); img.onload=()=>{ try{ const max=1200; let w=img.width,h=img.height; if(w>max||h>max){ if(w>=h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } } const cv=document.createElement('canvas'); cv.width=w||1; cv.height=h||1; cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); res({name:file.name.replace(/\\.[^.]+$/,'')+'.jpg', dataUrl:cv.toDataURL('image/jpeg',0.55)}); }catch(err){ res({name:file.name, dataUrl:orig}); } }; img.onerror=()=>res({name:file.name, dataUrl:orig}); img.src=orig; }; r.onerror=()=>res(null); r.readAsDataURL(file);\n  });\n}\n// botões por documento na linha da criança (abrir + imprimir cada um)\nfunction anexosIcons(id,pre){\n  const d=getD(); const c=(pre?(d.preInscricoes||[]):d.criancas).find(x=>x.id===id); const ax=(c&&c.anexos)||{};\n  const it=[]; const btn=(k,lbl,cls)=>{ if(ax[k]&&ax[k].dataUrl) it.push(`<button class=\"btn-sm ${cls}\" style=\"padding:2px 7px;font-size:10.5px\" onclick=\"verAnexo('${id}','${k}',${pre?'true':'false'})\" title=\"Abrir / imprimir ${esc(ax[k].name||lbl)}\">🖨️ ${lbl}<\/button>`); };\n  btn('comprovativo','Comprov.','btn-neutral'); btn('ccFrente','CC frente','btn-neutral'); btn('ccVerso','CC verso','btn-neutral');\n  if(it.length) it.push(`<button class=\"btn-sm btn-add\" style=\"padding:2px 7px;font-size:10.5px\" onclick=\"imprimirTodosAnexos('${id}',${pre?'true':'false'})\" title=\"Imprimir os 3 documentos juntos\">🖨️ 3 juntos<\/button>`);\n  return it.length?`<div style=\"margin-top:4px;display:flex;gap:4px;flex-wrap:wrap\">${it.join('')}<\/div>`:'';\n}\nfunction verAnexo(id,key,pre){\n  const d=getD(); const c=(pre?(d.preInscricoes||[]):d.criancas).find(x=>x.id===id); const ax=(c&&c.anexos&&c.anexos[key]);\n  if(!ax||!ax.dataUrl){ toast('Sem documento.',false); return; }\n  verAnexoData(key, ax, c.nome||'');\n}\n// abre uma janela com o documento e botão de impressão (CC à escala do cartão)\nfunction verAnexoData(key, ax, nome){\n  if(!ax||!ax.dataUrl){ toast('Sem documento.',false); return; }\n  const w=window.open('','_blank'); if(!w){ toast('Permite pop-ups (janelas) para ver o documento.',false); return; }\n  const isCC = key==='ccFrente'||key==='ccVerso';\n  const isPdf=(ax.dataUrl||'').indexOf('application/pdf')>=0;\n  const titulo = key==='comprovativo'?'Comprovativo de pagamento':key==='ccFrente'?'CC — frente':'CC — verso';\n  const printCss = isCC\n    ? '@media print{body{margin:0;background:#fff}.bar{display:none}img{width:85.6mm;height:54mm;object-fit:contain;display:block;margin:8mm auto}}'\n    : '@media print{body{margin:0;background:#fff}.bar{display:none}img{max-width:100%;max-height:100%;display:block;margin:0 auto}}';\n  const conteudo = isPdf? `<iframe src=\"${ax.dataUrl}\" style=\"width:100%;height:88vh;border:0;background:#fff\"><\/iframe>` : `<img src=\"${ax.dataUrl}\" style=\"max-width:100%;max-height:86vh;box-shadow:0 4px 18px rgba(0,0,0,.4)\">`;\n  w.document.write(`<html><head><meta charset=\"utf-8\"><title>${esc(titulo)} — ${esc(nome||'')}<\/title>\n    <style>body{margin:0;background:#2b2b2b;font-family:Arial,Helvetica,sans-serif}\n    .bar{position:sticky;top:0;background:#173F72;color:#fff;padding:9px 12px;display:flex;align-items:center;gap:12px;justify-content:center}\n    .bar b{font-size:13px} .bar button{padding:7px 14px;background:#fff;color:#173F72;border:none;border-radius:8px;font-weight:700;cursor:pointer}\n    .wrap{display:flex;align-items:center;justify-content:center;min-height:88vh;padding:14px}\n    ${printCss}<\/style><\/head><body>\n    <div class=\"bar\"><b>${esc(titulo)} · ${esc(nome||'')}<\/b><button onclick=\"window.print()\">🖨️ Imprimir${isCC?' (tamanho CC)':''}<\/button><button onclick=\"window.close()\">✕ Fechar<\/button><\/div>\n    <div class=\"wrap\">${conteudo}<\/div><\/body><\/html>`);\n  w.document.close();\n}\n// imprime os 3 documentos (comprovativo + CC frente + CC verso) juntos, para caber numa página\nfunction abrirImpressaoAnexos(anexos, nome){\n  anexos=anexos||{};\n  const items=[['comprovativo','Comprovativo de pagamento',false],['ccFrente','CC da criança — frente',true],['ccVerso','CC da criança — verso',true]].filter(x=>anexos[x[0]]&&anexos[x[0]].dataUrl);\n  if(!items.length){ toast('Esta inscrição não tem documentos anexados.',false); return; }\n  const w=window.open('','_blank'); if(!w){ toast('Permite pop-ups (janelas) para imprimir.',false); return; }\n  const media=(k,isCC)=>{ const ax=anexos[k]; const isPdf=(ax.dataUrl||'').indexOf('application/pdf')>=0; return isPdf? `<iframe src=\"${ax.dataUrl}\"><\/iframe>` : `<img class=\"${isCC?'cc':'full'}\" src=\"${ax.dataUrl}\">`; };\n  const comp=items.find(x=>x[0]==='comprovativo');\n  const ccs=items.filter(x=>x[2]);\n  const blocoComp = comp? `<div class=\"doc\"><div class=\"tt\">${esc(comp[1])}<\/div>${media('comprovativo',false)}<\/div>`:'';\n  const blocoCC = ccs.length? `<div class=\"ccrow\">${ccs.map(([k,t])=>`<div class=\"doc cc\"><div class=\"tt\">${esc(t)}<\/div>${media(k,true)}<\/div>`).join('')}<\/div>`:'';\n  w.document.write(`<html><head><meta charset=\"utf-8\"><title>Documentos — ${esc(nome||'')}<\/title>\n    <style>body{margin:0;background:#2b2b2b;font-family:Arial,Helvetica,sans-serif;color:#fff}\n    .bar{position:sticky;top:0;background:#173F72;padding:9px 12px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}\n    .bar b{font-size:13px}.bar button{padding:7px 14px;background:#fff;color:#173F72;border:none;border-radius:8px;font-weight:700;cursor:pointer}\n    .wrap{padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}\n    .doc{background:#fff;color:#111;border-radius:8px;padding:10px;width:100%;max-width:900px;box-sizing:border-box}\n    .doc .tt{font-weight:700;margin-bottom:6px;font-size:13px}\n    .doc img.full{max-width:100%;max-height:150mm;display:block;margin:0 auto}\n    .doc.cc{max-width:none;flex:0 0 auto}\n    .doc img.cc{width:85.6mm;height:54mm;object-fit:contain;display:block}\n    .doc iframe{width:100%;height:55vh;border:0}\n    .ccrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}\n    @media print{body{background:#fff}.bar{display:none}.wrap{padding:0;gap:8px}\n      .doc{max-width:100%;border:0;padding:0}.doc img.full{max-height:150mm}\n      .ccrow{gap:8px}.doc img.cc{width:85.6mm;height:54mm}}\n    <\/style><\/head><body>\n    <div class=\"bar\"><b>Documentos · ${esc(nome||'')}<\/b><button onclick=\"window.print()\">🖨️ Imprimir os 3<\/button><button onclick=\"window.close()\">✕ Fechar<\/button><\/div>\n    <div class=\"wrap\">${blocoComp}${blocoCC}<\/div><\/body><\/html>`);\n  w.document.close();\n}\nfunction imprimirTodosAnexos(id, pre){ const d=getD(); const c=(pre?(d.preInscricoes||[]):d.criancas).find(x=>x.id===id); abrirImpressaoAnexos(c&&c.anexos, c&&c.nome); }\nfunction imprimirTodosPreCloud(rowId){ const r=(_preCloud||[]).find(x=>x.id===rowId); abrirImpressaoAnexos(r&&r.dados&&r.dados.anexos, r&&r.dados&&r.dados.nome); }\n// estado dos documentos dentro da ficha admin (abrir/remover antes de guardar)\nfunction anexosEstadoEdit(){\n  const ax=(_cCur&&_cCur.anexos)||{};\n  const item=(k,l)=> ax[k]&&ax[k].dataUrl\n    ? `<button type=\"button\" class=\"btn-sm btn-neutral\" style=\"padding:2px 7px\" onclick=\"verAnexoCur('${k}')\" title=\"Abrir / imprimir\">🖨️ ${l} ✓<\/button> <button type=\"button\" class=\"btn-sm btn-del\" style=\"padding:2px 6px\" onclick=\"removerAnexoCur('${k}')\" title=\"Remover documento\">✕<\/button>`\n    : `<span class=\"chip red\" style=\"font-size:10.5px\">✗ ${l} (por anexar)<\/span>`;\n  return `<div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">${item('comprovativo','Comprovativo')} ${item('ccFrente','CC frente')} ${item('ccVerso','CC verso')}<\/div>`;\n}\nfunction verAnexoCur(key){ const ax=(_cCur&&_cCur.anexos&&_cCur.anexos[key]); verAnexoData(key, ax, (_cCur&&_cCur.nome)||''); }\nfunction removerAnexoCur(key){ if(_cCur&&_cCur.anexos){ delete _cCur.anexos[key]; } const el=$('c-docs-estado'); if(el) el.innerHTML=anexosEstadoEdit(); toast('Documento removido — guarda a ficha para confirmar.'); }\nfunction detalheInsc(c){\n  let nSem=0, nDias=0, total=false;\n  try{ const dec=decomporDiasCrianca(c); nSem=dec.fullWeeks; nDias=dec.avulsoDays; const pd=diasUteisPeriodo().length; total=dec.totalDias>0 && dec.totalDias===pd; }catch(e){}\n  if(!nSem && !nDias){ nSem=(c.semanasSel||[]).length; nDias=(c.avulsoDias||[]).length; }\n  const parts=[];\n  if(nSem) parts.push(nSem+(nSem===1?' semana':' semanas'));\n  if(nDias) parts.push(nDias+(nDias===1?' dia':' dias'));\n  let s = parts.join(' + ')||'—';\n  if(total && (nSem||nDias)) s='Total (todos os dias)';\n  const m=[]; if(c.atleta)m.push('🏅atleta'); if(c.temIrmao)m.push('👧👦irmão');\n  return s + (m.length?' · '+m.join(', '):'');\n}\nfunction statusDescontoBadge(c){\n  if(!(c.atleta||c.temIrmao)) return '';\n  return c.descontoVerificado\n    ? ` · <b style=\"color:var(--teal)\">✓ verificado<\/b>`\n    : ` · <b style=\"color:var(--coral)\">⏳ por verificar<\/b>`;\n}\nfunction renderCriancasTabela(){\n  const lista=filtraCri(); const box=$('cri-tabela');\n  if(!lista.length){ box.innerHTML='<div class=\"empty\">Sem inscrições para mostrar.<\/div>'; return; }\n  box.innerHTML = `<div class=\"table-wrap\"><table><thead><tr><th>Nº<\/th><th>Nome<\/th><th>Responsável<\/th><th>Inscrição<\/th><th title=\"Atribuído pela coordenação\">Grupo<\/th><th class=\"right\">Valor<\/th><th class=\"right\">Pago<\/th><th>Estado<\/th><th><\/th><\/tr><\/thead><tbody>\n    ${lista.map(c=>{ const val=+c.valor||0,pg=+c.pago||0; const estado= val>0&&pg>=val?'<span class=\"chip green\">Pago<\/span>':pg>0?'<span class=\"chip amber\">Parcial<\/span>':'<span class=\"chip red\">Por pagar<\/span>';\n      const canc=!!c.cancelada;\n      return `<tr${canc?' style=\"opacity:.55;background:#faf3f2\"':''}>\n        <td><b>${c.numero||'—'}<\/b><\/td>\n        <td><b style=\"${canc?'text-decoration:line-through':''}\">${esc(c.nome)}<\/b>${canc?' <span class=\"chip red\" style=\"font-size:10px\">🚫 Cancelada<\/span>':''}${c.nasc?`<div class=\"muted\">${idade(c.nasc)}<\/div>`:''}${modoAno()&&c._ed?`<div><span class=\"chip blue\" style=\"font-size:10px\">${esc(c._ed)}<\/span><\/div>`:''}${anexosIcons(c.id,false)}${canc&&c.motivoCancel?`<div class=\"muted\" style=\"font-size:11px\">motivo: ${esc(c.motivoCancel)}<\/div>`:''}<\/td>\n        <td>${esc(c.resp||'')}${c.tel?`<div class=\"muted\">${esc(c.tel)}<\/div>`:''}<\/td>\n        <td class=\"muted\">${esc(detalheInsc(c))}${statusDescontoBadge(c)}<\/td>\n        <td>${canc?'<span class=\"muted\">—<\/span>':(modoAno()? `<span class=\"chip ${c.grupo==='G1'?'blue':c.grupo==='G2'?'amber':'green'}\">${esc(c.grupo||'—')}<\/span>` : `<select onchange=\"setGrupo('${c.id}',this.value)\" style=\"padding:5px 7px;border:1.5px solid var(--line);border-radius:7px;font-weight:700\">${['—','G1','G
