arrasta o ficheiro aqui';\n  const fb=document.getElementById('l-fat-drop');if(fb)fb.style.borderColor='#ccc';\n  window._fatFilePending=null;\n  populateMov();\n  // Always default to Numerário — never Cartão Pré-Pago by accident\n  const sel=document.getElementById('l-tipmov');\n  if(sel){\n    const numIdx=[...sel.options].findIndex(o=>o.value==='Numerário');\n    sel.selectedIndex = numIdx>=0 ? numIdx : 0;\n  }\n  updateCat();\n}\n\nfunction populateMov(){\n  const sel=document.getElementById('l-tipmov');\n  sel.innerHTML=config.movimentos.map(m=>`<option value=\"${m}\">${m}<\/option>`).join('');\n}\n\nfunction setTipo(tipo){\n  currentTipo=tipo;\n  document.getElementById('tbtn-rec').className='tipo-btn'+(tipo==='receita'?' rec':'');\n  document.getElementById('tbtn-desp').className='tipo-btn'+(tipo==='despesa'?' desp':'');\n  document.getElementById('share-group').style.display=tipo==='receita'?'block':'none';\n  updateCat();\n}\n\nfunction updateCat(){\n  const cats=currentTipo==='receita'?Object.keys(config.recCats):Object.keys(config.despCats);\n  const sel=document.getElementById('l-categoria');\n  sel.innerHTML=cats.map(c=>`<option value=\"${c}\">${c}<\/option>`).join('');\n  updateSub();\n}\n\nfunction updateSub(){\n  const cat=document.getElementById('l-categoria').value;\n  const dict=currentTipo==='receita'?config.recCats:config.despCats;\n  const subs=dict[cat]||[];\n  document.getElementById('l-sub').innerHTML=subs.map(s=>`<option>${s}<\/option>`).join('');\n  checkDonatGenero();\n}\n\n// Verifica se é donativo de género (bens) — sem valor monetário obrigatório\nfunction isDonatGenero(){\n  const tipmov=(document.getElementById('l-tipmov').value||'').toLowerCase();\n  const sub=(document.getElementById('l-sub').value||'').toLowerCase();\n  const cat=(document.getElementById('l-categoria').value||'').toLowerCase();\n  return tipmov==='bens e géneros' ||\n    sub.includes('género') || sub.includes('genero') ||\n    sub.includes('bens') ||\n    cat.includes('donativo de género') || cat.includes('donativo de genero');\n}\n\n// ── Fatura upload ───────────────────────────────────────────\nfunction handleFatFile(input){\n  const file=input.files[0]; if(!file) return;\n  const reader=new FileReader();\n  reader.onload=e=>{\n    window._fatFilePending={name:file.name,type:file.type,data:e.target.result};\n    const lbl=document.getElementById('l-fat-label');\n    if(lbl) lbl.innerHTML=`<span style=\"color:var(--teal)\">📄 ${file.name} ✓<\/span>`;\n    const drop=document.getElementById('l-fat-drop');\n    if(drop) drop.style.borderColor='var(--teal)';\n  };\n  reader.readAsDataURL(file);\n}\n\nfunction handleFatDrop(e){\n  e.preventDefault();\n  const file=e.dataTransfer.files[0]; if(!file) return;\n  const inp=document.getElementById('l-fat-file');\n  const dt=new DataTransfer(); dt.items.add(file); inp.files=dt.files;\n  handleFatFile(inp);\n}\n\nfunction verFatura(id){\n  const m=movimentos.find(x=>x.id===id); if(!m||!m.fatFile) return;\n  if(m.fatFile.type==='application/pdf'||m.fatFile.data.startsWith('data:application/pdf')){\n    const w=window.open('','_blank');\n    if(w){ w.document.write(`<html><body style=\"margin:0\"><embed src=\"${m.fatFile.data}\" width=\"100%\" height=\"100%\" type=\"application/pdf\"><\/body><\/html>`); w.document.close(); }\n  } else {\n    const w=window.open('','_blank','width=900,height=700');\n    if(w){ w.document.write(`<html><body style=\"margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh\"><img src=\"${m.fatFile.data}\" style=\"max-width:100%;max-height:100vh;object-fit:contain\"><\/body><\/html>`); w.document.close(); }\n  }\n}\n\nfunction downloadFatura(id){\n  const m=movimentos.find(x=>x.id===id); if(!m||!m.fatFile) return;\n  // Nome organizado: AAAA-MM_NumFatura_Descricao.ext\n  const ext=m.fatFile.name?m.fatFile.name.split('.').pop():'pdf';\n  const mes=String(m.mes||'').padStart(2,'0');\n  const numFat=(m.fatNum||'').replace(/[^A-Za-z0-9]/g,'') || 'FAT';\n  const desc=(m.desc||m.sub||m.categoria||'').replace(/[^A-Za-z0-9 ]/g,'').trim().replace(/\\s+/g,'_').substring(0,20);\n  const nome=`${m.ano}-${mes}_${numFat}${desc?'_'+desc:''}.${ext}`;\n  const a=document.createElement('a');\n  a.href=m.fatFile.data;\n  a.download=nome;\n  a.click();\n  toast(`📥 A guardar: ${nome}`);\n}\n\nfunction checkDonatGenero(){\n  const isGen=isDonatGenero();\n  const vRow=document.getElementById('l-valor')?.closest('.form-row');\n  const vGroup=document.getElementById('l-valor')?.closest('.form-group');\n  const vEl=document.getElementById('l-valor');\n  const genAviso=document.getElementById('genero-aviso');\n  if(isGen){\n    if(vEl){vEl.required=false;vEl.placeholder='Opcional (donativo de bens)';}\n    if(genAviso) genAviso.style.display='block';\n  } else {\n    if(vEl){vEl.required=false;vEl.placeholder='0.00';}\n    if(genAviso) genAviso.style.display='none';\n  }\n}\n\nfunction onMovChange(){\n  checkDonatGenero();\n  const v=document.getElementById('l-tipmov').value;\n  const isCartaoDesp = v==='Cartão Pré-Pago' && currentTipo==='despesa';\n  const isMBRec = v==='Entidade / Referência MB' && currentTipo==='receita';\n  const isMBDesp = v==='Entidade / Referência MB' && currentTipo==='despesa';\n  const aviso=document.getElementById('cartao-aviso');\n  const hint=document.getElementById('tipmov-hint');\n  const saldoAtual=getSaldoCartao();\n\n  if(isCartaoDesp){\n    if(aviso){\n      aviso.style.display='block';\n      aviso.style.background='var(--blue-l)';\n      aviso.style.borderColor='#B5D4F4';\n      aviso.style.color='var(--blue)';\n      aviso.innerHTML=`💳 Esta despesa será debitada do <strong>Cartão Pré-Pago<\/strong>.<br>Saldo atual do cartão: <strong>${fmt(saldoAtual)}<\/strong>`;\n    }\n    if(hint) hint.style.display='none';\n  } else if(isMBRec){\n    if(aviso){\n      aviso.style.display='block';\n      aviso.style.background='var(--teal-l)';\n      aviso.style.borderColor='#9FE1CB';\n      aviso.style.color='var(--teal-d)';\n      aviso.innerHTML=`📲 Este valor vai <strong>acumular no Cartão Pré-Pago<\/strong> (Entidade 21312 / Ref. 995 610 745).<br>Saldo atual do cartão: <strong>${fmt(saldoAtual)}<\/strong>`;\n    }\n    if(hint) hint.style.display='none';\n  } else if(v==='Numerário' && currentTipo==='receita'){\n    if(aviso){\n      aviso.style.display='block';\n      aviso.style.background='var(--amber-l)';\n      aviso.style.borderColor='#FAC775';\n      aviso.style.color='var(--amber-d)';\n      aviso.innerHTML=`🏦 Este valor vai para o <strong>Cofre (Numerário)<\/strong>.<br>Saldo atual do cofre: <strong>${fmt(getSaldoCofre())}<\/strong>`;\n    }\n    if(hint) hint.style.display='none';\n  } else if(v==='Numerário' && currentTipo==='despesa'){\n    if(aviso){\n      aviso.style.display='block';\n      aviso.style.background='var(--amber-l)';\n      aviso.style.borderColor='#FAC775';\n      aviso.style.color='var(--amber-d)';\n      aviso.innerHTML=`🏦 Esta despesa sai do <strong>Cofre (Numerário)<\/strong>.<br>Saldo atual do cofre: <strong>${fmt(getSaldoCofre())}<\/strong>`;\n    }\n    if(hint) hint.style.display='none';\n  } else if(isMBDesp){\n    // MB usado como despesa normal (não vai para o cartão)\n    if(aviso) aviso.style.display='none';\n    if(hint){\n      hint.textContent='ℹ Referência MB usada como forma de pagamento normal — não afeta o saldo do Cartão Pré-Pago';\n      hint.style.display='block';\n      hint.style.color='var(--text-3)';\n    }\n  } else {\n    if(aviso) aviso.style.display='none';\n    if(hint) hint.style.display='none';\n  }\n  checkDonatGenero();\n}\n\nfunction setShare(pct){\n  document.getElementById('l-share').value=pct;\n  document.querySelectorAll('.share-btn').forEach(b=>b.classList.toggle('active',parseInt(b.textContent)===pct));\n  calcShare();\n}\n\nfunction calcShare(){\n  const total=parseFloat(document.getElementById('l-valor').value)||0;\n  const pct=parseInt(document.getElementById('l-share').value)||100;\n  document.getElementById('share-hint').textContent=`Valor guardado: ${fmt(total*pct/100)} (${pct}% do total)`;\n}\n\nfunction saveLancamento(){\n  const mes=parseInt(document.getElementById('l-mes').value);\n  const tipmov=document.getElementById('l-tipmov').value;\n  const cat=document.getElementById('l-categoria').value;\n  const sub=document.getElementById('l-sub').value;\n  const desc=document.getElementById('l-desc').value.trim();\n  const nota=document.getElementById('l-nota').value.trim();\n  const rawVal=parseFloat(document.getElementById('l-valor').value)||0;\n  const pct=currentTipo==='receita'?(parseInt(document.getElementById('l-share').value)||100):100;\n  const valor=Math.round(rawVal*pct/100*100)/100;\n  const genero=isDonatGenero();\n  if(!genero && (!valor||valor<=0)){toast('Insere um valor válido.',false);return;}\n  // Para donativos de género, valor 0 é aceite (bens, não dinheiro)\n  // Safety: confirm if Cartão Pré-Pago selected for despesa\n  if(currentTipo==='despesa' && tipmov==='Cartão Pré-Pago'){\n    const saldo=getSaldoCartao();\n    if(valor>saldo && saldo>=0){\n      if(!confirm(`Atenção: o saldo do Cartão Pré-Pago é ${fmt(saldo)} e esta despesa é ${fmt(valor)}. O saldo ficará negativo. Confirmas?`)) return;\n    }\n  }\n  const ano=getAno();\n  const fatNum=(document.getElementById('l-fat-num')?.value||'').trim();\n  const fatData=(document.getElementById('l-fat-data')?.value||'');\n  const fatFile=window._fatFilePending||null;\n  const obj={cat:currentTipo,ano,mes,tipmov,categoria:cat,sub,desc,nota,valor,fatNum,fatData};\n  if(fatFile) obj.fatFile=fatFile;\n  const agora=new Date();\n  if(editingId){\n    const idx=movimentos.findIndex(m=>m.id===editingId);\n    if(idx>=0){\n      // preservar fatura anterior se não carregou nova\n      const prev=movimentos[idx];\n      obj.id=editingId;\n      if(!fatFile && prev.fatFile) obj.fatFile=prev.fatFile;\n      // registo de auditoria: preserva sempre a data original; acrescenta a da edição\n      obj.registadoEm = prev.registadoEm || agora.toISOString();\n      obj.editadoEm = agora.toISOString();\n      movimentos[idx]=obj;\n    }\n    editingId=null;\n    toast('Lançamento atualizado!');\n  } else {\n    obj.id=Date.now();\n    obj.registadoEm = agora.toISOString();\n    movimentos.push(obj);\n    toast('Lançamento guardado!');\n  }\n  window._fatFilePending=null;\n  saveAll(); updateYearSelector(); closeModal('modal-lancamento'); renderAll();\n}\n\nfunction editMov(id){\n  const m=movimentos.find(x=>x.id===id);\n  if(!m) return;\n  editingId=id;\n  document.getElementById('lancamento-modal-title').textContent='Editar lançamento';\n  resetForm();\n  setTipo(m.cat);\n  document.getElementById('l-mes').value=m.mes;\n  populateMov();\n  setTimeout(()=>{\n    const sm=document.getElementById('l-tipmov');\n    for(let i=0;i<sm.options.length;i++){if(sm.options[i].value===m.tipmov){sm.selectedIndex=i;break;}}\n    const sc=document.getElementById('l-categoria');\n    for(let i=0;i<sc.options.length;i++){if(sc.options[i].value===m.categoria){sc.selectedIndex=i;break;}}\n    updateSub();\n    setTimeout(()=>{\n      const ss=document.getElementById('l-sub');\n      for(let i=0;i<ss.options.length;i++){if(ss.options[i].text===m.sub){ss.selectedIndex=i;break;}}\n    },30);\n    onMovChange();\n  },30);\n  document.getElementById('l-desc').value=m.desc||'';\n  document.getElementById('l-valor').value=m.valor;\n  document.getElementById('l-nota').value=m.nota||'';\n  document.getElementById('l-share').value=100;\n  const efn=document.getElementById('l-fat-num');if(efn)efn.value=m.fatNum||'';\n  const efd=document.getElementById('l-fat-data');if(efd)efd.value=m.fatData||'';\n  const efl=document.getElementById('l-fat-label');\n  if(efl) efl.innerHTML=m.fatFile?`<span style=\"color:var(--teal)\">📄 ${m.fatNum||'Fatura carregada'} ✓<\/span>`:'📎 Clica ou arrasta o ficheiro aqui';\n  window._fatFilePending=null;\n  calcShare();\n  openModal('modal-lancamento');\n}\n\nlet pendingDelete = null; // {type:'mov'|'recarga', id}\n\nfunction deleteMov(id){\n  const m = movimentos.find(x=>x.id===id);\n  if(!m) return;\n  pendingDelete = {type:'mov', id};\n  document.getElementById('delete-preview').innerHTML =\n    `<strong>${m.cat==='receita'?'Receita':'Despesa'}<\/strong> — ${MESES[m.mes-1]} ${m.ano}<br>\n     <span style=\"color:var(--text-2)\">${m.categoria}${m.sub?' › '+m.sub:''}<\/span><br>\n     ${m.desc?`<span style=\"color:var(--text-2);font-size:12px\">${m.desc}<\/span><br>`:''}\n     <strong style=\"color:${m.cat==='receita'?'#085041':'#712B13'};font-size:16px\">${fmt(m.valor)}<\/strong>`;\n  openModal('modal-confirma-delete');\n}\n\nfunction deleteRecarga(id){\n  const r = recargas.find(x=>x.id===id);\n  if(!r) return;\n  pendingDelete = {type:'recarga', id};\n  document.getElementById('delete-preview').innerHTML =\n    `<strong>Recarga Cartão Pré-Pago<\/strong> — ${MESES[r.mes-1]} ${r.ano}<br>\n     <span style=\"color:var(--text-2)\">${r.origem||''}<\/span><br>\n     <strong style=\"color:var(--blue);font-size:16px\">${fmt(r.valor)}<\/strong>`;\n  openModal('modal-confirma-delete');\n}\n\nfunction executeDelete(){\n  if(!pendingDelete) return;\n  if(pendingDelete.type==='mov'){\n    movimentos=movimentos.filter(m=>m.id!==pendingDelete.id);\n    saveAll(); updateYearSelector(); toast('Lançamento eliminado.');\n    pendingDelete=null; closeModal('modal-confirma-delete'); renderAll(); return;\n  }\n  if(pendingDelete.type==='recarga'){\n    recargas=recargas.filter(r=>r.id!==pendingDelete.id);\n    saveAll(); updateYearSelector(); updateTopbarSaldo(); toast('Recarga eliminada.');\n    pendingDelete=null; closeModal('modal-confirma-delete'); renderCartao(); return;\n  }\n  if(pendingDelete.type==='cofre'){\n    movCofre=movCofre.filter(m=>m.id!==pendingDelete.id);\n    saveCofre(); updateTopbarCofre(); toast('Movimento eliminado.');\n    pendingDelete=null; closeModal('modal-confirma-delete'); renderCofre(); return;\n  }\n  if(pendingDelete.type==='lembrete'){\n    const lembretes=LS.get('arca_lembretes')||[];\n    LS.set('arca_lembretes',lembretes.filter(l=>l.id!==pendingDelete.id));\n    toast('Lembrete eliminado.');\n    pendingDelete=null; closeModal('modal-confirma-delete'); renderAgenda(); return;\n  }\n  pendingDelete=null; closeModal('modal-confirma-delete');\n}\n\n// ============================================================\n// CARTÃO\n// ============================================================\nfunction getSaldoCartao(){\n  // ENTRADAS: receitas MB nos lançamentos + pagamentos ATL via MB + recargas manuais\n  const recMB   = movimentos.filter(m=>m.cat==='receita'&&m.tipmov===TIPMOV_CARTAO_IN).reduce((s,m)=>s+m.valor,0);\n  const atlMB   = 0;\n  const manual  = recargas.reduce((s,r)=>s+r.valor,0);\n  // SAÍDAS: despesas pagas com cartão nos lançamentos + despesas ATL via cartão\n  const despMov = movimentos.filter(m=>m.cat==='despesa'&&m.tipmov===TIPMOV_CARTAO_OUT).reduce((s,m)=>s+m.valor,0);\n  const atlCart = 0;\n  return Math.max(0, recMB + atlMB + manual - despMov - atlCart);\n}\n\nfunction getSaldoCartaoGlobal(){\n  const recMB      = movimentos.filter(m=>m.cat==='receita'&&m.tipmov===TIPMOV_CARTAO_IN).reduce((s,m)=>s+m.valor,0);\n  const atlMB      = 0;\n  const manual     = recargas.reduce((s,r)=>s+r.valor,0);\n  const totEntradas= recMB + atlMB + manual;\n  const despMov    = movimentos.filter(m=>m.cat==='despesa'&&m.tipmov===TIPMOV_CARTAO_OUT).reduce((s,m)=>s+m.valor,0);\n  const atlCart    = 0;\n  const totGasto   = despMov + atlCart;\n  const saldo      = Math.max(0, totEntradas - totGasto);\n  return {saldo, totRec:totEntradas, totRecMB:recMB, totAtlMB:atlMB, totRecargas:manual, totGasto, totDespMov:despMov, totAtlCart:atlCart};\n}\n\nfunction saveRecarga(){\n  const mes=parseInt(document.getElementById('rc-mes').value);\n  const valor=parseFloat(document.getElementById('rc-valor').value)||0;\n  const origem=document.getElementById('rc-origem').value;\n  const nota=document.getElementById('rc-nota').value.trim();\n  if(!valor||valor<=0){toast('Insere um valor válido.',false);return;}\n  const ano=getAno();\n  recargas.push({id:Date.now(),ano,mes,valor,origem,nota});\n  saveAll(); updateYearSelector(); closeModal('modal-recarga'); updateTopbarSaldo(); toast('Cartão recarregado!'); renderAll();\n}\n\nfunction onRecOrigChange(){\n  const v = document.getElementById('rc-origem').value;\n  const mbBox = document.getElementById('rc-mb-dados');\n  if(mbBox) mbBox.style.display = v === 'Entidade/Referência MB' ? 'block' : 'none';\n}\n\ndocument.getElementById('rc-valor').addEventListener('input',function(){\n  const saldo=getSaldoCartaoGlobal().saldo;\n  const v=parseFloat(this.value)||0;\n  document.getElementById('rc-saldo-atual').textContent=fmt(saldo);\n  document.getElementById('rc-saldo-novo').textContent=fmt(saldo+v);\n});\n\nfunction updateTopbarSaldo(){\n  const {saldo}=getSaldoCartaoGlobal();\n  document.getElementById('topbar-saldo-cartao').textContent=fmt(saldo);\n}\n\nfunction renderCartao(){\n  const ano=getAno(), mes=getMes();\n  const saldoData=getSaldoCartaoGlobal();\n  const {saldo,totRec,totRecMB,totRecargas,totGasto}=saldoData;\n\n  const elSaldo=document.getElementById('cartao-saldo-value');\n  const elRec=document.getElementById('cartao-total-rec');\n  const elGasto=document.getElementById('cartao-total-gasto');\n  if(elSaldo) elSaldo.textContent=fmt(saldo);\n  if(elRec) elRec.textContent=fmt(totRec);\n  if(elGasto) elGasto.textContent=fmt(totGasto);\n\n  // Update subtitle to explain all sources\n  const subLabel=document.getElementById('cartao-total-gasto-label');\n  if(subLabel) subLabel.innerHTML=`\n    Rec. MB lançamentos: <strong style=\"color:var(--blue)\">${fmt(saldoData.totRecMB||0)}<\/strong> &nbsp;·&nbsp;\n    Recargas manuais: <strong style=\"color:var(--blue)\">${fmt(saldoData.totRecargas||0)}<\/strong> &nbsp;·&nbsp;\n    Despesas cartão: <strong style=\"color:var(--coral-d)\">${fmt(saldoData.totGasto||0)}<\/strong>`;\n\n  // Ensure inner tabs active\n  const innerPanels=document.querySelectorAll('[id^=\"cartao-inner-\"]');\n  const hasActive=[...innerPanels].some(p=>p.classList.contains('active'));\n  if(!hasActive&&innerPanels.length){\n    innerPanels[0].classList.add('active');\n    document.querySelectorAll('#page-cartao .inner-tab')[0]?.classList.add('active');\n  }\n\n  // Chart 1: Entradas por mês (MB receipts + recargas manuais)\n  const recMBmes=MESES_S.map((_,i)=>movimentos.filter(m=>m.cat==='receita'&&m.tipmov==='Entidade / Referência MB'&&m.ano===ano&&m.mes===i+1).reduce((s,m)=>s+m.valor,0));\n  const recManuMes=MESES_S.map((_,i)=>recargas.filter(r=>r.ano===ano&&r.mes===i+1).reduce((s,r)=>s+r.valor,0));\n  mkChart('recargas','chart-recargas',{type:'bar',data:{labels:MESES_S,datasets:[\n    {label:'Recebido por MB',data:recMBmes,backgroundColor:'#185FA599',borderRadius:3},\n    {label:'Recarga manual',data:recManuMes,backgroundColor:'#9FE1CB99',borderRadius:3}\n  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:10,font:{size:11}}}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{callback:v=>'€'+Math.round(v),font:{size:10}}}}}});\n\n  // Chart 2: Despesas no cartão por categoria\n  const despCart=movimentos.filter(m=>m.cat==='despesa'&&m.ano===ano&&m.tipmov==='Cartão Pré-Pago');\n  const catTot={};despCart.forEach(m=>{catTot[m.categoria]=(catTot[m.categoria]||0)+m.valor;});\n  mkChart('cartao-desp','chart-cartao-desp',{type:'doughnut',data:{labels:Object.keys(catTot).length?Object.keys(catTot):['Sem dados'],datasets:[{data:Object.values(catTot).length?Object.values(catTot):[1],backgroundColor:Object.keys(catTot).length?CORES:['#e5e5e5'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:10}}}}});\n\n  // Tabela entradas (MB + manuais)\n  const recMBfilt=movimentos.filter(m=>m.cat==='receita'&&m.tipmov==='Entidade / Referência MB'&&m.ano===ano&&(mes===0||m.mes===mes)).sort((a,b)=>b.mes-a.mes||b.id-a.id);\n  const recManuFilt=recargas.filter(r=>r.ano===ano&&(mes===0||r.mes===mes)).sort((a,b)=>b.mes-a.mes||b.id-a.id);\n  const elR=document.getElementById('tabela-recargas');\n  if(elR){\n    let html='';\n    if(!recMBfilt.length&&!recManuFilt.length){\n      html='<div class=\"empty-state\"><p>Sem entradas no cartão neste período.<br><small>Regista receitas com tipo de movimento \"Entidade / Referência MB\" para que apareçam aqui.<\/small><\/p><\/div>';\n    } else {\n      html=`<table><thead><tr><th>Mês<\/th><th>Tipo entrada<\/th><th>Categoria / Origem<\/th><th>Descrição<\/th><th style=\"text-align:right\">Valor<\/th><th><\/th><\/tr><\/thead><tbody>`;\n      // MB receipts\n      recMBfilt.forEach(m=>{\n        html+=`<tr><td>${MESES[m.mes-1]}<\/td><td><span class=\"badge\" style=\"background:var(--blue-l);color:var(--blue)\">📲 MB<\/span><\/td><td style=\"font-size:12px\">${m.categoria}<\/td><td style=\"font-size:12px;color:var(--text-2)\">${m.desc||m.sub||'—'}<\/td><td style=\"text-align:right;color:var(--blue);font-weight:600\">${fmt(m.valor)}<\/td><td><button class=\"btn-edit\" onclick=\"editMov(${m.id})\" title=\"Editar\">✏<\/button><\/td><\/tr>`;\n      });\n      // Manual recargas\n      recManuFilt.forEach(r=>{\n        html+=`<tr><td>${MESES[r.mes-1]}<\/td><td><span class=\"badge\" style=\"background:var(--teal-l);color:var(--teal-d)\">🔄 Manual<\/span><\/td><td style=\"font-size:12px\">${r.origem||'—'}<\/td><td style=\"font-size:12px;color:var(--text-2)\">${r.nota||'—'}<\/td><td style=\"text-align:right;color:var(--teal-d);font-weight:600\">${fmt(r.valor)}<\/td><td><button class=\"btn-danger\" onclick=\"deleteRecarga(${r.id})\">🗑<\/button><\/td><\/tr>`;\n      });\n      html+='<\/tbody><\/table>';\n    }\n    elR.innerHTML=html;\n  }\n\n  // Tabela despesas cartão\n  const dFiltered=despCart.filter(m=>mes===0||m.mes===mes).sort((a,b)=>b.mes-a.mes||b.id-a.id);\n  const elD=document.getElementById('tabela-cartao-desp');\n  if(elD) elD.innerHTML=dFiltered.length\n    ?`<table><thead><tr><th>Mês<\/th><th>Categoria<\/th><th>Sub.<\/th><th>Descrição<\/th><th style=\"text-align:right\">Valor<\/th><th><\/th><\/tr><\/thead><tbody>${dFiltered.map(m=>`<tr><td>${MESES[m.mes-1]}<\/td><td>${m.categoria}<\/td><td style=\"font-size:12px;color:var(--text-2)\">${m.sub||'—'}<\/td><td style=\"font-size:12px;color:var(--text-2)\">${m.desc||'—'}<\/td><td style=\"text-align:right;color:var(--coral-d);font-weight:500\">${fmt(m.valor)}<\/td><td><div class=\"td-actions\"><button class=\"btn-edit\" onclick=\"editMov(${m.id})\">✏<\/button><button class=\"btn-print\" onclick=\"openComprovativo(${m.id})\" title=\"Imprimir\">🖨<\/button><button class=\"btn-danger\" onclick=\"deleteMov(${m.id})\">🗑<\/button><\/div><\/td><\/tr>`).join('')}<\/tbody><\/table>`\n    :'<div class=\"empty-state\"><p>Sem despesas no cartão neste período.<\/p><\/div>';\n}\n\n// ============================================================\n// DASHBOARD\n// ============================================================\nfunction renderDashboard(){\n  const ms=filteredMovs(), mes=getMes(), ano=getAno();\n  const totRec=ms.filter(m=>m.cat==='receita').reduce((s,m)=>s+m.valor,0);\n  const totDesp=ms.filter(m=>m.cat==='despesa').reduce((s,m)=>s+m.valor,0);\n  const fluxo=totRec-totDesp;\n  const {saldo}=getSaldoCartaoGlobal();\n  const saldoCofre=getSaldoCofre();\n  // Saldo global = geral + cartão + cofre\n  const saldoGlobal = fluxo + saldo + saldoCofre;\n  document.getElementById('dash-periodo-label').textContent=mes?`${MESES[mes-1]} ${ano}`:`Ano ${ano}`; { const tp=document.getElementById('topbar-periodo'); if(tp) tp.textContent='Controlo financeiro · '+document.getElementById('dash-periodo-label').textContent; }\n  document.getElementById('dash-metrics').innerHTML=`\n    <div class=\"metric-card\" title=\"Dinheiro que entrou na conta geral (banco, transferências, MBWAY) no período escolhido. Não inclui numerário nem cartão pré-pago — esses contam no Cofre e no Cartão.\"><div class=\"metric-label\">🏦 Receitas Gerais<\/div><div class=\"metric-value green\">${fmt(totRec)}<\/div><div class=\"metric-sub\">${ms.filter(m=>m.cat==='receita').length} mov.<\/div><\/div>\n    <div class=\"metric-card\" title=\"Dinheiro que saiu da conta geral (banco, transferências, MBWAY) no período escolhido. Não inclui numerário nem cartão pré-pago.\"><div class=\"metric-label\">🏦 Despesas Gerais<\/div><div class=\"metric-value red\">${fmt(totDesp)}<\/div><div class=\"metric-sub\">${ms.filter(m=>m.cat==='despesa').length} mov.<\/div><\/div>\n    <div class=\"metric-card\" title=\"Saldo atual do Cartão Pré-Pago MB: recargas feitas menos despesas pagas com o cartão. Clica em Cartão Pré-Pago no menu para gerir.\"><div class=\"metric-label\">💳 Saldo Cartão MB<\/div><div class=\"metric-value blue\">${fmt(saldo)}<\/div><div class=\"metric-sub\">Cartão MB<\/div><\/div>\n    <div class=\"metric-card\" title=\"Dinheiro vivo guardado no cofre: receitas em numerário e entradas/saídas manuais do cofre. Clica em Cofre / Numerário no menu para gerir.\"><div class=\"metric-label\">🏦 Cofre Numerário<\/div><div class=\"metric-value\" style=\"color:var(--amber)\">${fmt(saldoCofre)}<\/div><div class=\"metric-sub\">Numerário<\/div><\/div>\n    <div class=\"metric-card\" title=\"Todo o dinheiro da associação: conta geral + cartão pré-pago + cofre, sem contar nada duas vezes.\"><div class=\"metric-label\">📊 Saldo Global<\/div><div class=\"metric-value ${saldoGlobal>=0?'green':'red'}\">${fmt(saldoGlobal)}<\/div><div class=\"metric-sub\">Geral + Cartão + Cofre<\/div><\/div>\n  `;\n  // Usar apenas movimentos gerais (sem numerário nem cartão) para evitar duplicação\n  const movGeral=movimentos.filter(m=>m.ano===ano&&!TIPMOV_EXCLUIDOS_GERAL.includes(m.tipmov));\n  const rec=MESES_S.map((_,i)=>movGeral.filter(m=>m.cat==='receita'&&m.mes===i+1).reduce((s,m)=>s+m.valor,0));\n  const desp=MESES_S.map((_,i)=>movGeral.filter(m=>m.cat==='despesa'&&m.mes===i+1).reduce((s,m)=>s+m.valor,0));\n  let acum=0; const acumArr=rec.map((r,i)=>{acum+=r-desp[i];return Math.round(acum*100)/100;});\n  mkChart('mensal','chart-mensal',{type:'bar',data:{labels:MESES_S,datasets:[{label:'Receitas',data:rec,backgroundColor:'#1D9E7599',borderRadius:3},{label:'Despesas',data:desp,backgroundColor:'#D85A3099',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:10,font:{size:11}}}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{callback:v=>'€'+Math.round(v),font:{size:10}}}}}});\n  const catT={};ms.filter(m=>m.cat==='receita').forEach(m=>{catT[m.categoria]=(catT[m.categoria]||0)+m.valor;});\n  mkChart('rec-cat','chart-rec-cat',{type:'doughnut',data:{labels:Object.keys(catT).length?Object.keys(catT):['Sem dados'],datasets:[{data:Object.values(catT).length?Object.values(catT):[1],backgroundColor:Object.keys(catT).length?CORES:['#e5e5e5'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:10}}}}});\n  mkChart('fluxo-acum','chart-fluxo-acum',{type:'line',data:{labels:MESES_S,datasets:[{label:'Fluxo acumulado',data:acumArr,borderColor:'#0F6E56',backgroundColor:'#E1F5EE80',fill:true,tension:.35,pointRadius:3,pointBackgroundColor:'#0F6E56'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{callback:v=>'€'+Math.round(v),font:{size:10}}}}}});\n  // Últimos lançamentos: mostrar todos mas indicar onde vão (geral/cartão/cofre)\n  const ultAll=[...movimentos.filter(m=>m.ano===ano)].sort((a,b)=>b.id-a.id).slice(0,8);\n  document.getElementById('dash-ultimos').innerHTML=ultAll.length?`<table><thead><tr><th>Mês<\/th><th>Tipo<\/th><th>Conta<\/th><th>Categoria<\/th><th>Descrição<\/th><th style=\"text-align:right\">Valor<\/th><\/tr><\/thead><tbody>${ultAll.map(m=>{\n    const isCartao=TIPMOV_CARTAO.includes(m.tipmov);\n    const isNumerario=m.tipmov==='Numerário';\n    const contaBadge=isCartao?`<span style=\"font-size:10px;background:var(--blue-l);color:var(--blue);padding:1px 5px;border-radius:8px\">💳 Cartão<\/span>`:isNumerario?`<span style=\"font-size:10px;background:var(--amber-l);color:var(--amber-d);padding:1px 5px;border-radius:8px\">🏦 Cofre<\/span>`:`<span style=\"font-size:10px;background:var(--teal-l);color:var(--teal-d);padding:1px 5px;border-radius:8px\">📊 Geral<\/span>`;\n    return `<tr style=\"${isCartao?'background:var(--blue-l)':isNumerario?'background:var(--amber-l)':''}\"><td>${MESES[m.mes-1]}<\/td><td><span class=\"badge ${m.cat==='receita'?'badge-rec':'badge-desp'}\">${m.cat==='receita'?'Rec.':'Desp.'}<\/span><\/td><td>${contaBadge}<\/td><td style=\"font-size:12px\">${m.categoria}<\/td><td style=\"color:var(--text-2);font-size:12px\">${m.desc||m.sub||'—'}<\/td><td style=\"text-align:right;font-weight:500;color:${m.cat==='receita'?'#085041':'#712B13'}\">${m.valor>0?fmt(m.valor):'Bens'}<\/td><\/tr>`;\n  }).join('')}<\/tbody><\/table>`:'<div class=\"empty-state\"><p>Sem lançamentos. Clica em \"+ Lançamento\" para começar.<\/p><\/div>';\n}\n\n// ============================================================\n// LANÇAMENTOS\n// ============================================================\nfunction renderLancamentos(){\n  const ano=getAno(), mes=getMes();\n  const ftipo=document.getElementById('f-tipo').value;\n  const fcat=document.getElementById('f-cat').value;\n  const fmov=document.getElementById('f-mov').value;\n  const fb=(document.getElementById('f-busca').value||'').toLowerCase();\n  // fill filters\n  const allCats=[...new Set(movimentos.filter(m=>m.ano===ano).map(m=>m.categoria))].sort();\n  const fs=document.getElementById('f-cat'); const vc=fs.value;\n  fs.innerHTML='<option value=\"\">Todas as categorias<\/option>'+allCats.map(c=>`<option value=\"${c}\">${c}<\/option>`).join(''); fs.value=vc;\n  const fm=document.getElementById('f-mov'); const vm=fm.value;\n  fm.innerHTML='<option value=\"\">Todos os movimentos<\/option>'+config.movimentos.map(m=>`<option value=\"${m}\">${m}<\/option>`).join(''); fm.value=vm;\n  // Use ALL movements (including cartão) in the ledger — cartão ones are flagged\n  let ms=movimentos.filter(m=>m.ano===ano&&(mes===0||m.mes===mes));\n  if(ftipo) ms=ms.filter(m=>m.cat===ftipo);\n  if(fcat) ms=ms.filter(m=>m.categoria===fcat);\n  if(fmov) ms=ms.filter(m=>m.tipmov===fmov);\n  if(fb) ms=ms.filter(m=>(m.desc||'').toLowerCase().includes(fb)||(m.sub||'').toLowerCase().includes(fb)||(m.categoria||'').toLowerCase().includes(fb));\n  ms=[...ms].sort((a,b)=>b.mes-a.mes||b.id-a.id);\n  const el=document.getElementById('tabela-lancamentos');\n  if(!ms.length){el.innerHTML='<div class=\"empty-state\"><p>Nenhum lançamento encontrado.<\/p><\/div>';return;}\n  el.innerHTML=`<table><thead><tr><th>Mês<\/th><th>Tipo<\/th><th>Movimento<\/th><th>Categoria<\/th><th>Subcategoria<\/th><th>Descrição<\/th><th style=\"text-align:right\">Valor<\/th><th><\/th><\/tr><\/thead><tbody>${ms.map(m=>{\n    const isCartaoMov = TIPMOV_CARTAO.includes(m.tipmov);\n    let audit='';\n    if(m.registadoEm){\n      const reg=new Date(m.registadoEm);\n      const retro = (reg.getFullYear()>m.ano) || (reg.getFullYear()===m.ano && (reg.getMonth()+1)>m.mes);\n      const txt = `Registado a ${reg.toLocaleDateString('pt-PT')} ${reg.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}`\n        + (retro?` — LANÇAMENTO RETROATIVO (referente a ${MESES[m.mes-1]} ${m.ano})`:'')\n        + (m.editadoEm?`\\nÚltima edição: ${new Date(m.editadoEm).toLocaleDateString('pt-PT')} ${new Date(m.editadoEm).toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}`:'');\n      audit = ` <span title=\"${txt.replace(/\"/g,'&quot;')}\" style=\"cursor:help;font-size:11px\">${retro?'🕓':''}${m.editadoEm?'✏':''}<\/span>`;\n      if(!retro && !m.editadoEm) audit = ` <span title=\"${txt.replace(/\"/g,'&quot;')}\" style=\"cursor:help;font-size:10px;color:var(--text-3)\">🛈<\/span>`;\n    }\n    const rowStyle = isCartaoMov ? 'background:var(--blue-l)' : '';\n    const movBadge = m.tipmov==='Cartão Pré-Pago'\n      ? `<span class=\"badge badge-cartao\">💳 ${m.tipmov}<\/span>`\n      : m.tipmov==='Entidade / Referência MB'\n      ? `<span class=\"badge\" style=\"background:var(--blue-l);color:var(--blue)\">📲 MB<\/span>`\n      : m.tipmov==='Numerário'\n      ? `<span class=\"badge\" style=\"background:var(--amber-l);color:var(--amber-d)\">🏦 Numerário<\/span>`\n      : `<span class=\"badge badge-mov\">${m.tipmov||'—'}<\/span>`;\n    const cartaoNote = isCartaoMov ? `<span style=\"font-size:10px;color:var(--blue);margin-left:4px\" title=\"Contabilizado no Cartão Pré-Pago — não duplica no fluxo geral\">💳<\/span>` : '';\n    return `<tr style=\"${rowStyle}\">\n      <td>${MESES[m.mes-1]}${audit}<\/td>\n      <td><span class=\"badge ${m.cat==='receita'?'badge-rec':'badge-desp'}\">${m.cat==='receita'?'Receita':'Despesa'}<\/span>${cartaoNote}<\/td>\n      <td>${movBadge}<\/td>\n      <td>${m.categoria}<\/td>\n      <td style=\"color:var(--text-2);font-size:12px\">${m.sub||'—'}<\/td>\n      <td style=\"color:var(--text-2);font-size:12px\">${m.desc||'—'}<\/td>\n      <td style=\"text-align:right;font-weight:500;color:${m.cat==='receita'?'#085041':'#712B13'}\">${m.valor>0?fmt(m.valor):'<span style=\"font-size:11px;background:var(--amber-l);color:var(--amber-d);padding:1px 7px;border-radius:10px\">🎁 Bens<\/span>'}<\/td>\n      <td><div class=\"td-actions\"><button class=\"btn-edit\" onclick=\"editMov(${m.id})\" title=\"Editar\">✏<\/button>${m.fatFile?`<button class=\"btn-blue\" onclick=\"verFatura(${m.id})\" title=\"Ver fatura\" style=\"padding:5px 8px;font-size:12px\">📄<\/button>`:''}<button class=\"btn-print\" onclick=\"openComprovativo(${m.id})\" title=\"Imprimir comprovativo\">🖨<\/button><button class=\"btn-danger\" onclick=\"deleteMov(${m.id})\" title=\"Eliminar\">🗑<\/button><\/div><\/td>\n    <\/tr>`;\n  }).join('')}<\/tbody><\/table>`;\n}\n\n// ============================================================\n// FLUXO\n// ============================================================\nfunction renderFluxo(){\n  const ano=getAno();\n  document.getElementById('fluxo-ano-lbl').textContent=ano+' — todas as contas (banco, numerário e cartão)';\n  const rec=Array(12).fill(0), desp=Array(12).fill(0);\n  movimentos.filter(m=>m.ano===ano)\n    .forEach(m=>m.cat==='receita'?rec[m.mes-1]+=m.valor:desp[m.mes-1]+=m.valor);\n  const fluxo=rec.map((r,i)=>r-desp[i]);\n  const fmtF=v=>v===0?'—':`<span style=\"color:${v>0?'#085041':'#712B13'};font-weight:600\">${fmt(v)}<\/span>`;\n  const fmtR=v=>v===0?'—':`<span style=\"color:#085041\">${fmt(v)}<\/span>`;\n  const fmtD=v=>v===0?'—':`<span style=\"color:#712B13\">${fmt(v)}<\/span>`;\n  const rows=[\n    {l:'Total Receitas',v:rec,fn:fmtR,cls:''},\n    {l:'Total Despesas',v:desp,fn:fmtD,cls:'fluxo-desp'},\n    {l:'Resultado Mensal',v:fluxo,fn:fmtF,cls:''},\n    {l:'Saldo Acumulado',v:fluxo,fn:fmtF,cls:'fluxo-total'}\n  ];\n  document.getElementById('fluxo-table-el').innerHTML=`<thead><tr><th>Conta<\/th>${MESES_S.map(m=>`<th>${m}<\/th>`).join('')}<th>Total<\/th><\/tr><\/thead><tbody>${rows.map(r=>`<tr class=\"${r.cls}\"><td style=\"font-weight:500;white-space:nowrap\">${r.l}<\/td>${r.v.map(v=>`<td>${r.fn(v)}<\/td>`).join('')}<td>${r.fn(r.v.reduce((a,b)=>a+b,0))}<\/td><\/tr>`).join('')}<\/tbody>`;\n  mkChart('fluxo2','chart-fluxo2',{type:'bar',data:{labels:MESES_S,datasets:[{label:'Receitas',data:rec,backgroundColor:'#1D9E7599',borderRadius:3,order:2},{label:'Despesas',data:desp,backgroundColor:'#D85A3099',borderRadius:3,order:2},{label:'Fluxo',data:fluxo,type:'line',borderColor:'#0F6E56',backgroundColor:'transparent',tension:.35,pointRadius:4,pointBackgroundColor:'#0F6E56',order:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:10,font:{size:11}}}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{callback:v=>'€'+Math.round(v),font:{size:10}}}}}});\n}\n\n// ---- Análise ponto por ponto ----\nfunction irParaAnaliseDetalhe(){\n  showPage('analise', document.getElementById('nav-pesquisa'));\n  setTimeout(()=>{ const c=document.getElementById('ad-tabela'); if(c) c.closest('.card').scrollIntoView({behavior:'smooth',block:'start'}); }, 120);\n}\nfunction popularAnaliseCategorias(){\n  const tipo=document.getElementById('ad-tipo').value;\n  const cats = tipo==='receita' ? Object.keys(config.recCats)\n             : tipo==='despesa' ? Object.keys(config.despCats)\n             : [...new Set([...Object.keys(config.recCats),...Object.keys(config.despCats)])];\n  const sel=document.getElementById('ad-cat'); const atual=sel.value;\n  sel.innerHTML='<option value=\"\">Todas as categorias<\/option>'+cats.map(c=>`<option>${c}<\/option>`).join('');\n  if(cats.includes(atual)) sel.value=atual;\n  popularAnaliseSubs();\n}\nfunction popularAnaliseSubs(){\n  const cat=document.getElementById('ad-cat').value;\n  const subs = cat ? [...new Set([...(config.recCats[cat]||[]),...(config.despCats[cat]||[])])] : [];\n  const sel=document.getElementById('ad-sub'); const atual=sel.value;\n  sel.innerHTML='<option value=\"\">Todas as subcategorias<\/option>'+subs.map(s=>`<option>${s}<\/option>`).join('');\n  if(subs.includes(atual)) sel.value=atual;\n}\nfunction contaDoMov(m){\n  return TIPMOV_CARTAO.includes(m.tipmov) ? 'cartao' : m.tipmov==='Numerário' ? 'numerario' : 'geral';\n}\nfunction filtrarAnaliseDetalhe(){\n  const ano=getAno();\n  const t=document.getElementById('ad-tipo').value, c=document.getElementById('ad-cat').value;\n  const s=document.getElementById('ad-sub').value, ct=document.getElementById('ad-conta').value;\n  const mes=parseInt(document.getElementById('ad-mes').value)||0;\n  return movimentos.filter(m=> m.ano===ano\n    && (!t||m.cat===t) && (!c||m.categoria===c) && (!s||m.sub===s)\n    && (!ct||contaDoMov(m)===ct) && (mes===0||m.mes===mes)\n  ).sort((a,b)=>a.mes-b.mes||(a.id||0)-(b.id||0));\n}\nfunction renderAnaliseDetalhe(){\n  const el=document.getElementById('ad-tabela'); if(!el) return;\n  const list=filtrarAnaliseDetalhe();\n  const rec=list.filter(m=>m.cat==='receita').reduce((x,m)=>x+m.valor,0);\n  const desp=list.filter(m=>m.cat==='despesa').reduce((x,m)=>x+m.valor,0);\n  document.getElementById('ad-contagem').textContent=`${list.length} mov. · ${fmt(rec-desp)}`;\n  if(!list.length){ el.innerHTML='<div class=\"empty-state\"><p>Nenhum movimento com estes filtros.<\/p><\/div>'; return; }\n  const contaLbl={geral:'Banco',numerario:'Numerário',cartao:'Cartão'};\n  el.innerHTML=`<table><thead><tr><th>Mês<\/th><th>Tipo<\/th><th>Categoria<\/th><th>Subcategoria<\/th><th>Conta<\/th><th>Descrição<\/th><th style=\"text-align:right\">Valor<\/th><\/tr><\/thead><tbody>\n    ${list.map(m=>`<tr><td>${MESES[m.mes-1]||m.mes}<\/td><td><span class=\"badge ${m.cat==='receita'?'badge-rec':'badge-desp'}\">${m.cat==='receita'?'Receita':'Despesa'}<\/span><\/td><td style=\"font-size:12px\">${m.categoria||'—'}<\/td><td style=\"font-size:12px\">${m.sub||'—'}<\/td><td style=\"font-size:12px\">${contaLbl[contaDoMov(m)]}<\/td><td style=\"font-size:12px;color:var(--text-2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\" title=\"${(m.desc||'').replace(/\"/g,'&quot;')}\">${m.desc||'—'}<\/td><td style=\"text-align:right;font-weight:600;color:${m.cat==='receita'?'#085041':'#712B13'}\">${m.cat==='receita'?'+':'−'}${fmt(m.valor)}<\/td><\/tr>`).join('')}\n    <tr class=\"fluxo-total\"><td colspan=\"6\" style=\"font-weight:700\">Total (${list.length} movimentos) — Receitas ${fmt(rec)} · Despesas ${fmt(desp)}<\/td><td style=\"text-align:right;font-weight:700;color:${rec-desp>=0?'#085041':'#712B13'}\">${fmt(rec-desp)}<\/td><\/tr>\n  <\/tbody><\/table>`;\n}\nfunction tituloAnaliseDetalhe(){\n  const t=document.getElementById('ad-tipo'), c=document.getElementById('ad-cat'), s=document.getElementById('ad-sub'), ct=document.getElementById('ad-conta'), mes=document.getElementById('ad-mes');\n  const partes=[];\n  partes.push(t.value ? (t.value==='receita'?'Receitas':'Despesas') : 'Receitas e Despesas');\n  if(c.value) partes.push(c.value); if(s.value) partes.push(s.value);\n  if(ct.value) partes.push(ct.options[ct.selectedIndex].text.replace(/^[^ ]+ /,''));\n  partes.push(mes.value==='0' ? ('Ano '+getAno()) : (MESES[parseInt(mes.value)-1]+' '+getAno()));\n  return partes.join(' · ');\n}\nfunction imprimirAnaliseDetalhe(){\n  const list=filtrarAnaliseDetalhe();\n  if(!list.length){ toast('Nenhum movimento para imprimir.',false); return; }\n  const rec=list.filter(m=>m.cat==='receita').reduce((x,m)=>x+m.valor,0);\n  const desp=list.filter(m=>m.cat==='despesa').reduce((x,m)=>x+m.valor,0);\n  const logo=currentLogoData||LS.get('arca_logo')||'';\n  const contaLbl={geral:'Banco',numerario:'Numerário',cartao:'Cartão'};\n  const html=`<!DOCTYPE html><html lang=\"pt\"><head><meta charset=\"UTF-8\"><title>Análise — ${tituloAnaliseDetalhe()}<\/title>\n  <style>\n    *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}\n    body{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#111;padding:24px 28px}\n    @media print{.noprint{display:none!important}}\n    .noprint{position:fixed;top:10px;right:14px;display:flex;gap:8px}\n    .noprint button{padding:7px 16px;border:none;border-radius:20px;font-size:12px;cursor:pointer}\n    .p{background:#1a3a6b;color:#fff}.s{background:#555;color:#fff}\n    .cab{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid #1a3a6b;padding-bottom:10px;margin-bottom:12px}\n    .cab img{height:52px;width:52px;object-fit:cover;border-radius:50%}\n    h1{font-size:15px;color:#1a3a6b}\n    .sub{font-size:10.5px;color:#666;margin-top:2px}\n    table{width:100%;border-collapse:collapse;margin-top:8px}\n    th{background:#EEF2F7;text-align:left;padding:6px 7px;font-size:9.5px;text-transform:uppercase;letter-spacing:.2px;color:#444;border-bottom:1px solid #cfd6df}\n    td{padding:5px 7px;border-bottom:0.5px solid #e5e8ec}\n    .r{text-align:right}\n    .tot td{font-weight:700;background:#F4F7FA;border-top:1.5px solid #1a3a6b}\n    .rod{margin-top:14px;font-size:9px;color:#888;text-align:center}\n  <\/style><\/head><body>\n  <div class=\"noprint\"><button class=\"p\" onclick=\"window.print()\">🖨 Imprimir / PDF<\/button><button class=\"s\" onclick=\"window.close()\">✕ Fechar<\/button><\/div>\n  <div class=\"cab\">${logo?`<img src=\"${logo}\">`:''}<div><h1>ARCA d'Ajuda — Análise ponto por ponto<\/h1><div class=\"sub\">${tituloAnaliseDetalhe()} · gerado a ${new Date().toLocaleDateString('pt-PT')}<\/div><\/div><\/div>\n  <table><thead><tr><th>Mês<\/th><th>Tipo<\/th><th>Categoria<\/th><th>Subcategoria<\/th><th>Conta<\/th><th>Descrição<\/th><th class=\"r\">Valor<\/th><\/tr><\/thead><tbody>\n    ${list.map(m=>`<tr><td>${MESES[m.mes-1]||m.mes}<\/td><td>${m.cat==='receita'?'Receita':'Despesa'}<\/td><td>${m.categoria||'—'}<\/td><td>${m.sub||'—'}<\/td><td>${contaLbl[contaDoMov(m)]}<\/td><td>${(m.desc||'—')}${m.fatNum?` <span style=\"color:#888\">(Fat. ${m.fatNum})<\/span>`:''}<\/td><td class=\"r\" style=\"color:${m.cat==='receita'?'#085041':'#712B13'}\">${m.cat==='receita'?'+':'−'}${fmt(m.valor)}<\/td><\/tr>`).join('')}\n    <tr class=\"tot\"><td colspan=\"6\">Total — ${list.length} movimentos · Receitas ${fmt(rec)} · Despesas ${fmt(desp)}<\/td><td class=\"r\" style=\"color:${rec-desp>=0?'#085041':'#712B13'}\">${fmt(rec-desp)}<\/td><\/tr>\n  <\/tbody><\/table>\n  <div class=\"rod\">ARCA d'Ajuda — Associação Recreativa e Cultural da Ajuda · Controlo Financeiro<\/div>\n  <\/body><\/html>`;\n  const w=window.open('','_blank','width=980,height=1000');\n  if(w){ w.document.write(html); w.document.close(); } else toast('O browser bloqueou a janela. Permite pop-ups.',false);\n}\nfunction exportarAnaliseDetalheCSV(){\n  const list=filtrarAnaliseDetalhe();\n  const contaLbl={geral:'Banco',numerario:'Numerário',cartao:'Cartão'};\n  const linhas=[['Mês','Tipo','Categoria','Subcategoria','Conta','Descrição','Nota','Fatura','Valor']];\n  list.forEach(m=>linhas.push([MESES[m.mes-1]||m.mes, m.cat, m.categoria||'', m.sub||'', contaLbl[contaDoMov(m)], m.desc||'', m.nota||'', m.fatNum||'', String(m.cat==='despesa'?-m.valor:m.valor).replace('.',',')]));\n  const csv='\\uFEFF'+linhas.map(r=>r.map(c=>'\"'+String(c).replace(/\"/g,'\"\"')+'\"').join(';')).join('\\n');\n  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='analise_arca.csv'; a.click();\n}\n\n// ============================================================\n// MODALIDADES\n// ============================================================\nfunction renderModalidades(){\n  const ms=movsDoPeriodo().filter(m=>m.cat==='receita'&&m.categoria==='Modalidades Sala');\n  const g={};ms.forEach(m=>{const k=m.sub.split(' ').slice(0,-1).join(' ')||m.sub;g[k]=(g[k]||0)+m.valor;});\n  mkChart('mod','chart-mod',{type:'bar',data:{labels:Object.keys(g).length?Object.keys(g):['Sem dados'],datasets:[{label:'Receitas',data:Object.values(g).length?Object.values(g):[0],backgroundColor:CORES,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{callback:v=>'€'+Math.round(v),font:{size:10}}}}}});\n  const el=document.getElementById('tabela-modalidades');\n  if(!ms.length){el.innerHTML='<div class=\"empty-state\"><p>Sem receitas de modalidades neste período.<\/p><\/div>';return;}\n  el.innerHTML=mkTable(ms.sort((a,b)=>b.mes-a.mes),[['Mês',m=>MESES[m.mes-1]],['Subcategoria',m=>m.sub||'—'],['Movimento',m=>`<span class=\"badge badge-mov\">${m.tipmov||'—'}<\/span>`],['Descrição',m=>`<span style=\"color:var(--text-2);font-size:12px\">${m.desc||'—'}<\/span>`],['Valor',m=>`<span style=\"color:#085041;font-weight:500\">${fmt(m.valor)}<\/span>`,true]],true);\n}\n\n// ============================================================\n// ATL\n// ============================================================\n// ============================================================\n// EVENTOS\n// ============================================================\nfunction renderEventos(){\n  const todos=movsDoPeriodo().filter(m=>m.categoria==='Eventos');\n  const por={};config.eventos.forEach(e=>por[e]={rec:0,desp:0});\n  todos.forEach(m=>{if(!por[m.sub])por[m.sub]={rec:0,desp:0};if(m.cat==='receita')por[m.sub].rec+=m.valor;else por[m.sub].desp+=m.valor;});\n  document.getElementById('eventos-grid').innerHTML=config.eventos.map(e=>{const v=por[e]||{rec:0,desp:0};return `<div class=\"metric-card\"><div class=\"metric-label\" style=\"font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">${e}<\/div><div style=\"font-size:15px;font-weight:600;color:#085041\">${fmt(v.rec)}<\/div><div style=\"font-size:11px;color:#712B13\">Desp: ${fmt(v.desp)}<\/div><\/div>`;}).join('');\n  const el=document.getElementById('tabela-eventos');\n  if(!todos.length){el.innerHTML='<div class=\"empty-state\"><p>Sem lançamentos de eventos neste período.<\/p><\/div>';return;}\n  el.innerHTML=mkTable(todos.sort((a,b)=>b.mes-a.mes),[['Mês',m=>MESES[m.mes-1]],['Tipo',m=>`<span class=\"badge ${m.cat==='receita'?'badge-rec':'badge-desp'}\">${m.cat==='receita'?'Receita':'Despesa'}<\/span>`],['Evento',m=>m.sub||'—'],['Descrição',m=>`<span style=\"font-size:12px;color:var(--text-2)\">${m.desc||'—'}<\/span>`],['Valor',m=>`<span style=\"color:${m.cat==='receita'?'#085041':'#712B13'};font-weight:500\">${fmt(m.valor)}<\/span>`,true]],true);\n}\n\n// ============================================================\n// FUNCIONÁRIOS\n// ============================================================\nfunction renderFuncionarios(){\n  const ms=movsDoPeriodo().filter(m=>m.cat==='despesa'&&m.categoria==='Funcionários');\n  const total=ms.reduce((s,m)=>s+m.valor,0);\n  const por={};ms.forEach(m=>{por[m.sub]=(por[m.sub]||0)+m.valor;});\n  document.getElementById('func-metrics').innerHTML=`<div class=\"metric-card\"><div class=\"metric-label\">Total Pago<\/div><div class=\"metric-value red\">${fmt(total)}<\/div><div class=\"metric-sub\">${ms.length} pagamentos<\/div><\/div><div class=\"metric-card\"><div class=\"metric-label\">Média Mensal<\/div><div class=\"metric-value\">${fmt(total/12)}<\/div><\/div><div class=\"metric-card\"><div class=\"metric-label\">Sub-tipos<\/div><div class=\"metric-value\">${Object.keys(por).length}<\/div><\/div>`;\n  const men=MESES_S.map((_,i)=>ms.filter(m=>m.mes===i+1).reduce((s,m)=>s+m.valor,0));\n  mkChart('func','chart-func',{type:'bar',data:{labels:MESES_S,datasets:[{label:'Funcionários',data:men,backgroundColor:'#D85A3099',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{callback:v=>'€'+Math.round(v),font:{size:10}}}}}});\n  const el=document.getElementById('tabela-func');\n  if(!ms.length){el.innerHTML='<div class=\"empty-state\"><p>Sem pagamentos neste período.<\/p><\/div>';return;}\n  el.innerHTML=mkTable(ms.sort((a,b)=>b.mes-a.mes),[['Mês',m=>MESES[m.mes-1]],['Sub.',m=>m.sub||'—'],['Descrição',m=>`<span style=\"font-size:12px;color:var(--text-2)\">${m.desc||'—'}<\/span>`],['Valor',m=>`<span style=\"color:#712B13;font-weight:500\">${fmt(m.valor)}<\/span>`,true]],true);\n}\n\n// ============================================================\n// VIATURAS\n// ============================================================\nfunction renderViaturas(){\n  const ms=movsDoPeriodo().filter(m=>m.cat==='despesa'&&m.categoria==='Reparações Viaturas');\n  const p={};ms.forEach(m=>{p[m.sub]=(p[m.sub]||0)+m.valor;});\n  mkChart('viaturas','chart-viaturas',{type:'bar',data:{labels:Object.keys(p).length?Object.keys(p):['Sem dados'],datasets:[{label:'Despesas',data:Object.values(p).length?Object.values(p):[0],backgroundColor:CORES,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:10},maxRotation:30}},y:{ticks:{callback:v=>'€'+Math.round(v),font:{size:10}}}}}});\n  const el=document.getElementById('tabela-viaturas');\n  if(!ms.length){el.innerHTML='<div class=\"empty-state\"><p>Sem despesas de viaturas neste período.<\/p><\/div>';return;}\n  el.innerHTML=mkTable(ms.sort((a,b)=>b.mes-a.mes),[['Mês',m=>MESES[m.mes-1]],['Sub.',m=>m.sub||'—'],['Descrição',m=>`<span style=\"font-size:12px;color:var(--text-2)\">${m.desc||'—'}<\/span>`],['Valor',m=>`<span style=\"color:#712B13;font-weight:500\">${fmt(m.valor)}<\/span>`,true]],true);\n}\n\n// ============================================================\n// ANÁLISE\n// ============================================================\nfunction renderAnalise(){\n  const ano=getAno();\n  if(document.getElementById('ad-cat') && document.getElementById('ad-cat').options.length<=1) popularAnaliseCategorias();\n  renderAnaliseDetalhe();\n  document.getElementById('analise-ano-lbl').textContent='Ano '+ano+' — todos os movimentos';\n\n  // Usar TODOS os movimentos do ano para análise completa\n  // Lançamentos gerais (inclui cartão pré-pago pois usa mesmo array com tipmov diferente)\n  const msGeral = movimentos.filter(m=>m.ano===ano);\n  // Cofre / Numerário — variável separada\n  const msCofre = (movCofre||[]).filter(m=>m.ano===ano).map(m=>({\n    cat: m.tipo==='entrada'?'receita':'despesa',\n    categoria: m.cat||'Numerário / Cofre',\n    sub: m.desc||'Movimento de caixa',\n    valor: m.valor||0, tipmov:'Numerário', ano:m.ano, mes:m.mes\n  }));\n  // Cartão ATL (recargas e despesas do cartão pré-pago já estão em msGeral via movimentos)\n  const ms = [...msGeral, ...msCofre];\n\n  // Separar por origem para ícone na tabela\n  const catsCofreSet = new Set(msCofre.map(m=>m.categoria));\n  const TIPMOV_CART = (typeof TIPMOV_CARTAO!=='undefined')?TIPMOV_CARTAO:['MB/Cartão','Cartão Pré-Pago','MB Way Cartão'];\n  const catsCartaoSet = new Set(msGeral.filter(m=>TIPMOV_CART.some(t=>m.tipmov===t)).map(m=>m.categoria));\n\n  // Gráfico despesas por categoria\n  const catD={};\n  ms.filter(m=>m.cat==='despesa').forEach(m=>{catD[m.categoria]=(catD[m.categoria]||0)+m.valor;});\n  // Ordenar por valor desc\n  const catDKeys = Object.keys(catD).sort((a,b)=>catD[b]-catD[a]);\n  mkChart('desp-cat','chart-desp-cat',{type:'doughnut',data:{labels:catDKeys.length?catDKeys:['Sem dados'],datasets:[{data:catDKeys.length?catDKeys.map(k=>catD[k]):[1],backgroundColor:catDKeys.length?CORES:['#e5e5e5'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:10}}}}});\n\n  // Gráfico subsídios e apoios\n  const sub={};\n  ms.filter(m=>m.cat==='receita'&&(m.categoria==='Subsídios e Apoios Oficiais'||m.categoria==='Subsídios')).forEach(m=>{sub[m.sub||m.categoria]=(sub[m.sub||m.categoria]||0)+m.valor;});\n  mkChart('subsidios','chart-subsidios',{type:'bar',data:{labels:Object.keys(sub).length?Object.keys(sub):['Sem dados'],datasets:[{label:'Valor',data:Object.values(sub).length?Object.values(sub):[0],backgroundColor:'#1D9E7599',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9},maxRotation:35}},y:{ticks:{callback:v=>'€'+Math.round(v),font:{size:10}}}}}});\n\n  // Tabela por categoria — todas as fontes\n  const cats=[...new Set(ms.map(m=>m.categoria))].sort();\n  const rows=cats.map(c=>{\n    const r=ms.filter(m=>m.cat==='receita'&&m.categoria===c).reduce((s,m)=>s+m.valor,0);\n    const d=ms.filter(m=>m.cat==='despesa'&&m.categoria===c).reduce((s,m)=>s+m.valor,0);\n    return {c,r,d,s:r-d};\n  }).filter(r=>r.r>0||r.d>0);\n\n  // Já separados acima em catsCofreSet e catsCartaoSet\n\n  const tR=rows.reduce((s,r)=>s+r.r,0);\n  const tD=rows.reduce((s,r)=>s+r.d,0);\n  const el=document.getElementById('tabela-analise');\n  if(!rows.length){el.innerHTML='<div class=\"empty-state\"><p>Sem dados para este período.<\/p><\/div>';return;}\n\n  el.innerHTML=`<table><thead><tr>\n    <th>Categoria<\/th>\n    <th style=\"text-align:center;font-size:10px\">Conta<\/th>\n    <th style=\"text-align:right\">Receitas<\/th>\n    <th style=\"text-align:right\">Despesas<\/th>\n    <th style=\"text-align:right\">Saldo<\/th>\n  <\/tr><\/thead><tbody>${rows.map(r=>{\n    const conta = catsCofreSet.has(r.c)?'🏦':catsCartaoSet.has(r.c)?'💳':'📊';\n    return `<tr>\n      <td>${r.c}<\/td>\n      <td style=\"text-align:center;font-size:12px\">${conta}<\/td>\n      <td style=\"text-align:right;color:#085041\">${r.r?fmt(r.r):'—'}<\/td>\n      <td style=\"text-align:right;color:#712B13\">${r.d?fmt(r.d):'—'}<\/td>\n      <td style=\"text-align:right;font-weight:500;color:${r.s>=0?'#085041':'#712B13'}\">${fmt(r.s)}<\/td>\n    <\/tr>`;\n  }).join('')}\n  <tr style=\"font-weight:700;background:var(--teal-l)\">\n    <td colspan=\"2\">TOTAL GERAL<\/td>\n    <td style=\"text-align:right;color:#085041\">${fmt(tR)}<\/td>\n    <td style=\"text-align:right;color:#712B13\">${fmt(tD)}<\/td>\n    <td style=\"text-align:right;font-weight:800;color:${tR-tD>=0?'#085041':'#712B13'}\">${fmt(tR-tD)}<\/td>\n  <\/tr><\/tbody><\/table>`;\n}\n\n// ============================================================\n// TABLE HELPER\n// ============================================================\nfunction mkTable(rows,cols,actions){\n  return `<table><thead><tr>${cols.map(c=>`<th${c[2]?' style=\"text-align:right\"':''}>${c[0]}<\/th>`).join('')}${actions?'<th><\/th>':''}<\/tr><\/thead><tbody>${rows.map(m=>`<tr>${cols.map(c=>`<td${c[2]?' style=\"text-align:right\"':''}>${c[1](m)}<\/td>`).join('')}${actions?`<td><div class=\"td-actions\"><button class=\"btn-edit\" onclick=\"editMov(${m.id})\" title=\"Editar\">✏<\/button><button class=\"btn-print\" onclick=\"openComprovativo(${m.id})\" title=\"Imprimir comprovativo\">🖨<\/button><button class=\"btn-danger\" onclick=\"deleteMov(${m.id})\" title=\"Eliminar\">🗑<\/button><\/div><\/td>`:''}<\/tr>`).join('')}<\/tbody><\/table>`;\n}\n\n// ============================================================\n// CONFIGURAÇÕES\n// ============================================================\nfunction renderConfig(tab){\n  if(tab==='receitas') renderConfigCats('receitas',config.recCats,'recCats');\n  if(tab==='despesas') renderConfigCats('despesas',config.despCats,'despCats');\n  if(tab==='movimentos') renderConfigMovimentos();\n  if(tab==='eventos') renderConfigEventos();\n  if(tab==='direccao') renderConfigDireccao();\n  if(tab==='acessos') renderConfigAcessos();\n  if(tab==='dados') renderPinStatus();\n}\n\n// ── ARCA CHAT ASSISTANT ──────────────────────────────────────\nlet arcaChatHistory = [];\nlet arcaChatOpen = false;\n\nfunction toggleArcaChat(){\n  arcaChatOpen = !arcaChatOpen;\n  const w = document.getElementById('arca-chat-widget');\n  if(w){ w.style.display = arcaChatOpen ? 'flex' : 'none'; }\n  if(arcaChatOpen) document.getElementById('arca-chat-input')?.focus();\n}\n\nasync function arcaChatSend(textoFixo){\n  const input = document.getElementById('arca-chat-input');\n  const texto = (textoFixo || input?.value || '').trim();\n  if(!texto) return;\n  if(input && !textoFixo) input.value = '';\n\n  // Mostrar mensagem do utilizador\n  const msgs = document.getElementById('arca-chat-msgs');\n  msgs.innerHTML += `<div style=\"align-self:flex-end;background:#1a3a6b;color:#fff;border-radius:12px 12px 2px 12px;padding:10px 14px;font-size:12px;line-height:1.6;max-width:85%\">${texto}<\/div>`;\n\n  // Indicador de digitação\n  const typingId = 'typing-'+Date.now();\n  msgs.innerHTML += `<div id=\"${typingId}\" style=\"background:#fff;border-radius:12px;padding:10px 14px;font-size:12px;color:#94a3b8;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:60%\">💭 A pensar...<\/div>`;\n  msgs.scrollTop = msgs.scrollHeight;\n\n  // Desativar botão\n  const btn = document.getElementById('arca-chat-send');\n  if(btn) btn.disabled = true;\n\n  arcaChatHistory.push({role:'user', content:texto});\n\n  try {\n    const resp = await fetch('https://api.anthropic.com/v1/messages', {\n      method:'POST',\n      headers:{'Content-Type':'application/json'},\n      body: JSON.stringify({\n        model: 'claude-sonnet-4-6',\n        max_tokens: 1000,\n        system: `És o assistente de utilização da aplicação ARCA Financeiro, uma app de gestão financeira da Associação Recreativa e Cultural da Ajuda (ARCA d'Ajuda), sediada no Funchal, Madeira.\n\nA app tem os seguintes módulos:\n- **Dashboard**: resumo financeiro com gráficos de receitas, despesas e fluxo de caixa\n- **Lançamentos**: registo de receitas e despesas gerais, com campos de fatura (nº, data, upload de PDF/imagem)\n- **Fluxo de Caixa**: visão mensal de entradas e saídas\n- **Cofre / Numerário**: gestão do dinheiro em caixa — entradas, saídas e depósito no banco (cria 2 registos: saída do cofre + entrada bancária)\n- **Cartão Pré-Pago**: controlo do saldo e movimentos do cartão\n- **Modalidades**: receitas das atividades de sala (Capoeira, Ballet, Judo, Atletismo, etc.)\n- **Eventos**: gestão financeira de eventos (Arraial, Semana Cultural, Motocross, etc.)\n- **Funcionários**: pagamentos de salários e gratificações\n- **Viaturas**: despesas com combustível, seguros e reparações\n- **Agenda**: lembretes e eventos da associação\n- **Análise Financeira**: gráficos e tabela consolidada de todas as fontes (geral + cofre + cartão)\n- **Relatório**: impressão e exportação de relatórios\n- **Configurações**: dados da associação, acessos por PIN, Google Drive, logo\n\nResponde sempre em português de Portugal, de forma clara, concisa e amigável. Quando explicas como fazer algo, usa passos numerados. Não uses markdown complexo — texto simples com emojis quando útil.`,\n        messages: arcaChatHistory\n      })\n    });\n    const data = await resp.json();\n    const resposta = data.content?.[0]?.text || 'Desculpa, não consegui responder. Tenta novamente.';\n\n    arcaChatHistory.push({role:'assistant', content:resposta});\n\n    // Remover typing e mostrar resposta\n    document.getElementById(typingId)?.remove();\n    msgs.innerHTML += `<div style=\"background:#fff;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:92%;white-space:pre-wrap\">${resposta}<\/div>`;\n\n  } catch(e){\n    document.getElementById(typingId)?.remove();\n    msgs.innerHTML += `<div style=\"background:#FEE2E2;border-radius:12px;padding:10px 14px;font-size:12px;color:#991b1b;max-width:85%\">❌ Erro de ligação. Verifica a tua ligação à internet e tenta novamente.<\/div>`;\n  }\n\n  msgs.scrollTop = msgs.scrollHeight;\n  if(btn) btn.disabled = false;\n}\nfunction renderPinStatus(){\n  const hasPin = !!getPinHash();\n  const area = document.getElementById('pin-status-area');\n  if(area) area.innerHTML = hasPin\n    ? `<div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--teal-l);border:0.5px solid #9FE1CB;border-radius:var(--radius);font-size:13px;color:var(--teal-d)\"><span>✅<\/span> Código de acesso <strong>ativo<\/strong><\/div>`\n    : `<div style=\"display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--amber-l);border:0.5px solid #FAC775;border-radius:var(--radius);font-size:13px;color:var(--amber-d)\"><span>⚠<\/span> Sem código de acesso definido — a plataforma está aberta a todos.<\/div>`;\n  const btnSet = document.getElementById('btn-set-pin');\n  const btnRem = document.getElementById('btn-remove-pin');\n  const btnLock = document.getElementById('btn-lock-now');\n  if(btnSet) btnSet.textContent = hasPin ? '🔒 Alterar código' : 'Definir código';\n  if(btnRem) btnRem.style.display = hasPin ? 'inline-flex' : 'none';\n  if(btnLock) btnLock.style.display = hasPin ? 'inline-flex' : 'none';\n}\n\nfunction moveItem(arr, idx, dir, rerender){\n  const other = idx + dir;\n  if(other < 0 || other >= arr.length) return;\n  [arr[idx], arr[other]] = [arr[other], arr[idx]];\n  saveAll(); rerender();\n}\n\nfunction moveCat(key, cat, dir){\n  const cats = config[key];\n  const keys = Object.keys(cats);\n  const idx = keys.indexOf(cat);\n  const other = idx + dir;\n  if(other < 0 || other >= keys.length) return;\n  // Rebuild object with new order\n  const newCats = {};\n  const newKeys = [...keys];\n  [newKeys[idx], newKeys[other]] = [newKeys[other], newKeys[idx]];\n  newKeys.forEach(k => newCats[k] = cats[k]);\n  config[key] = newCats;\n  saveAll();\n  if(key === 'recCats') renderConfigCats('receitas', config.recCats, 'recCats');\n  else renderConfigCats('despesas', config.despCats, 'despCats');\n}\n\nfunction moveSub(key, cat, idx, dir){\n  const arr = config[key][cat];\n  const other = idx + dir;\n  if(other < 0 || other >= arr.length) return;\n  [arr[idx], arr[other]] = [arr[other], arr[idx]];\n  saveAll();\n  if(key === 'recCats') renderConfigCats('receitas', config.recCats, 'recCats');\n  else renderConfigCats('despesas', config.despCats, 'despCats');\n}\n\nfunction renderConfigCats(id, cats, key){\n  const el = document.getElementById('config-' + id + '-content');\n  const catKeys = Object.keys(cats);\n\n  function subRows(cat, subs){\n    return subs.map((s, si) => {\n      const esc = cat.replace(/\\\\/g, '\\\\\\\\').replace(/'/g, \"\\\\'\");\n      return `<div class=\"gestao-item\">\n        <span class=\"gestao-item-name\">${s}<\/span>\n        <div style=\"display:flex;gap:3px;align-items:center\">\n          <button class=\"reorder-btn\" title=\"Subir\" ${si === 0 ? 'disabled' : ''} onclick=\"moveSub('${key}','${esc}',${si},-1)\">▲<\/button>\n          <button class=\"reorder-btn\" title=\"Descer\" ${si === subs.length-1 ? 'disabled' : ''} onclick=\"moveSub('${key}','${esc}',${si},1)\">▼<\/button>\n          <button class=\"btn-danger\" style=\"padding:3px 8px;font-size:11px\" onclick=\"deleteSub('${key}','${esc}',${si})\">✕<\/button>\n        <\/div>\n      <\/div>`;\n    }).join('');\n  }\n\n  let html = '<div style=\"display:flex;flex-direction:column;gap:12px\">';\n  catKeys.forEach((cat, ci) => {\n    const esc = cat.replace(/\\\\/g, '\\\\\\\\').replace(/'/g, \"\\\\'\");\n    const subs = cats[cat];\n    html += `<div class=\"card gestao-section\">\n      <div class=\"gestao-section-title\">\n        <span style=\"font-weight:600\">${cat}<\/span>\n        <div style=\"display:flex;gap:4px;align-items:center\">\n          <button class=\"reorder-btn\" title=\"Subir categoria\" ${ci === 0 ? 'disabled' : ''} onclick=\"moveCat('${key}','${esc}',-1)\">▲<\/button>\n          <button class=\"reorder-btn\" title=\"Descer categoria\" ${ci === catKeys.length-1 ? 'disabled' : ''} onclick=\"moveCat('${key}','${esc}',1)\">▼<\/button>\n          <button class=\"btn-danger\" onclick=\"deleteCategory('${key}','${esc}')\">🗑 Categoria<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"gestao-list\">${subRows(cat, subs)}<\/div>\n      <div class=\"gestao-add-row\">\n        <input type=\"text\" id=\"sub-input-${id}-${ci}\" placeholder=\"Nova subcategoria...\">\n        <button class=\"btn-primary\" style=\"padding:7px 12px;font-size:12px\" onclick=\"addSub('${key}','${esc}','sub-input-${id}-${ci}')\">+<\/button>\n      <\/div>\n    <\/div>`;\n  });\n  html += `<div class=\"card\" style=\"border:2px dashed var(--teal-m);background:var(--teal-l)\">\n    <div style=\"font-size:12px;font-weight:600;color:var(--teal-d);margin-bottom:8px\">+ Nova Categoria<\/div>\n    <div class=\"gestao-add-row\">\n      <input type=\"text\" id=\"newcat-${id}\" placeholder=\"Nome da nova categoria...\">\n      <button class=\"btn-primary\" style=\"padding:7px 12px;font-size:12px\" onclick=\"addCategory('${key}','newcat-${id}')\">Adicionar<\/button>\n    <\/div>\n  <\/div><\/div>`;\n  el.innerHTML = html;\n}\n\nfunction renderConfigMovimentos(){\n  const el = document.getElementById('config-movimentos-content');\n  const items = config.movimentos;\n  const rows = items.map((m, i) => `\n    <div class=\"gestao-item\">\n      <span class=\"gestao-item-name\">${m}<\/span>\n      <div style=\"display:flex;gap:3px;align-items:center\">\n        <button class=\"reorder-btn\" title=\"Subir\" ${i === 0 ? 'disabled' : ''} onclick=\"moveItem(config.movimentos,${i},-1,renderConfigMovimentos)\">▲<\/button>\n        <button class=\"reorder-btn\" title=\"Descer\" ${i === items.length-1 ? 'disabled' : ''} onclick=\"moveItem(config.movimentos,${i},1,renderConfigMovimentos)\">▼<\/button>\n        <button class=\"btn-danger\" style=\"padding:3px 8px;font-size:11px\" onclick=\"deleteMov2(${i})\">✕<\/button>\n      <\/div>\n    <\/div>`).join('');\n  el.innerHTML = `<div class=\"card\">\n    <div class=\"card-title\">Tipos de movimento <span style=\"font-weight:400;color:var(--text-3);font-size:11px\">— usa ▲▼ para reordenar<\/span><\/div>\n    <div class=\"gestao-list\">${rows}<\/div>\n    <div class=\"gestao-add-row\" style=\"margin-top:10px\">\n      <input type=\"text\" id=\"new-mov-input\" placeholder=\"Novo tipo de movimento...\">\n      <button class=\"btn-primary\" onclick=\"addMov2()\">+<\/button>\n    <\/div>\n  <\/div>`;\n}\n\nfunction renderConfigEventos(){\n  const el = document.getElementById('config-eventos-content');\n  const items = config.eventos;\n  const rows = items.map((e, i) => `\n    <div class=\"gestao-item\">\n      <span class=\"gestao-item-name\">${e}<\/span>\n      <div style=\"display:flex;gap:3px;align-items:center\">\n        <button class=\"reorder-btn\" title=\"Subir\" ${i === 0 ? 'disabled' : ''} onclick=\"moveItem(config.eventos,${i},-1,renderConfigEventos)\">▲<\/button>\n        <button class=\"reorder-btn\" title=\"Descer\" ${i === items.length-1 ? 'disabled' : ''} onclick=\"moveItem(config.eventos,${i},1,renderConfigEventos)\">▼<\/button>\n        <button class=\"btn-danger\" style=\"padding:3px 8px;font-size:11px\" onclick=\"deleteEvento(${i})\">✕<\/button>\n      <\/div>\n    <\/div>`).join('');\n  el.innerHTML = `<div class=\"card\">\n    <div class=\"card-title\">Lista de eventos <span style=\"font-weight:400;color:var(--text-3);font-size:11px\">— usa ▲▼ para reordenar<\/span><\/div>\n    <div class=\"gestao-list\">${rows}<\/div>\n    <div class=\"gestao-add-row\" style=\"margin-top:10px\">\n      <input type=\"text\" id=\"new-evento-input\" placeholder=\"Nome do novo evento...\">\n      <button class=\"btn-primary\" onclick=\"addEvento()\">+<\/button>\n    <\/div>\n  <\/div>`;\n}\n\nfunction addCategory(key,inputId){\n  const v=document.getElementById(inputId).value.trim();\n  if(!v){toast('Insere um nome.',false);return;}\n  if(config[key][v]){toast('Já existe.',false);return;}\n  config[key][v]=[];saveAll();renderConfig(key==='recCats'?'receitas':'despesas');toast('Categoria adicionada!');\n}\nfunction deleteCategory(key,cat){\n  if(!confirm(`Eliminar categoria \"${cat}\" e todas as subcategorias?`)) return;\n  delete config[key][cat];saveAll();renderConfig(key==='recCats'?'receitas':'despesas');toast('Eliminado.');\n}\nfunction addSub(key,cat,inputId){\n  const v=document.getElementById(inputId).value.trim();\n  if(!v){toast('Insere um nome.',false);return;}\n  config[key][cat].push(v);saveAll();renderConfig(key==='recCats'?'receitas':'despesas');toast('Sub-categoria adicionada!');\n}\nfunction deleteSub(key,cat,idx){\n  config[key][cat].splice(idx,1);saveAll();renderConfig(key==='recCats'?'receitas':'despesas');toast('Eliminado.');\n}\nfunction addMov2(){\n  const v=document.getElementById('new-mov-input').value.trim();\n  if(!v){toast('Insere um nome.',false);return;}\n  config.movimentos.push(v);saveAll();renderConfigMovimentos();toast('Tipo adicionado!');\n}\nfunction deleteMov2(i){config.movimentos.splice(i,1);saveAll();renderConfigMovimentos();toast('Eliminado.');}\nfunction addEvento(){\n  const v=document.getElementById('new-evento-input').value.trim();\n  if(!v){toast('Insere um nome.',false);return;}\n  config.eventos.push(v);\n  if(!config.recCats['Eventos'].includes(v)) config.recCats['Eventos'].push(v);\n  saveAll();renderConfigEventos();toast('Evento adicionado!');\n}\nfunction deleteEvento(i){config.eventos.splice(i,1);saveAll();renderConfigEventos();toast('Eliminado.');}\n\n// ============================================================\n// CSV & JSON\n// ============================================================\nfunction exportCSV(){\n  const ano=getAno(),mes=getMes();\n  let ms=movimentos.filter(m=>m.ano===ano&&(mes===0||m.mes===mes));\n  const h=['Ano','Mês','Tipo','Movimento','Categoria','Sub','Descrição','Nota','Valor','Conta'];\n  const rows=ms.map(m=>[\n    m.ano,MESES[m.mes-1],m.cat==='receita'?'Receita':'Despesa',\n    m.tipmov||'',m.categoria||'',m.sub||'',m.desc||'',m.nota||'',\n    m.valor.toFixed(2),\n    TIPMOV_CARTAO.includes(m.tipmov)?'Cartão Pré-Pago':m.tipmov==='Numerário'?'Cofre Numerário':'Geral ARCA'\n  ]);\n  const csv=[h,...rows].map(r=>r.map(c=>`\"${String(c).replace(/\"/g,'\"\"')}\"`).join(',')).join('\\n');\n  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\\uFEFF'+encodeURIComponent(csv);a.download=`ARCA_${ano}${mes?'_'+MESES[mes-1]:''}.csv`;a.click();\n}\nfunction exportJSON(){\n  const data={movimentos,recargas,config,exportedAt:new Date().toISOString()};\n  const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));a.download='ARCA_backup.json';a.click();\n}\nfunction importJSON(input){\n  const f=input.files[0];if(!f) return;\n  const r=new FileReader();r.onload=e=>{\n    try{\n      const d=JSON.parse(e.target.result);\n      if(d.movimentos) movimentos=d.movimentos;\n      if(d.recargas) recargas=d.recargas;\n      if(d.config) config=d.config;\n      saveAll();updateYearSelector();updateTopbarSaldo();renderAll();toast('Dados importados!');\n    }catch(err){toast('Ficheiro inválido.',false);}\n  };r.readAsText(f);\n}\nfunction clearAll(){\n  movimentos=[];recargas=[];config=getDefaultConfig();saveAll();updateYearSelector();updateTopbarSaldo();renderAll();toast('Dados apagados.');\n}\n\n// ============================================================\n// LOGO\n// ============================================================\nlet logoImageData=null;\nlet currentLogoData = LS.get('arca_logo') || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHgAAAB4CAIAAAC2BqGFAABLz0lEQVR42uW9d3wU1fo/fsrM9myy6Y0QEkIJJaFDDIoURawgCiqIIoqKKFhBbIgNFbvYRUCRLtIMHaR3CCWhJYT0XjbbZuac8/vj7E5mNwnivd77ua/vb9wXTmZnd2fe85z3U89zIGMM/E9uzLfxffWgegKEUN3h++rO/+AG/3eAZoxRSvn1YIz/NcgopZRSDjpC6H8H9/9joFVwmyOrKEpFRUVZWVlZWVlFRUV1dbXdbne5XIQQAIAgCEaj0Wq1hoaGRkZGRkdHx8TEREREYIwDvp8Q8r8A+v8N0FzuEEIIIfVgeXn5yZMnDx06dOzYsdzc3LKyssbGRgCATqczmUxms9loNOr1ev5IZFn2eDwul8vhcDidTkmSEEIWiyU2NrZTp049e/bs27dvWlpaeHi4+v2EkBaf6P+DQHP55czAj1RXV+/cuXPjxo27d+8uKChACMXHx3fp0qV79+6pqalJSUkxMTGhoaFms/kqX9vY2FhTU1NcXJyXl3fmzJns7OyzZ8+WlJQAAJKSkm644YYRI0YMHDgwJCRERRwA8F+W8f8S0HwIC4LA/ywuLv7tt9+WLVt25MgRhFB6evrQoUMHDRrUvXv3sLCwq+jGgIPaARGwVVZWHj9+fMeOHdu2bTt16hRCqF+/fvfdd9+dd94ZGRmpstN/T8DZf3gjhCiKwvc9Hs/SpUsHDx4simJ4ePj48ePXrl1bV1enPZ9SKsuyLMuKohBCCCHUt7X4/fwt/ivqBwPOqaqqWrly5ZgxY2w2m16vHz58+Jo1aziTMMb4D/2ncQD/HYgLCwtnzJgRFham0+lGjhy5YcMGSZK0Z3KAVDS1O4pCtEcCTmhto5Ry6LUgulyu3377bcSIEYIgxMTEvPHGG+Xl5Srcf/md/3NA85vk++fOnZswYQLGOCEh4f3336+oqFBP04JLKSWt3yc/59rlTlGIrJFrfj1aSS8uLp49e3Z0dLRer3/88ccLCgrUS/oPwf3PA63eT0FBwYQJEwAA3bt3X758ufaEAOHlMqtuHkl2ON0c94PZ5z/4cQ1jbNxLn5y5WMgYk2SFMbbgt+3HzuYxxgihf1cC1CtUFGXhwoUdO3bEGD/xxBOlpaUBt/A/CrQqyA6HY8aMGYIgdOnS5ffff9eKcGvyUt/gOHupkKOWtef4w7O+YIwphJRX13W6berCtTv7jn3JI8lc8BVCwjImvPLZEsZYgOQyxorLq0c/Pfetr1c43R7KGG3lUmVZVv9cunRpcnKywWCYM2cO57R/nEnAPy7Iy5cvj4qKioyM/Omnn7QPQHvdVLMVlFSOfnpux2GTZ8/3Sv3FgtLMcbOIT9J/3bgbthsx5+sVjDGXW2KM/bxuV7c7nhk+eY4k+32trBDG2OK1O3vf/dw3yzfbHS7WDGhFIbKsEB9faS/syy+/DA4Obtu27YYNG/5x0Qb/oCCXlJTcfvvtAIDnnnvO4XAEkHVzPcblt7rOvnrz/r5jXqy3O70fIWTg+FmXiyu4UBNKO4+Ysu1ANpdft <option value=\"\">Todas as categorias<\/option>'+cats.map(c=>`<option value=\"${c}\">${c}<\/option>`).join('');\n  onRelPeriodoChange();\n  buildRelPreview();\n}\n\nfunction onRelPeriodoChange(){\n  const p=document.getElementById('rel-periodo').value;\n  document.getElementById('rel-ano-wrap').style.display=p==='total'?'none':'block';\n  document.getElementById('rel-mes-wrap').style.display=(p==='mes'||p==='semana')?'block':'none';\n  document.getElementById('rel-semana-wrap').style.display=p==='semana'?'block':'none';\n  document.getElementById('rel-custom-wrap').style.display=p==='custom'?'block':'none';\n  document.getElementById('rel-custom-wrap2').style.display=p==='custom'?'block':'none';\n  buildRelPreview();\n}\n\nfunction getRelMovimentos(){\n  const p=document.getElementById('rel-periodo').value;\n  const ano=parseInt(document.getElementById('rel-ano').value)||getAno();\n  const mes=parseInt(document.getElementById('rel-mes-sel').value)||0;\n  const sem=parseInt(document.getElementById('rel-semana').value)||1;\n  const tipo=document.getElementById('rel-tipo').value;\n  const cat=document.getElementById('rel-cat').value;\n  const ordem=document.getElementById('rel-ordem').value;\n\n  let ms=[...movimentos];\n\n  if(p==='total'){\n    // all data\n  } else if(p==='ano'){\n    ms=ms.filter(m=>m.ano===ano);\n  } else if(p==='mes'){\n    ms=ms.filter(m=>m.ano===ano&&(mes===0||m.mes===mes));\n  } else if(p==='semana'){\n    // We approximate week by splitting month into 4 blocks\n    // Since we don't store the day, we'll filter by month and note week\n    ms=ms.filter(m=>m.ano===ano&&(mes===0||m.mes===mes));\n    // tag each with a pseudo-week based on order in month\n    // Actually: show all for the month, grouped by week label in output\n  } else if(p==='custom'){\n    const ini=document.getElementById('rel-data-ini').value;\n    const fim=document.getElementById('rel-data-fim').value;\n    if(ini&&fim){\n      const iniD=new Date(ini+'T00:00:00'), fimD=new Date(fim+'T23:59:59');\n      ms=ms.filter(m=>{\n        const d=new Date(m.ano+'-'+String(m.mes).padStart(2,'0')+'-01');\n        return d>=iniD&&d<=fimD;\n      });\n    }\n  }\n  if(tipo) ms=ms.filter(m=>m.cat===tipo);\n  if(cat) ms=ms.filter(m=>m.categoria===cat);\n  if(ordem==='cat') ms.sort((a,b)=>a.categoria.localeCompare(b.categoria)||b.valor-a.valor);\n  else if(ordem==='valor') ms.sort((a,b)=>b.valor-a.valor);\n  else ms.sort((a,b)=>a.ano-b.ano||a.mes-b.mes||b.id-a.id);\n  return ms;\n}\n\nfunction getRelLabel(){\n  const p=document.getElementById('rel-periodo').value;\n  const ano=parseInt(document.getElementById('rel-ano').value)||getAno();\n  const mes=parseInt(document.getElementById('rel-mes-sel').value)||0;\n  const sem=parseInt(document.getElementById('rel-semana').value)||1;\n  const semRanges=['1–7','8–14','15–21','22–31'];\n  if(p==='total') return 'Total — Todos os Períodos';\n  if(p==='ano') return `Ano ${ano}`;\n  if(p==='mes') return mes?`${MESES[mes-1]} ${ano}`:`Ano ${ano} — todos os meses`;\n  if(p==='semana') return mes?`Semana ${sem} (dias ${semRanges[sem-1]}) — ${MESES[mes-1]} ${ano}`:`Semana ${sem} — ${ano}`;\n  const ini=document.getElementById('rel-data-ini').value;\n  const fim=document.getElementById('rel-data-fim').value;\n  return ini&&fim?`${ini} a ${fim}`:'Intervalo personalizado';\n}\n\nfunction buildRelPreview(){\n  const ms=getRelMovimentos();\n  const label=getRelLabel();\n  const incMov=document.getElementById('rel-inc-movimentos').checked;\n  const incFluxo=document.getElementById('rel-inc-fluxo').checked;\n  const incResumo=document.getElementById('rel-inc-resumo').checked;\n\n  // Split: geral vs cartão\n  const msGeral =ms.filter(m=>!TIPMOV_CARTAO.includes(m.tipmov)&&m.tipmov!=='Numerário');\n  const msCartao=ms.filter(m=>TIPMOV_CARTAO.includes(m.tipmov));\n  const msCofre =ms.filter(m=>m.tipmov==='Numerário');\n\n  const totRecG=msGeral.filter(m=>m.cat==='receita').reduce((s,m)=>s+m.valor,0);\n  const totDespG=msGera       <div style=\"font-size:12px;display:flex;justify-content:space-between;border-top:1px solid #dde;margin-top:6px;padding-top:6px\"><span>Saldo:<\/span><strong style=\"color:${totRecC-totDespC>=0?'#085041':'#712B13'}\">${fmt(totRecC-totDespC)}<\/strong><\/div>\n    <\/div>\n    <div style=\"border:1.5px solid #BA7517;border-radius:8px;padding:12px 14px;background:#FDFAF0\">\n      <div style=\"font-size:11px;font-weight:700;color:#BA7517;margin-bottom:6px\">🏦 Cofre Numerário<\/div>\n      <div style=\"font-size:11px;color:#666;margin-bottom:6px;font-style:italic\">Dinheiro físico — não duplica<\/div>\n      <div style=\"font-size:12px;display:flex;justify-content:space-between\"><span>Entradas:<\/span><strong style=\"color:#085041\">${fmt(msCofre.filter(m=>m.cat==='receita').reduce((s,m)=>s+m.valor,0))}<\/strong><\/div>\n      <div style=\"font-size:12px;display:flex;justify-content:space-between\"><span>Saídas:<\/span><strong style=\"color:#712B13\">${fmt(msCofre.filter(m=>m.cat==='despesa').reduce((s,m)=>s+m.valor,0))}<\/strong><\/div>\n      <div style=\"font-size:12px;display:flex;justify-content:space-between;border-top:1px solid #e8d87a;margin-top:6px;padding-top:6px\"><span>Saldo cofre:<\/span><strong style=\"color:#BA7517\">${fmt(getSaldoCofre())}<\/strong><\/div>\n    <\/div>\n  <\/div>`;\n\n  function buildPrintTable(rows, title, bgColor){\n    if(!rows.length) return '';\n    let h=`<h3 style=\"font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #ddd;padding-bottom:5px;margin:16px 0 8px\">${title}<\/h3>`;\n    h+=`<table style=\"width:100%;border-collapse:collapse;font-size:10px\">\n      <thead><tr style=\"background:${bgColor||'#E1F5EE'}\">\n        ${['Ano','Mês','Tipo','Categoria','Sub.','Descrição','Movimento','Valor'].map((t,i)=>`<th style=\"padding:5px 6px;text-align:${i===7?'right':'left'};font-weight:600;color:#333\">${t}<\/th>`).join('')}\n      <\/tr><\/thead><tbody>`;\n    rows.for
