) body.password=pass;\n  if(!body.email && !body.password){ toast('Nada para alterar.',false); return; }\n  try{ await fetch(`${SUPA_URL}/auth/v1/user`,{ method:'PUT', headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+supaSession.access_token}, body:JSON.stringify(body) }).then(async r=>{ const j=await r.json(); if(!r.ok) throw new Error(j.msg||j.error_description||'Falha.'); return j; });\n    toast('Acesso atualizado.'); renderDefinicoes();\n  }catch(e){ toast(e.message||'Falha ao atualizar.',false); }\n}\n\n/* ============================================================\n   MODAL genérico\n   ============================================================ */\nfunction modal(title, bodyHTML, botoes){\n  $('ov-title').textContent=title; $('ov-body').innerHTML=bodyHTML;\n  const foot=$('ov-foot'); foot.innerHTML='';\n  (botoes||[]).filter(Boolean).forEach(b=>{ const btn=document.createElement('button'); btn.className='btn-sm '+(b.cls||'btn-neutral'); btn.textContent=b.txt; btn.onclick=b.fn; foot.appendChild(btn); });\n  const cancel=document.createElement('button'); cancel.className='btn-sm btn-neutral'; cancel.textContent='Cancelar'; cancel.onclick=fecharModal; foot.appendChild(cancel);\n  $('ov').classList.add('open'); document.body.classList.add('modal-aberto');\n}\nfunction fecharModal(){ $('ov').classList.remove('open'); document.body.classList.remove('modal-aberto'); _modalCriancaNovo=false; }\n// clicar fora NÃO fecha (evita perder o que se está a escrever) — só fecha no × ou em Cancelar\n$('ov').addEventListener('click', e=>{ if(e.target.id==='ov'){ const t=$('toast'); t.textContent='Usa \"Cancelar\" ou o × para fechar (assim não perdes o que escreveste).'; t.className='show'; clearTimeout(_toastT); _toastT=setTimeout(()=>t.className='',2600); } });\nfunction __pendentes(){ return _fila; }\n<\/script>\n<\/body>\n<\/html>\n";

family:inherit}\n.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}\n.nav-item:hover{background:var(--bg2);color:var(--text);padding-left:20px}\n.nav-item:hover svg{opacity:1}\n.nav-item.active{background:linear-gradient(90deg,var(--teal-l) 0%,transparent 100%);color:var(--teal);font-weight:600}\n.nav-item.active svg{opacity:1;color:var(--teal)}\n.nav-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--teal);border-radius:0 3px 3px 0}\n.nav-badge{margin-left:auto;background:var(--coral);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;min-width:18px;text-align:center}\n.nav-badge.amber{background:var(--amber)}\n.nav-badge.blue{background:var(--blue)}\n.sidebar-footer{margin-top:auto;padding:10px 14px;border-top:0.5px solid var(--border-c);background:var(--bg);position:sticky;bottom:0}\n.sidebar-saldos{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:10px}\n.sidebar-saldo-card{background:var(--bg2);border-radius:6px;padding:6px 8px;text-align:left;border:0.5px solid var(--border-c)}\n.sidebar-saldo-card.cartao{background:linear-gradient(135deg,#E8F1FB,#F4F8FD)}\n.sidebar-saldo-card.cofre{background:linear-gradient(135deg,#FDF6E8,#FBF8F0)}\n.sidebar-saldo-label{font-size:9px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}\n.sidebar-saldo-value{font-size:12px;font-weight:700;margin-top:1px}\n.sidebar-actions{display:flex;gap:5px;justify-content:center}\n.sidebar-action-btn{background:none;border:0.5px solid var(--border-c);font-size:11px;color:var(--text-2);cursor:pointer;padding:5px 9px;border-radius:5px;transition:all .12s;display:flex;align-items:center;gap:4px}\n.sidebar-action-btn:hover{background:var(--bg2);color:var(--text);border-color:var(--text-3)}\n.sidebar-action-btn.lock:hover{color:var(--coral-d);border-color:var(--coral)}\n/* legacy nav rules removed — using new sidebar styles above */\n\n/* MAIN */\n.main{flex:1;overflow-y:auto;padding:22px}\n.page{display:none}\n.page.active{display:block}\n.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}\n.page-title{font-size:20px;font-weight:700;color:var(--text)}\n.page-sub{font-size:12px;color:var(--text-3);margin-top:3px}\n.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n\n/* BUTTONS */\n.btn-primary{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--teal);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;transition:opacity .15s;white-space:nowrap}\n.btn-primary:hover{opacity:.88}\n.btn-secondary{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--bg);color:var(--text-2);border:var(--border);border-radius:var(--radius);font-size:13px;transition:background .12s;white-space:nowrap}\n.btn-secondary:hover{background:var(--bg2)}\n.btn-blue{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;transition:opacity .15s;white-space:nowrap}\n.btn-blue:hover{opacity:.88}\n.btn-danger{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;background:transparent;color:var(--coral);border:0.5px solid var(--coral);border-radius:var(--radius);font-size:12px;transition:background .12s}\n.btn-danger:hover{background:var(--coral-l)}\n.btn-edit{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;background:transparent;color:var(--text-2);border:var(--border);border-radius:var(--radius);font-size:12px;transition:background .12s}\n.btn-edit:hover{background:var(--bg2)}\n.btn-print{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;background:transparent;color:var(--blue);border:0.5px solid var(--blue);border-radius:var(--radius);font-size:12px;transition:background .12s}\n.btn-print:hover{background:var(--blue-l)}\n\n/* CARDS */\n.card{background:var(--bg);border:var(--border);border-radius:var(--radius-lg);padding:18px;transition:box-shadow .15s}\n.card-title{font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}\n\n/* METRICS */\n.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}\n.metric-card{background:var(--bg);border:var(--border);border-radius:var(--radius-lg);padding:15px;transition:box-shadow .15s,transform .15s}\n.metric-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px)}\n.metric-label{font-size:10px;color:var(--text-3);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}\n.metric-value{font-size:22px;font-weight:700;color:var(--text)}\n.metric-sub{font-size:11px;color:var(--text-3);margin-top:4px}\n.green{color:var(--teal-d)}.red{color:var(--coral-d)}.blue{color:var(--blue)}\n\n/* CHARTS */\n.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}\n.chart-wrap{position:relative;width:100%;height:220px}\n.chart-wrap-sm{position:relative;width:100%;height:160px}\n\n/* TABLES */\n.table-wrap{overflow-x:auto}\ntable{width:100%;border-collapse:collapse;font-size:13px}\nth{text-align:left;padding:9px 11px;color:var(--text-3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:var(--border);white-space:nowrap;background:var(--bg2)}\ntd{padding:9px 11px;border-bottom:var(--border);color:var(--text);vertical-align:middle}\ntr:last-child td{border-bottom:none}\ntbody tr:hover td{background:var(--bg2)}\n.td-actions{white-space:nowrap;display:flex;gap:4px}\n\n/* BADGES */\n.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}\n.badge-rec{background:var(--teal-l);color:var(--teal-d)}\n.badge-desp{background:var(--coral-l);color:var(--coral-d)}\n.badge-mov{background:var(--amber-l);color:var(--amber-d);font-size:10px}\n.badge-cartao{background:var(--blue-l);color:var(--blue);font-size:10px}\n\n/* FILTERS */\n.filters-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;padding:12px 14px;background:var(--bg);border:var(--border);border-radius:var(--radius-lg)}\n.filter-select,.filter-input{padding:7px 10px;border-radius:var(--radius);border:var(--border);background:var(--bg2);font-size:13px;color:var(--text)}\n.filter-input{min-width:160px}\n\n/* MODAL */\n.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px}\n.modal-overlay.open{display:flex}\n.modal{background:var(--bg);border-radius:var(--radius-lg);padding:24px;width:560px;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}\n.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}\n.modal-title{font-size:16px;font-weight:600}\n.modal-close{background:none;border:none;font-size:22px;color:var(--text-3);line-height:1;padding:2px 6px;border-radius:var(--radius);cursor:pointer}\n.modal-close:hover{background:var(--bg2);color:var(--text)}\n.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:var(--border)}\n\n/* FORMS */\n.form-grid{display:grid;gap:13px}\n.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}\n.form-group{display:flex;flex-direction:column;gap:5px}\n.form-group label{font-size:12px;font-weight:500;color:var(--text-2)}\n.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border-radius:var(--radius);border:var(--border);background:var(--bg2);font-size:13px;color:var(--text);width:100%;transition:border-color .12s}\n.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--teal);background:var(--bg)}\n.form-group textarea{resize:vertical;min-height:64px}\n.hint{font-size:11px;color:var(--text-3);margin-top:2px}\n\n/* TIPO TOGGLE */\n.tipo-toggle{display:flex;border:var(--border);border-radius:var(--radius);overflow:hidden}\n.tipo-btn{flex:1;padding:9px;border:none;background:var(--bg);font-size:13px;color:var(--text-2);font-weight:500;transition:all .15s}\n.tipo-btn.rec{background:var(--teal-l);color:var(--teal)}\n.tipo-btn.desp{background:var(--coral-l);color:var(--coral)}\n\n/* SHARE */\n.share-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}\n.share-btn{padding:4px 10px;border:var(--border);border-radius:20px;font-size:11px;background:var(--bg);cursor:pointer;transition:all .12s}\n.share-btn:hover,.share-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}\n\n/* GESTÃO LISTS */\n.gestao-list{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}\n.gestao-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg2);border-radius:var(--radius);font-size:13px}\n.gestao-item-name{flex:1}\n.reorder-btn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text-2);font-size:11px;cursor:pointer;transition:background .12s;padding:0}\n.reorder-btn:hover:not([disabled]){background:var(--teal-l);color:var(--teal);border-color:var(--teal-m)}\n.reorder-btn[disabled]{opacity:.3;cursor:not-allowed}\n.gestao-add-row{display:flex;gap:8px;margin-top:10px}\n.gestao-add-row input{flex:1;padding:8px 10px;border:var(--border);border-radius:var(--radius);background:var(--bg);font-size:13px}\n.gestao-add-row input:focus{outline:none;border-color:var(--teal)}\n.gestao-section{margin-bottom:16px}\n.gestao-section-title{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}\n\n/* CARTAO */\n.cartao-widget{background:linear-gradient(135deg,#185FA5,#0c447c);border-radius:var(--radius-lg);padding:20px;color:#fff;margin-bottom:16px}\n.cartao-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}\n.cartao-label{font-size:11px;opacity:.7;letter-spacing:.5px;text-transform:uppercase}\n.cartao-saldo{font-size:32px;font-weight:700;margin-top:4px}\n.cartao-bottom{display:flex;gap:12px;font-size:12px;opacity:.8}\n.cartao-historico{font-size:12px}\n\n/* TABS dentro de páginas */\n.inner-tabs{display:flex;gap:6px;margin-bottom:14px}\n.inner-tab{padding:6px 14px;font-size:12px;border-radius:20px;border:var(--border);background:var(--bg);color:var(--text-2);cursor:pointer;transition:all .15s}\n.inner-tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}\n.inner-panel{display:none}.inner-panel.active{display:block}\n\n/* TOAST */\n.toast{position:fixed;bottom:24px;right:24px;background:var(--teal);color:#fff;padding:12px 20px;border-radius:var(--radius-lg);font-size:13px;font-weight:500;z-index:400;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none}\n.toast.show{opacity:1;transform:translateY(0)}\n\n/* LOGO MODAL */\n.logo-preview-area{text-align:center;padding:20px 0}\n.logo-preview-area img{max-height:120px;max-width:100%;border-radius:var(--radius-lg);object-fit:contain}\n.logo-drop{border:2px dashed #ccc;border-radius:var(--radius-lg);padding:24px;text-align:center;cursor:pointer;transition:border-color .15s;background:var(--bg2)}\n.logo-drop:hover{border-color:var(--teal)}\n.logo-drop p{font-size:12px;color:var(--text-3);margin-top:6px}\n\n/* FLUXO TABLE */\n.fluxo-table th:nth-child(n+2){text-align:right}\n.fluxo-table td:nth-child(n+2){text-align:right;font-size:12px;font-variant-numeric:tabular-nums}\n.fluxo-total td{font-weight:700;background:var(--teal-l)}\n.fluxo-desp td{background:#FFF8F6}\n\n/* EMPTY */\n.empty-state{text-align:center;padding:44px 20px;color:var(--text-3)}\n.empty-state p{font-size:13px}\n\n/* SECTION DIVIDER */\n.section-divider{height:1px;background:var(--bg3);margin:16px 0}\n\n@media(max-width:768px){\n  .sidebar{display:none}\n  .charts-row{grid-template-columns:1fr}\n  .form-row{grid-template-columns:1fr}\n  .metrics-grid{grid-template-columns:1fr 1fr}\n  .topbar{height:auto;padding:10px 14px;flex-wrap:wrap}\n}\n\n/* ===================== RENOVAÇÃO VISUAL (set/2026) — igual às apps Sócios e Ofícios ===================== */\nbody{background:#F3F5F8}\n.topbar{background:linear-gradient(90deg,#1B4570 0%,#2E6199 60%,#2F7A8F 100%);border-bottom:none;box-shadow:0 3px 12px rgba(27,69,112,.28);height:64px}\n.topbar .logo-text{color:#fff;font-size:16px}\n.topbar .logo-sub{color:rgba(255,255,255,.75)}\n.topbar .logo-badge{background:#fff;color:#1B4570;box-shadow:0 2px 8px rgba(0,0,0,.2);border-radius:50%}\n.logo-img,.logo-edit-overlay{border-radius:50%}\n.topbar #role-badge{background:rgba(255,255,255,.15)!important;color:#fff!important;border-color:rgba(255,255,255,.4)!important}\n.topbar #btn-arca-chat{background:linear-gradient(135deg,#83BEDD 0%,color-mix(in srgb,#83BEDD 55%,#fff) 100%)!important;color:#2B3440!important;border:none!important;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.18)}\n.topbar .card-saldo{border:none!important;box-shadow:0 2px 6px rgba(0,0,0,.18)}\n.topbar .mes-sel,.topbar .year-sel{border:none;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.18)}\n\n/* Menu lateral: botões coloridos em degradê como nas outras apps */\n.sidebar{background:#fff;border-right:0.5px solid #dfe3e8;padding-bottom:8px}\n.sidebar-nav{display:flex;flex-direction:column;gap:clamp(5px,1vh,8px);padding:6px 10px}\n.nav-label{padding:clamp(6px,1.2vh,10px) 6px 2px}\n.nav-label::after{display:none}\n.nav-item{--c:#1B4570;border-radius:9px;background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 72%,#fff) 100%);color:#fff!important;font-weight:700;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;box-shadow:0 3px 9px color-mix(in srgb,var(--c) 45%,transparent);padding:clamp(7px,1.2vh,10px) 12px;transition:transform .12s,filter .12s;position:relative}\n.nav-item svg{opacity:1;color:#fff;background:rgba(255,255,255,.22);border-radius:6px;padding:3px;width:22px;height:22px}\n.nav-item:hover{transform:translateX(3px);filter:brightness(1.08);background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 72%,#fff) 100%);color:#fff;padding-left:12px}\n.nav-item.active{background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 72%,#fff) 100%);color:#fff;font-weight:700;transform:translateX(3px);outline:1.5px solid color-mix(in srgb,var(--c) 55%,#0E1A26)}\n.nav-item.active::before{display:none}\n.nav-item.active svg{background:rgba(255,255,255,.38);color:#fff}\n.nav-item.nav-geral{--c:#1B4570;background:linear-gradient(135deg,#1B4570,#2E6199 60%,#2F7A8F)!important;font-size:12.5px}\n@media(max-height:940px){.nav-item.nav-geral{grid-column:1/-1;font-size:10px}}\n.nav-item[onclick*=\"'dashboard'\"]{--c:#6C4BB6}\n.nav-item[onclick*=\"'lancamentos'\"]{--c:#2F5F9E}\n.nav-item[onclick*=\"'fluxo'\"]{--c:#1F8FC8}\n.nav-item[onclick*=\"'cartao'\"]{--c:#B8863B}\n.nav-item[onclick*=\"'cofre'\"]{--c:#E0703A}\n.nav-item[onclick*=\"'modalidades'\"]{--c:#15A38F}\n.nav-item[onclick*=\"'eventos'\"]{--c:#C2437B}\n.nav-item[onclick*=\"'funcionarios'\"]{--c:#4A6A85}\n.nav-item[onclick*=\"'viaturas'\"]{--c:#5B6770}\n.nav-item[onclick*=\"'analise'\"]{--c:#0F6E56}\n.nav-item[onclick*=\"'relatorio'\"]{--c:#1B4570}\n.nav-item[onclick*=\"'agenda'\"]{--c:#2FA89B}\n.nav-item[onclick*=\"'gestao-config'\"]{--c:#A2762F}\n.sidebar::-webkit-scrollbar{display:none}\n.sidebar{scrollbar-width:none}\n\n/* Conteúdo */\n.main{padding:22px 24px}\n.page-title{font-size:23px;letter-spacing:-.2px}\n.card{border:none;box-shadow:0 1px 3px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.05)}\n.card:hover{box-shadow:0 2px 6px rgba(16,24,40,.08),0 10px 24px rgba(16,24,40,.08)}\n.metric-card{border:none;box-shadow:0 1px 3px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.05);position:relative;overflow:hidden}\n.metric-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#1FA7DA}\n.metric-card:nth-child(2)::before{background:#12B8A4}.metric-card:nth-child(3)::before{background:#E8752E}\n.metric-card:nth-child(4)::before{background:#6C4BB6}.metric-card:nth-child(5)::before{background:#B8863B}\n.metric-card:nth-child(6)::before{background:#C2437B}.metric-card:nth-child(7)::before{background:#1B4A8F}.metric-card:nth-child(8)::before{background:#5CC9C0}\n.btn-primary{background:linear-gradient(135deg,#1B4570,#2E6199);box-shadow:0 3px 10px rgba(27,69,112,.28);border-radius:9px;font-weight:600}\n.btn-primary:hover{opacity:1;filter:brightness(1.08)}\n.btn-secondary{border-radius:9px;box-shadow:0 1px 2px rgba(16,24,40,.05)}\n.inner-tab{--c:#A995D2;color:#2B3440;border-radius:9px;padding:8px 15px;font-weight:700;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;border:none;background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 55%,#fff) 100%);box-shadow:0 1px 4px rgba(0,0,0,.08)}\n.inner-tab.active{color:#1E2833;background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 55%,#fff) 100%);border:none;outline:1.5px solid color-mix(in srgb,var(--c) 45%,#1E2833)}\n.inner-tabs{flex-wrap:wrap;gap:8px}\n.inner-tabs .inner-tab:nth-child(1){--c:#A995D2}.inner-tabs .inner-tab:nth-child(2){--c:#83BEDD}.inner-tabs .inner-tab:nth-child(3){--c:#7CCBB9}\n.inner-tabs .inner-tab:nth-child(4){--c:#E9A27A}.inner-tabs .inner-tab:nth-child(5){--c:#9DD6CD}.inner-tabs .inner-tab:nth-child(6){--c:#7F9CC4}\n.inner-tabs .inner-tab:nth-child(7){--c:#D4B27A}.inner-tabs .inner-tab:nth-child(8){--c:#D99DB7}\nth{background:linear-gradient(180deg,#F7F9FC,#EEF2F7);color:#4A5568;font-weight:700;border-bottom:1px solid #E1E6ED}\ntbody tr:hover td{background:#F5F9FF}\n.filter-select:focus,.filter-input:focus,input:focus,select:focus,textarea:focus{outline:none;border-color:#2E6199!important;box-shadow:0 0 0 3px rgba(46,97,153,.15)}\n\n/* Navegação em telemóvel (a barra lateral desaparece) */\n.fin-mobile-nav{display:none;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;-webkit-overflow-scrolling:touch}\n.fin-mobile-nav button,.fin-mobile-nav .mn-a{--c:#1B4570;flex-shrink:0;border:none;border-radius:9px;padding:8px 12px;font-weight:700;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--c) 0%,color-mix(in srgb,var(--c) 72%,#fff) 100%);box-shadow:0 2px 6px rgba(0,0,0,.15)}\n.fin-mobile-nav button.mn-active{outline:1.5px solid color-mix(in srgb,var(--c) 55%,#0E1A26)}\n@media(max-width:768px){.fin-mobile-nav{display:flex}.main{padding:14px 12px}.topbar{height:auto}}\n/* Ecrãs baixos: menu em 2 colunas para caber tudo sem scroll */\n/* Dashboard: cartões de métricas sempre numa só linha, adaptam-se à largura */\n#dash-metrics{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;overflow:hidden}\n#dash-metrics .metric-card{min-width:0;padding:13px 12px}\n#dash-metrics .metric-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9.5px}\n#dash-metrics .metric-value{font-size:clamp(15px,1.7vw,24px);white-space:nowrap}\n#dash-metrics .metric-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}\n@media(max-width:768px){#dash-metrics{gap:7px}#dash-metrics .metric-card{padding:10px 8px}#dash-metrics .metric-label{font-size:8px}#dash-metrics .metric-sub{display:none}}\n/* Cabeçalho: todos os elementos com o mesmo formato (altura 40px, raio 10px) */\n.topbar-right{gap:8px;align-items:center}\n.topbar-right>*{height:40px!important;border-radius:10px!important;box-sizing:border-box}\n.topbar #btn-arca-chat{display:inline-flex;align-items:center;gap:6px;padding:0 14px!important;font-size:12px!important;font-weight:700;letter-spacing:.3px;text-transform:uppercase}\n.topbar #role-badge{display:inline-flex;align-items:center;padding:0 14px!important;font-size:11px!important;f gação) */\n#cloud-estado{width:36px;padding:0!important;justify-content:center;background:rgba(255,255,255,.14)!important;font-size:21px!important;line-height:1}\n.top-cfg{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}\n.top-cfg:hover{background:rgba(255,255,255,.28)}\n.logo-wrap{gap:10px!important}\n.logo-container,.logo-badge,.logo-img{width:46px!important;height:46px!important;max-width:46px!important;max-height:46px!important;font-size:14px!important}\n.topbar .logo-text{font-size:19px!important;font-weight:800!important;line-height:1.1}\n.topbar .logo-sub{display:block!important;font-size:12.5px!important;margin-top:2px!important;color:rgba(255,255,255,.88)!important;font-weight:600}\n.app-body{flex-direction:column!important}\n.sidebar{width:auto!important;height:auto!important;position:sticky!important;top:68px!important;flex-direction:row!important;overflow:visible!important;padding:7px 12px!important;border-right:0!important;border-bottom:1px solid #dfe3e8;z-index:90;box-shadow:0 5px 12px rgba(20,50,90,.12);background:#fff}\n.sidebar-nav{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;gap:5px!important;padding:0!important;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}\n.sidebar-nav::-webkit-scrollbar{display:none}\n.nav-item{flex:1 1 auto!important;display:inline-flex!important;align-items:center;justify-content:center;text-align:center;box-sizing:border-box;height:34px;font-size:11.5px!important;letter-spacing:0!important;text-transform:none!important;padding:0 11px!important;white-space:nowrap;transform:none!important;width:auto!important;margin:0!important}\n.nav-item svg{display:none!important}\n.nav-item:hover,.nav-item.active{transform:none!important;padding:0 11px!important;margin:0!important}\n.main{padding:16px 20px!important;overflow:visible!important}\n/* botão flutuante \"+ Lançamento\" (some quando a ficha de lançamento está aberta) */\n#fab-lanc{position:fixed;right:22px;bottom:20px;z-index:150;border:0;border-radius:999px;padding:13px 20px;font:700 14px/1 inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,#E0703A,#C2437B);box-shadow:0 8px 22px rgba(194,67,123,.4);cursor:pointer;display:inline-flex;align-items:center;gap:6px}\n#fab-lanc:hover{filter:brightness(1.07)}\nbody.fab-off #fab-lanc{display:none!important}\n@media print{#fab-lanc,.top-cfg{display:none!important}}\n@media(max-width:768px){.top-cfg{order:1;margin-left:auto}.topbar-right{order:2}.topbar{height:auto!important;padding:6px 8px!important;flex-wrap:wrap!important}.logo-container,.logo-badge,.logo-img{width:36px!important;height:36px!important;max-width:36px!important;max-height:36px!important}.topbar .logo-text{font-size:15px!important}.topbar .logo-sub{font-size:11px!important}.topbar-right{flex-wrap:nowrap!important;overflow-x:auto;width:100%;scrollbar-width:none}.topbar-right>*{flex:0 0 auto}.main{padding:12px 10px!important}.sidebar{top:0!important;position:static!important}#fab-lanc{right:12px;bottom:12px;padding:12px 16px}}\n<\/style>\n<\/head>\n<body>\n<!-- LOGIN CLOUD (mesma conta das outras apps) -->\n<div id=\"fin-login-overlay\" style=\"position:fixed;inset:0;background:linear-gradient(135deg,#12314F,#1B4570);z-index:10000;display:none;align-items:center;justify-content:center;padding:16px\">\n  <div style=\"background:#fff;border-radius:16px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)\">\n    <div id=\"fin-login-logo\" style=\"display:flex;justify-content:center;margin-bottom:10px\"><\/div>\n    <div style=\"text-align:center;font-size:13px;font-weight:700;color:#1B4570;letter-spacing:.5px;text-transform:uppercase\">ARCA d'Ajuda<\/div>\n    <div style=\"text-align:center;font-size:19px;font-weight:700;margin:4px 0 18px\">Contro ght\">\n  <span id=\"cloud-estado\" title=\"Estado da sincronização com a cloud\" style=\"display:inline-flex;align-items:center;gap:6px;padding:0 12px;background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:700;letter-spacing:.3px;cursor:default;white-space:nowrap\">☁️ …<\/span>\n  <button onclick=\"toggleArcaChat()\" id=\"btn-arca-chat\" style=\"padding:6px 14px;border-radius:20px;border:0.5px solid var(--teal-m);background:var(--teal-l);color:var(--teal-d);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px\" title=\"Assistente ARCA — ajuda de utilização\">\n    🤖 Ajuda\n  <\/button>\n    <span id=\"role-badge\" style=\"font-size:11px;font-weight:600;color:var(--teal);padding:4px 10px;border:0.5px solid var(--teal-m);border-radius:20px;background:var(--teal-l)\">Administrador<\/span>\n    <div class=\"card-saldo\" onclick=\"showPage('cofre',document.querySelector('.nav-item[onclick*=\\'cofre\\']'))\" title=\"Cofre — clica para gerir\" style=\"background:var(--amber-l);border-color:#FAC775\">\n      <div>\n        <div class=\"card-saldo-label\" style=\"color:var(--amber)\">🏦 Cofre<\/div>\n        <div class=\"card-saldo-value\" id=\"topbar-saldo-cofre\" style=\"color:var(--amber)\">€0,00<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"card-saldo\" onclick=\"showPage('cartao',this);\" title=\"Cartão Pré-Pago — clica para gerir\">\n      <div>\n        <div class=\"card-saldo-label\">💳 Cartão Pré-Pago<\/div>\n        <div class=\"card-saldo-value\" id=\"topbar-saldo-cartao\">€0,00<\/div>\n      <\/div>\n    <\/div>\n    <select class=\"mes-sel\" id=\"sel-mes\" onchange=\"renderAll()\">\n      <option value=\"0\">Todos os meses<\/option>\n      <option value=\"1\">Janeiro<\/option><option value=\"2\">Fevereiro<\/option><option value=\"3\">Março<\/option>\n      <option value=\"4\">Abril<\/option><option value=\"5\">Maio<\/option><option value=\"6\">Junho<\/option>\n      <option value=\"7\">Julho<\/option><option    <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- PRÉ-VISUALIZAÇÃO -->\n  <div class=\"card\">\n    <div class=\"card-title\" style=\"display:flex;align-items:center;justify-content:space-between\">\n      <span>Pré-visualização<\/span>\n      <button class=\"btn-blue\" onclick=\"gerarRelatorio()\" style=\"padding:5px 14px;font-size:12px\">🖨 Imprimir<\/button>\n    <\/div>\n    <div id=\"rel-preview\" style=\"font-size:13px;color:var(--text-2)\">\n      <div class=\"empty-state\"><p>Ajusta os filtros acima e clica em \"Gerar e Imprimir\".<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- CONFIGURAÇÕES -->\n<div class=\"page\" id=\"page-gestao-config\">\n  <div class=\"page-header\">\n    <div><div class=\"page-title\">⚙️ Configurações<\/div><div class=\"page-sub\">Gere categorias, tipos de receita, despesa, movimentos e eventos<\/div><\/div>\n  <\/div>\n  <div class=\"inner-tabs\">\n    <button class=\"inner-tab active\" onclick=\"showInner('config','receitas',this)\">Categorias Receita<\/button>\n    <button class=\"inner-tab\" onclick=\"showInner('config','despesas',this)\">Categorias Despesa<\/button>\n    <button class=\"inner-tab\" onclick=\"showInner('config','movimentos',this)\">Tipos de Movimento<\/button>\n    <button class=\"inner-tab\" onclick=\"showInner('config','eventos',this)\">Eventos<\/button>\n        <button class=\"inner-tab\" onclick=\"showInner('config','direccao',this)\">👥 Direção<\/button>\n    <button class=\"inner-tab\" onclick=\"showInner('config','acessos',this)\">🔐 Acessos<\/button>\n    <button class=\"inner-tab\" onclick=\"showInner('config','dados',this)\">Dados<\/button>\n  <\/div>\n  <div class=\"inner-panel active\" id=\"config-inner-receitas\"><div id=\"config-receitas-content\"><\/div><\/div>\n  <div class=\"inner-panel\" id=\"config-inner-despesas\"><div id=\"config-despesas-content\"><\/div><\/div>\n  <div class=\"inner-panel\" id=\"config-inner-movimentos\"><div id=\"config-movimentos-content\"><\/div><\/div>\n  <div class=\"inner-panel\" id=\"config-inner-eventos\"><div id=\"config-eventos-content\"><\/div><\/div>\n    <div class=\"inner-panel\" id=\"config-inner-direccao\"><div id=\"config-direccao-content\"><\/div><\/div>\n  <div class=\"inner-panel\" id=\"config-inner-acessos\"><div id=\"config-acessos-content\"><\/div><\/div>\n  <div class=\"inner-panel\" id=\"config-inner-dados\">\n    <div class=\"card\" style=\"margin-bottom:14px\">\n      <div class=\"card-title\">🔒 Código de Acesso<\/div>\n      <div style=\"font-size:13px;color:var(--text-2);margin-bottom:14px;line-height:1.6\">\n        Protege a plataforma com um código. Sempre que alguém abrir a página terá de introduzir o código para ver os dados.\n      <\/div>\n      <div id=\"pin-status-area\"><\/div>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:10px\">\n        <button class=\"btn-blue\" onclick=\"openSetPin()\" id=\"btn-set-pin\">Definir código<\/button>\n        <button class=\"btn-secondary\" id=\"btn-remove-pin\" style=\"display:none\" onclick=\"removePin()\">🔓 Remover código<\/button>\n        <button class=\"btn-secondary\" onclick=\"lockApp()\" id=\"btn-lock-now\" style=\"display:none\">🔒 Bloquear agora<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"card\" style=\"margin-bottom:14px\">\n      <div class=\"card-title\"><img src=\"https://www.gstatic.com/images/branding/product/1x/drive_2020q4_16dp.png\" style=\"width:14px;height:14px;vertical-align:middle;margin-right:4px\"> Google Drive da ARCA<\/div>\n      <div style=\"font-size:12px;color:var(--text-2);margin-bottom:12px;line-height:1.5\">\n        Define o link da pasta do Google Drive onde guardas as faturas. Aparece como atalho ao registar lançamentos.\n      <\/div>\n      <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n        <input type=\"url\" id=\"config-drive-url\" placeholder=\"https://drive.google.com/drive/folders/...\" \n          style=\"flex:1;min-width:200px;padding:8px 10px;border:var(--border);border-radius:var(--radius);font-size:12px;background:var(--bg2)\">\n        <button class=\"btn-primary\" onclick=\"saveDriveUrl()\">💾 Guardar<\/button>\n        <a id=\"config-drive-link\" href=\"#\" onclick=\"abrirDrive();return false;\" \n          style=\"display:none;padding:8px 12px;background:#f0faf0;border:0.5px solid #34a853;border-radius:var(--radius);color:#1a7f37;font-size:12px;text-decoration:none;white-space:nowrap\">\n          🔗 Abrir Drive\n        <\/a>\n      <\/div>\n      <div id=\"config-drive-msg\" style=\"font-size:11px;margin-top:6px;min-height:14px\"><\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"card-title\">Exportar / Importar dados<\/div>\n      <div style=\"display:flex;flex-direction:column;gap:10px;max-width:400px\">\n        <button class=\"btn-secondary\" onclick=\"exportJSON()\">⬇ Exportar todos os dados (JSON)<\/button>\n        <button class=\"btn-secondary\" onclick=\"document.getElementById('import-file').click()\">⬆ Importar dados (JSON)<\/button>\n        <input type=\"file\" id=\"import-file\" accept=\".json\" style=\"display:none\" onchange=\"importJSON(this)\">\n        <hr style=\"border:none;border-top:var(--border)\">\n        <button class=\"btn-danger\" onclick=\"if(confirm('Apagar TODOS os dados? Esta ação é irreversível!'))clearAll()\">🗑 Apagar todos os dados<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n\n<!-- AGENDA -->\n<div class=\"page\" id=\"page-agenda\">\n  <div class=\"page-header\">\n    <div><div class=\"page-title\">📅 Agenda<\/div><div class=\"page-sub\" id=\"agenda-hoje-label\">Controlo diário de afazeres da ARCA<\/div><\/div>\n    <button class=\"btn-primary\" onclick=\"openModalLembrete()\">+ Novo lembrete<\/button>\n  <\/div>\n  <div class=\"metrics-grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:18px\" id=\"agenda-metrics\"><\/div>\n  <div class=\"inner-tabs\">\n    <button class=\"inner-tab active\" id=\"atab-hoje\" onclick=\"showInner('agenda','hoje',this)\">📅 Hoje<\/button>\n    <button class=\"inner-tab\" id=\"atab-semana\" onclick=\"showInner('agenda','semana',this)\">📆 Esta semana<\/button>\n    <button class=\"inner-tab\" id=\"atab-todos\" onclick=\"showInner('agenda','todos',this)\">📋 Todos<\/button>\n    <button class=\"inner-tab\" id=\"atab-concluidos\" onclick=\"showInner('agenda','concluidos',this)\">✅ Concluídos<\/button>\n  <\/div>\n  <div class=\"inner-panel active\" id=\"agenda-inner-hoje\"><div id=\"agenda-list-hoje\"><\/div><\/div>\n  <div class=\"inner-panel\" id=\"agenda-inner-semana\"><div id=\"agenda-list-semana\"><\/div><\/div>\n  <div class=\"inner-panel\" id=\"agenda-inner-todos\"><div id=\"agenda-list-todos\"><\/div><\/div>\n  <div class=\"inner-panel\" id=\"agenda-inner-concluidos\"><div id=\"agenda-list-concluidos\"><\/div><\/div>\n<\/div>\n\n<!-- MODAL LEMBRETE -->\n<div class=\"modal-overlay\" id=\"modal-lembrete\">\n  <div class=\"modal\" style=\"max-width:480px\">\n    <div class=\"modal-header\">\n      <div class=\"modal-title\" id=\"lembrete-modal-title\">Novo lembrete<\/div>\n      <button class=\"modal-close\" onclick=\"closeModal('modal-lembrete')\">×<\/button>\n    <\/div>\n    <div class=\"form-grid\">\n      <div class=\"form-group\"><label>Título *<\/label><input type=\"text\" id=\"lem-titulo\" placeholder=\"Ex: Reunião de direção, Pagar renda...\"><\/div>\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Data<\/label><input type=\"date\" id=\"lem-data\"><\/div>\n        <div class=\"form-group\"><label>Hora<\/label><input type=\"time\" id=\"lem-hora\" placeholder=\"HH:MM\"><\/div>\n      <\/div>\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Prioridade<\/label>\n          <select id=\"lem-prioridade\">\n            <option value=\"normal\">Normal<\/option>\n            <option value=\"alta\">Alta<\/option>\n            <option value=\"urgente\">Urgente<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"form-group\"><label>Categoria<\/label>\n          <select id=\"lem-cat\">\n            <option>Reunião<\/option><option>Pagamento<\/option><option>Evento<\/option>\n            <option>Sócio<\/option><option>ATL<\/option><option>Administrativo<\/option><option>Outro<\/option>\n          <\/select>\n        <\/div>\n      <\/div>\n      <div class=\"form-group\"><label>Notas<\/label><textarea id=\"lem-notas\" placeholder=\"Detalhes adicionais...\"><\/textarea><\/div>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button class=\"btn-secondary\" onclick=\"closeModal('modal-lembrete')\">Cancelar<\/button>\n      <button class=\"btn-primary\" onclick=\"saveLembrete()\">Guardar<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<\/main>\n<\/div>\n\n<!-- MODAL DEPÓSITO NO BANCO -->\n<div class=\"modal-overlay\" id=\"modal-deposito-banco\">\n  <div class=\"modal\" style=\"max-width:440px\">\n    <div class=\"modal-header\">\n      <div class=\"modal-title\">🏦 Depositar no Banco<\/div>\n      <button class=\"modal-close\" onclick=\"closeModal('modal-deposito-banco')\">×<\/button>\n    <\/div>\n    <div style=\"background:var(--blue-l);border:0.5px solid #B5D4F4;border-radius:var(--radius);padding:12px 14px;font-size:12px;color:var(--blue);margin-bottom:16px;line-height:1.6\">\n      💡 Este registo faz <strong>duas entradas automáticas<\/strong>:<br>\n      1. <strong>Saída do Cofre<\/strong> — o dinheiro sai do numerário em caixa<br>\n      2. <strong>Transferência bancária<\/strong> — fica registado nos lançamentos gerais como receita por transferência\n    <\/div>\n    <div class=\"form-grid\">\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Mês<\/label>\n          <select id=\"dep-mes\">\n            <option value=\"1\">Janeiro<\/option><option value=\"2\">Fevereiro<\/option><option value=\"3\">Março<\/option>\n            <option value=\"4\">Abril<\/option><option value=\"5\">Maio<\/option><option value=\"6\">Junho<\/option>\n            <option value=\"7\">Julho<\/option><option value=\"8\">Agosto<\/option><option value=\"9\">Setembro<\/option>\n            <option value=\"10\">Outubro<\/option><option value=\"11\">Novembro<\/option><option value=\"12\">Dezembro<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"form-group\"><label>Data<\/label><input type=\"date\" id=\"dep-data\"><\/div>\n      <\/div>\n      <div class=\"form-group\"><label>Valor a depositar (€)<\/label>\n        <input type=\"number\" id=\"dep-valor\" placeholder=\"0.00\" step=\"0.01\" min=\"0.01\" oninput=\"updateDepositoPreview()\">\n      <\/div>\n      <div class=\"form-group\"><label>Depositado por<\/label>\n        <input type=\"text\" id=\"dep-quem\" placeholder=\"Ex: Bárbara Silva — Administrativa\">\n      <\/div>\n      <div class=\"form-group\"><label>Nota / Referência<\/label>\n        <input type=\"text\" id=\"dep-nota\" placeholder=\"Ex: Depósito referente a quotas e ATL Julho\">\n      <\/div>\n      <div id=\"dep-preview\" style=\"background:var(--bg2);border-radius:var(--radius);padding:12px 14px;font-size:12px\">\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:4px\">\n          <span style=\"color:var(--text-3)\">Saldo actual do cofre:<\/span>\n          <strong id=\"dep-saldo-atual\">€0,00<\/strong>\n        <\/div>\n        <div style=\"display:flex;justify-content:space-between\">\n          <span style=\"color:var(--text-3)\">Saldo após depósito:<\/span>\n          <strong id=\"dep-saldo-depois\" style=\"color:var(--teal-d)\">€0,00<\/strong>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button class=\"btn-secondary\" onclick=\"closeModal('modal-deposito-banco')\">Cancelar<\/button>\n      <button class=\"btn-blue\" onclick=\"saveDepositoBanco()\">🏦 Registar depósito<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- MODAL LANÇAMENTO -->\n<div class=\"modal-overlay\" id=\"modal-lancamento\">\n  <div class=\"modal\">\n    <div class=\"modal-header\">\n      <div class=\"modal-title\" id=\"lancamento-modal-title\">Novo lançamento<\/div>\n      <button class=\"modal-close\" onclick=\"closeModal('modal-lancamento')\">×<\/button>\n    <\/div>\n    <div class=\"form-grid\">\n      <div class=\"tipo-toggle\">\n        <button class=\"tipo-btn rec\" id=\"tbtn-rec\" onclick=\"setTipo('receita')\">▲ Receita<\/button>\n        <button class=\"tipo-btn\" id=\"tbtn-desp\" onclick=\"setTipo('despesa')\">▼ Despesa<\/button>\n      <\/div>\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Mês<\/label>\n          <select id=\"l-mes\">\n            <option value=\"1\">Janeiro<\/option><option value=\"2\">Fevereiro<\/option><option value=\"3\">Março<\/option>\n            <option value=\"4\">Abril<\/option><option value=\"5\">Maio<\/option><option value=\"6\">Junho<\/option>\n            <option value=\"7\">Julho<\/option><option value=\"8\">Agosto<\/option><option value=\"9\">Setembro<\/option>\n            <option value=\"10\">Outubro<\/option><option value=\"11\">Novembro<\/option><option value=\"12\">Dezembro<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"form-group\"><label>Tipo de movimento<\/label>\n          <select id=\"l-tipmov\" onchange=\"onMovChange()\"><\/select>\n          <div id=\"tipmov-hint\" class=\"hint\" style=\"display:none;color:var(--blue)\">💳 Esta despesa será debitada do saldo do Cartão Pré-Pago<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"form-group\"><label>Categoria<\/label><select id=\"l-categoria\" onchange=\"updateSub()\"><\/select><\/div>\n      <div class=\"form-group\"><label>Subcategoria<\/label><select id=\"l-sub\" onchange=\"checkDonatGenero()\"><\/select><\/div>\n      <div id=\"genero-aviso\" style=\"display:none;background:#FDF6E8;border:0.5px solid #FAC775;border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--amber-d)\">\n        🎁 <strong>Donativo de Bens/Género<\/strong> — não é necessário indicar valor monetário. Este donativo é de bens e não de dinheiro. Podes deixar o valor em branco ou colocar o valor estimado dos bens.\n      <\/div>\n      <div class=\"form-group\"><label>Descrição / Referência<\/label><input type=\"text\" id=\"l-desc\" placeholder=\"Ex: Mensalidades Capoeira — João Silva\"><\/div>\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Valor (€) <span id=\"l-valor-label-hint\" style=\"font-size:10px;color:var(--text-3);font-weight:400\">— opcional para bens<\/span><\/label><input type=\"number\" id=\"l-valor\" placeholder=\"0.00\" step=\"0.01\" min=\"0\" oninput=\"calcShare()\"><\/div>\n        <div class=\"form-group\"><label>Nota<\/label><input type=\"text\" id=\"l-nota\" placeholder=\"Fatura, recibo...\"><\/div>\n      <\/div>\n      <div id=\"share-group\" style=\"display:none\">\n        <div class=\"form-group\"><label>Partilha da receita<\/label>\n          <div class=\"share-row\">\n            <button class=\"share-btn\" onclick=\"setShare(25)\">25%<\/button>\n            <button class=\"share-btn\" onclick=\"setShare(33)\">33%<\/button>\n            <button class=\"share-btn\" onclick=\"setShare(50)\">50%<\/button>\n            <button class=\"share-btn\" onclick=\"setShare(75)\">75%<\/button>\n            <button class=\"share-btn active\" onclick=\"setShare(100)\">100%<\/button>\n          <\/div>\n          <input type=\"range\" id=\"l-share\" min=\"1\" max=\"100\" value=\"100\" oninput=\"calcShare()\" style=\"margin-top:8px;width:100%\">\n          <div class=\"hint\" id=\"share-hint\">Valor guardado: €0,00 (100% do total)<\/div>\n        <\/div>\n      <\/div>\n      <div id=\"cartao-aviso\" style=\"display:none;background:var(--blue-l);border:0.5px solid #B5D4F4;border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--blue)\">\n        💳 Esta despesa será debitada do saldo do <strong>Cartão Pré-Pago<\/strong> (diferente do MBWay).\n        <br>Saldo atual do cartão: <strong id=\"aviso-saldo\"><\/strong>\n      <\/div>\n      <!-- FATURA -->\n      <div style=\"border-top:var(--border);padding-top:12px;margin-top:4px\">\n        <div style=\"font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px\">📄 Fatura / Documento<\/div>\n        <div class=\"form-row\">\n          <div class=\"form-group\"><label>Nº Fatura<\/label><input type=\"text\" id=\"l-fat-num\" placeholder=\"Ex: FT 2025/001\"><\/div>\n          <div class=\"form-group\"><label>Data Fatura<\/label><input type=\"date\" id=\"l-fat-data\"><\/div>\n        <\/div>\n        <div class=\"form-group\">\n          <label>Carregar fatura (PDF, imagem)<\/label>\n          <div id=\"l-fat-drop\" onclick=\"document.getElementById('l-fat-file').click()\"\n            style=\"border:2px dashed #ccc;border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;background:var(--bg2);transition:border-color .15s\"\n            onmouseover=\"this.style.borderColor='var(--teal)'\" onmouseout=\"this.style.borderColor='#ccc'\"\n            ondragover=\"event.preventDefault();this.style.borderColor='var(--teal)'\"\n            ondrop=\"handleFatDrop(event)\">\n            <div id=\"l-fat-label\" style=\"font-size:12px;color:var(--text-3)\">📎 Clica ou arrasta o ficheiro aqui<\/div>\n          <\/div>\n          <input type=\"file\" id=\"l-fat-file\" accept=\".pdf,.png,.jpg,.jpeg,.webp\" style=\"display:none\" onchange=\"handleFatFile(this)\">\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button class=\"btn-secondary\" onclick=\"closeModal('modal-lancamento')\">Cancelar<\/button>\n      <button class=\"btn-primary\" onclick=\"saveLancamento()\">Guardar<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- MODAL RECARGA CARTÃO -->\n<div class=\"modal-overlay\" id=\"modal-recarga\">\n  <div class=\"modal\" style=\"max-width:420px\">\n    <div class=\"modal-header\">\n      <div class=\"modal-title\">💳 Recarregar Cartão Pré-Pago<\/div>\n      <button class=\"modal-close\" onclick=\"closeModal('modal-recarga')\">×<\/button>\n    <\/div>\n    <div class=\"form-grid\">\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Mês<\/label>\n          <select id=\"rc-mes\">\n            <option value=\"1\">Janeiro<\/option><option value=\"2\">Fevereiro<\/option><option value=\"3\">Março<\/option>\n            <option value=\"4\">Abril<\/option><option value=\"5\">Maio<\/option><option value=\"6\">Junho<\/option>\n            <option value=\"7\">Julho<\/option><option value=\"8\">Agosto<\/option><option value=\"9\">Setembro<\/option>\n            <option value=\"10\">Outubro<\/option><option value=\"11\">Novembro<\/option><option value=\"12\">Dezembro<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"form-group\"><label>Valor da recarga (€)<\/label><input type=\"number\" id=\"rc-valor\" placeholder=\"0.00\" step=\"0.01\" min=\"0.01\"><\/div>\n      <\/div>\n      <div class=\"form-group\"><label>Forma de pagamento da recarga<\/label>\n        <select id=\"rc-origem\" onchange=\"onRecOrigChange()\">\n          <option value=\"Entidade/Referência MB\">Entidade / Referência MB<\/option>\n          <option value=\"Transferência Bancária\">Transferência Bancária<\/option>\n          <option value=\"Caixa (numerário)\">Caixa (numerário)<\/option>\n          <option value=\"Outra\">Outra<\/option>\n        <\/select>\n      <\/div>\n      <!-- Dados MB fixos da associação -->\n      <div id=\"rc-mb-dados\" style=\"background:var(--blue-l);border:0.5px solid #B5D4F4;border-radius:var(--radius);padding:12px 14px;font-size:13px\">\n        <div style=\"font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px\">Dados MB da associação para receber pagamentos<\/div>\n        <div style=\"display:flex;justify-content:space-between;margin-bottom:4px\">\n          <span style=\"color:var(--text-2)\">Entidade:<\/span>\n          <strong style=\"color:var(--blue);letter-spacing:1px;font-size:15px\">21 312<\/strong>\n        <\/div>\n        <div style=\"display:flex;justify-content:space-between\">\n          <span style=\"color:var(--text-2)\">Referência:<\/span>\n          <strong style=\"color:var(--blue);letter-spacing:1px;font-size:15px\">995 610 745<\/strong>\n        <\/div>\n        <div style=\"font-size:10px;color:var(--text-2);margin-top:8px;line-height:1.5\">✅ Os pagamentos de quotas, ATL, inscrições e outros serviços feitos com estes dados acumulam no saldo do cartão pré-pago.<\/div>\n      <\/div>\n      <div class=\"form-group\"><label>Nota / Referência<\/label><input type=\"text\" id=\"rc-nota\" placeholder=\"Ex: Recarga Janeiro 2025...\"><\/div>\n      <div style=\"background:var(--bg2);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--text-2)\">\n        Saldo atual: <strong id=\"rc-saldo-atual\">€0,00<\/strong> → após recarga: <strong id=\"rc-saldo-novo\">€0,00<\/strong>\n      <\/div>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button class=\"btn-secondary\" onclick=\"closeModal('modal-recarga')\">Cancelar<\/button>\n      <button class=\"btn-blue\" onclick=\"saveRecarga()\">💳 Registar recarga<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- MODAL LOGO -->\n<div class=\"modal-overlay\" id=\"modal-logo\">\n  <div class=\"modal\" style=\"max-width:420px\">\n    <div class=\"modal-header\">\n      <div class=\"modal-title\">Logo da Associação<\/div>\n      <button class=\"modal-close\" onclick=\"closeModal('modal-logo')\">×<\/button>\n    <\/div>\n    <div id=\"logo-preview-area\" class=\"logo-preview-area\" style=\"display:none\"><\/div>\n    <div class=\"logo-drop\" id=\"logo-drop\" onclick=\"document.getElementById('logo-file-input').click()\" ondragover=\"event.preventDefault()\" ondrop=\"handleLogoDrop(event)\">\n      <svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#bbb\" stroke-width=\"1.5\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12\"/><\/svg>\n      <p>Clica ou arrasta a imagem do logo aqui<\/p>\n      <p style=\"font-size:10px;margin-top:4px\">PNG, JPG, SVG — o fundo transparente fica melhor<\/p>\n    <\/div>\n    <input type=\"file\" id=\"logo-file-input\" accept=\"image/*\" style=\"display:none\" onchange=\"handleLogoFile(this)\">\n    <div id=\"logo-bg-section\" style=\"display:none;margin-top:14px\">\n      <div class=\"form-group\">\n        <label>Remover fundo (tolerância)<\/label>\n        <input type=\"range\" id=\"bg-tolerance\" min=\"5\" max=\"80\" value=\"30\" oninput=\"previewBgRemoval()\">\n        <div class=\"hint\" id=\"bg-hint\">Tolerância: 30 — ajusta se ficarem restos de cor<\/div>\n      <\/div>\n      <canvas id=\"bg-canvas\" style=\"display:none\"><\/canvas>\n      <div style=\"display:flex;gap:10px;margin-top:10px;align-items:center\">\n        <div style=\"flex:1;text-align:center\">\n          <div style=\"font-size:10px;color:var(--text-3);margin-bottom:4px\">Original<\/div>\n          <img id=\"bg-original\" style=\"max-height:80px;max-width:100%;border-radius:var(--radius);border:var(--border)\">\n        <\/div>\n        <div style=\"flex:1;text-align:center\">\n          <div style=\"font-size:10px;color:var(--text-3);margin-bottom:4px\">Resultado<\/div>\n          <canvas id=\"bg-result\" style=\"max-height:80px;max-width:100%;border-radius:var(--radius);border:var(--border);background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0 0/16px 16px\"><\/canvas>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button class=\"btn-secondary\" onclick=\"closeModal('modal-logo')\">Cancelar<\/button>\n      <button class=\"btn-danger\" onclick=\"removeLogo()\">🗑 Remover logo atual<\/button>\n      <button id=\"btn-apply-logo\" class=\"btn-primary\" onclick=\"applyLogo()\" style=\"display:none\">Aplicar logo<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- MODAL PIN / ACESSO -->\n<div class=\"modal-overlay\" id=\"modal-pin\">\n  <div class=\"modal\" style=\"max-width:380px;text-align:center\">\n    <div id=\"login-logo-area\" style=\"margin-bottom:10px;display:flex;justify-content:center\"><\/div>\n    <div class=\"modal-header\" style=\"justify-content:center;border-bottom:var(--border);padding-bottom:14px;margin-bottom:18px\">\n      <div class=\"modal-title\" id=\"pin-modal-title\">🔒 Acesso Protegido<\/div>\n    <\/div>\n    <div id=\"pin-body\">\n      <div style=\"font-size:13px;color:var(--text-2);margin-bottom:18px\" id=\"pin-message\">Introduz o código de acesso<\/div>\n      <div style=\"display:flex;justify-content:center;gap:10px;margin-bottom:18px\">\n        <input type=\"password\" id=\"pin-input\" maxlength=\"8\" placeholder=\"••••••••\"\n          style=\"text-align:center;font-size:22px;letter-spacing:6px;width:180px;padding:10px;border:var(--border);border-radius:var(--radius);background:var(--bg2)\"\n          onkeydown=\"if(event.key==='Enter')confirmPin()\">\n      <\/div>\n      <div id=\"pin-error\" style=\"color:var(--coral);font-size:12px;margin-bottom:12px;min-height:16px\"><\/div>\n    <\/div>\n    <div class=\"modal-footer\" style=\"justify-content:center;gap:10px\">\n      <button class=\"btn-secondary\" onclick=\"closeModal('modal-pin')\">Cancelar<\/button>\n      <button class=\"btn-primary\" id=\"pin-confirm-btn\" onclick=\"confirmPin()\">Confirmar<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- MODAL CONFIRMAÇÃO ELIMINAÇÃO -->\n<div class=\"modal-overlay\" id=\"modal-confirma-delete\">\n  <div class=\"modal\" style=\"max-width:420px\">\n    <div class=\"modal-header\">\n      <div class=\"modal-title\" style=\"color:var(--coral)\">⚠ Confirmar eliminação<\/div>\n      <button class=\"modal-close\" onclick=\"closeModal('modal-confirma-delete')\">×<\/button>\n    <\/div>\n    <div style=\"font-size:14px;color:var(--text-2);line-height:1.6;margin-bottom:10px\">\n      Tens a certeza que queres eliminar este registo?\n    <\/div>\n    <div id=\"delete-preview\" style=\"background:var(--coral-l);border:0.5px solid #F09595;border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-bottom:6px\"><\/div>\n    <div style=\"font-size:12px;color:var(--coral-d);margin-top:8px;font-style:italic\">Esta ação não pode ser desfeita.<\/div>\n    <div class=\"modal-footer\">\n      <button class=\"btn-secondary\" onclick=\"closeModal('modal-confirma-delete')\">Cancelar — Manter registo<\/button>\n      <button class=\"btn-danger\" id=\"btn-confirma-delete\" onclick=\"executeDelete()\">Sim, eliminar<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- MODAL COMPROVATIVO -->\n<div class=\"modal-overlay\" id=\"modal-comprovativo\">\n  <div class=\"modal\" style=\"max-width:640px\">\n    <div class=\"modal-header\">\n      <div class=\"modal-title\">🖨 Comprovativo de Pagamento<\/div>\n      <button class=\"modal-close\" onclick=\"closeModal('modal-comprovativo')\">×<\/button>\n    <\/div>\n    <div style=\"margin-bottom:14px;padding:10px 14px;background:var(--bg2);border-radius:var(--radius);font-size:12px;color:var(--text-2)\">\n      Podes editar os campos antes de imprimir. O comprovativo sai em duplicado (original + cópia) para assinatura.\n    <\/div>\n    <div class=\"form-grid\" style=\"margin-bottom:16px\">\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Nome de quem recebe / paga<\/label><input type=\"text\" id=\"cp-nome\" placeholder=\"Ex: Teresa Sena\"><\/div>\n        <div class=\"form-group\"><label>Referência / N.º<\/label><input type=\"text\" id=\"cp-ref\" placeholder=\"Ex: REC-2025-001\"><\/div>\n      <\/div>\n      <div class=\"form-group\"><label>Descrição do pagamento<\/label><input type=\"text\" id=\"cp-descricao\" placeholder=\"Ex: Pagamento Inscrição ATL Joana\"><\/div>\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Valor (€)<\/label><input type=\"number\" id=\"cp-valor\" step=\"0.01\"><\/div>\n        <div class=\"form-group\"><label>Data<\/label><input type=\"date\" id=\"cp-data\"><\/div>\n      <\/div>\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Modo de pagamento<\/label><input type=\"text\" id=\"cp-modo\" placeholder=\"Ex: Numerário\"><\/div>\n        <div class=\"form-group\"><label>Observações<\/label><input type=\"text\" id=\"cp-obs\" placeholder=\"Opcional\"><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"modal-footer\">\n      <button class=\"btn-secondary\" onclick=\"closeModal('modal-comprovativo')\">Cancelar<\/button>\n      <button class=\"btn-blue\" onclick=\"imprimirComprovativo()\">🖨 Imprimir<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<!-- ARCA CHAT ASSISTANT -->\n<div id=\"arca-chat-widget\" style=\"display:none;position:fixed;bottom:20px;right:20px;width:360px;height:500px;background:#fff;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.18);z-index:400;display:none;flex-direction:column;overflow:hidden;border:1px solid #e2e8f0\">\n  <!-- Header -->\n  <div style=\"background:linear-gradient(135deg,#1a3a6b,#2E75B5);padding:14px 16px;display:flex;align-items:center;justify-content:space-between\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <div style=\"width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px\">🤖<\/div>\n      <div>\n        <div style=\"color:#fff;font-weight:700;font-size:13px\">Assistente ARCA<\/div>\n        <div style=\"color:rgba(255,255,255,.7);font-size:10px\">Guia de utilização da app<\/div>\n      <\/div>\n    <\/div>\n    <button onclick=\"toggleArcaChat()\" style=\"background:none;border:none;color:rgba(255,255,255,.8);font-size:20px;cursor:pointer;line-height:1\">×<\/button>\n  <\/div>\n  <!-- Mensagens -->\n  <div id=\"arca-chat-msgs\" style=\"flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f8fafc\">\n    <div style=\"background:#fff;border-radius:12px;padding:12px 14px;font-size:12px;line-height:1.6;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:90%\">\n      👋 Olá! Sou o assistente da <strong>ARCA d'Ajuda<\/strong>.<br><br>\n      Posso ajudar-te a usar a aplicação — como registar lançamentos, gerir o cartão MB e o cofre, ver relatórios, ou qualquer outra dúvida.<br><br>\n      <span style=\"color:#64748b\">Em que posso ajudar?<\/span>\n    <\/div>\n    <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n      <button onclick=\"arcaChatSend('Como registro um lançamento?')\" style=\"padding:5px 10px;border:0.5px solid #cbd5e1;border-radius:20px;background:#fff;font-size:11px;cursor:pointer;color:#334155\">Como registro um lançamento?<\/button>\n      <button onclick=\"arcaChatSend('Como registo uma despesa com fatura?')\" style=\"padding:5px 10px;border:0.5px solid #cbd5e1;border-radius:20px;background:#fff;font-size:11px;cursor:pointer;color:#334155\">Como adiciono um sócio?<\/button>\n      <button onclick=\"arcaChatSend('Como funciona o cofre de numerário?')\" style=\"padding:5px 10px;border:0.5px solid #cbd5e1;border-radius:20px;background:#fff;font-size:11px;cursor:pointer;color:#334155\">Como funciona o ATL?<\/button>\n      <button onclick=\"arcaChatSend('Como depositar do cofre para o banco?')\" style=\"padding:5px 10px;border:0.5px solid #cbd5e1;border-radius:20px;background:#fff;font-size:11px;cursor:pointer;color:#334155\">Depositar no banco?<\/button>\n    <\/div>\n  <\/div>\n  <!-- Input -->\n  <div style=\"padding:10px 12px;border-top:1px solid #e2e8f0;display:flex;gap:8px;background:#fff\">\n    <input id=\"arca-chat-input\" type=\"text\" placeholder=\"Escreve a tua dúvida...\" \n      style=\"flex:1;padding:8px 12px;border:1px solid #e2e8f0;border-radius:20px;font-size:12px;outline:none\"\n      onkeydown=\"if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();arcaChatSend();}\">\n    <button onclick=\"arcaChatSend()\" id=\"arca-chat-send\" style=\"width:34px;height:34px;border-radius:50%;background:#1a3a6b;border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center\">➤<\/button>\n  <\/div>\n<\/div>\n\n<!-- TOAST -->\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n// ============================================================\n// STORAGE & STATE\n// ============================================================\nconst LS = {\n  get: k => { try{const v=localStorage.getItem(k); return v?JSON.parse(v):null;}catch(e){return null;} },\n  set: (k,v) => { try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }\n};\n\nlet movimentos = LS.get('arca_movs') || [];\nlet recargas = LS.get('arca_recargas') || [];\n// ============================================================\n// CLOUD (Supabase) — dados partilhados entre todos os PCs\n// ============================================================\nconst SUPA_URL = 'https://yfsyifypsrqnwkqkfrnm.supabase.co';\nconst SUPA_KEY = 'sb_publishable_AkzlMeHlYHDyl0HzeC7_qg__j_Y6C9W';\nlet supaSession = { get access_token(){ return parent.ARCA.token(); }, get user(){ return parent.ARCA.user; }, refresh_token:null };\nconst __inflight=new Set();\nlet cloudPronto = false;\nconst CLOUD_KEYS = ['arca_movs','arca_cofre','arca_recargas','arca_config','arca_lembretes','arca_faturas','arca_direccao','arca_admin_info','arca_pin_hash','arca_role_codes','arca_drive_url','arca_logo'];\nconst _cloudTimers = {};\n\nfunction cloudEstado(txt, cor){\n  const el=document.getElementById('cloud-estado'); if(!el) return;\n  const t=String(txt).toLowerCase(); const c=/sincroniz/.test(t)?'#4ADE80':(/erro|sem sess|sem liga|offline/.test(t)?'#FF5C5C':'#FFC24A');\n  el.textContent='●'; el.style.color=c; el.title='Cloud: '+String(txt).replace(/^\\S+\\s*/,''); el.setAttribute('aria-label',el.title);\n}\nasync function supaAuthLogin(email, password){\n  const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY}, body: JSON.stringify({email,password})});\n  const data = await res.json();\n  if(!res.ok) throw new Error(data.error_description||data.msg||'Email ou password incorretos.');\n  supaSession = data; LS.set('arca_supa_session', supaSession); return data;\n}\nasync function supaRefreshSession(){\n  if(!supaSession?.refresh_token) return false;\n  try{\n    const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY}, body: JSON.stringify({refresh_token: supaSession.refresh_token})});\n    const data = await res.json(); if(!res.ok) return false;\n    supaSession = data; LS.set('arca_supa_session', supaSession); return true;\n  }catch(e){ return false; }\n}\nasync function supaFetch(path, method='GET', body=null){\n  const p=parent.ARCA.api('/rest/v1/'+path, {method, body: body||undefined, prefer: method!=='GET'?'resolution=merge-duplicates,return=minimal':undefined});\n  __inflight.add(p); const done=()=>__inflight.delete(p); p.then(done,done); return p;\n}\nfunction finMostrarLogin(msg){ try{ parent.ARCA.logout(msg||'A sessão expirou. Entre novamente.'); }catch(e){} return;\n  const ov=document.getElementById('fin-login-overlay'); if(!ov) return;\n  ov.style.display='flex';\n  const logo=LS.get('arca_logo'); const la=document.getElementById('fin-login-logo');\n  if(la&&logo) la.innerHTML=`<img src=\"${logo}\" style=\"height:64px;width:64px;border-radius:50%;object-fit:cover\">`;\n  if(msg){ const e=document.getElementById('fin-login-erro'); e.textContent=msg; e.style.display='block'; }\n  cloudEstado('☁️ sem sessão','#FFD9A0');\n}\nasync function finFazerLogin(){\n  const email=document.getElementById('fin-login-email').value.trim(), pass=document.getElementById('fin-login-pass').value;\n  const erro=document.getElementById('fin-login-erro'); erro.style.display='none';\n  const btn=document.getElementById('fin-login-btn'); btn.disabled=true; btn.textContent='A entrar…';\n  try{ await supaAuthLogin(email,pass); document.getElementById('fin-login-overlay').style.display='none'; await cloudArrancar(); }\n  catch(e){ erro.textContent=e.message; erro.style.display='block'; }\n  finally{ btn.disabled=false; btn.textContent='Entrar'; }\n}\nfunction fundirPorId(cloudArr, localArr){\n  const a=Array.isArray(cloudArr)?cloudArr:[], b=Array.isArray(localArr)?localArr:[];\n  const ids=new Set(a.map(x=>x&&x.id)); const extra=b.filter(x=>x&&x.id!=null&&!ids.has(x.id));\n  return [...a, ...extra];\n}\nasync function cloudArrancar(){\n  cloudEstado('☁️ a ligar…');\n  let rows;\n  try{ rows = await supaFetch('fin_dados?select=chave,valor'); }\n  catch(e){\n    if(String(e.message)==='AUTH_EXPIRED') return;\n    console.error(e); cloudEstado('☁️ erro','#FFB3A7');\n    toast(/fin_dados|relation|does not exist/i.test(e.message)?'Falta criar a tabela fin_dados no Supabase (corre o SQL da instalação).':'Sem ligação à cloud — NÃO registe nada agora: as alterações não ficariam guardadas. Volte a abrir esta área.', false);\n    return;\n  }\n  const cloud={}; (rows||[]).forEach(r=>{cloud[r.chave]=r.valor;});\n  const porId={'arca_movs':1,'arca_recargas':1,'arca_lembretes':1,'arca_cofre':1};\n  const paraSubir=[];\n  CLOUD_KEYS.forEach(k=>{\n    const local=LS.get(k), naCloud=cloud[k];\n    let final;\n    if(porId[k]) final=fundirPorId(naCloud, local);\n    else final=(naCloud!==undefined&&naCloud!==null)?naCloud:local;\n    if(final===undefined) final=null;\n    LS._silencio=true; LS.set(k, final); LS._silencio=false;\n    const mudouCloud = JSON.stringify(final)!==JSON.stringify(naCloud===undefined?null:naCloud);\n    if(mudouCloud && final!==null) paraSubir.push({chave:k, valor:final});\n  });\n  // recarregar estruturas em memória e ecrã\n  movimentos = LS.get('arca_movs')||[];\n  recargas = LS.get('arca_recargas')||[];\n  lembretes = LS.get('arca_lembretes')||[];\n  movCofre = LS.get('arca_cofre')||[];\n  faturas = LS.get('arca_faturas')||{};\n  config = LS.get('arca_config')||getDefaultConfig();\n  // blindagem: se vier da cloud uma config antiga do ATL (semanas/meses), corrige e sobe\n  try{\n    const velho=/semana|m[êe]s|meses|dias|camisola|monitor|coordenador|seguro|alimenta|transport|autocarro|entradas/i;\n    let mexeu=false;\n    [['recCats','ATL Páscoa','Receita Total'],['recCats','ATL Verão','Receita Total'],['despCats','Despesas ATL Páscoa','Despesa Total'],['despCats','Despesas ATL Verão','Despesa Total']].forEach(([g,c,alvo])=>{\n      const l=config[g]&&config[g][c];\n      if(Array.isArray(l) && (l.length>1||l[0]!==alvo) && l.some(x=>velho.test(String(x)))){ config[g][c]=[alvo]; mexeu=true; }\n    });\n    if(mexeu) LS.set('arca_config', config);\n  }catch(e){ console.warn('blindagem ATL:',e); }\n  try{ populateMov(); updateCat(); }catch(e){}\n  try{ const pg=document.querySelector('.page.active'); if(pg) renderPage(pg.id.replace('page-','')); }catch(e){}\n  cloudPronto = true;\n  setTimeout(()=>{ try{ verificarLembretes(true); }catch(e){ console.warn(e); } }, 900);\n  if(paraSubir.length){\n    try{ await supaFetch('fin_dados','POST',paraSubir.map(x=>({chave:x.chave,valor:x.valor,atualizado_em:new Date().toISOString()}))); }\n    catch(e){ console.warn('subida inicial:',e); }\n  }\n  cloudEstado('☁️ sincronizado','#B6F0C8');\n}\nfunction cloudAgendar(chave){\n  if(!cloudPronto) return;\n  clearTimeout(_cloudTimers[chave]);\n  cloudEstado('☁️ a guardar…');\n  _cloudTimers[chave]=setTimeout(async()=>{\n    delete _cloudTimers[chave];\n    try{\n      await supaFetch('fin_dados','POST',[{chave, valor:LS.get(chave), atualizado_em:new Date().toISOString()}]);\n      if(!Object.keys(_cloudTimers).length) cloudEstado('☁️ sincronizado','#B6F0C8');\n    }catch(e){ console.error('sync '+chave+':',e); cloudEstado('☁️ erro ao guardar','#FFB3A7'); }\n  }, 700);\n}\n// LS.set passa a empurrar para a cloud as chaves partilhadas\nconst _lsSetOriginal = LS.set.bind(LS);\nLS.set = (k,v)=>{ _lsSetOriginal(k,v); if(!LS._silencio && CLOUD_KEYS.includes(k)) cloudAgendar(k); };\n\nlet config = LS.get('arca_config') || getDefaultConfig();\n// Migração (set/2026): o ATL passa a registar-se apenas por totais — as semanas/meses\n// vivem na futura app do ATL; aqui entra só \"Receita Total\" e \"Despesa Total\" por edição.\n(function(){\n  if(LS.get('arca_fix_atl_totais')) return;\n  try{\n    if(config.recCats){ if(config.recCats['ATL Páscoa']) config.recCats['ATL Páscoa']=['Receita Total']; if(config.recCats['ATL Verão']) config.recCats['ATL Verão']=['Receita Total']; }\n    if(config.despCats){ if(config.despCats['Despesas ATL Páscoa']) config.despCats['Despesas ATL Páscoa']=['Despesa Total']; if(config.despCats['Despesas ATL Verão']) config.despCats['Despesas ATL Verão']=['Despesa Total']; }\n    LS.set('arca_config', config);\n  }catch(e){ console.warn('migração ATL:', e); }\n  LS.set('arca_fix_atl_totais', true);\n})();\nlet charts = {};\nlet editingId = null;\nlet currentTipo = 'receita';\nlet logoRawData = null;\n\nfunction getDefaultConfig(){\n  return {\n    recCats: {\n      'Modalidades Sala': ['Capoeira Mensalidade','Capoeira Inscrições','Ballet Mensalidade','Ballet Inscrições','Krav Maga Mensalidade','Krav Maga Inscrições','Judo Mensalidade','Judo Inscrições','Qi Gong Mensalidade','Qi Gong Inscrições','Dança Mensalidade','Dança Inscrições','Teatro Mensalidade','Teatro Inscrições','Karaté Mensalidade','Karaté Inscrições','Esgrima Mensalidade','Esgrima Inscrições','Yoga Mensalidade','Yoga Inscrições','Outra'],\n      'Outras Atividades Sala': ['Aluguer Escritório','Formação','Workshop','Explicações','Aniversários','Reuniões','Condomínio','Outra'],\n      'ATL Páscoa': ['Receita Total'],\n      'ATL Verão': ['Receita Total'],\n      'Quotas Sócio': ['6 Meses','Anual','2 Anos'],\n      'Pagamentos Atletas': ['Pagamentos Atletas Modalidades (Sócio)','Pagamentos Atletas Provas'],\n      'Donativos': ['Donativo Quotas Antigas','Donativo'],\n      'Subsídios e Apoios Oficiais': ['DRD - Direção Reg. Desporto','CMF - Câmara do Funchal','ADPT - Desportos Para Todos','JFSM - Junta Freg. S. Martinho','Secretaria Reg. da Cultura','CMSC - Câmara Mun. St. Cruz','Outro'],\n      'Patrocínios': ['Financeiro','Produtos ou Serviços','Patrocínio Misto','Institucional','Cultural','Desportivo','Mídia ou Conteúdo','Digital'],\n      'Merchandising': ['Camisolas','Bonés','Adesivos','Outro'],\n      'Eventos': ['Varrer dos Armários','Altar São João','1º de Maio - Motocross','Semana Cultural ARCA','Arraial Nossa Sr. Ajuda','Sarau de Poesia e Fado','Halloween','Missa do Parto','Grande Prémio ARCA','Outro'],\n      'Outra Receita': ['Outra']\n    },\n    despCats: {\n      'Funcionários': ['Remuneração Administrativa','Gratificação Extra','Apoio Combustível','Honorários do Advogado','Honorários do Contabilista','Outro'],\n      'Mão de Obra Reparações': ['Mestre Carlos','Paulo (Filho Paulo Andrade)','Outra 1','Outra 2'],\n      'Despesas Fixas Salas ARCA': ['Renda','Telecomunicações / MEO','Luz Sala 1','Luz Sala 2','Água Sala 1','Água Sala 2','Material Informático','Material Limpeza','Empresa Limpeza','Outros Gastos'],\n      'Despesas ATL Páscoa': ['Despesa Total'],\n      'Despesas ATL Verão': ['Despesa Total'],\n      'Seguros': ['Salas ARCA 1 e 2','Atividades','Viatura 1','Viatura 2','Funcionários','Outro'],\n      'Reparações Viaturas': ['Seguro Viatura 1','Seguro Viatura 2','Inspeção','Pneus','Avarias','Combustível Viatura','Outra'],\n      'Material Aulas': ['Material Escritório','Material Atividade Salas','Material ATL'],\n      'Manutenção Informática': ['PC Escritório','Impressora','Projetor','Coluna Som'],\n      'Deslocações Aéreas': ['Funchal–Porto (ida e volta)','Funchal–Lisboa (ida e volta)','Funchal–Açores (ida e volta)','Madeira–Porto Santo','Outra Viagem'],\n      'Inscrições Modalidades Federadas': ['Atletismo','Voleibol','Motocross','Judo','Karaté','Orientação','Esgrima','Outra'],\n      'Pagamento Quotas Associações': ['AARAM','Fed. Orientação','Fed. Esgrima','Fed. Motocross','Fed. Karaté','ADPT'],\n      'Limpeza': ['Produtos Limpeza Sede','Produtos Limpeza ATL','Empresa Limpeza','Outro'],\n      'Despesas Não Contempladas': ['Outras Despesas']\n    },\n    movimentos: ['Numerário','MBWay','Entidade / Referência MB','Cartão Pré-Pago','Transf. Bancária','Bens e Géneros','Outra'],\n    eventos: ['Varrer dos Armários','Altar São João','1º de Maio - Motocross','Semana Cultural ARCA','Arraial Nossa Sr. Ajuda','Sarau de Poesia e Fado','Halloween','Missa do Parto','Grande Prémio ARCA']\n  };\n}\n\nfunction saveAll(){\n  LS.set('arca_movs', movimentos);\n  LS.set('arca_recargas', recargas);\n  LS.set('arca_config', config);\n}\n\n// ============================================================\n// UTILS\n// ============================================================\nconst MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];\nconst MESES_S = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];\nconst CORES = ['#1D9E75','#0F6E56','#5DCAA5','#D85A30','#BA7517','#EF9F27','#185FA5','#534AB7','#3C3489','#A32D2D','#9FE1CB','#633806'];\n\nfunction fmt(v){ return '€'+Number(v||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}); }\nfunction getAno(){ return parseInt(document.getElementById('sel-ano').value)||new Date().getFullYear(); }\nfunction getMes(){ return parseInt(document.getElementById('sel-mes').value)||0; }\n\n// Movimentos excluídos das finanças gerais (são contabilizados apenas no Cartão Pré-Pago)\n// ============================================================\n// REGRAS DE CONTABILIDADE\n// ============================================================\n// CARTÃO PRÉ-PAGO: recebe pagamentos por MB (Entidade/Ref) e é debitado com Cartão Pré-Pago\n// COFRE: recebe numerário e é debitado em numerário\n// GERAL ARCA: todos os outros movimentos (MBWay, Transf. Bancária, Bens e Géneros, etc.)\n// Pagamentos ATL via MB → cartão; via Numerário → cofre; outros → geral\n// O balanço geral soma tudo (cartão + cofre + geral) SEM duplicar\n\nconst TIPMOV_CARTAO   = ['Entidade / Referência MB', 'Cartão Pré-Pago'];\nconst TIPMOV_COFRE    = ['Numerário'];   // receitas/despesas em numerário vão para o cofre\nconst TIPMOV_CARTAO_IN  = 'Entidade / Referência MB';  // entrada no cartão\nconst TIPMOV_CARTAO_OUT = 'Cartão Pré-Pago';            // saída do cartão\nconst TIPMOV_COFRE_IN   = 'Numerário';                  // entrada no cofre (receitas)\n// Movimentos excluídos do fluxo geral da ARCA:\n// - Cartão (Entidade/Ref MB + Cartão Pré-Pago) → contabilizados no Cartão Pré-Pago\n// - Numerário → contabilizado no Cofre\nconst TIPMOV_EXCLUIDOS_GERAL = [...TIPMOV_CARTAO, 'Numerário'];\n\nfunction movsDoPeriodo(){\n  const ano=getAno(), mes=getMes();\n  return movimentos.filter(m=> m.ano===ano && (mes===0||m.mes===mes) );\n}\nfunction filteredMovs(){\n  const ano=getAno(), mes=getMes();\n  return movimentos.filter(m=>\n    m.ano===ano &&\n    (mes===0||m.mes===mes) &&\n    !TIPMOV_EXCLUIDOS_GERAL.includes(m.tipmov)\n  );\n}\n\n// Versão que inclui TUDO (para exportações e lista completa de lançamentos)\nfunction allMovs(){\n  const ano=getAno(), mes=getMes();\n  return movimentos.filter(m=>m.ano===ano&&(mes===0||m.mes===mes));\n}\n\nfunction toast(msg,ok=true){\n  const t=document.getElementById('toast');\n  t.textContent=(ok?'✓ ':'⚠ ')+msg;\n  t.style.background=ok?'var(--teal)':'var(--coral)';\n  t.classList.add('show');\n  setTimeout(()=>t.classList.remove('show'),3000);\n}\n\nfunction destroyChart(k){ if(charts[k]){charts[k].destroy();delete charts[k];} }\nfunction mkChart(k,id,cfg){ destroyChart(k); const el=document.getElementById(id); if(el) charts[k]=new Chart(el,cfg); }\n\n// ============================================================\n// YEAR SELECTOR — auto from data\n// ============================================================\nfunction updateYearSelector(){\n  const anos = new Set();\n  const curYear = new Date().getFullYear();\n  anos.add(curYear);\n  movimentos.forEach(m=>anos.add(m.ano));\n  recargas.forEach(r=>anos.add(r.ano));\n  const sorted=[...anos].sort();\n  const sel=document.getElementById('sel-ano');\n  const cur=sel.value;\n  sel.innerHTML=sorted.map(y=>`<option value=\"${y}\">${y}<\/option>`).join('');\n  if(sorted.includes(parseInt(cur))) sel.value=cur;\n  else sel.value=curYear;\n}\n\nfunction onAnoChange(){ renderAll(); }\n\n// ============================================================\n// NAVIGATION\n// ============================================================\nfunction navMovel(id,btn){\n  showPage(id, document.querySelector(`.nav-item[onclick*=\"'${id}'\"]`));\n  document.querySelectorAll('#fin-mobile-nav button').forEach(b=>b.classList.toggle('mn-active', b===btn));\n}\nfunction showPage(id,btn){\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));\n  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));\n  const p=document.getElementById('page-'+id);\n  if(p) p.classList.add('active');\n  if(btn) btn.classList.add('active');\n  renderPage(id);\n}\n\nfunction showInner(group,id,btn){\n  const prefix=group+'-inner-';\n  document.querySelectorAll('[id^=\"'+prefix+'\"]').forEach(el=>el.classList.remove('active'));\n  const el=document.getElementById(prefix+id);\n  if(el) el.classList.add('active');\n  if(btn){\n    btn.parentElement.querySelectorAll('.inner-tab').forEach(b=>b.classList.remove('active'));\n    btn.classList.add('active');\n  }\n  if(group==='config') renderConfig(id);\n}\n\nfunction renderPage(id){\n  const map={dashboard:renderDashboard,lancamentos:renderLancamentos,fluxo:renderFluxo,cartao:renderCartao,cofre:renderCofre,modalidades:renderModalidades,eventos:renderEventos,funcionarios:renderFuncionarios,viaturas:renderViaturas,analise:renderAnalise,relatorio:renderRelatorio,agenda:renderAgenda,'gestao-config':()=>renderConfig('receitas')};\n  if(map[id]) map[id]();\n}\n\n// ============================================================\n// MODAL\n// ============================================================\nfunction openModal(id){ document.getElementById(id).classList.add('open'); }\nfunction closeModal(id){ document.getElementById(id).classList.remove('open'); }\ndocument.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));\n\nfunction openModalPre(tipo,cat,mov){\n  editingId=null;\n  document.getElementById('lancamento-modal-title').textContent='Novo lançamento';\n  resetForm();\n  setTipo(tipo);\n  if(cat){\n    setTimeout(()=>{\n      const s=document.getElementById('l-categoria');\n      for(let i=0;i<s.options.length;i++){if(s.options[i].value===cat){s.selectedIndex=i;break;}}\n      updateSub();\n    },40);\n  }\n  if(mov){\n    setTimeout(()=>{\n      const s=document.getElementById('l-tipmov');\n      for(let i=0;i<s.options.length;i++){if(s.options[i].value===mov){s.selectedIndex=i;break;}}\n      onMovChange();\n    },40);\n  }\n  openModal('modal-lancamento');\n}\n\nfunction resetForm(){\n  currentTipo='receita';\n  setTipo('receita');\n  const mes=getMes()||new Date().getMonth()+1;\n  document.getElementById('l-mes').value=mes;\n  document.getElementById('l-desc').value='';\n  document.getElementById('l-valor').value='';\n  document.getElementById('l-nota').value='';\n  document.getElementById('l-share').value=100;\n  document.getElementById('share-group').style.display='none';\n  document.getElementById('cartao-aviso').style.display='none';\n  const fn=document.getElementById('l-fat-num');if(fn)fn.value='';\n  const fd=document.getElementById('l-fat-data');if(fd)fd.value='';\n  const fl=document.getElementById('l-fat-label');if(fl)fl.innerHTML='📎 Clica ou
