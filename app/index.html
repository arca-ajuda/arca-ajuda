<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>ARCA d'Ajuda</title>
<link rel="icon" href="data:,">
<meta name="theme-color" content="#14395f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARCA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
<style>
:root{
  color-scheme:light;
  --teal:#0E9C7C;--teal-d:#076B54;--teal-l:#DFF7EF;
  --coral:#FF6B4A;--coral-l:#FFE7DF;--coral-d:#B8360F;
  --amber:#FFAB1F;--amber-l:#FFF1D8;--amber-d:#8A5A05;
  --sky:#2FA9E8;--sky-l:#E2F3FC;--sky-d:#0D6FA0;
  --purple:#8B5CF6;--purple-l:#F0E9FE;--purple-d:#5B21B6;
  --pink:#EC4899;--pink-l:#FCE7F3;--pink-d:#9D174D;
  --red:#DC2626;--red-l:#FDE8E8;--green:#16A34A;--green-l:#E6F6EA;
  --navy:#14395f;
  --text:#1a1a1a;--text-2:#5b5b5b;--text-3:#8a8a8a;
  --bg:#FCF9F1;--card:#fff;--line:#ECE7DA;--line-2:#DDD6C4;
  --crest-1:#3FD4E4;--crest-2:#2E86C9;--crest-3:#1B5FA8;
  --side:260px;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  display:flex;height:100dvh;overflow:hidden;font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{line-height:1.2}

/* ===== shell ===== */
#app{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}
#bar{display:flex;align-items:center;gap:6px;padding:0 10px;height:52px;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);box-sizing:content-box;z-index:40}
#bar .brand{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 8px 4px 2px;border-radius:10px;flex:0 0 auto}
#bar .brand:hover{background:#f4f1e8}
#bar .brand img{height:34px;width:auto}
#bar .brand b{font-size:14px;color:var(--navy);white-space:nowrap}
#nav{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#nav::-webkit-scrollbar{display:none}
#nav .sep{width:1px;height:22px;background:var(--line-2);margin:0 4px;flex:0 0 auto}
.nav-i{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 9px;border-radius:10px;font-size:13px;font-weight:500;white-space:nowrap;flex:0 0 auto}
.nav-i:hover{background:#f4f1e8}
.nav-i.on{background:var(--teal-l);color:var(--teal-d);font-weight:700}
.nav-i .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;background:var(--al,#eee)}
.bar-user{display:flex;align-items:center;gap:6px;flex:0 0 auto;font-size:12px;color:var(--text-2)}
.bar-user #whoName{font-weight:600;color:var(--text);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-user small{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:0 0 auto}
#view{flex:1;min-height:0;overflow:auto;padding:20px clamp(12px,2.4vw,30px) 40px;
  background:radial-gradient(900px 400px at 8% -10%,#E4F6F7,transparent 55%),radial-gradient(900px 420px at 100% 0,#FFF1D8,transparent 50%),var(--bg)}
body.out #app>#bar{display:none}
@media (max-width:1560px){.nav-i span:not(.ic){display:none}.nav-i.on span:not(.ic){display:inline}}
@media (max-width:1100px){#bar .brand b,.bar-user #whoName{display:none}}
@media (max-width:760px){#bar .brand b,.bar-user #whoName,.bar-user .dot,.lbl{display:none}#bar{padding:0 6px}}

/* ===== components ===== */
.btn{border:0;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;background:var(--teal);color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--teal-d)}
.btn.sec{background:#f1ede2;color:var(--text)}.btn.sec:hover{background:#e7e1d1}
.btn.line{background:#fff;border:1px solid var(--line-2);color:var(--text)}.btn.line:hover{background:#f6f3ea}
.btn.danger{background:var(--red)}.btn.danger:hover{background:#b91c1c}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.block{width:100%;justify-content:center}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:15px;margin-bottom:10px}
.page-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-h h1{font-family:Fraunces,Georgia,serif;font-size:clamp(22px,3vw,30px);color:var(--navy)}
.page-h p{color:var(--text-2);margin-top:3px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
.input,.select,.textarea{border:1px solid var(--line-2);border-radius:10px;padding:8px 11px;background:#fffdf8;min-width:0;font-size:13.5px}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--sky);border-color:transparent}
.textarea{width:100%;min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label{font-size:12px;font-weight:600;color:var(--text-2)}
.field .input,.field .select{width:100%}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--k,var(--teal));border-radius:12px;padding:12px 14px;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{box-shadow:0 6px 16px rgba(30,60,90,.1)}
.kpi small{display:block;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.kpi b{display:block;font-size:24px;margin-top:2px}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:#faf7ee;text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th.sort{cursor:pointer}.tbl th.sort:hover{color:var(--text)}
.tbl td{padding:9px 12px;border-bottom:1px solid #f3efe3;vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fbf9f2}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:#eee;color:#444;white-space:nowrap}
.chip.ok{background:var(--green-l);color:#166534}.chip.warn{background:var(--amber-l);color:var(--amber-d)}
.chip.bad{background:var(--red-l);color:#991b1b}.chip.info{background:var(--sky-l);color:var(--sky-d)}
.chip.mute{background:#f0ede4;color:var(--text-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tab{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--text-2);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--teal-d);border-bottom-color:var(--teal)}
.empty{text-align:center;color:var(--text-3);padding:36px 12px}
.muted{color:var(--text-2)}.small{font-size:12px}
div.err{background:var(--red-l);color:#9b2c14;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
div.info{background:var(--sky-l);color:var(--sky-d);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.spin{width:30px;height:30px;border-radius:50%;border:4px solid #e5dfcf;border-top-color:var(--teal);animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:50px;text-align:center;color:var(--text-2)}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:80;display:grid;place-items:center;padding:14px;overflow:auto}
.modal{background:#fff;border-radius:18px;width:min(560px,100%);max-height:calc(100dvh - 28px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(860px,100%)}
.modal>header{padding:16px 18px 10px;display:flex;align-items:center;gap:10px}
.modal>header h2{font-size:17px;flex:1}
.modal .x{border:0;background:#f1ede2;border-radius:8px;width:30px;height:30px;font-size:16px}
.modal .body{padding:6px 18px 14px;overflow:auto}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(380px,92vw)}
.toast{background:var(--navy);color:#fff;padding:11px 14px;border-radius:12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.ok{background:#166534}.toast.bad{background:#991b1b}

/* login */
#login{position:fixed;inset:0;overflow:auto;z-index:60;display:grid;place-items:center;padding:20px;
  background:radial-gradient(900px 400px at 8% -10%,#E4F6F7,transparent 55%),radial-gradient(900px 420px at 100% 0,#FFF1D8,transparent 50%),var(--bg)}
.lbox{width:min(420px,100%)}
.lhead{text-align:center;margin-bottom:16px}
.lhead img{height:84px;margin:0 auto 6px;filter:drop-shadow(0 4px 10px rgba(30,80,130,.25))}
.lhead h1{font-family:Fraunces,Georgia,serif;font-size:26px;color:var(--navy)}
.lcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 12px 30px rgba(30,60,90,.1)}
.lcard label.f{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:10px 0 4px}
.lcard .input{width:100%;padding:11px 12px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--text-2);margin-top:10px}
.chk input{margin-top:2px}
.priv{margin-top:14px;font-size:11.5px;color:var(--text-3);line-height:1.5;border-top:1px dashed var(--line);padding-top:10px}
.proto{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;background:var(--amber-l);color:var(--amber-d);padding:3px 10px;border-radius:99px}

/* lock + idle */
#lock{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(20,57,95,.92);backdrop-filter:blur(10px);padding:20px}
#lock .lcard{width:min(360px,100%)}
#idle{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;max-width:92vw}
#idle button{border:0;background:#fff;color:var(--navy);border-radius:8px;padding:6px 12px;font-weight:700}

/* home */
.grp{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);font-weight:700;margin:22px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:12px}}
@media (max-width:420px){.tiles{grid-template-columns:1fr}}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;border-top:4px solid var(--a);transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,60,90,.12)}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--al)}
.tile h3{font-size:15.5px}.tile p{font-size:12.5px;color:var(--text-2);flex:1}
.tile.soon{opacity:.55;cursor:default}.tile.soon:hover{transform:none;box-shadow:none}
.c-teal{--a:var(--teal);--al:var(--teal-l)}.c-coral{--a:var(--coral);--al:var(--coral-l)}.c-amber{--a:var(--amber);--al:var(--amber-l)}
.c-sky{--a:var(--sky);--al:var(--sky-l)}.c-purple{--a:var(--purple);--al:var(--purple-l)}.c-pink{--a:var(--pink);--al:var(--pink-l)}

@media (max-width:900px){
  .tbl th,.tbl td{padding:8px 9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#bar,#toasts,#idle{display:none!important}body{display:block;height:auto;overflow:visible}#view{overflow:visible;padding:0;background:#fff}}

/* aplicações antigas em moldura */
#view.legacy{padding:0;overflow:hidden;position:relative}
.lg-frame{display:block;width:100%;height:100%;border:0;background:#fff}
.lg-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted,#667);font-size:14px;pointer-events:none}

.tile .tg{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);font-weight:700}
.lg-load.err{color:#b00020;padding:20px;text-align:center}

@media (max-width:760px){.hm{display:none}}

</style>
</head>

function $(s,r){return (r||document).querySelector(s)}
A.$=$;
A.h=function(tag,attrs){
  var el=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k]; if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(k==='value')el.value=v;
    else if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);
  return el;
};
function add(el,c){
  if(c==null||c===false)return;
  if(Array.isArray(c))c.forEach(function(x){add(el,x)});
  else el.appendChild(c.nodeType?c:document.createTextNode(String(c)));
}

A.csv=function(rows,cols){

  return '﻿'+[cols.map(function(c){return q(c.t)}).join(';')].concat(rows.map(function(r){return cols.map(function(c){return q(c.v(r))}).join(';')})).join('\r\n');
};

/* ---------------- armazenamento ---------------- */
function lg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ld(k){try{localStorage.removeItem(k)}catch(e){}}

var SK='arca_app_sess',PK='arca_app_keep',SH='arca_app_shared';
function keep(){return lg(PK)==='1'}
function readSess(){var r=sg(SK)||(keep()?lg(SK):null);try{return r?JSON.parse(r):null}catch(e){return null}}
function writeSess(s){
  if(!s){sd(SK);ld(SK);return}
  var j=JSON.stringify(s); if(keep()){ls(SK,j);sd(SK)}else{ss(SK,j);ld(SK)}
}
var S=readSess();   // {access_token,refresh_token,expires_at,user}

/* ---------------- API ---------------- */
var refreshing=null;
function expMs(){return S&&S.expires_at?S.expires_at*1000:0}
async function refresh(){
  if(refreshing)return refreshing;
  refreshing=(async function(){
    // outro separador pode já ter renovado
    var cur=readSess(); if(cur&&S&&cur.refresh_token!==S.refresh_token){S=cur; if(expMs()-Date.now()>60000)return true}
    if(!S||!S.refresh_token)return false;
    var r;
    try{ r=await fetch(SUPA+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({refresh_token:S.refresh_token})}); }
    catch(e){ return 'offline'; }
    var d={}; try{d=await r.json()}catch(e){}
    if(!r.ok||!d.access_token)return false;
    d.user=d.user||S.user; if(!d.expires_at&&d.expires_in)d.expires_at=Math.floor(Date.now()/1000)+d.expires_in;
    S=d; writeSess(S); return true;
  })();
  try{return await refreshing}finally{refreshing=null}
}
/* pedido genérico à API REST. opts: {method, body, headers, prefer, raw} */
A.api=async function(path,opts,_retry){
  opts=opts||{};
  if(S&&expMs()-Date.now()<45000){ var ok=await refresh(); if(ok===false){await A.logout('A sessão expirou. Entre novamente.');throw new Error('AUTH_EXPIRED')} }
  var h={apikey:KEY,'Content-Type':'application/json','Authorization':'Bearer '+((S&&S.access_token)||KEY)};
  if(opts.prefer)h.Prefer=opts.prefer;
  if(opts.headers)Object.assign(h,opts.headers);
  var res=await fetch(SUPA+path,{method:opts.method||'GET',headers:h,body:opts.body!=null?(typeof opts.body==='string'?opts.body:JSON.stringify(opts.body)):null});
  if((res.status===401)&&!_retry&&S){ var ok2=await refresh(); if(ok2===true)return A.api(path,opts,1); await A.logout('A sessão expirou. Entre novamente.'); throw new Error('AUTH_EXPIRED'); }
  if(opts.raw)return res;
  var txt=await res.text(), data=null; try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  if(!res.ok){
    var msg=(data&&(data.message||data.error_description||data.msg||data.hint))||('Erro '+res.status);
    if(res.status===403||/row-level security/i.test(msg))msg='Sem permissão para esta operação.';
    var er=new Error(msg); er.status=res.status; er.data=data; throw er;
  }
  return data;
};
/* leitura de uma tabela (query = string PostgREST). Lê tudo em páginas de 1000. */
A.getAll=async function(table,query){
  var out=[],from=0,size=1000;
  for(;;){
    var res=await A.api('/rest/v1/'+table+(query?'?'+query:''),{raw:true,headers:{Range:from+'-'+(from+size-1),'Range-Unit':'items'}});
    var t=await res.text(),d=null; try{d=t?JSON.parse(t):[]}catch(e){d=[]}
    if(!res.ok){var m=(d&&d.message)||('Erro '+res.status); if(res.status===403)m='Sem permissão para ler "'+table+'".'; var er=new Error(m);er.status=res.status;throw er}
    out=out.concat(d); if(d.length<size)break; from+=size;
  }
  return out;
};
A.count=async function(table,filter){
  var res=await A.api('/rest/v1/'+table+'?select=id'+(filter?'&'+filter:''),{raw:true,headers:{Prefer:'count=exact',Range:'0-0','Range-Unit':'items'}});
  var cr=res.headers.get('content-range')||''; var m=cr.match(/\/(\d+)$/); return m?Number(m[1]):0;
};

/* tabela simples: cols=[{t,v(row)->texto|Node,cls,sort(row)->valor}], rows */
A.table=function(cols,rows,o){
  o=o||{};
  var wrap=A.h('div',{class:'tbl-wrap'}); var tb=A.h('table',{class:'tbl'}); wrap.appendChild(tb);
  var state={k:o.sortKey==null?-1:o.sortKey,dir:o.sortDir||1};
  function draw(){
    tb.innerHTML=''; var tr=A.h('tr');
    cols.forEach(function(c,i){
      var th=A.h('th',{class:(c.cls||'')+(c.sort?' sort':''),text:c.t+(state.k===i?(state.dir>0?' ▲':' ▼'):'')});
      if(c.sort)th.onclick=function(){state.dir=state.k===i?-state.dir:1;state.k=i;draw()};
      tr.appendChild(th);
    }); tb.appendChild(A.h('thead',null,tr));
    var data=rows.slice();
    if(state.k>=0&&cols[state.k].sort){var f=cols[state.k].sort;data.sort(function(a,b){var x=f(a),y=f(b);if(x==null)x='';if(y==null)y='';return (x<y?-1:x>y?1:0)*state.dir})}
    var body=A.h('tbody'); var max=o.limit||500;
    data.slice(0,max).forEach(function(r){
      var row=A.h('tr',{class:o.onRow?'click':''});
      cols.forEach(function(c){var td=A.h('td',{class:c.cls||''}); add(td,c.v(r)); row.appendChild(td)});
      if(o.onRow)row.onclick=function(e){if(e.target.closest('button,a,input,select'))return;o.onRow(r)};
      body.appendChild(row);
    });
    if(!data.length)body.appendChild(A.h('tr',null,A.h('td',{colspan:cols.length,class:'empty',text:o.empty||'Sem resultados.'})));
    else if(data.length>max)body.appendChild(A.h('tr',null,A.h('td',{colspan:cols.length,class:'empty small',text:'A mostrar '+max+' de '+data.length+'. Use a pesquisa ou os filtros para restringir.'})));
    tb.appendChild(body);
  }
  draw(); return wrap;
};


/* ---------------- aplicações antigas dentro da app (iframe, sem tocar nos originais) ----------------
   O HTML original (já com pequenos ajustes feitos em build/legacy.py) corre numa moldura própria.
   Não guarda nada no dispositivo (localStorage em memória) e usa a sessão da app única. */
A.token=function(){return S&&S.access_token};
/* token válido para usar já (renova se estiver a expirar; se a sessão acabou, termina-a) */
A.freshToken=async function(){
  if(S&&expMs()-Date.now()<45000){ var ok=await refresh(); if(ok===false){await A.logout('A sessão expirou. Entre novamente.');throw new Error('AUTH_EXPIRED')} }
  return (S&&S.access_token)||'';
};
A.legacy=function(def){
  var m={id:def.id,title:def.title,icon:def.icon,color:def.color,group:def.group,desc:def.desc,roles:def.roles,legacyUrl:def.url};
  var frame=null, host=null;
  m.mount=function(el){
    el.classList.add('legacy'); host=el;
    A.log(def.id,'', 'Abriu '+def.title);
    var load=A.h('div',{class:'lg-load',text:'A abrir '+def.title+'…'});
    frame=document.createElement('iframe');
    frame.className='lg-frame'; frame.setAttribute('title',def.title);
    frame.setAttribute('allow','clipboard-write');
    var fr=frame;
    el.appendChild(fr); el.appendChild(load);
    /* def.prepare (opcional): prepara o HTML antes de abrir (ex.: ler código auxiliar da base de dados) */
    Promise.resolve().then(function(){return def.prepare?def.prepare(def.html):def.html}).then(function(h){
      if(frame===fr){ fr.addEventListener('load',function(){ if(load.parentNode)load.remove(); },{once:true}); fr.srcdoc=h; }
    },function(e){
      if(frame===fr){ load.textContent='Não foi possível abrir '+def.title+': '+((e&&e.message)||e); load.classList.add('err'); }
    });
    return function(){ m.unmount(); };
  };
  m.unmount=function(){
    var f=frame, h=host; frame=null; host=null;
    if(h)h.classList.remove('legacy');
    if(!f)return;
    /* espera que as gravações pendentes terminem antes de fechar a moldura (evita perder dados) */
    f.style.display='none';
    var w=null; try{w=f.contentWindow}catch(e){}
    var pend=null; try{pend=w&&w.__pendentes&&w.__pendentes()}catch(e){}
    var kill=function(){ try{f.remove()}catch(e){} };
    if(pend&&pend.then){ var t=setTimeout(kill,20000); pend.then(function(){clearTimeout(t);kill()},function(){clearTimeout(t);kill()}); }
    else kill();
  };
  m.reset=function(){ if(frame){ try{frame.remove()}catch(e){} frame=null; } };
  return m;
};

A.login=async function(email,pw){
  var r=await fetch(SUPA+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({email:email,password:pw})});
  var d={}; try{d=await r.json()}catch(e){}
  if(!r.ok||!d.access_token)throw new Error(d.error_description||d.msg||'Email ou palavra-passe incorretos.');
  if(!d.expires_at&&d.expires_in)d.expires_at=Math.floor(Date.now()/1000)+d.expires_in;
  S=d; writeSess(S);
  try{await loadPerfil()}catch(e){S=null;writeSess(null);throw e}
};
A.logout=async function(msg){
  var tok=S&&S.access_token, shared=sg(SH)==='1';
  S=null; A.user=null; A.perfil=null; writeSess(null); stopIdle(); closeAllModals();
  A.modules.forEach(function(m){if(m.reset){try{m.reset()}catch(e){}}});
  if(tok){try{await fetch(SUPA+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+tok}})}catch(e){}}
  if(shared){try{localStorage.clear()}catch(e){}try{sessionStorage.clear()}catch(e){}}
  if(A.current&&A.current.unmount){try{A.current.unmount()}catch(e){}} A.current=null;
  $('#view').innerHTML='';
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  showLogin(msg||'');
};

/* ---------------- inatividade ---------------- */
var idleT,warnT,tickT,idleBound=false;
function bump(){
  if(!A.user)return;
  $('#idle').hidden=true; clearTimeout(idleT);clearTimeout(warnT);clearInterval(tickT);
  warnT=setTimeout(function(){
    var left=Math.round(WARN_MS/1000); $('#idle').hidden=false;

  var s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return '';

    var out=[],cur='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}else if((ch===';'||ch===',')&&!q&&(ch===';'||l.indexOf(';')<0)){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out});
}
async function importRows(rows,msg){

  if(col.nome<0){msg.textContent='Não encontrei a coluna do Nome.';return}
  var data=rows.slice(hi+1).filter(function(l){return l&&l[col.nome]&&String(l[col.nome]).trim()});
  var g=function(l,k){return col[k]>-1?l[col[k]]:''};
  var exist={};S.socios.forEach(function(s){exist[s.num]=1});var auto=nextNum(),ok=0,dup=0,bad=0,novos=[];
  var ok2=await A.confirm('Importar '+data.length+' linha(s)? Sócios cujo nº já existe são ignorados (nunca se sobrepõem dados existentes).',{ok:'Importar',title:'Confirmar importação'});

    var val=pData(g(l,'val')),sit=tipoIsento(tipo)?'ISENTO':(val?sitOf({validade_quota:val,tipo:tipo,num:n}):'VENCIDO');
    var cell=function(k){var v=g(l,k);return typeof v==='number'?String(Math.round(v)):String(v==null?'':v).trim()};
    var row=toRow({num:n,nome:nome,sexo:String(g(l,'sexo')||'').toUpperCase().slice(0,1),nif:cell('nif'),tipo:tipo,di:pData(g(l,'di')),dp:pData(g(l,'dp')),per:'1ano',val:val,estado:est,tel:cell('tel'),morada:cell('morada'),cp:cell('cp'),email:cell('email'),quota:String(g(l,'quota')||'').replace('€','').replace(',','.'),situacao:sit,obs:cell('obs'),isento:tipoIsento(tipo)});
    try{var r=await A.insert('socios',row);S.socios.push(r[0]);exist[n]=1;ok++;if(S.tipos.every(function(t){return t.nome!==tipo})&&novos.indexOf(tipo)<0)novos.push(tipo);if(ok%20===0)msg.textContent='A importar… '+(ok+dup+bad)+'/'+data.length}
    catch(e){bad++;if(e.message==='AUTH_EXPIRED')break}
  }
  for(var k=0;k<novos.length;k++){try{var tr=await A.insert('socios_tipos',{nome:novos[k],ordem:S.tipos.length,isento:false});S.tipos.push(tr[0])}catch(e){}}
  S.socios.sort(function(a,b){return a.num-b.num});
  A.log('importar','',ok+' sócios importados ('+dup+' já existiam, '+bad+' falharam)');
  msg.textContent='✓ '+ok+' importado(s)'+(dup?' · '+dup+' já existiam (ignorados)':'')+(bad?' · ⚠ '+bad+' falharam':'');
}

px 14px rgba(8,30,60,.28);z-index:50}\n.side-top-row{order:1;flex:0 0 auto}\nnav#tabs{order:2;flex-direction:row!important;flex-wrap:nowrap!important;flex:1 1 0;min-width:0;gap:4px!important;padding:2px 0!important;width:auto!important;overflow-x:auto!important;scrollbar-width:none}\nnav#tabs::-webkit-scrollbar{display:none}\nnav#tabs button{flex:0 0 auto;border-left:none!important;border-bottom:3px solid var(--c)!important;border-radius:8px!important;padding:6px 7px!important;font-size:12.5px!important;transform:none!important}\nnav#tabs button.active{border-bottom-color:rgba(255,255,255,.7)!important}\n.side-period{order:3;flex-direction:row!important;border:none!important;padding:0!important;gap:6px!important;align-items:center!important;flex:0 0 auto;flex-wrap:nowrap!important}\naside#side select{width:auto!important;max-width:150px;padding:5px 6px!important;font-size:12.5px}\n#ano-sel{width:86px!important;max-width:86px!important}#ed-sel{width:172px!important;max-width:172px!important}\n.side-period-btns{flex:0 0 auto;flex-wrap:nowrap}\n.side-period-btns .side-mini{flex:0 0 auto;padding:6px 7px;white-space:nowrap}\n.side-foot{order:4;margin:0 0 0 2px!important;border:none!important;padding:0!important;flex:0 0 auto;flex-wrap:nowrap!important;gap:5px}\n.side-foot #cloud-pill{flex:0 0 auto;white-space:nowrap;font-size:0!important;padding:4px 8px}\n.side-foot #cloud-pill::first-letter{font-size:14px}\n.side-home{padding:6px 11px!important;white-space:nowrap;font-size:12.5px!important}\nmain{max-width:1500px!important;padding:14px 18px 60px!important}\n#ajuda-fab{bottom:14px}\n@media(max-width:820px){main{padding:12px 10px 60px!important}aside#side{position:static!important;flex-wrap:wrap!important}nav#tabs{order:5;flex:1 1 100%!important}.side-top-row{flex:0 0 auto}.side-period{flex:1 1 auto;overflow-x:auto}.side-foot{margin-left:auto!important}}\n<\/style>\n<\/head>\n<body>\n\n<div id=\"login-screen\">\n  <div id=\"login-card\">\n    <h1>☀️ ATL ARCAKIDS<\/h1>\n    <div class=\"sub\">Gestão do ATL — ARCA d'Ajuda<\/div>\n    <label>Email<\/label>\n    <input type=\"email\" id=\"lg-email\" autocomplete=\"username\" placeholder=\"atl.arcakids@gmail.com\">\n    <label>Palavra-passe<\/label>\n    <input type=\"password\" id=\"lg-pass\" autocomplete=\"current-password\" placeholder=\"••••••••\" onkeydown=\"if(event.key==='Enter')fazerLogin()\">\n    <button class=\"btn btn-primary\" onclick=\"fazerLogin()\">Entrar<\/button>\n    <div id=\"login-msg\"><\/div>\n    <div class=\"muted\" style=\"margin-top:14px;font-size:12px;text-align:center;line-height:1.5\">Entra sempre com a <b>conta da associação<\/b> para os dados ficarem guardados e sincronizados em todos os computadores.<\/div>\n  <\/div>\n<\/div>\n\n<div id=\"cloud-banner\" style=\"display:none\">⚠️ SEM LIGAÇÃO À CONTA — as alterações podem NÃO estar a ser guardadas nem sincronizadas. Verifica a internet e recarrega (Ctrl+F5).<\/div>\n<div id=\"app\">\n  <aside id=\"side\">\n    <div class=\"brand\">☀️ ATL ARCAKIDS<\/div>\n    <div class=\"side-top-row\">\n      <a class=\"side-geral\" href=\"#\" onclick=\"parent.ARCA.go('');return false\" title=\"Voltar ao menu geral da ARCA d'Ajuda\">⬅️ Geral<\/a>\n      <button class=\"side-home\" data-tab=\"dashboard\" onclick=\"showTab('dashboard')\" title=\"Painel\">📊 Painel<\/button>\n    <\/div>\n    <div class=\"side-period\">\n      <select id=\"ano-sel\" title=\"Ano\" onchange=\"onAnoChange(this.value)\"><\/select>\n      <select id=\"ed-sel\" onchange=\"onEdicaoChange(this.value)\"><\/select>\n      <div class=\"side-period-btns\">\n        <button class=\"side-mini\" title=\"Editar nome/datas ou eliminar este período\" onclick=\"editarPeriodoAtual()\">✏️ Editar<\/button>\n        <button class=\"side-mini\" onclick=\"abrirModalEdicao()\">+ Período<\/button>\n      <\/div>\n      <button id=\"drive-aviso\" class=\"side-drive-aviso\" hidden onclick=\"driveReligarEGuardar()\">⚠️ Religar a Google Drive p/ guardar<\/button>\n    <\/div>\n    <nav id=\"tabs\">\n      <button data-tab=\"criancas\" onclick=\"showTab('criancas')\">🧒 Inscrições<\/button>\n      <button data-tab=\"mapa\" onclick=\"showTab('mapa')\">📆 Semanas / Mapa<\/button>\n      <button data-tab=\"despesas\" onclick=\"showTab('despesas')\">💸 Despesas<\/button>\n      <button data-tab=\"receitas\" onclick=\"showTab('receitas')\">💰 Receitas<\/button>\n      <button data-tab=\"precos\" onclick=\"showTab('precos')\">🏷️ Valores<\/button>\n      <button data-tab=\"documentos\" onclick=\"showTab('documentos')\">📄 Documentos<\/button>\n    <\/nav>\n    <div class=\"side-foot\">\n      <span id=\"cloud-pill\" title=\"Estado da cloud — clica para sincronizar\" style=\"cursor:pointer\" onclick=\"marcaCloud(null);hidratarCloud().then(ok=>toast(ok===false?'Sem ligação à cloud — verifica a internet.':'Sincronizado.', ok!==false))\">•<\/span>\n      <button class=\"side-icon def\" onclick=\"showTab('definicoes')\" title=\"Definições\">⚙️<\/button>\n      <button class=\"side-icon sair\" onclick=\"sair()\" title=\"Sair\">⏻<\/button>\n    <\/div>\n  <\/aside>\n\n  <div id=\"content\">\n  <main>\n    <div id=\"ano-banner\" class=\"hidden\" style=\"background:#FFF3D6;border:1.5px solid #E6B800;color:#6b4e00;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:600\">📅 <b>Vista anual<\/b> — soma de todos os períodos do ano. Só para consulta (receitas, despesas e inscrições de todo o ATL). Para <b>editar<\/b>, escolhe um período específico no seletor de períodos (menu lateral).<\/div>\n    <div id=\"sec-dashboard\" class=\"section active\"><\/div>\n    <div id=\"sec-criancas\" class=\"section\"><\/div>\n    <div id=\"sec-semanas\" class=\"section\"><\/div>\n    <div id=\"sec-mapa\" class=\"section\"><\/div>\n    <div id=\"sec-despesas\" class=\"section\"><\/div>\n    <div id=\"sec-receitas\" class=\"section\"><\/div>\n    <div id=\"sec-equipa\" class=\"section\"><\/div>\n    <div id=\"sec-atividades\" class=\"section\"><\/div>\n    <div id=\"sec-precos\" class=\"section\"><\/div>\n    <div id=\"sec-documentos\" class=\"section\"><\/div>\n    <div id=\"sec-definicoes\" class=\"section\"><\/div>\n  <\/main>\n  <\/div>\n  <button id=\"ajuda-fab\" title=\"Ajuda — arrasta para mover\">❓ Ajuda<\/button>\n<\/div>\n\n<div id=\"pub\"><\/div>\n\n<div class=\"overlay\" id=\"ov\">\n  <div class=\"modal\">\n    <div class=\"modal-head\"><div class=\"t\" id=\"ov-title\">—<\/div><button class=\"modal-close\" onclick=\"fecharModal()\">×<\/button><\/div>\n    <div class=\"modal-body\" id=\"ov-body\"><\/div>\n    <div class=\"modal-foot\" id=\"ov-foot\"><\/div>\n  <\/div>\n<\/div>\n\n<div id=\"toast\"><\/div>\n\n<script>\n/* ============================================================\n   ATL ARCAKIDS — app autónoma (ARCA d'Ajuda)\n   localStorage + espelho na cloud (Supabase, tabela atl_dados)\n   ============================================================ */\nconst SUPA_URL = 'https://yfsyifypsrqnwkqkfrnm.supabase.co';\nconst SUPA_KEY = 'sb_publishable_AkzlMeHlYHDyl0HzeC7_qg__j_Y6C9W';\n\nconst LS = {\n  get(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } },\n  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },\n  del(k){ try{ localStorage.removeItem(k); }catch(e){} }\n};\nconst $ = id => document.getElementById(id);\nconst esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\nconst fmt = n => '€ ' + (Number(n)||0).toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst uid = () => 'x'+Math.random().toString(36).slice(2,9)+(performance.now()|0).toString(36);\nconst FORMAS_PAG = ['','Numerário','Cartão Pré-Pago (MB)','MB Way','Transferência','Multibanco (Entidade/Ref)','Cheque'];\nconst MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];\nconst DIAS_SEM=['D','S','T','Q','Q','S','S'];\nconst DIAS_SEM_FULL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];\n// feriados nacionais fixos (MM-DD) + Madeira (07-01, 12-26)\nconst FERIADOS=['01-01','04-25','05-01','06-10','08-15','10-05','11-01','12-01','12-08','12-25','07-01','12-26'];\nlet _toastT=null;\nfunction toast(msg, ok=true){ const t=$('toast'); t.textContent=msg; t.className='show'+(ok?'':' err'); clearTimeout(_toastT); _toastT=setTimeout(()=>t.className='',2600); }\n\n/* ---------- Supabase auth ---------- */\nlet supaSession = { get access_token(){ return parent.ARCA.token(); }, get user(){ return parent.ARCA.user; }, refresh_token:null };\nlet modoLocal = false; try{ LS.del('atl_modo_local'); }catch(e){}\nasync function supaAuthLogin(email, password){\n  const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{ method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY}, body: JSON.stringify({email,password}) });\n  const data = await res.json();\n  if(!res.ok) throw new Error(data.error_description||data.msg||data.error||'Email ou palavra-passe incorretos.');\n  supaSession = data; LS.set('atl_supa_session', supaSession); return data;\n}\nasync function supaSignup(email, password){\n  const res = await fetch(`${SUPA_URL}/auth/v1/signup`,{ method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY}, body: JSON.stringify({email,password}) });\n  const data = await res.json();\n  if(!res.ok) throw new Error(data.error_description||data.msg||data.error||'Não foi possível criar a conta.');\n  if(data.access_token){ supaSession=data; LS.set('atl_supa_session', supaSession); } return data;\n}\n// renova o acesso com o refresh_token (a sessão expira ~1h) — evita \"Sem ligação\" com sessão iniciada\nlet _refreshing=null, _sessaoMorta=false, _ultimoErroCloud='';\nasync function supaRefresh(){\n  const rt = supaSession && supaSession.refresh_token; if(!rt){ _sessaoMorta=true; return false; }\n  if(_refreshing) return _refreshing;\n  _refreshing = (async()=>{\n    try{ const res=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`,{ method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_KEY}, body:JSON.stringify({refresh_token:rt}) });\n      const data=await res.json();\n      if(res.ok && data.access_token){ supaSession=data; LS.set('atl_supa_session', supaSession); _sessaoMorta=false; return true; }\n      if(res.status===400 || res.status===401 || res.status===403){ _sessaoMorta=true; _ultimoErroCloud='sessão expirada ('+res.status+')'; } }   // servidor recusou o refresh → sessão morta\n    catch(e){ console.warn('refresh',e); _ultimoErroCloud='sem rede'; }   // erro de rede → NÃO é sessão morta\n    return false;\n  })();\n  const ok=await _refreshing; _refreshing=null; return ok;\n}\nasync function supaFetch(path, method='GET', body=null, extra=null){\n  const hdr=Object.assign({}, extra||{}); const pref=hdr.Prefer||(method!=='GET'?'return=representation':undefined); delete hdr.Prefer;\n  return parent.ARCA.api('/rest/v1/'+path, {method, body: body||undefined, prefer: pref, headers: hdr});\n}\nconst CLOUD_ON = () => !modoLocal && supaSession && supaSession.access_token;\nfunction ehChaveAtl(k){ return typeof k==='string' && k.indexOf('atl_')===0 && k!=='atl_supa_session' && k!=='atl_modo_local'; }\nlet _fila = Promise.resolve();\nfunction cloudGuardar(chave, valor){\n  if(!CLOUD_ON()) return;\n  _fila = _fila.then(()=>supaFetch('atl_dados','POST',{chave, valor, atualizado_em:new Date().toISOString()},{'Prefer':'resolution=merge-duplicates'})).then(()=>marcaCloud(true)).catch(e=>{ console.warn('cloud guardar',chave,e); _ultimoErroCloud=(e&&e.message)||_ultimoErroCloud; marcaCloud(false); });\n}\nfunction cloudApagar(chave){ if(!CLOUD_ON()) return; _fila=_fila.then(()=>supaFetch('atl_dados?chave=eq.'+encodeURIComponent(chave),'DELETE')).catch(e=>console.warn('cloud apagar',chave,e)); }\nfunction save(k,v){ LS.set(k,v); if(ehChaveAtl(k)) cloudGuardar(k,v); }\nfunction del(k){ LS.del(k); if(ehChaveAtl(k)) cloudApagar(k); }\nasync function hidratarCloud(){\n  if(!CLOUD_ON()){ marcaCloud(null); return false; }\n  let rows; try{ rows = await supaFetch('atl_dados?select=chave,valor'); }catch(e){ console.warn('cloud ler',e); _ultimoErroCloud=(e&&e.message)||_ultimoErroCloud; marcaCloud(false); return false; }\n  if(rows && rows.length){ rows.forEach(r=>{ try{ localStorage.setItem(r.chave, JSON.stringify(r.valor)); }catch(e){} }); }\n  else{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(ehChaveAtl(k)){ try{ cloudGuardar(k, JSON.parse(localStorage.getItem(k))); }catch(e){} } } }\n  marcaCloud(true); return true;\n}\nfunction marcaCloud(state){ const b=$('cloud-banner');\n  if(b){ b.style.display=(state===false)?'block':'none';\n    if(state===false){ b.innerHTML='⚠️ SEM LIGAÇÃO À CONTA — as alterações podem NÃO estar a ser guardadas. '+(_ultimoErroCloud?('<span style=\"opacity:.85\">('+String(_ultimoErroCloud).replace(/[<>]/g,'').slice(0,90)+')<\/span> '):'')+'Verifica a internet ou <b>entra outra vez<\/b>.'; } }\n  const p=$('cloud-pill'); if(!p) return;\n  if(modoLocal){ p.textContent='📴 Local'; return; }\n  p.textContent = state===true?'☁️ Ligado':state===false?'⚠️ Sem ligação':'☁️ …';\n}\n\n/* ============================================================\n   CÓPIA DE SEGURANÇA NA GOOGLE DRIVE (Ano → ATL)\n   ============================================================ */\nlet _driveTok=null, _driveTokExp=0, _driveTC=null, _drivePendente=false;\nfunction driveLigada(){ return !!_driveTok && Date.now()<_driveTokExp; }\nfunction atualizaDriveAviso(){\n  const el=$('drive-aviso'); if(!el) return;\n  const auto=getCfg().driveAuto;\n  if(!auto){ el.hidden=true; return; }\n  if(!driveLigada()){ el.hidden=false; el.textContent = _drivePendente? '⚠️ Há alterações por guardar na Drive — religar' : '⚠️ Religar a Google Drive p/ guardar'; }\n  else if(_drivePendente){ el.hidden=false; el.textContent='☁️ Guardar alterações na Drive'; }\n  else { el.hidden=true; }\n}\nasync function driveReligarEGuardar(){ try{ toast('A ligar à Google Drive…'); await driveGetToken(true); _drivePendente=false; atualizaDriveAviso(); toast('A guardar na Drive…'); const rootId=await driveFolder('ATL ARCAKIDS','root'); for(const ed of edicoes){ await driveBackupEdicao(rootId, ed, true); } LS.set('atl_drive_ultima', Date.now()); toast('✅ Cópia guardada na Google Drive.'); atualizaDriveAviso(); }catch(e){ console.warn(e); toast('Não consegui guardar na Drive. Confirma o Client ID e a ligação.',false); } }\nfunction driveClient(){ toast('A cópia na Google Drive faz-se na aplicação ATL original (a ligação à Google não funciona dentro da app única).',false); return null;\n  const cid=(getCfg().driveClientId||'').trim();\n  if(!cid){ toast('Falta o Client ID da Google (Definições → Cópia na Google Drive).',false); return null; }\n  if(!(window.google&&google.accounts&&google.accounts.oauth2)){ toast('A biblioteca da Google ainda não carregou — espera uns segundos e tenta de novo.',false); return null; }\n  if(!_driveTC || _driveTC._cid!==cid){ _driveTC=google.accounts.oauth2.initTokenClient({client_id:cid, scope:'https://www.googleapis.com/auth/drive.file', callback:()=>{}}); _driveTC._cid=cid; }\n  return _driveTC;\n}\nfunction driveGetToken(interactive){\n  return new Promise((resolve,reject)=>{\n    if(_driveTok && Date.now()<_driveTokExp-60000) return resolve(_driveTok);\n    const tc=driveClient(); if(!tc) return reject(new Error('Sem Client ID / biblioteca.'));\n    tc.callback=(resp)=>{ if(resp&&resp.access_token){ _driveTok=resp.access_token; _driveTokExp=Date.now()+((resp.expires_in||3600)*1000); resolve(_driveTok); } else reject(new Error((resp&&resp.error)||'Não autorizado.')); };\n    try{ tc.requestAccessToken({prompt: interactive?'consent':''}); }catch(e){ reject(e); }\n  });\n}\n// religa a Drive automaticamente (sem pedir nada) se já foi autorizada antes e há sessão Google ativa\nasync function driveAutoReligar(tent){ return;\n  tent=tent||0; const cfg=getCfg();\n  if(!cfg.driveAuto || !(cfg.driveClientId||'').trim()) return;   // Drive não configurada\n  if(driveLigada()){ atualizaDriveAviso(); return; }              // já ligada\n  if(!(window.google&&google.accounts&&google.accounts.oauth2)){  // biblioteca da Google ainda a carregar\n    if(tent<20) setTimeout(()=>driveAutoReligar(tent+1), 500); return; }\n  try{ await driveGetToken(false); _drivePendente=false; atualizaDriveAviso(); const el=$('drive-estado'); if(el) el.textContent='✅ Google Drive ligada nesta sessão.'; }\n  catch(e){ /* 1ª vez ou sem sessão Google → mantém o aviso para ligar à mão */ }\n}\nasync function driveFetch(path, method='GET', body){\n  const res=await fetch('https://www.googleapis.com'+path,{method,headers:{Authorization:'Bearer '+_driveTok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});\n  const j=await res.json().catch(()=>({})); if(!res.ok) throw new Error((j.error&&j.error.message)||('Drive '+res.status)); return j;\n}\nfunction driveEscQ(s){ return String(s||'').replace(/'/g,\"\\\\'\"); }\nasync function driveFolder(nome, parent){\n  nome=String(nome||'').replace(/[\\\\/]/g,'-')||'sem-nome';\n  const q=encodeURIComponent(`name='${driveEscQ(nome)}' and mimeType='application/vnd.google-apps.folder' and '${parent}' in parents and trashed=false`);\n  const r=await driveFetch(`/drive/v3/files?q=${q}&fields=files(id,name)&spaces=drive`);\n  if(r.files&&r.files.length) return r.files[0].id;\n  const c=await driveFetch(`/drive/v3/files?fields=id`,'POST',{name:nome, mimeType:'application/vnd.google-apps.folder', parents:[parent]});\n  return c.id;\n}\nasync function driveUpsert(nome, parent, mime, content){\n  const blob = content instanceof Blob ? content : new Blob([content],{type:mime});\n  const q=encodeURIComponent(`name='${driveEscQ(nome)}' and '${parent}' in parents and trashed=false`);\n  const found=await driveFetch(`/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);\n  if(found.files&&found.files.length){\n    const id=found.files[0].id;\n    const res=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+_driveTok},body:blob});\n    if(!res.ok) throw new Error('Drive update '+res.status); return id;\n  }\n  const form=new FormData();\n  form.append('metadata', new Blob([JSON.stringify({name:nome, parents:[parent], mimeType:mime})],{type:'application/json'}));\n  form.append('file', blob);\n  const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{Authorization:'Bearer '+_driveTok},body:form});\n  const j=await res.json().catch(()=>({})); if(!res.ok) throw new Error((j.error&&j.error.message)||('Drive upload '+res.status)); return j.id;\n}\nfunction dataUrlToBlob(u){ const c=String(u||'').split(','); const mime=(c[0].match(/data:([^;]+)/)||[])[1]||'application/octet-stream'; const bin=atob(c[1]||''); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }\nfunction driveExt(u){ return /application\\/pdf/.test(String(u||''))?'pdf':'jpg'; }\nasync function driveBackupEdicao(rootId, ed, incluirDocs){\n  const d=LS.get('atl_ed_'+ed.id); if(!d) return;\n  const anoF=await driveFolder(String(ed.ano||'sem-ano'), rootId);\n  const atlF=await driveFolder(ed.nome||'ATL', anoF);\n  await driveUpsert('dados.json', atlF, 'application/json', JSON.stringify({edicao:ed, dados:d}, null, 2));\n  if(incluirDocs){\n    const comDocs=(d.criancas||[]).filter(c=>c.anexos&&(c.anexos.comprovativo||c.anexos.ccFrente||c.anexos.ccVerso));\n    if(comDocs.length){ const docsF=await driveFolder('Documentos', atlF);\n      for(const c of comDocs){ const ax=c.anexos||{}; const cF=await driveFolder(((c.numero?('#'+c.numero+' '):'')+(c.nome||'crianca')), docsF);\n        for(const [k,fn] of [['comprovativo','comprovativo'],['ccFrente','CC-frente'],['ccVerso','CC-verso']]){ const a=ax[k]; if(a&&a.dataUrl){ try{ const blob=dataUrlToBlob(a.dataUrl); await driveUpsert(fn+'.'+driveExt(a.dataUrl), cF, blob.type, blob); }catch(e){ console.warn('doc',e); } } }\n      }\n    }\n  }\n}\nasync function driveLigar(){ try{ toast('A abrir a autorização da Google…'); await driveGetToken(true); _drivePendente=false; atualizaDriveAviso(); toast('Google Drive ligada. ✅'); const el=$('drive-estado'); if(el) el.textContent='✅ Google Drive ligada nesta sessão.'; }catch(e){ console.warn(e); toast('Não foi possível ligar à Google Drive. Confirma o Client ID e o domínio autorizado.',false); } }\nasync function driveBackupTudo(){\n  if(!edicoes.length){ toast('Não há ATL para guardar.',false); return; }\n  try{ toast('A ligar à Google Drive…'); await driveGetToken(true);\n    const rootId=await driveFolder('ATL ARCAKIDS','root');\n    toast('A guardar na Drive… (pode demorar um pouco)');\n    for(const ed of edicoes){ await driveBackupEdicao(rootId, ed, true); }\n    LS.set('atl_drive_ultima', Date.now()); _drivePendente=false; atualizaDriveAviso();\n    toast('✅ Cópia guardada na Google Drive (Ano → ATL).');\n  }catch(e){ console.warn(e); toast('Falha ao guardar na Drive: '+(e.message||'erro'),false); }\n}\nlet _driveAutoT=null;\nfunction driveAutoBackup(){\n  if(!getCfg().driveAuto) return;\n  if(!driveLigada()){ driveGetToken(false).then(()=>{ _drivePendente=false; atualizaDriveAviso(); driveAutoBackup(); }).catch(()=>{ _drivePendente=true; atualizaDriveAviso(); }); return; } // expirou → tenta religar em silêncio; se não der, avisa\n  if(modoAno()||!edicaoAtiva) return;\n  clearTimeout(_driveAutoT);\n  _driveAutoT=setTimeout(async()=>{ try{ const rootId=await driveFolder('ATL ARCAKIDS','root'); const ed=getEdicao(); if(ed&&ed.id) await driveBackupEdicao(rootId, ed, false); LS.set('atl_drive_ultima', Date.now()); _drivePendente=false; atualizaDriveAviso(); }catch(e){ console.warn('auto drive',e); _drivePendente=true; atualizaDriveAviso(); } }, 6000);\n}\n\n/* ============================================================\n   MODELO DE DADOS\n   atl_edicoes -> [{id,nome,ano,dataInicio,dataFim}]\n   atl_edicao_ativa -> id\n   atl_ed_<id> -> {criancas,despesas,equipa,atividades,receitas,categorias,precos,semanasMeta}\n   atl_cfg -> {emailEnvio,emailNotif,emailDrive}\n   ============================================================ */\nconst CATEGORIAS_DEFAULT = ['Alimentação','Seguros','Atividades / Visitas','Autocarro / Saídas','Material','Camisolas / T-shirts','Funcionários','Professores convidados','Outros'];\nconst CATEGORIAS_REC_DEFAULT = ['Donativos','Apoios / Subsídios','Eventos','Venda de material','Camisolas','Outros'];\nfunction hoje(){ return new Date().toISOString().slice(0,10); }\n// estrutura de preços (tudo editável, varia de ano para ano)\nfunction precosDefault(){\n  const packs = [1,2,3,4,5,6,7,8,9].map(n=>({id:uid(), label:n+(n===1?' semana':' semanas'), semanas:n, avulso:false, preco:0, descontoArca:0}));\n  return {\n    inscricoes:[ {id:uid(), label:'1 dia (avulso)', semanas:0, avulso:true, preco:0, descontoArca:0}, ...packs ],\n    precoMes:0, descontoArcaMes:0, descontoAtletaSemana:0,\n    descontoIrmao:{tipo:'€/semana', valor:0},\n    campanhas:[],\n    atividades:['Piscina','IlhaPark','Museu','Canoagem'].map(n=>({id:uid(),nome:n,preco:0})),\n    alimentacaoDiaria:{almoco:0, lancheManha:0, lancheTarde:0},\n    outros:['Seguro','Seguro acidentes pessoais','Camisola / t-shirt'].map(n=>({id:uid(),nome:n,preco:0})),\n  };\n}\nfunction normalizaPrecos(p){\n  p = p||{};\n  if(!Array.isArray(p.inscricoes)||!p.inscricoes.length) p.inscricoes = precosDefault().inscricoes;\n  p.inscricoes.forEach(x=>{ if(!x.id) x.id=uid(); if(x.descontoArca==null) x.descontoArca=0; });\n  if(p.precoMes==null) p.precoMes=0; if(p.descontoArcaMes==null) p.descontoArcaMes=0;\n  if(p.descontoAtletaSemana==null){ const one=(p.inscricoes||[]).find(x=>!x.avulso&&+x.semanas===1); p.descontoAtletaSemana = one?(+one.descontoArca||0):0; }\n  if(!p.descontoIrmao||typeof p.descontoIrmao!=='object') p.descontoIrmao={tipo:'€/semana', valor:(p.descontoIrmaos||0)};\n  if(!Array.isArray(p.campanhas)) p.campanhas=[];\n  if(!Array.isArray(p.atividades)) p.atividades=precosDefault().atividades;\n  if(!p.alimentacaoDiaria||typeof p.alimentacaoDiaria!=='object') p.alimentacaoDiaria={almoco:0,lancheManha:0,lancheTarde:0};\n  if(!Array.isArray(p.outros)) p.outros=precosDefault().outros;\n  p.atividades.forEach(x=>{ if(!x.id) x.id=uid(); });\n  p.outros.forEach(x=>{ if(!x.id) x.id=uid(); });\n  p.campanhas.forEach(x=>{ if(!x.id) x.id=uid(); });\n  return p;\n}\nlet edicoes = LS.get('atl_edicoes') || [];\nlet edicaoAtiva = LS.get('atl_edicao_ativa') || null;\nlet anoFiltro = LS.get('atl_ano_filtro') || null; // ano selecionado no menu ('todos' = todos os anos)\n\nconst ANO='__ano__'; // vista anual (soma dos períodos do ano selecionado)\nfunction modoAno(){ return edicaoAtiva===ANO; }\nfunction anosDisponiveis(){ const ys=[...new Set(edicoes.map(e=>String(e.ano||'')).filter(Boolean))]; ys.sort((a,b)=>+b-+a); return ys; }\nfunction edicoesFiltradas(){ return (!anoFiltro||anoFiltro==='todos')? edicoes : edicoes.filter(e=>String(e.ano||'')===String(anoFiltro)); }\nfunction edKey(){ return 'atl_ed_'+edicaoAtiva; }\nfunction dadosVazios(){ return {criancas:[],preInscricoes:[],despesas:[],equipa:[],atividades:[],receitas:[],categorias:CATEGORIAS_DEFAULT.slice(),categoriasRec:CATEGORIAS_REC_DEFAULT.slice(),precos:precosDefault(),semanasMeta:{},inscricaoOnline:{aberto:true,prazo:'',max:0}}; }\n// crianças que contam (exclui as canceladas) — usado em contagens, mapas e custos\nfunction criancasAtivas(d){ d=d||getD(); return (d.criancas||[]).filter(c=>!c.cancelada); }\n// configuração do link de inscrições online (abrir/fechar, prazo, limite)\nfunction getInscOnline(d){ d=d||getD(); const o=d.inscricaoOnline||{}; return {aberto:o.aberto!==false, prazo:o.prazo||'', max:+o.max||0}; }\n// nº de inscrições que contam para o limite: crianças ativas + pré-inscrições por aprovar\nfunction nInscricoesAtuais(d){ d=d||getD(); return criancasAtivas(d).length + ((d.preInscricoes||[]).length); }\n// estado do link: {aberto, motivo} — fechado por opção, prazo ultrapassado ou limite atingido\nfunction estadoLink(d){ d=d||getD(); const cfg=getInscOnline(d);\n  if(!cfg.aberto) return {aberto:false, motivo:'As inscrições estão encerradas.'};\n  if(cfg.prazo && hoje()>cfg.prazo) return {aberto:false, motivo:'O prazo de inscrição terminou ('+fmtData(cfg.prazo)+').'};\n  if(cfg.max>0 && nInscricoesAtuais(d)>=cfg.max) return {aberto:false, motivo:'Foi atingido o número máximo de inscrições ('+cfg.max+').'};\n  return {aberto:true, motivo:'', cfg, atuais:nInscricoesAtuais(d)};\n}\nfunction getDAno(){\n  const base=dadosVazios();\n  edicoesFiltradas().forEach(e=>{ const d=LS.get('atl_ed_'+e.id); if(!d) return; const nome=e.nome+(e.ano?(' '+e.ano):'');\n    (d.criancas||[]).forEach(c=>base.criancas.push(Object.assign({}, c, {_ed:nome, _edId:e.id})));\n    (d.despesas||[]).forEach(x=>base.despesas.push(Object.assign({}, x, {_ed:nome})));\n    (d.receitas||[]).forEach(x=>base.receitas.push(Object.assign({}, x, {_ed:nome})));\n    (d.equipa||[]).forEach(x=>base.equipa.push(Object.assign({}, x, {_ed:nome})));\n    (d.atividades||[]).forEach(x=>base.atividades.push(Object.assign({}, x, {_ed:nome})));\n  });\n  return base;\n}\nfunction getD(){ if(modoAno()) return getDAno(); if(!edicaoAtiva) return dadosVazios(); const d=LS.get(edKey()); if(!d) return dadosVazios(); const m=Object.assign(dadosVazios(), d); m.precos=normalizaPrecos(m.precos); return m; }\nfunction setD(d){ if(!edicaoAtiva || modoAno()) return; save(edKey(), d); driveAutoBackup(); }\n// aplica uma alteração aos dados de UMA edição específica (permite editar da vista anual)\nfunction getEdicao(){ if(modoAno()) return {id:ANO, nome:'Todo o ano', ano:'', dataInicio:'', dataFim:''}; return edicoes.find(e=>e.id===edicaoAtiva)||null; }\nfunction guardaModoAno(){ if(modoAno()){ toast('Vista anual: escolhe um período específico para editar.',false); return true; } return false; }\nfunction getCfg(){ return Object.assign({emailEnvio:'',emailNotif:'',emailDrive:'',driveClientId:'',driveAuto:false,logo:'',assocNome:\"ARCA d'Ajuda\",assocMorada:'',assocNif:'',assocContacto:''}, LS.get('atl_cfg')||{}); }\nfunction setCfg(c){ save('atl_cfg', c); }\nfunction proximoNumero(){ const arr=getD().criancas.map(c=>+c.numero||0); return (arr.length?Math.max(...arr):0)+1; }\n// ---------- documentos / declarações (modelos editáveis, globais) ----------\nfunction getDocs(){ return LS.get('atl_documentos')||[]; }\nfunction setDocs(d){ save('atl_documentos', d); }\nfunction docsDefault(){ return [\n  {id:uid(), titulo:'Declaração de veracidade e conhecimento do plano de atividades', corpo:`Eu, {{responsavel}}, encarregado(a) de educação de {{nome}} (inscrição n.º {{numero}}), declaro que:\\n\\n• Tomei conhecimento do plano de atividades do {{atl}};\\n• Todas as informações prestadas na ficha de inscrição são verdadeiras e completas, não tendo omitido qualquer informação relevante sobre a criança, nomeadamente relativa à saúde, alergias ou cuidados especiais.\\n\\nData: ____/____/________\\n\\nAssinatura do Encarregado de Educação:\\n\\n___________________________________________`},\n  {id:uid(), titulo:'Autorização de saída autónoma', corpo:`Eu, {{responsavel}}, encarregado(a) de educação de {{nome}} (inscrição n.º {{numero}}), autorizo que o(a) meu(minha) educando(a) saia sozinho(a) das instalações do {{atl}} a partir das ______ horas, assumindo total responsabilidade a partir desse momento.\\n\\nData: ____/____/________\\n\\nAssinatura do Encarregado de Educação:\\n\\n___________________________________________`},\n]; }\n// ---------- impressão ----------\nfunction logoHeaderHTML(){\n  const c=getCfg(); const logo=c.logo? `<img src=\"${c.logo}\" style=\"max-height:78px;max-width:200px;object-fit:contain\">` : '';\n  return `<div style=\"display:flex;align-items:center;gap:16px;border-bottom:3px solid #173F72;padding-bottom:10px;margin-bottom:18px\">${logo}<div><div style=\"font-size:18px;font-weight:800;color:#173F72\">${esc(c.assocNome||\"ARCA d'Ajuda\")}<\/div><div style=\"font-size:12px;color:#555\">ATL ARCAKIDS<\/div><\/div><\/div>`;\n}\nfunction rodapeImpressaoHTML(){\n  const c=getCfg(); const bits=[]; if(c.assocMorada)bits.push(esc(c.assocMorada)); if(c.assocNif)bits.push('NIF/NIPC: '+esc(c.assocNif)); if(c.assocContacto)bits.push(esc(c.assocContacto));\n  const nome=esc(c.assocNome||''); if(!nome && !bits.length) return '';\n  return `<div style=\"margin-top:34px;border-top:2px solid #173F72;padding-top:8px;font-size:10.5px;color:#555;text-align:center;line-height:1.4\"><b style=\"color:#173F72\">${nome}<\/b>${bits.length?'<br>'+bits.join(' · '):''}<\/div>`;\n}\nfunction abrirImpressao(titulo, corpoHtml){\n  const w=window.open('','_blank'); if(!w){ toast('Permite pop-ups (janelas) para imprimir.',false); return; }\n  w.document.write(`<html><head><meta charset=\"utf-8\"><title>${esc(titulo)}<\/title><style>\n    body{font-family:Arial,Helvetica,sans-serif;padding:28px;color:#111;line-height:1.55}\n    h1{font-size:18px;color:#173F72;margin:0 0 4px}\n    table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 12px}\n    td,th{border:1px solid #bbb;padding:6px 9px;text-align:left;vertical-align:top}\n    th{background:#E8F1FB;width:34%;font-weight:700}\n    .sec{font-weight:700;color:#173F72;margin:16px 0 4px;border-bottom:1px solid #ccc;font-size:13px;padding-bottom:2px}\n    .decl{white-space:pre-wrap;font-size:13.5px;margin-top:10px}\n    .btnbar{margin-top:22px}\n    @media print{.btnbar{display:none}}\n  <\/style><\/head><body>${logoHeaderHTML()}${corpoHtml}${rodapeImpressaoHTML()}<div class=\"btnbar\"><button onclick=\"window.print()\" style=\"padding:9px 16px;background:#173F72;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer\">🖨️ Imprimir<\/button><\/div><\/body><\/html>`);\n  w.document.close(); w.focus(); setTimeout(()=>{try{w.print();}catch(e){}},400);\n}\nfunction preencherPlaceholders(txt, c){\n  const ed=getEdicao()||{}; const map={\n    '{{nome}}': c?esc(c.nome):'_______________________________',\n    '{{numero}}': c?(c.numero||''):'______',\n    '{{nasc}}': c?fmtData(c.nasc):'____/____/________',\n    '{{doc}}': c?esc(c.cc||''):'____________________',\n    '{{nif}}': c?esc(c.nif||''):'____________________',\n    '{{responsavel}}': c?esc(c.resp||''):'_______________________________',\n    '{{atl}}': esc(ed.nome||''),\n    '{{ano}}': ed.ano||''\n  };\n  return String(txt||'').replace(/\\{\\{\\w+\\}\\}/g, m=>map[m]!=null?map[m]:m);\n}\nfunction imprimirDocumento(docId, childId){\n  const dc=getDocs().find(x=>x.id===docId); if(!dc){ toast('Documento não encontrado.',false); return; }\n  const c= childId? getD().criancas.find(x=>x.id===childId):null;\n  abrirImpressao(dc.titulo, `<h1>${esc(dc.titulo)}<\/h1><div class=\"decl\">${preencherPlaceholders(dc.corpo||'', c)}<\/div>`);\n}\nfunction imprimirFicha(id){\n  const c=getD().criancas.find(x=>x.id===id); if(!c) return; const ed=getEdicao()||{};\n  const body=`<h1>Ficha de Inscrição — N.º ${c.numero||'—'}<\/h1>\n    <div style=\"font-size:12px;color:#555;margin-bottom:6px\">${esc(ed.nome||'')}${ed.ano?(' · '+ed.ano):''}<\/div>\n    <div class=\"sec\">Criança<\/div>\n    <table><tr><th>Nome<\/th><td>${esc(c.nome||'')}<\/td><\/tr>\n      <tr><th>Data de nascimento<\/th><td>${esc(fmtData(c.nasc))} ${c.nasc?('('+idadeATL(c)+')'):''}<\/td><\/tr>\n      <tr><th>Documento<\/th><td>${esc(c.ccTipo||'')} ${esc(c.cc||'')}${c.ccVal?(' — validade '+esc(fmtData(c.ccVal))):''}<\/td><\/tr>\n      <tr><th>NIF<\/th><td>${esc(c.nif||'')}<\/td><\/tr>\n      <tr><th>Alergias / intolerâncias<\/th><td>${esc(c.alergias||'—')}<\/td><\/tr>\n      <tr><th>Observações<\/th><td>${esc(c.obs||'—')}<\/td><\/tr><\/table>\n    <div class=\"sec\">Encarregado de Educação<\/div>\n    <table><tr><th>Nome<\/th><td>${esc(c.resp||'')}${c.parentesco?(' ('+esc(c.parentesco)+')'):''}<\/td><\/tr>\n      <tr><th>Telemóvel<\/th><td>${esc(c.tel||'')}<\/td><\/tr>\n      <tr><th>Email<\/th><td>${esc(c.email||'')}<\/td><\/tr>\n      <tr><th>Contacto de emergência<\/th><td>${esc(c.emergencia||'')}<\/td><\/tr><\/table>\n    <div class=\"sec\">Inscrição<\/div>\n    <table><tr><th>Modalidade<\/th><td>${esc(detalheInsc(c))}<\/td><\/tr>\n      <tr><th>Data da inscrição<\/th><td>${esc(fmtData(c.dataInscricao))}<\/td><\/tr>\n      <tr><th>Valor a pagar<\/th><td>${fmt(c.valor)}<\/td><\/tr>\n      <tr><th>Já pago<\/th><td>${fmt(c.pago)}<\/td><\/tr>\n      <tr><th>Forma de pagamento<\/th><td>${esc(c.pagamento||'')}<\/td><\/tr><\/table>\n    <div class=\"sec\">Pessoas autorizadas a entregar / levantar a criança<\/div>\n    <table><thead><tr><th>Nome<\/th><th>Parentesco<\/th><th>Nº documento<\/th><th style=\"width:32%\">Assinatura<\/th><\/tr><\/thead><tbody>\n      ${(c.autorizados||[]).filter(a=>a.nome||a.doc||a.parentesco).map(a=>`<tr><td>${esc(a.nome||'')}<\/td><td>${esc(a.parentesco||'')}<\/td><td>${esc(a.doc||'')}<\/td><td><\/td><\/tr>`).join('')}\n      <tr><td>&nbsp;<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n      <tr><td>&nbsp;<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n    <\/tbody><\/table>\n    <div style=\"font-size:11px;color:#555;margin-top:3px\">Além do(a) encarregado(a) de educação, estas pessoas ficam autorizadas a entregar/levantar a criança. As linhas em branco podem ser preenchidas e assinadas à mão no 1.º dia.<\/div>\n    <div style=\"margin-top:30px;font-size:13px;line-height:2.5\">\n      <div>O(A) Encarregado(a) de Educação: ______________________________&nbsp;&nbsp;Data: ____/____/________<\/div>\n      <div>Quem entrega/levanta a criança (pessoa autorizada): ______________________________&nbsp;&nbsp;Data: ____/____/________<\/div>\n    <\/div>\n    <div style=\"margin-top:24px;font-size:13px;line-height:2.5;border-top:1px solid #ccc;padding-top:12px\">\n      <div style=\"font-size:12px;color:#555;margin-bottom:4px\">A preencher pela ARCA d'Ajuda — declara-se que foi dado conhecimento ao(à) encarregado(a) de educação das condições e normas do ATL:<\/div>\n      <div>Coordenação / Administração — Nome: ____________________&nbsp;&nbsp;Assinatura: __________________&nbsp;&nbsp;Data: ____/____/________<\/div>\n    <\/div>`;\n  abrirImpressao('Ficha de Inscrição N.º '+(c.numero||''), body);\n}\nfunction abrirImprimir(id){\n  const c=getD().criancas.find(x=>x.id===id); if(!c) return; const docs=getDocs();\n  modal('🖨️ Imprimir — '+esc(c.nome), `\n    <div class=\"muted\" style=\"margin-bottom:12px\">Sai com o logótipo da associação no cabeçalho. ${getCfg().logo?'':'<b>(Ainda não definiste o logótipo — fá-lo em Definições.)<\/b>'}<\/div>\n    <button class=\"btn-sm btn-add\" style=\"width:100%;margin-bottom:8px;padding:10px\" onclick=\"imprimirFicha('${id}')\">📄 Ficha de inscrição (N.º ${c.numero||'—'})<\/button>\n    ${(c.anexos&&(c.anexos.comprovativo||c.anexos.ccFrente||c.anexos.ccVerso))?`<button class=\"btn-sm btn-neutral\" style=\"width:100%;margin-bottom:10px;padding:10px\" onclick=\"imprimirTodosAnexos('${id}',false)\">🖨️ Documentos anexados — comprovativo + CC (os 3 juntos)<\/button>`:''}\n    <div class=\"subt2\">Declarações<\/div>\n    ${docs.length? docs.map(dc=>`<button class=\"btn-sm btn-neutral\" style=\"width:100%;margin-bottom:6px;text-align:left;padding:9px\" onclick=\"imprimirDocumento('${dc.id}','${id}')\">🖊️ ${esc(dc.titulo)}<\/button>`).join('') : '<div class=\"muted\">Sem declarações — cria em 📄 Documentos.<\/div>'}\n  `, [ {txt:'Fechar',cls:'btn-neutral',fn:fecharModal} ]);\n}\n\n/* ---------- períodos: dias úteis, semanas ---------- */\nfunction pad2(n){ return String(n).padStart(2,'0'); }\nfunction isoDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }\nfunction isFeriado(d){ return FERIADOS.includes(pad2(d.getMonth()+1)+'-'+pad2(d.getDate())); }\nfunction isDiaUtil(d){ const w=d.getDay(); return w>=1 && w<=5 && !isFeriado(d); }\nfunction parseD(s){ if(!s) return null; const p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }\n// datas úteis (Date) de um período qualquer\nfunction diasUteisDe(ed){\n  if(!ed||!ed.dataInicio||!ed.dataFim) return [];\n  const ini=parseD(ed.dataInicio), fim=parseD(ed.dataFim); const out=[];\n  let d=new Date(ini); let guard=0;\n  while(d<=fim && guard<400){ if(isDiaUtil(d)) out.push(new Date(d)); d.setDate(d.getDate()+1); guard++; }\n  return out;\n}\nfunction semanasDe(ed){\n  const dias=diasUteisDe(ed); if(!dias.length) return [];\n  const fim=parseD(ed.dataFim);\n  // agrupa os dias úteis por semana de calendário (começa nova semana a cada segunda-feira)\n  const grupos=[]; let atual=null;\n  dias.forEach(d=>{ if(atual && d.getDay()===1){ grupos.push(atual); atual=null; } if(!atual) atual={dias:[]}; atual.dias.push(d); });\n  if(atual) grupos.push(atual);\n  // só contam SEMANAS INTEIRAS: começam à segunda e a sexta dessa semana está dentro do período.\n  // Os dias soltos (início/fim de período que não formam semana completa) ficam disponíveis como AVULSO.\n  const full=grupos.filter(g=>{ const a=g.dias[0]; if(a.getDay()!==1) return false; const sexta=new Date(a); sexta.setDate(sexta.getDate()+4); return !fim || sexta<=fim; });\n  return full.map((s,i)=>{ const a=s.dias[0], b=s.dias[s.dias.length-1];\n    return { id:'S'+(i+1), num:i+1, label:'Semana '+(i+1), periodo: `${a.getDate()}/${a.getMonth()+1} a ${b.getDate()}/${b.getMonth()+1}`, dias: s.dias.map(isoDate) }; });\n}\nfunction mesesDe(ed){ const dias=diasUteisDe(ed); const set=[];\n  dias.forEach(d=>{ const key=d.getFullYear()+'-'+d.getMonth(); if(!set.find(x=>x.key===key)) set.push({key, mes:d.getMonth(), ano:d.getFullYear(), nome:MESES[d.getMonth()]+' '+d.getFullYear()}); });\n  return set; }\n// versões do período ativo\nfunction diasUteisPeriodo(){ return diasUteisDe(getEdicao()); }\nfunction semanasPeriodo(){ return semanasDe(getEdicao()); }\nfunction mesesPeriodo(){ return mesesDe(getEdicao()); }\n\n/* ============================================================\n   ARRANQUE / LOGIN\n   ============================================================ */\nwindow.addEventListener('DOMContentLoaded', ()=>{\n  if(supaSession && supaSession.access_token){ entrarApp(); }\n});\nasync function fazerLogin(){\n  const email=$('lg-email').value.trim(), pass=$('lg-pass').value;\n  if(!email||!pass){ loginMsg('Preenche o email e a palavra-passe.', false); return; }\n  loginMsg('A entrar…');\n  try{ await supaAuthLogin(email, pass); modoLocal=false; LS.set('atl_modo_local', false); await entrarApp(); }\n  catch(e){ loginMsg(e.message||'Falha ao entrar.', false); }\n}\nasync function criarConta(){\n  const email=$('lg-email').value.trim(), pass=$('lg-pass').value;\n  if(!email||pass.length<6){ loginMsg('Escreve um email e uma palavra-passe (mín. 6 caracteres).', false); return; }\n  loginMsg('A criar conta…');\n  try{ const d=await supaSignup(email, pass);\n    if(d.access_token){ modoLocal=false; LS.set('atl_modo_local', false); await entrarApp(); }\n    else loginMsg('Conta criada! Confirma o email (se for pedido) e depois carrega em Entrar.', true);\n  }catch(e){ loginMsg(e.message||'Falha ao criar conta.', false); }\n}\nfunction usarLocal(){ modoLocal=true; LS.set('atl_modo_local', true); entrarApp(); }\nfunction loginMsg(m, ok){ const el=$('login-msg'); el.textContent=m||''; el.style.color = ok===false?'#C0392B':(ok===true?'#173F72':'#5C6B70'); }\n\nlet _religarTimer=null;\nfunction sessaoExpirou(){ try{ parent.ARCA.logout('A sessão expirou. Entre novamente.'); }catch(e){} return;\n  if(_religarTimer){ clearInterval(_religarTimer); _religarTimer=null; }\n  try{ LS.del('atl_supa_session'); }catch(e){} supaSession=null; _sessaoMorta=false;\n  const b=$('cloud-banner'); if(b) b.style.display='none';\n  document.body.classList.remove('modal-aberto');\n  const app=$('app'); if(app) app.style.display='none';\n  const ls=$('login-screen'); if(ls) ls.style.display='flex';\n  loginMsg('A tua sessão expirou por segurança. Escreve a palavra-passe e entra outra vez — os teus dados estão guardados.', false);\n}\nasync function ligarCloudComRetries(){\n  if(!CLOUD_ON()){ marcaCloud(null); return false; }\n  if(supaSession && supaSession.refresh_token){ await supaRefresh(); }   // renova já no arranque\n  for(let i=0;i<3;i++){ if(await hidratarCloud()) return true; if(_sessaoMorta) break; await new Promise(r=>setTimeout(r,800)); }\n  if(_sessaoMorta){ sessaoExpirou(); return false; }   // refresh_token recusado → pedir novo login em vez de barra eterna\n  // ainda falhou (provável falta de rede): continuar a tentar sozinho em segundo plano\n  if(!_religarTimer){\n    _religarTimer=setInterval(async()=>{\n      if(!CLOUD_ON()){ clearInterval(_religarTimer); _religarTimer=null; return; }\n      if(supaSession && supaSession.refresh_token){ await supaRefresh(); }\n      if(_sessaoMorta){ clearInterval(_religarTimer); _religarTimer=null; sessaoExpirou(); return; }\n      if(await hidratarCloud()){ clearInterval(_religarTimer); _religarTimer=null; toast('Ligação à conta reposta. ✅'); if(tabAtual==='criancas') carregarPreInscricoesCloud(); }\n    }, 6000);\n  }\n  return false;\n}\nasync function entrarApp(){\n  $('login-screen').style.display='none'; $('app').style.display='flex';\n  _sessaoMorta=false; marcaCloud(null); await ligarCloudComRetries();\n  if(LS.get('atl_documentos')===null) setDocs(docsDefault());\n  edicoes = LS.get('atl_edicoes') || []; edicaoAtiva = LS.get('atl_edicao_ativa') || null;\n  if(!edicaoAtiva && edicoes.length) edicaoAtiva = edicoes[0].id;\n  // alinhar o ano do menu com a edição ativa (ou o ano mais recente)\n  { const ea=edicoes.find(e=>e.id===edicaoAtiva); if(ea&&ea.ano) anoFiltro=String(ea.ano); else if(!anoFiltro) anoFiltro = anosDisponiveis()[0]||String(new Date().getFullYear()); }\n  popularEdicoes(); showTab('dashboard'); initAjudaFab(); atualizaDriveAviso(); driveAutoReligar();\n  carregarPreInscricoesCloud();\n  verificarFimMes();\n}\n/* ---------- Botão de Ajuda flutuante e móvel ---------- */\nlet _ajudaInit=false;\nfunction initAjudaFab(){\n  const fab=$('ajuda-fab'); if(!fab) return; fab.style.display='inline-flex';\n  const pos=LS.get('atl_ajuda_pos'); if(pos&&pos.left!=null){ fab.style.left=pos.left+'px'; fab.style.top=pos.top+'px'; fab.style.right='auto'; fab.style.bottom='auto'; }\n  if(_ajudaInit) return; _ajudaInit=true;\n  let drag=false, moved=false, sx=0, sy=0, ox=0, oy=0;\n  const down=e=>{ drag=true; moved=false; const p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY; const r=fab.getBoundingClientRect(); ox=r.left; oy=r.top; };\n  const move=e=>{ if(!drag) return; const p=e.touches?e.touches[0]:e; const dx=p.clientX-sx, dy=p.clientY-sy; if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true; let nl=ox+dx, nt=oy+dy; nl=Math.max(4,Math.min(window.innerWidth-fab.offsetWidth-4,nl)); nt=Math.max(4,Math.min(window.innerHeight-fab.offsetHeight-4,nt)); fab.style.left=nl+'px'; fab.style.top=nt+'px'; fab.style.right='auto'; fab.style.bottom='auto'; if(e.cancelable)e.preventDefault(); };\n  const up=()=>{ if(!drag) return; drag=false; if(moved){ const r=fab.getBoundingClientRect(); LS.set('atl_ajuda_pos',{left:Math.round(r.left),top:Math.round(r.top)}); } };\n  fab.addEventListener('mousedown',down); document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);\n  fab.addEventListener('touchstart',down,{passive:true}); document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up);\n  fab.addEventListener('click',()=>{ if(!moved) abrirAjuda(); });\n}\nfunction abrirAjuda(){\n  modal('❓ Ajuda — como usar o ATL ARCAKIDS', `\n    <div class=\"muted\" style=\"margin-bottom:10px\">Guia rápido de cada secção. (Podes arrastar este botão de ajuda para onde quiseres.)<\/div>\n    <div class=\"subt\">Antes de começar<\/div>\n    <ul style=\"margin:0 0 8px 18px;font-size:13px;line-height:1.6\">\n      <li><b>+ Período<\/b> (menu lateral): cria cada ATL por <b>datas<\/b> — semanas e dias úteis geram-se sozinhos. Troca de período no seletor de períodos (menu lateral); <b>📅 Todo o ano<\/b> soma tudo.<\/li>\n      <li><b>🏷️ Valores<\/b>: preços das inscrições, alimentação diária (almoço + 2 lanches), descontos (atleta / irmão, editáveis), campanhas, atividades, seguros. Tudo editável.<\/li>\n    <\/ul>\n    <div class=\"subt\">No dia a dia<\/div>\n    <ul style=\"margin:0 0 8px 18px;font-size:13px;line-height:1.6\">\n      <li><b>🧒 Inscrições<\/b>: nova inscrição, nº automático, procura por Nº/nome/NIF. O <b>grupo (G1/G2)<\/b> é atribuído aqui pela coordenação. Botões: 🖨️ imprimir ficha/declarações, 🗂️ notas administrativas.<\/li>\n      <li><b>👪 Ficha pública<\/b> + <b>🔗 Copiar link<\/b>: link para os pais se inscreverem; ficam em <b>📥 pré-inscrições<\/b> para aprovares.<\/li>\n      <li><b>📆 Mapa<\/b>: ocupação por dia, e listas por semana (seguradora), <b>alergias (cozinha)<\/b>, observações e <b>grupos<\/b> — cada uma imprime-se por semana.<\/li>\n      <li><b>💸 Despesas<\/b>: lançamentos manuais (seguros, material, autocarro…), <b>🍽️ Alimentação por dia<\/b> (automática) e <b>Resumo<\/b> por dia/semana/mês. Funcionários e atividades também contam.<\/li>\n      <li><b>🎟️ Atividades<\/b>: preço × nº de crianças do grupo presentes no dia. <b>🗓️ Mapa por dia<\/b> mostra G1/G2 por atividade.<\/li>\n      <li><b>📄 Documentos<\/b>: declarações editáveis + atalhos para as listas. O logótipo e a morada/NIF definem-se em ⚙️ Definições.<\/li>\n    <\/ul>\n    <div class=\"subt\">Automático<\/div>\n    <ul style=\"margin:0 0 4px 18px;font-size:13px;line-height:1.6\">\n      <li>No <b>fim do mês<\/b> aparece um lembrete para imprimir os movimentos.<\/li>\n      <li>Tudo é guardado e <b>sincronizado na cloud<\/b> (☁️ no topo). Podes usar em vários dispositivos.<\/li>\n    <\/ul>`,\n    [ {txt:'Repor posição do botão',cls:'btn-neutral',fn:()=>{ LS.del('atl_ajuda_pos'); const f=$('ajuda-fab'); f.style.left='auto';f.style.top='auto';f.style.right='20px';f.style.bottom='20px'; fecharModal(); }},\n      {txt:'Fechar',cls:'btn-add',fn:fecharModal} ]);\n}\nfunction sair(){ parent.ARCA.go(''); }\n\n/* ============================================================\n   EDIÇÕES / PERÍODOS\n   ============================================================ */\nfunction popularAnos(){\n  const sel=$('ano-sel'); if(!sel) return; const anos=anosDisponiveis();\n  if(anoFiltro!=='todos' && !anos.includes(String(anoFiltro))){ const ea=edicoes.find(e=>e.id===edicaoAtiva); anoFiltro = (ea&&ea.ano)? String(ea.ano) : (anos[0]||String(new Date().getFullYear())); }\n  sel.innerHTML='';\n  anos.forEach(y=>{ const o=document.createElement('option'); o.value=y; o.textContent='📅 '+y; if(String(anoFiltro)===y)o.selected=true; sel.appendChild(o); });\n  const ot=document.createElement('option'); ot.value='todos'; ot.textContent='🗂️ Todos'; if(anoFiltro==='todos')ot.selected=true; sel.appendChild(ot);\n}\nfunction popularEdicoes(){\n  popularAnos();\n  const sel=$('ed-sel'); sel.innerHTML='';\n  const lista=edicoesFiltradas();\n  if(!lista.length){ const o=document.createElement('option'); o.value=''; o.textContent='(sem períodos neste ano)'; sel.appendChild(o); }\n  else lista.forEach(e=>{ const o=document.createElement('option'); o.value=e.id; o.textContent=`${e.nome}${e.ano?' · '+e.ano:''}`; if(e.id===edicaoAtiva)o.selected=true; sel.appendChild(o); });\n  const oa=document.createElement('option'); oa.value=ANO; oa.textContent = anoFiltro==='todos'? '➕ Somar todos os ATL (todos os anos)' : ('➕ Somar todos os ATL de '+anoFiltro); if(edicaoAtiva===ANO)oa.selected=true; sel.appendChild(oa);\n}\nfunction onAnoChange(v){ anoFiltro=v; LS.set('atl_ano_filtro', v);\n  if(edicaoAtiva!==ANO){ const lista=edicoesFiltradas(); if(!lista.find(e=>e.id===edicaoAtiva)){ edicaoAtiva = lista[0]? lista[0].id : ANO; save('atl_edicao_ativa', edicaoAtiva); } }\n  popularEdicoes(); renderAtual();\n}\nfunction onEdicaoChange(id){ edicaoAtiva=id; save('atl_edicao_ativa', id); renderAtual(); }\nfunction editarPeriodoAtual(){\n  if(!edicaoAtiva || modoAno()){ toast('Escolhe primeiro um período específico (não “Todo o ano”) para editar ou eliminar.',false); return; }\n  const ed=getEdicao(); if(!ed){ toast('Não há período selecionado.',false); return; }\n  abrirModalEdicao(ed);\n}\n\nfunction abrirModalEdicao(ed){\n  if(ed && ed.id===ANO) ed=null; // não se edita a vista anual\n  const e = ed||{nome:'',ano:new Date().getFullYear(),dataInicio:'',dataFim:''};\n  modal('Período do ATL', `\n    <div class=\"info\">Define o ATL pelas <b>datas<\/b>. As semanas e os dias úteis (sem fins de semana nem feriados) são gerados automaticamente.<\/div>\n    <div class=\"grid2\">\n      <div class=\"fg\"><label>Nome *<\/label><input id=\"e-nome\" value=\"${esc(e.nome)}\" placeholder=\"Ex: ATL de Verão\"><\/div>\n      <div class=\"fg\"><label>Ano<\/label><input id=\"e-ano\" type=\"number\" value=\"${esc(e.ano)}\"><\/div>\n    <\/div>\n    <div class=\"grid2\">\n      <div class=\"fg\"><label>Data de início *<\/label><input id=\"e-ini\" type=\"date\" value=\"${esc(e.dataInicio)}\"><\/div>\n      <div class=\"fg\"><label>Data de fim *<\/label><input id=\"e-fim\" type=\"date\" value=\"${esc(e.dataFim)}\"><\/div>\n    <\/div>`,\n    [ ed?{txt:'Eliminar',cls:'btn-del',fn:()=>eliminarEdicao(ed.id)}:null,\n      {txt:'Guardar',cls:'btn-add',fn:()=>guardarEdicao(ed?ed.id:null)} ]);\n}\nfunction guardarEdicao(id){\n  const nome=$('e-nome').value.trim(); if(!nome){ toast('Dá um nome ao período.',false); return; }\n  const ini=$('e-ini').value, fim=$('e-fim').value;\n  if(ini&&fim&&parseD(ini)>parseD(fim)){ toast('A data de fim tem de ser depois do início.',false); return; }\n  const antigo = id ? edicoes.find(e=>e.id===id) : null;\n
