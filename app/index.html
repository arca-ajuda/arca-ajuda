Each((m,idx)=>{\n      h+=`<tr style=\"background:${idx%2===0?'#fff':bgColor+'33'||'#f9f9f9'}\">\n        <td style=\"padding:4px 6px\">${m.ano}<\/td>\n        <td style=\"padding:4px 6px;white-space:nowrap\">${MESES[m.mes-1]}<\/td>\n        <td style=\"padding:4px 6px\"><span style=\"background:${m.cat==='receita'?'#E1F5EE':'#FAECE7'};color:${m.cat==='receita'?'#085041':'#712B13'};padding:1px 6px;border-radius:10px;font-size:9px;font-weight:600\">${m.cat==='receita'?'Receita':'Despesa'}<\/span><\/td>\n        <td style=\"padding:4px 6px;font-size:10px\">${m.categoria}<\/td>\n        <td style=\"padding:4px 6px;font-size:9px;color:#666\">${m.sub||'—'}<\/td>\n        <td style=\"padding:4px 6px;font-size:9px;color:#666\">${m.desc||'—'}<\/td>\n        <td style=\"padding:4px 6px;font-size:9px\">${m.tipmov||'—'}<\/td>\n        <td style=\"padding:4px 6px;text-align:right;font-weight:600;color:${m.cat==='receita'?'#085041':'#712B13'}\">${fmt(m.valor)}<\/td>\n      <\/tr>`;\n    });\n    h+=`<\/tbody><\/table>`;\n    return h;\n  }\n\n  if(incMov&&ms.length){\n    body+=`<h3 style=\"font-size:12px;font-weight:700;color:#0F6E56;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #9FE1CB;padding-bottom:5px;margin:20px 0 10px\">Lista de Movimentos<\/h3>`;\n    if(msGeral.length) body+=buildPrintTable(msGeral,'🏦 Conta Geral ARCA','#E1F5EE');\n    if(msCartao.length){\n      body+=`<div style=\"background:#EBF3FD;border:1px solid #B5D4F4;border-radius:6px;padding:8px 12px;margin:12px 0 6px;font-size:11px;color:#185FA5\">\n        💳 <strong>Cartão Pré-Pago (Entidade 21312 / Referência 995 610 745)<\/strong> — Os valores abaixo são recebidos/pagos via MB e estão associados ao cartão recarregável da associação. <strong>Não duplicam na conta geral.<\/strong>\n      <\/div>`;\n      body+=buildPrintTable(msCartao,'💳 Movimentos do Cartão Pré-Pago','#E6F1FB');\n    }\n  }\n\n  if(incFluxo){\n    const anos=[...new Set(ms.map(m=>m.ano))].sort();\n    body+=`<h3 style=\"font-size:12px;font-weight:700;color:#0F6E56;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #9FE1CB;padding-bottom:5px;margin:20px 0 10px\">Fluxo de Caixa<\/h3>`;\n    anos.forEach(ano=>{\n      const recG=Array(12).fill(0),despG=Array(12).fill(0),recC=Array(12).fill(0),despC=Array(12).fill(0);\n      ms.filter(m=>m.ano===ano).forEach(m=>{\n        if(TIPMOV_CARTAO.includes(m.tipmov)){ if(m.cat==='receita') recC[m.mes-1]+=m.valor; else despC[m.mes-1]+=m.valor; }\n        else { if(m.cat==='receita') recG[m.mes-1]+=m.valor; else despG[m.mes-1]+=m.valor; }\n      });\n      const recT=recG.map((v,i)=>v+recC[i]), despT=despG.map((v,i)=>v+despC[i]);\n      const fluxo=recT.map((r,i)=>r-despT[i]);\n      let ac=0; const acArr=fluxo.map(f=>{ac+=f;return ac;});\n      const fV=v=>v===0?'—':fmt(v);\n      const fC=v=>v===0?'#aaa':v>0?'#085041':'#712B13';\n      body+=`<div style=\"font-size:11px;font-weight:600;color:#555;margin-bottom:6px\">${ano}<\/div>\n      <table style=\"width:100%;border-collapse:collapse;font-size:9px;margin-bottom:14px\">\n        <thead><tr style=\"background:#E1F5EE\"><th style=\"padding:4px 6px;text-align:left;color:#085041\">Linha<\/th>${MESES_S.map(m=>`<th style=\"padding:4px 3px;text-align:right;color:#085041\">${m}<\/th>`).join('')}<th style=\"padding:4px 6px;text-align:right;color:#085041\">Total<\/th><\/tr><\/thead>\n        <tbody>\n        <tr><td style=\"padding:3px 6px;font-weight:500\">🏦 Rec. Gerais<\/td>${recG.map(v=>`<td style=\"padding:3px;text-align:right;color:${fC(v)}\">${fV(v)}<\/td>`).join('')}<td style=\"padding:3px 6px;text-align:right;font-weight:700;color:#085041\">${fV(recG.reduce((a,b)=>a+b,0))}<\/td><\/tr>\n        <tr style=\"background:#EBF3FD\"><td style=\"padding:3px 6px;font-weight:500\">💳 Rec. Cartão MB<\/td>${recC.map(v=>`<td style=\"padding:3px;text-align:right;color:${fC(v)}\">${fV(v)}<\/td>`).join('')}<td style=\"padding:3px 6px;text-align:right;font-weight:700;color:#185FA5\">${fV(recC.reduce((a,b)=>a+b,0))}<\/td><\/tr>\n        <tr style=\"background:#FFF4F0\"><td style=\"padding:3px 6px;font-weight:500\">🏦 Desp. Gerais<\/td>${despG.map(v=>`<td style=\"padding:3px;text-align:right;color:${fC(-v)}\">${fV(v)}<\/td>`).join('')}<td style=\"padding:3px 6px;text-align:right;font-weight:700;color:#712B13\">${fV(despG.reduce((a,b)=>a+b,0))}<\/td><\/tr>\n        <tr style=\"background:#EBF3FD\"><td style=\"padding:3px 6px;font-weight:500\">💳 Desp. Cartão<\/td>${despC.map(v=>`<td style=\"padding:3px;text-align:right;color:${fC(-v)}\">${fV(v)}<\/td>`).join('')}<td style=\"padding:3px 6px;text-align:right;font-weight:700;color:#712B13\">${fV(despC.reduce((a,b)=>a+b,0))}<\/td><\/tr>\n        <tr style=\"font-weight:600\"><td style=\"padding:4px 6px\">Resultado Total<\/td>${fluxo.map(v=>`<td style=\"padding:3px;text-align:right;color:${fC(v)}\">${fV(v)}<\/td>`).join('')}<td style=\"padding:3px 6px;text-align:right;color:${fC(fluxo.reduce((a,b)=>a+b,0))};font-weight:700\">${fV(fluxo.reduce((a,b)=>a+b,0))}<\/td><\/tr>\n        <tr style=\"background:#E1F5EE;font-weight:700\"><td style=\"padding:4px 6px\">Acumulado<\/td>${acArr.map(v=>`<td style=\"padding:3px;text-align:right;color:${fC(v)}\">${fV(v)}<\/td>`).join('')}<td style=\"padding:3px 6px;text-align:right;color:${fC(acArr[acArr.length-1])}\">${fV(acArr[acArr.length-1])}<\/td><\/tr>\n        <\/tbody><\/table>`;\n    });\n  }\n\n  if(incResumo&&ms.length){\n    body+=`<h3 style=\"font-size:12px;font-weight:700;color:#0F6E56;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #9FE1CB;padding-bottom:5px;margin:20px 0 10px\">Resumo por Categoria<\/h3>`;\n    body+=`<table style=\"width:100%;border-collapse:collapse;font-size:11px\"><thead><tr style=\"background:#E1F5EE\"><th style=\"padding:6px 8px;text-align:left\">Conta<\/th><th style=\"padding:6px 8px;text-align:left\">Categoria<\/th><th style=\"padding:6px 8px;text-align:right;color:#085041\">Receitas<\/th><th style=\"padding:6px 8px;text-align:right;color:#712B13\">Despesas<\/th><th style=\"padding:6px 8px;text-align:right\">Saldo<\/th><\/tr><\/thead><tbody>`;\n    const catsG=[...new Set(msGeral.map(m=>m.categoria))].sort();\n    const catsC=[...new Set(msCartao.map(m=>m.categoria))].sort();\n    catsG.forEach((c,i)=>{\n      const r=msGeral.filter(m=>m.cat==='receita'&&m.categoria===c).reduce((s,m)=>s+m.valor,0);\n      const d=msGeral.filter(m=>m.cat==='despesa'&&m.categoria===c).reduce((s,m)=>s+m.valor,0);\n      body+=`<tr style=\"background:${i%2===0?'#fff':'#f9f9f9'}\"><td style=\"padding:5px 8px;font-size:10px;color:#0F6E56\">🏦 Geral<\/td><td style=\"padding:5px 8px\">${c}<\/td><td style=\"padding:5px 8px;text-align:right;color:#085041\">${r?fmt(r):'—'}<\/td><td style=\"padding:5px 8px;text-align:right;color:#712B13\">${d?fmt(d):'—'}<\/td><td style=\"padding:5px 8px;text-align:right;font-weight:600;color:${r-d>=0?'#085041':'#712B13'}\">${fmt(r-d)}<\/td><\/tr>`;\n    });\n    catsC.forEach((c,i)=>{\n      const r=msCartao.filter(m=>m.cat==='receita'&&m.categoria===c).reduce((s,m)=>s+m.valor,0);\n      const d=msCartao.filter(m=>m.cat==='despesa'&&m.categoria===c).reduce((s,m)=>s+m.valor,0);\n      body+=`<tr style=\"background:${i%2===0?'#EBF3FD':'#dfedfb'}\"><td style=\"padding:5px 8px;font-size:10px;color:#185FA5\">💳 Cartão<\/td><td style=\"padding:5px 8px\">${c}<\/td><td style=\"padding:5px 8px;text-align:right;color:#085041\">${r?fmt(r):'—'}<\/td><td style=\"padding:5px 8px;text-align:right;color:#712B13\">${d?fmt(d):'—'}<\/td><td style=\"padding:5px 8px;text-align:right;font-weight:600;color:${r-d>=0?'#085041':'#712B13'}\">${fmt(r-d)}<\/td><\/tr>`;\n    });\n    body+=`<tr style=\"font-weight:700;background:#E1F5EE\"><td colspan=\"2\" style=\"padding:7px 8px\">TOTAL GLOBAL<\/td><td style=\"padding:7px 8px;text-align:right;color:#085041\">${fmt(totRec)}<\/td><td style=\"padding:7px 8px;text-align:right;color:#712B13\">${fmt(totDesp)}<\/td><td style=\"padding:7px 8px;text-align:right;color:${saldo>=0?'#085041':'#712B13'}\">${fmt(saldo)}<\/td><\/tr>`;\n    body+=`<\/tbody><\/table>`;\n  }\n\n  body+=`<div style=\"margin-top:28px;padding-top:14px;border-top:1px solid #ccc;font-size:10px;color:#999;display:flex;justify-content:space-between\">\n    <span>ARCA d'Ajuda — Associação Recreativa e Cultural da Ajuda<\/span>\n    <span>Balanço gerado em ${dataGeracao}<\/span>\n  <\/div>`;\n\n  const html=`<!DOCTYPE html><html lang=\"pt\"><head><meta charset=\"UTF-8\"><title>Balanço ARCA — ${label}<\/title>\n  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#111;background:#fff;padding:20px}\n  @page{size:A4 landscape;margin:10mm}\n  @media print{.noprint{display:none}body{padding:0}}\n  .noprint{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}\n  .noprint button{padding:9px 20px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:Arial}\n  .p{background:#0F6E56;color:#fff}.s{background:#555;color:#fff}\n  <\/style><\/head><body>\n  <div class=\"noprint\">\n    <button class=\"p\" onclick=\"window.print()\">🖨 Imprimir<\/button>\n    <button class=\"s\" onclick=\"window.close()\">✕ Fechar<\/button>\n  <\/div>\n  ${body}\n  <\/body><\/html>`;\n\n  const w=window.open('','_blank','width=1200,height=900');\n  if(w){w.document.write(html);w.document.close();}\n}\n\n// ============================================================\n// PIN / CÓDIGO DE ACESSO\n// ============================================================\nlet pinCallback = null;\nlet pinMode = 'check'; // 'check' | 'set' | 'change'\nlet appUnlocked = false;\n\nfunction getPinHash(){ return LS.get('arca_pin_hash') || null; }\n\nfunction hashPin(pin){\n  // Simple deterministic hash (not crypto, but obfuscated for local use)\n  let h = 5381;\n  for(let i=0;i<pin.length;i++) h = ((h<<5)+h)+pin.charCodeAt(i);\n  return 'arca_' + Math.abs(h).toString(36) + '_' + pin.length;\n}\n\nfunction requirePin(title, message, onSuccess){\n  if(appUnlocked || !getPinHash()){\n    onSuccess();\n    return;\n  }\n  pinCallback = onSuccess;\n  pinMode = 'check';\n  document.getElementById('pin-modal-title').textContent = '🔒 ' + (title||'Acesso Protegido');\n  document.getElementById('pin-message').textContent = message || 'Introduz o código de acesso';\n  document.getElementById('pin-input').value = '';\n  document.getElementById('pin-error').textContent = '';\n  document.getElementById('pin-confirm-btn').textContent = 'Entrar';\n  openModal('modal-pin');\n  setTimeout(()=>document.getElementById('pin-input').focus(),100);\n}\n\nfunction confirmPin(){\n  const input = document.getElementById('pin-input').value.trim();\n  if(!input){ document.getElementById('pin-error').textContent = 'Introduz o código.'; return; }\n  if(pinMode==='check'){\n    if(hashPin(input) === getPinHash()){\n      appUnlocked = true;\n      closeModal('modal-pin');\n      if(pinCallback){ pinCallback(); pinCallback=null; }\n    } else {\n      document.getElementById('pin-error').textContent = 'Código incorreto. Tenta de novo.';\n      document.getElementById('pin-input').value='';\n      document.getElementById('pin-input').focus();\n    }\n  } else if(pinMode==='set'){\n    if(input.length < 4){ document.getElementById('pin-error').textContent = 'Mínimo 4 caracteres.'; return; }\n    LS.set('arca_pin_hash', hashPin(input));\n    appUnlocked = true;\n    closeModal('modal-pin');\n    toast('Código de acesso definido! ✓');\n    renderConfig('dados');\n  } else if(pinMode==='change'){\n    if(hashPin(input) === getPinHash()){\n      // correct old pin, now set new\n      pinMode = 'set';\n      document.getElementById('pin-modal-title').textContent = '🔒 Novo Código';\n      document.getElementById('pin-message').textContent = 'Escolhe o novo código de acesso (mín. 4 caracteres)';\n      document.getElementById('pin-input').value='';\n      document.getElementById('pin-error').textContent='';\n      document.getElementById('pin-confirm-btn').textContent='Definir';\n    } else {\n      document.getElementById('pin-error').textContent = 'Código atual incorreto.';\n      document.getElementById('pin-input').value='';\n    }\n  }\n}\n\nfunction openSetPin(){\n  pinMode = getPinHash() ? 'change' : 'set';\n  document.getElementById('pin-modal-title').textContent = getPinHash() ? '🔒 Alterar Código' : '🔒 Definir Código de Acesso';\n  document.getElementById('pin-message').textContent = getPinHash() ? 'Introduz o código atual para confirmar' : 'Escolhe um código de acesso (mín. 4 caracteres)';\n  document.getElementById('pin-input').value='';\n  document.getElementById('pin-error').textContent='';\n  document.getElementById('pin-confirm-btn').textContent = getPinHash() ? 'Verificar' : 'Definir';\n  openModal('modal-pin');\n  setTimeout(()=>document.getElementById('pin-input').focus(),100);\n}\n\nfunction removePin(){\n  if(!confirm('Tens a certeza que queres remover o código de acesso?')) return;\n  LS.set('arca_pin_hash', null);\n  appUnlocked = true;\n  toast('Código removido.');\n  renderConfig('dados');\n}\n\n// ============================================================\n// SIDEBAR — saudação dinâmica e nome editável\n// ============================================================\nfunction getAdminInfo(){\n  return LS.get('arca_admin_info') || {nome:'Bárbara', cargo:'Administração'};\n}\n\nfunction saveAdminInfo(info){\n  LS.set('arca_admin_info', info);\n}\n\nfunction updateSidebarGreeting(){\n  const info = getAdminInfo();\n  const nameEl = document.getElementById('sidebar-admin-name');\n  const roleEl = document.getElementById('sidebar-admin-role');\n  const avEl = document.getElementById('sidebar-avatar');\n  if(nameEl) nameEl.textContent = info.nome || 'Administrativa';\n  if(roleEl) roleEl.textContent = info.cargo || '';\n  if(avEl){\n    const initials = (info.nome||'A').trim().split(/\\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();\n    avEl.textContent = initials || 'A';\n  }\n  // Time-based greeting\n  const h = new Date().getHours();\n  let greet = 'Olá';\n  if(h>=5 && h<12) greet='Bom dia';\n  else if(h>=12 && h<19) greet='Boa tarde';\n  else greet='Boa noite';\n  const tEl = document.getElementById('sidebar-time-text');\n  if(tEl) tEl.textContent = greet;\n}\n\nfunction editAdminName(){\n  const info = getAdminInfo();\n  const novoNome = prompt('Nome da pessoa que usa a plataforma:', info.nome||'');\n  if(novoNome===null) return;\n  const nome = novoNome.trim();\n  if(!nome){ toast('O nome não pode ficar vazio.', false); return; }\n  const novoCargo = prompt('Cargo / função:', info.cargo||'Administração');\n  if(novoCargo===null) return;\n  saveAdminInfo({nome, cargo:novoCargo.trim()||'Administração'});\n  updateSidebarGreeting();\n  toast('Nome atualizado!');\n}\n\nfunction updateSidebarSaldos(){\n  try {\n    const {saldo} = getSaldoCartaoGlobal();\n    const elCart = document.getElementById('sidebar-saldo-cartao');\n    if(elCart) elCart.textContent = fmt(saldo).replace(',00','');\n    const saldoCof = getSaldoCofre();\n    const elCof = document.getElementById('sidebar-saldo-cofre');\n    if(elCof) elCof.textContent = fmt(saldoCof).replace(',00','');\n  } catch(e){}\n}\n\n// Update sidebar every minute (for time-based greeting)\nsetInterval(updateSidebarGreeting, 60000);\n\nfunction lockApp(){\n  appUnlocked = false;\n  toast('Aplicação bloqueada. 🔒');\n}\n\n// Wrap app startup with PIN check\nfunction checkPinOnLoad(){\n  if(getPinHash() && !appUnlocked){\n    pinCallback = ()=>{ renderDashboard(); };\n    pinMode = 'check';\n    document.getElementById('pin-modal-title').textContent = '🔒 ARCA d\\'Ajuda';\n    document.getElementById('pin-message').textContent = 'Introduz o código de acesso para entrar';\n    document.getElementById('pin-input').value='';\n    document.getElementById('pin-error').textContent='';\n    document.getElementById('pin-confirm-btn').textContent='Entrar';\n    // Blur the main content — esconder logo do topbar para não aparecer no fundo\n    document.querySelector('.app-body').style.visibility='hidden';\n    document.querySelector('.topbar').style.visibility='hidden';\n    const _li2=document.getElementById('logo-img');\n    if(_li2){_li2._srcBak=_li2.src;_li2.src='';_li2.style.display='none';}\n    openModal('modal-pin');\n    setTimeout(()=>document.getElementById('pin-input').focus(),150);\n    // Remove blur when unlocked\n    const obs = setInterval(()=>{\n      if(appUnlocked){\n        document.querySelector('.app-body').style.visibility='';\n        document.querySelector('.topbar').style.visibility='';\n        const _lr=document.getElementById('logo-img');\n        if(_lr&&_lr._srcBak){_lr.src=_lr._srcBak;_lr.style.display='block';}\n        clearInterval(obs);\n      }\n    },200);\n  }\n}\n\n// ============================================================\n// COMPROVATIVO DE PAGAMENTO\n// ============================================================\nfunction openComprovativo(id){\n  const m = movimentos.find(x=>x.id===id);\n  if(!m) return;\n  document.getElementById('cp-nome').value = m.desc || '';\n  document.getElementById('cp-ref').value = 'N.º ' + String(id).slice(-6);\n  document.getElementById('cp-descricao').value = [m.categoria, m.sub].filter(Boolean).join(' — ');\n  document.getElementById('cp-valor').value = m.valor.toFixed(2);\n  document.getElementById('cp-data').value = new Date().toISOString().slice(0,10);\n  document.getElementById('cp-modo').value = m.tipmov || '';\n  document.getElementById('cp-obs').value = m.nota || '';\n  openModal('modal-comprovativo');\n}\n\nfunction imprimirComprovativo(){\n  const logo = currentLogoData || LS.get('arca_logo') || '';\n  const nome = document.getElementById('cp-nome').value.trim() || '___________________________';\n  const ref = document.getElementById('cp-ref').value.trim();\n  const descricao = document.getElementById('cp-descricao').value.trim() || '___________________________';\n  const valorNum = parseFloat(document.getElementById('cp-valor').value)||0;\n  const valorStr = valorNum.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});\n  const dataStr = document.getElementById('cp-data').value;\n  const dataFmt = dataStr ? new Date(dataStr+'T12:00:00').toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'}) : '__ / __ / ______';\n  const modo = document.getElementById('cp-modo').value.trim() || '_______________';\n  const obs = document.getElementById('cp-obs').value.trim();\n  const logoHtml = logo\n    ? `<img src=\"${logo}\" style=\"height:64px;max-width:180px;object-fit:contain;display:block\">`\n    : `<div style=\"width:120px;height:64px;border:1.5px solid #0F6E56;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#0F6E56;border-radius:6px\">ARCA<\/div>`;\n\n  const bloco = (subtitulo) => `\n  <div style=\"border:1.5px solid #333;border-radius:8px;padding:20px 24px;font-family:Arial,sans-serif;font-size:12px;color:#111;page-break-inside:avoid\">\n    <div style=\"display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:16px\">\n      <div>${logoHtml}<\/div>\n      <div style=\"flex:1;text-align:center\">\n        <div style=\"font-size:15px;font-weight:700;color:#0F6E56\">ASSOCIAÇÃO RECREATIVA E CULTURAL DA AJUDA<\/div>\n        <div style=\"font-size:10px;color:#666;margin-top:2px\">ARCA d'Ajuda<\/div>\n        <div style=\"font-size:13px;font-weight:700;margin-top:7px;text-transform:uppercase;letter-spacing:.5px\">Comprovativo de Pagamento<\/div>\n        <div style=\"font-size:10px;color:#888;margin-top:2px;font-style:italic\">${subtitulo}<\/div>\n      <\/div>\n      <div style=\"text-align:right;font-size:11px;min-width:90px;line-height:1.7\">\n        <div><b>Ref.:<\/b> ${ref}<\/div>\n        <div><b>Data:<\/b> ${dataFmt}<\/div>\n      <\/div>\n    <\/div>\n    <hr style=\"border:none;border-top:2px solid #0F6E56;margin:0 0 14px\">\n    <table style=\"width:100%;border-collapse:collapse;font-size:12px\">\n      <tr><td style=\"padding:5px 8px;width:170px;color:#555;font-weight:600;white-space:nowrap\">Exmos. Srs. / Sr.ª:<\/td><td style=\"padding:5px 8px;border-bottom:1px solid #ddd;font-weight:500\">${nome}<\/td><\/tr>\n      <tr><td style=\"padding:5px 8px;color:#555;font-weight:600\">Descrição:<\/td><td style=\"padding:5px 8px;border-bottom:1px solid #ddd\">${descricao}<\/td><\/tr>\n      <tr><td style=\"padding:5px 8px;color:#555;font-weight:600\">Modo de pagamento:<\/td><td style=\"padding:5px 8px;border-bottom:1px solid #ddd\">${modo}<\/td><\/tr>\n      ${obs?`<tr><td style=\"padding:5px 8px;color:#555;font-weight:600\">Observações:<\/td><td style=\"padding:5px 8px;border-bottom:1px solid #ddd\">${obs}<\/td><\/tr>`:''}\n    <\/table>\n    <div style=\"margin-top:14px;display:flex;align-items:center;justify-content:space-between;background:#F2FAF6;border:1.5px solid #9FE1CB;border-radius:6px;padding:12px 18px\">\n      <div>\n        <div style=\"font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px\">Valor total<\/div>\n        <div style=\"font-size:26px;font-weight:700;color:#0F6E56\">€ ${valorStr}<\/div>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:32px\">\n      <div style=\"text-align:center\"><div style=\"height:40px\"><\/div><div style=\"border-top:1.5px solid #333;padding-top:6px;font-size:10px;color:#555\">Assinatura de quem paga / entrega<\/div><\/div>\n      <div style=\"text-align:center\"><div style=\"height:40px\"><\/div><div style=\"border-top:1.5px solid #333;padding-top:6px;font-size:10px;color:#555\">Assinatura Administrativa / Direção ARCA<\/div><\/div>\n    <\/div>\n  <\/div>`;\n\n  const html = `<!DOCTYPE html><html lang=\"pt\"><head><meta charset=\"UTF-8\"><title>Comprovativo ARCA<\/title>\n  <style>*{box-sizing:border-box;margin:0;padding:0}body{background:#fff;padding:16px;font-family:Arial,sans-serif}\n  @page{size:A4;margin:12mm}\n  @media print{.noprint{display:none}body{padding:0}}\n  .sep{text-align:center;margin:16px 0;font-size:11px;color:#999;display:flex;align-items:center;gap:8px}\n  .sep::before,.sep::after{content:'';flex:1;border-top:1px dashed #ccc}\n  .noprint{text-align:center;margin-bottom:14px;display:flex;gap:8px;justify-content:center}\n  .noprint button{padding:9px 22px;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:Arial}\n  .p{background:#0F6E56;color:#fff}.s{background:#555;color:#fff}\n  <\/style><\/head><body>\n  <div class=\"noprint\">\n    <button class=\"p\" onclick=\"window.print()\">🖨 Imprimir<\/button>\n    <button class=\"s\" onclick=\"window.close()\">✕ Fechar<\/button>\n  <\/div>\n  ${bloco('ORIGINAL — Arquivo da Associação')}\n  <div class=\"sep\">✂ &nbsp; Cortar aqui — Duplicado para entregar a quem paga &nbsp; ✂<\/div>\n  ${bloco('DUPLICADO — Para quem paga / colaborador')}\n  <\/body><\/html>`;\n\n  const w = window.open('','_blank','width=820,height=950');\n  if(w){ w.document.write(html); w.document.close(); }\n  closeModal('modal-comprovativo');\n}\n\n// ============================================================\n// ============================================================\n// ACESSO POR NÍVEIS (Admin / Edição / Convidado)\n// ============================================================\nconst ROLES = {\n  ADMIN:    {label:'Administrador', code:null, color:'#0F6E56', desc:'Acesso total à plataforma'},\n  EDITOR:   {label:'Edição',        code:null, color:'#185FA5', desc:'Pode inserir e editar dados'},\n  CONVIDADO:{label:'Convidado',     code:null, color:'#BA7517', desc:'Acesso apenas a resultados finais'}\n};\n\nfunction getRoleCodes(){ return LS.get('arca_role_codes') || {ADMIN:null, EDITOR:null, CONVIDADO:null}; }\nfunction saveRoleCodes(c){ LS.set('arca_role_codes', c); }\nlet currentRole = 'ADMIN'; // default when no codes set\n\nfunction hashCode(c){\n  let h=5381;\n  for(let i=0;i<c.length;i++) h=((h<<5)+h)+c.charCodeAt(i);\n  return 'r_'+Math.abs(h).toString(36)+'_'+c.length;\n}\n\nfunction validateRoleCode(code){\n  const codes = getRoleCodes();\n  for(const [role, hash] of Object.entries(codes)){\n    if(hash && hashCode(code)===hash) return role;\n  }\n  return null;\n}\n\nfunction setCurrentRole(role){\n  currentRole = role;\n  applyRoleRestrictions(role);\n  const badge = document.getElementById('role-badge');\n  if(badge){\n    badge.textContent = ROLES[role]?.label || role;\n    badge.style.color = ROLES[role]?.color || '#555';\n  }\n}\n\nfunction applyRoleRestrictions(role){\n  // Convidado: hide edit/delete buttons and forms\n  const isConv = role === 'CONVIDADO';\n  const isEdit = role === 'EDITOR' || role === 'ADMIN';\n  // Hide edit/delete/add buttons for Convidado\n  document.querySelectorAll('.btn-danger,.btn-edit').forEach(el=>{\n    el.style.display = isConv ? 'none' : '';\n  });\n  document.querySelectorAll('.btn-primary[onclick]').forEach(el=>{\n    const oc = el.getAttribute('onclick')||'';\n    if(oc.includes('modal-lancamento')||oc.includes('openModalPre')||oc.includes('saveMovCofre')||oc.includes('saveRecarga')){\n      el.style.display = isConv ? 'none' : '';\n    }\n  });;\n  // Hide nav items for convidado\n  const restricted = ['page-gestao-config','page-lancamentos'];\n  document.querySelectorAll('.nav-item').forEach(btn=>{\n    const onclick = btn.getAttribute('onclick')||'';\n    if(isConv && restricted.some(r=>onclick.includes(r.replace('page-','')))){\n      btn.style.opacity='.4'; btn.style.pointerEvents='none';\n    } else {\n      btn.style.opacity=''; btn.style.pointerEvents='';\n    }\n  });\n}\n\nfunction renderConfigAcessos(){\n  const el = document.getElementById('config-acessos-content');\n  if(!el) return;\n  const codes = getRoleCodes();\n  el.innerHTML = `\n  <div class=\"card\" style=\"margin-bottom:14px\">\n    <div class=\"card-title\">🔐 Códigos de acesso por nível<\/div>\n    <p style=\"font-size:12px;color:var(--text-2);margin-bottom:16px;line-height:1.6\">\n      Define um código para cada nível. Formato obrigatório: mínimo 7 caracteres com <strong>2 números, 2 maiúsculas, 2 minúsculas e 1 símbolo<\/strong> (ex: <code>Ab2@x9!<\/code>).<br>\n      Quem não tiver código de nível superior usa o nível mais baixo disponível.\n    <\/p>\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      ${Object.entries(ROLES).map(([role, info])=>`\n      <div style=\"background:var(--bg2);border-radius:var(--radius);padding:14px;border:var(--border)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px\">\n          <div>\n            <span style=\"font-weight:600;color:${info.color}\">${info.label}<\/span>\n            <span style=\"font-size:11px;color:var(--text-3);margin-left:8px\">${info.desc}<\/span>\n          <\/div>\n          <span style=\"font-size:11px;padding:3px 9px;background:${codes[role]?'#E1F5EE':'#FAECE7'};color:${codes[role]?'#085041':'#712B13'};border-radius:20px;font-weight:600\">\n            ${codes[role]?'Definido':'Sem código'}\n          <\/span>\n        <\/div>\n        <div style=\"display:flex;gap:8px;align-items:center\">\n          <input type=\"password\" id=\"code-input-${role}\" placeholder=\"Novo código (mín. 7 car.)\"\n            style=\"flex:1;padding:8px 10px;border:var(--border);border-radius:var(--radius);font-size:13px;background:var(--bg)\">\n          <button class=\"btn-primary\" style=\"padding:7px 14px;font-size:12px\" onclick=\"saveRoleCode('${role}')\">Definir<\/button>\n          ${codes[role]?`<button class=\"btn-danger\" style=\"padding:7px 10px;font-size:12px\" onclick=\"clearRoleCode('${role}')\">Remover<\/button>`:''}\n        <\/div>\n        <div id=\"code-msg-${role}\" style=\"font-size:11px;margin-top:5px;min-height:14px\"><\/div>\n      <\/div>`).join('')}\n    <\/div>\n  <\/div>\n  <div class=\"card\">\n    <div class=\"card-title\">ℹ Como funciona<\/div>\n    <div style=\"font-size:12px;color:var(--text-2);line-height:1.8\">\n      <div>• <strong>Administrador<\/strong> — acesso total, pode gerir tudo incluindo configurações e eliminar dados<\/div>\n      <div>• <strong>Edição<\/strong> — pode inserir e editar receitas e despesas, mas não acede a configurações do sistema<\/div>\n      <div>• <strong>Convidado<\/strong> — só vê dashboards, relatórios e fluxo de caixa. Não pode editar nem eliminar<\/div>\n      <div>• Ao abrir a aplicação, é pedido o código. O sistema deteta automaticamente qual o nível<\/div>\n    <\/div>\n  <\/div>`;\n}\n\nfunction validateCodeFormat(code){\n  if(code.length < 7) return 'Mínimo 7 caracteres.';\n  if(!/[0-9].*[0-9]|[0-9][^0-9]*[0-9]/.test(code)) return 'Precisa de pelo menos 2 números.';\n  if(!/[A-Z].*[A-Z]|[A-Z][^A-Z]*[A-Z]/.test(code)) return 'Precisa de pelo menos 2 maiúsculas.';\n  if(!/[a-z].*[a-z]|[a-z][^a-z]*[a-z]/.test(code)) return 'Precisa de pelo menos 2 minúsculas.';\n  if(!/[^A-Za-z0-9]/.test(code)) return 'Precisa de pelo menos 1 símbolo (ex: @, !, #).';\n  return null;\n}\n\nfunction saveRoleCode(role){\n  const input = document.getElementById('code-input-'+role);\n  const msg = document.getElementById('code-msg-'+role);\n  const code = (input?.value||'').trim();\n  const err = validateCodeFormat(code);\n  if(err){ if(msg) msg.innerHTML=`<span style=\"color:var(--coral)\">${err}<\/span>`; return; }\n  const codes = getRoleCodes();\n  codes[role] = hashCode(code);\n  saveRoleCodes(codes);\n  if(input) input.value='';\n  if(msg) msg.innerHTML='<span style=\"color:var(--teal)\">✓ Código definido com sucesso!<\/span>';\n  setTimeout(()=>renderConfigAcessos(), 1200);\n  toast('Código de '+ROLES[role].label+' definido!');\n}\n\nfunction clearRoleCode(role){\n  if(!confirm('Remover código do nível '+ROLES[role].label+'?')) return;\n  const codes = getRoleCodes();\n  codes[role] = null;\n  saveRoleCodes(codes);\n  renderConfigAcessos();\n  toast('Código removido.');\n}\n\n// Override checkPinOnLoad to support role-based login\nfunction checkRoleLogin(){\n  const codes = getRoleCodes();\n  const anyCodeSet = Object.values(codes).some(v=>v);\n  if(!anyCodeSet){ setCurrentRole('ADMIN'); return; } // no codes = full access\n\n  const overlay = document.getElementById('role-login-overlay');\n  if(!overlay) return;\n  document.querySelector('.app-body').style.visibility='hidden';\n  document.querySelector('.topbar').style.visibility='hidden';\n  overlay.style.display='flex';\n}\n\nfunction submitRoleLogin(){\n  const code = (document.getElementById('role-code-input')?.value||'').trim();\n  const errEl = document.getElementById('role-login-error');\n  if(!code){ if(errEl) errEl.textContent='Insere o código de acesso.'; return; }\n  const role = validateRoleCode(code);\n  if(!role){ \n    if(errEl) errEl.textContent='Código incorreto. Tenta novamente.';\n    document.getElementById('role-code-input').value='';\n    document.getElementById('role-code-input').focus();\n    return;\n  }\n  document.querySelector('.app-body').style.visibility='';\n  document.querySelector('.topbar').style.visibility='';\n  const overlay = document.getElementById('role-login-overlay');\n  if(overlay) overlay.style.display='none';\n  setCurrentRole(role);\n  appUnlocked = true;\n  renderDashboard();\n}\n\n// ============================================================\n// AGENDA / LEMBRETES\n// ============================================================\nlet lembretes = LS.get('arca_lembretes') || [];\nlet editingLemId = null;\n\nfunction saveLembretes(){ LS.set('arca_lembretes', lembretes); }\n\nfunction openModalLembrete(id){\n  editingLemId = id||null;\n  const lem = id ? lembretes.find(l=>l.id===id) : null;\n  document.getElementById('lembrete-modal-title').textContent = lem ? 'Editar lembrete' : 'Novo lembrete';\n  document.getElementById('lem-titulo').value = lem?.titulo||'';\n  document.getElementById('lem-data').value = lem?.data||new Date().toISOString().slice(0,10);\n  document.getElementById('lem-hora').value = lem?.hora||'';\n  document.getElementById('lem-prioridade').value = lem?.prioridade||'normal';\n  document.getElementById('lem-cat').value = lem?.cat||'Reunião';\n  document.getElementById('lem-notas').value = lem?.notas||'';\n  openModal('modal-lembrete');\n  setTimeout(()=>document.getElementById('lem-titulo').focus(),100);\n}\n\nfunction saveLembrete(){\n  const titulo = document.getElementById('lem-titulo').value.trim();\n  if(!titulo){ toast('Título obrigatório.',false); return; }\n  const obj = {\n    id: editingLemId||Date.now(),\n    titulo,\n    data: document.getElementById('lem-data').value,\n    hora: document.getElementById('lem-hora').value,\n    prioridade: document.getElementById('lem-prioridade').value,\n    cat: document.getElementById('lem-cat').value,\n    notas: document.getElementById('lem-notas').value.trim(),\n    concluido: false,\n    criadoEm: new Date().toISOString()\n  };\n  if(editingLemId){\n    const idx = lembretes.findIndex(l=>l.id===editingLemId);\n    if(idx>=0){ obj.concluido=lembretes[idx].concluido; lembretes[idx]=obj; }\n  } else {\n    lembretes.push(obj);\n  }\n  editingLemId=null;\n  saveLembretes(); closeModal('modal-lembrete'); renderAgenda(); toast('Lembrete guardado!');\n}\n\nfunction toggleLembrete(id){\n  const l = lembretes.find(x=>x.id===id); if(!l) return;\n  l.concluido = !l.concluido;\n  saveLembretes(); renderAgenda();\n}\n\nfunction deleteLembrete(id){\n  const l = lembretes.find(x=>x.id===id); if(!l) return;\n  pendingDelete = {type:'lembrete', id, label:l.titulo, valor:''};\n  document.getElementById('delete-preview').innerHTML =\n    `<strong>Lembrete<\/strong><br>${l.titulo}<br><span style=\"color:var(--text-2);font-size:12px\">${l.data||''} ${l.hora||''} · ${l.cat||''}<\/span>`;\n  openModal('modal-confirma-delete');\n}\n\n// ---- Alerta central de lembretes vencidos / para hoje ----\nlet _lembretesAvisados = new Set();\nfunction lembretesDevidos(){\n  const agora=new Date(); const hoje=agora.toISOString().slice(0,10);\n  const hhmm=String(agora.getHours()).padStart(2,'0')+':'+String(agora.getMinutes()).padStart(2,'0');\n  return (lembretes||[]).filter(l=>!l.concluido && l.data && (l.data<hoje || (l.data===hoje && (!l.hora || l.hora<=hhmm))));\n}\nfunction verificarLembretes(force){\n  const devidos=lembretesDevidos();\n  const novos=devidos.filter(l=>!_lembretesAvisados.has(l.id));\n  if(!devidos.length || (!novos.length && !force)) return;\n  devidos.forEach(l=>_lembretesAvisados.add(l.id));\n  mostrarPopupLembretes(devidos);\n}\nfunction mostrarPopupLembretes(lista){\n  document.getElementById('lembretes-popup')?.remove();\n  const hoje=new Date().toISOString().slice(0,10);\n  const pr={alta:'🔴',normal:'🟡',baixa:'🟢'};\n  const div=document.createElement('div');\n  div.id='lembretes-popup';\n  div.style.cssText='position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:800;display:flex;align-items:center;justify-content:center;padding:16px';\n  div.innerHTML=`<div style=\"background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:20px 22px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px\">\n      <div style=\"font-size:17px;font-weight:700\">🔔 Lembretes<\/div>\n      <button onclick=\"document.getElementById('lembretes-popup').remove()\" style=\"background:none;border:none;font-size:22px;color:#888;cursor:pointer;line-height:1\">×<\/button>\n    <\/div>\n    <div style=\"font-size:12.5px;color:var(--text-2);margin-bottom:14px\">${lista.length===1?'Tens 1 lembrete':'Tens '+lista.length+' lembretes'} para hoje ou em atraso.<\/div>\n    ${lista.map(l=>`\n      <div style=\"border:0.5px solid #E1E6ED;border-left:4px solid ${l.prioridade==='alta'?'#C0392B':l.prioridade==='baixa'?'#1D9E75':'#BA7517'};border-radius:10px;padding:11px 13px;margin-bottom:9px;background:${l.data<hoje?'#FBF3F1':'#FDFBF5'}\">\n        <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:flex-start\">\n          <div>\n            <div style=\"font-weight:700;font-size:14px\">${pr[l.prioridade]||'🟡'} ${(l.titulo||'').replace(/<\/g,'&lt;')}<\/div>\n            <div style=\"font-size:12px;color:var(--text-2);margin-top:3px\">${l.data<hoje?'⚠️ Em atraso desde ':''}${l.data.split('-').reverse().join('/')}${l.hora?' às '+l.hora:''} · ${l.cat||''}<\/div>\n            ${l.notas?`<div style=\"font-size:12px;color:var(--text-3);margin-top:3px\">${String(l.notas).replace(/<\/g,'&lt;')}<\/div>`:''}\n          <\/div>\n          <div style=\"display:flex;flex-direction:column;gap:5px;flex-shrink:0\">\n            <button onclick=\"concluirLembretePopup(${l.id})\" style=\"font-size:11.5px;padding:5px 10px;border:none;border-radius:16px;background:var(--teal-l);color:var(--teal-d);cursor:pointer;font-weight:600;white-space:nowrap\">✔ Concluído<\/button>\n            <button onclick=\"adiarLembretePopup(${l.id})\" style=\"font-size:11.5px;padding:5px 10px;border:0.5px solid #ddd;border-radius:16px;background:#fff;color:var(--text-2);cursor:pointer;white-space:nowrap\">💤 Amanhã<\/button>\n          <\/div>\n        <\/div>\n      <\/div>`).join('')}\n    <div style=\"display:flex;justify-content:flex-end;gap:8px;margin-top:12px\">\n      <button onclick=\"showPage('agenda', document.querySelector('.nav-item[onclick*=&quot;\\'agenda\\'&quot;]'));document.getElementById('lembretes-popup').remove()\" style=\"font-size:12.5px;padding:8px 14px;border:0.5px solid #ddd;border-radius:9px;background:#fff;cursor:pointer\">🗓 Abrir Agenda<\/button>\n      <button onclick=\"document.getElementById('lembretes-popup').remove()\" class=\"btn-primary\" style=\"font-size:12.5px;padding:8px 16px\">Fechar<\/button>\n    <\/div>\n  <\/div>`;\n  document.body.appendChild(div);\n}\nfunction concluirLembretePopup(id){\n  const l=lembretes.find(x=>x.id===id); if(!l) return;\n  l.concluido=true; saveLembretes();\n  try{ renderAgenda(); }catch(e){}\n  const resto=lembretesDevidos();\n  if(resto.length) mostrarPopupLembretes(resto); else document.getElementById('lembretes-popup')?.remove();\n  toast('Lembrete concluído ✓');\n}\nfunction adiarLembretePopup(id){\n  const l=lembretes.find(x=>x.id===id); if(!l) return;\n  const d=new Date(); d.setDate(d.getDate()+1);\n  l.data=d.toISOString().slice(0,10);\n  saveLembretes(); _lembretesAvisados.delete(id);\n  try{ renderAgenda(); }catch(e){}\n  const resto=lembretesDevidos();\n  if(resto.length) mostrarPopupLembretes(resto); else document.getElementById('lembretes-popup')?.remove();\n  toast('Adiado para amanhã 💤');\n}\n\nfunction renderAgenda(){\n  const hoje = new Date().toISOString().slice(0,10);\n  const fimSemana = new Date(); fimSemana.setDate(fimSemana.getDate()+7);\n  const fimSemStr = fimSemana.toISOString().slice(0,10);\n\n  // Header date\n  const el = document.getElementById('agenda-hoje-label');\n  if(el) el.textContent = 'Hoje: '+new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});\n\n  const ativos = lembretes.filter(l=>!l.concluido);\n  const concluidos = lembretes.filter(l=>l.concluido);\n  const hojeList = ativos.filter(l=>l.data===hoje);\n  const semanaList = ativos.filter(l=>l.data>hoje&&l.data<=fimSemStr);\n  const urgentes = ativos.filter(l=>l.prioridade==='urgente').length;\n\n  // Metrics\n  const mEl = document.getElementById('agenda-metrics');\n  if(mEl) mEl.innerHTML = `\n    <div class=\"metric-card\"><div class=\"metric-label\">Hoje<\/div><div class=\"metric-value\" style=\"color:var(--blue)\">${hojeList.length}<\/div><div class=\"metric-sub\">tarefas<\/div><\/div>\n    <div class=\"metric-card\"><div class=\"metric-label\">Esta semana<\/div><div class=\"metric-value\">${semanaList.length}<\/div><div class=\"metric-sub\">tarefas<\/div><\/div>\n    <div class=\"metric-card\"><div class=\"metric-label\">Urgentes<\/div><div class=\"metric-value red\">${urgentes}<\/div><div class=\"metric-sub\">pendentes<\/div><\/div>\n    <div class=\"metric-card\"><div class=\"metric-label\">Concluídos<\/div><div class=\"metric-value green\">${concluidos.length}<\/div><\/div>`;\n\n  renderLemList('agenda-list-hoje', hojeList.length ? hojeList : [{_empty:'Nenhum lembrete para hoje.'}]);\n  renderLemList('agenda-list-semana', semanaList.length ? semanaList : [{_empty:'Nenhum lembrete para esta semana.'}]);\n  renderLemList('agenda-list-todos', ativos.length ? [...ativos].sort((a,b)=>(a.data||'9').localeCompare(b.data||'9')) : [{_empty:'Sem lembretes pendentes.'}]);\n  renderLemList('agenda-list-concluidos', concluidos.length ? concluidos : [{_empty:'Sem lembretes concluídos.'}]);\n\n  // Show alert if urgentes\n  const existingAlert = document.getElementById('agenda-urgente-banner');\n  if(existingAlert) existingAlert.remove();\n  if(hojeList.filter(l=>l.prioridade==='urgente').length){\n    const banner = document.createElement('div');\n    banner.id='agenda-urgente-banner';\n    banner.style.cssText='position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#FAECE7;border:1.5px solid #F09595;border-radius:var(--radius-lg);padding:10px 20px;font-size:13px;color:#712B13;z-index:90;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.1)';\n    banner.innerHTML='⚠️ Tens tarefas urgentes para hoje! <a href=\"#\" onclick=\"showPage(&quot;agenda&quot;,null);this.parentElement.remove()\" style=\"color:#712B13;margin-left:8px;text-decoration:underline\">Ver →<\/a>';\n    document.body.appendChild(banner);\n    setTimeout(()=>{const b=document.getElementById('agenda-urgente-banner');if(b)b.remove();},8000);\n  }\n}\n\nfunction renderLemList(containerId, list){\n  const el = document.getElementById(containerId); if(!el) return;\n  if(list[0]?._empty){ el.innerHTML=`<div class=\"empty-state\" style=\"padding:24px\"><p>${list[0]._empty}<\/p><\/div>`; return; }\n  const priorCor={urgente:'#712B13',alta:'#633806',normal:'var(--text)'}; \n  const priorBg={urgente:'#FAECE7',alta:'#FAEEDA',normal:'var(--bg2)'};\n  const catIcon={Reunião:'👥',Pagamento:'💶',Evento:'🎉',Sócio:'🪪',ATL:'🏃',Administrativo:'📋',Outro:'📌'};\n  el.innerHTML = `<div style=\"display:flex;flex-direction:column;gap:8px;padding:4px 0\">${list.map(l=>`\n    <div style=\"background:${l.concluido?'var(--bg2)':priorBg[l.prioridade||'normal']};border:var(--border);border-left:3px solid ${l.concluido?'#ccc':priorCor[l.prioridade||'normal']};border-radius:var(--radius);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;opacity:${l.concluido?.6:1}\">\n      <input type=\"checkbox\" ${l.concluido?'checked':''} onchange=\"toggleLembrete(${l.id})\" style=\"margin-top:3px;width:16px;height:16px;cursor:pointer;accent-color:var(--teal)\">\n      <div style=\"flex:1;min-width:0\">\n        <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap\">\n          <span style=\"font-size:13px;font-weight:${l.concluido?400:600};text-decoration:${l.concluido?'line-through':''};color:${l.concluido?'var(--text-3)':'var(--text)'}\">${l.titulo}<\/span>\n          ${l.prioridade!=='normal'?`<span style=\"font-size:10px;padding:1px 7px;border-radius:20px;background:${priorCor[l.prioridade]};color:#fff;font-weight:600\">${l.prioridade.toUpperCase()}<\/span>`:''}\n          <span style=\"font-size:10px;color:var(--text-3)\">${catIcon[l.cat]||'📌'} ${l.cat||''}<\/span>\n        <\/div>\n        ${l.data||l.hora?`<div style=\"font-size:11px;color:var(--text-3);margin-top:3px\">📅 ${l.data?new Date(l.data+'T12:00').toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'short'}):''} ${l.hora?'🕐 '+l.hora:''}<\/div>`:''}\n        ${l.notas?`<div style=\"font-size:11px;color:var(--text-2);margin-top:4px;white-space:pre-wrap\">${l.notas}<\/div>`:''}\n      <\/div>\n      <div style=\"display:flex;gap:3px;flex-shrink:0\">\n        <button class=\"btn-edit\" onclick=\"openModalLembrete(${l.id})\" title=\"Editar\" style=\"padding:4px 7px;font-size:11px\">✏<\/button>\n        <button class=\"btn-danger\" onclick=\"deleteLembrete(${l.id})\" title=\"Eliminar\" style=\"padding:4px 7px;font-size:11px\">🗑<\/button>\n      <\/div>\n    <\/div>`).join('')}<\/div>`;\n}\n\n// ============================================================\n// UPLOAD FATURA NAS DESPESAS\n// ============================================================\nlet faturas = LS.get('arca_faturas') || {};\n\nfunction saveFaturas(){ \n  try{ LS.set('arca_faturas', faturas); }catch(e){ toast('Fatura demasiado grande para guardar no browser. Use a exportação.',false); }\n}\n\nfunction openFaturaPanel(movId){\n  const m = movimentos.find(x=>x.id===movId); if(!m) return;\n  const fat = faturas[movId]||{};\n  const overlay = document.createElement('div');\n  overlay.id='fatura-overlay';\n  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250;display:flex;align-items:center;justify-content:center;padding:16px';\n  overlay.innerHTML=`<div style=\"background:var(--bg);border-radius:var(--radius-lg);padding:24px;width:500px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px\">\n      <div style=\"font-size:15px;font-weight:600\">📎 Fatura — ${m.desc||m.sub||m.categoria}<\/div>\n      <button onclick=\"document.getElementById('fatura-overlay').remove()\" style=\"background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-3)\">×<\/button>\n    <\/div>\n    <div class=\"form-grid\">\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Nº da Fatura<\/label>\n          <input type=\"text\" id=\"fat-numero\" value=\"${fat.numero||''}\" placeholder=\"Ex: FT2025/001\"><\/div>\n        <div class=\"form-group\"><label>Data da Fatura<\/label>\n          <input type=\"date\" id=\"fat-data\" value=\"${fat.data||''}\"><\/div>\n      <\/div>\n      <div class=\"form-row\">\n        <div class=\"form-group\"><label>Fornecedor / Emitente<\/label>\n          <input type=\"text\" id=\"fat-fornecedor\" value=\"${fat.fornecedor||''}\" placeholder=\"Nome do fornecedor\"><\/div>\n        <div class=\"form-group\"><label>Valor na Fatura (€)<\/label>\n          <input type=\"number\" id=\"fat-valor\" value=\"${fat.valor||m.valor||''}\" step=\"0.01\" min=\"0\"><\/div>\n      <\/div>\n      <div class=\"form-group\"><label>Notas / Referência<\/label>\n        <input type=\"text\" id=\"fat-notas\" value=\"${fat.notas||''}\" placeholder=\"Referência interna, nota...\"><\/div>\n      <div class=\"form-group\"><label>Upload da fatura (PDF, imagem)<\/label>\n        <div class=\"logo-drop\" onclick=\"document.getElementById('fat-file-input').click()\" style=\"cursor:pointer\">\n          ${fat.fileName?`<div style=\"font-size:13px;color:var(--teal)\">📎 ${fat.fileName}<\/div><div style=\"font-size:11px;color:var(--text-3);margin-top:4px\">Clica para substituir<\/div>`:'<div style=\"font-size:13px;color:var(--text-2)\">Clica para selecionar PDF ou imagem<\/div>'}\n        <\/div>\n        <input type=\"file\" id=\"fat-file-input\" accept=\".pdf,image/*\" style=\"display:none\" onchange=\"handleFaturaFile(${movId},this)\">\n        ${fat.fileName?`<div style=\"margin-top:6px;display:flex;gap:6px;align-items:center\">\n          <span style=\"font-size:12px;color:var(--text-2)\">📎 ${fat.fileName}<\/span>\n          ${fat.fileData?`<button onclick=\"viewFatura(${movId})\" class=\"btn-edit\" style=\"font-size:11px;padding:3px 8px\">Ver<\/button>`:''}\n        <\/div>`:''}\n      <\/div>\n    <\/div>\n    <div style=\"display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:var(--border)\">\n      <button class=\"btn-secondary\" onclick=\"document.getElementById('fatura-overlay').remove()\">Cancelar<\/button>\n      <button class=\"btn-primary\" onclick=\"saveFaturaData(${movId})\">Guardar fatura<\/button>\n    <\/div>\n  <\/div>`;\n  document.body.appendChild(overlay);\n}\n\nfunction handleFaturaFile(movId, input){\n  const file=input.files[0]; if(!file) return;\n  const maxSize=2*1024*1024; // 2MB limit for localStorage\n  if(file.size>maxSize){ toast('Ficheiro demasiado grande (máx 2MB). Guarda o nome e número da fatura manualmente.',false); \n    if(!faturas[movId]) faturas[movId]={};\n    faturas[movId].fileName=file.name;\n    saveFaturas(); return; }\n  const r=new FileReader();\n  r.onload=e=>{\n    if(!faturas[movId]) faturas[movId]={};\n    faturas[movId].fileData=e.target.result;\n    faturas[movId].fileName=file.name;\n    saveFaturas();\n    // Update UI\n    const drop=document.querySelector('#fatura-overlay .logo-drop');\n    if(drop) drop.innerHTML=`<div style=\"font-size:13px;color:var(--teal)\">📎 ${file.name}<\/div><div style=\"font-size:11px;color:var(--text-3);margin-top:4px\">Clica para substituir<\/div>`;\n    toast('Fatura carregada!');\n  };\n  r.readAsDataURL(file);\n}\n\nfunction saveFaturaData(movId){\n  if(!faturas[movId]) faturas[movId]={};\n  faturas[movId].numero = (document.getElementById('fat-numero')?.value||'').trim();\n  faturas[movId].data = document.getElementById('fat-data')?.value||'';\n  faturas[movId].fornecedor = (document.getElementById('fat-fornecedor')?.value||'').trim();\n  faturas[movId].valor = parseFloat(document.getElementById('fat-valor')?.value)||0;\n  faturas[movId].notas = (document.getElementById('fat-notas')?.value||'').trim();\n  // Also update movimento with fatura reference\n  const m = movimentos.find(x=>x.id===movId);\n  if(m){\n    m.faturaRef = faturas[movId].numero;\n    m.faturaData = faturas[movId].data;\n    save();\n  }\n  saveFaturas();\n  document.getElementById('fatura-overlay')?.remove();\n  toast('Fatura guardada!');\n  renderAll();\n}\n\nfunction viewFatura(movId){\n  const fat=faturas[movId]; if(!fat?.fileData) return;\n  const w=window.open('','_blank');\n  if(fat.fileData.startsWith('data:image')){\n    w.document.write(`<html><body style=\"margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh\"><img src=\"${fat.fileData}\" style=\"max-width:100%;max-height:100vh;object-fit:contain\"><\/body><\/html>`);\n  } else {\n    w.document.write(`<html><body style=\"margin:0\"><embed src=\"${fat.fileData}\" type=\"application/pdf\" width=\"100%\" height=\"100vh\"><\/body><\/html>`);\n  }\n  w.document.close();\n}\n\n// ============================================================\n// MENSAGENS MOTIVACIONAIS / ANEDOTAS\n// ============================================================\n\n// Direção members - loaded dynamically from config\nfunction getDirMembers(){ return LS.get('arca_direccao') || [\n  {id:1, cargo:'Presidente', nome:''},\n  {id:2, cargo:'Vice-Presidente', nome:''},\n  {id:3, cargo:'Tesoureiro/a', nome:''},\n  {id:4, cargo:'Secretário/a', nome:''},\n  {id:5, cargo:'Diretor/a Desportivo/a', nome:''},\n  {id:6, cargo:'Diretor/a Cultural', nome:''},\n  {id:7, cargo:'Vogal', nome:''}\n]; }\nfunction saveDirMembers(m){ LS.set('arca_direccao', m); }\n\n// Get admin name for personalised jokes\nfunction getAdminNome(){\n  const m = getDirMembers();\n  const sec = m.find(x=>x.cargo.toLowerCase().includes('secret'));\n  return sec?.nome ? sec.nome.split(' ')[0] : 'Administrativa';\n}\n\nfunction getMsgComNome(){\n  const nome = getAdminNome();\n  const dir = getDirMembers().filter(x=>x.nome);\n  // Pick a random direction member that is NOT the admin\n  const outros = dir.filter(x=>!x.cargo.toLowerCase().includes('secret'));\n  const remetente = outros.length ? outros[Math.floor(Math.random()*outros.length)] : {cargo:'Direção', nome:'A Direção'};\n  const rem = remetente.nome ? remetente.nome.split(' ')[0] : remetente.cargo;\n  return {nome, rem, cargo:remetente.cargo};\n}\n\nconst MOTIVACIONAIS_BASE = [\n  // Motivacionais gerais\n  {tipo:'motiv', msg:'\"O sucesso é a soma de pequenos esforços repetidos dia após dia.\" Continuem o excelente trabalho pela ARCA! 💪'},\n  {tipo:'motiv', msg:'\"Sozinhos fazemos tão pouco; juntos fazemos tanto.\" — Helen Keller. A ARCA é isso mesmo! 🌟'},\n  {tipo:'motiv', msg:'Cada sócio conquistado é uma vitória. Cada atividade realizada é uma memória criada. Obrigado pela vossa dedicação! 🏆'},\n  {tipo:'motiv', msg:'\"O futuro pertence a quem acredita na beleza dos seus sonhos.\" — Eleanor Roosevelt. A ARCA tem futuro! ✨'},\n  {tipo:'motiv', msg:'Pequenas associações, grandes impactos. A ARCA faz a diferença na comunidade todos os dias! 🤝'},\n  {tipo:'motiv', msg:'\"O trabalho voluntário é a alma de uma boa associação.\" Cada hora que dedicam à ARCA vale ouro! ❤️'},\n  {tipo:'motiv', msg:'A dedicação de hoje é o orgulho de amanhã. Obrigado por fazerem a ARCA crescer! 🌱'},\n  {tipo:'motiv', msg:'Uma associação é tão forte quanto as pessoas que a formam. A ARCA tem os melhores! 🦁'},\n  {tipo:'motiv', msg:'Já passou mais de meia hora? Levanta-te, estica as pernas e bebe água! A ARCA precisa de ti bem disposto! 💧🚶'},\n  {tipo:'motiv', msg:'\"Não são as circunstâncias que fazem o homem, mas o homem que faz as circunstâncias.\" A ARCA faz as suas! 🎯'},\n  {tipo:'motiv', msg:'Cada email respondido, cada sócio atendido, cada evento organizado conta. OBRIGADO! 🙏'},\n  {tipo:'motiv', msg:'O segredo de uma boa associação? Pessoas que se importam. E a ARCA tem isso em abundância! 💫'},\n  {tipo:'motiv', msg:'\"O talento vence jogos, mas só o trabalho em equipa ganha campeonatos.\" — Michael Jordan. Equipa ARCA! 🏅'},\n  {tipo:'motiv', msg:'Lembra-te: cada pequeno passo conta. A ARCA chegou onde está porque toda a gente deu um passo! 👣'},\n  {tipo:'motiv', msg:'Se o trabalho parece muito, é porque vale muito! A ARCA agradece o teu esforço diário 💚'},\n  {tipo:'motiv', msg:'\"A melhor forma de prever o futuro é criá-lo.\" — Peter Drucker. A ARCA cria o seu futuro todos os dias! 🔮'},\n  {tipo:'motiv', msg:'Quantos sócios felizes fazem uma associação de sucesso? TODOS! Continua o excelente trabalho! ⭐'},\n  {tipo:'motiv', msg:'A paixão pelo que fazemos é o motor que nos move. Obrigado por colocarem o vosso coração na ARCA! ❤️🔥'},\n  // Anedotas gerais\n  {tipo:'anedota', msg:'Por que é que o contabilista cruzou a rua? Para chegar ao outro lado do balanço! 😄'},\n  {tipo:'anedota', msg:'Um sócio pergunta: \"Quando é que a reunião acaba?\" O presidente responde: \"Quando todos concordarem!\" O sócio: \"Então fica para sempre...\" 😂'},\n  {tipo:'anedota', msg:'Qual é a diferença entre um tesouro e um tesoureiro? O tesouro é o que guardamos. O tesoureiro é quem nos guarda de gastar! 💰😄'},\n  {tipo:'anedota', msg:'Um sócio chega atrasado à reunião. O presidente pergunta: \"Tens uma boa desculpa?\" Resposta: \"Tenho várias, qual prefere?\" 😅'},\n  {tipo:'anedota', msg:'Por que é que as reuniões da associação nunca terminam a horas? Porque todos querem ter a última palavra... exceto o secretário que quer ir embora! 📝😂'},\n  {tipo:'anedota', msg:'Porque é que o tesoureiro não gosta de janelas? Porque tem medo de gastos correntes! 💨😂'},\n  {tipo:'anedota', msg:'O presidente diz: \"Esta reunião vai ser rápida.\" Duas horas depois... \"Só mais um ponto na ordem do dia!\" 😂🕐'},\n  {tipo:'anedota', msg:'Sócio: \"Quando é a próxima assembleia?\" Admin: \"Quando toda a gente pagar as quotas!\" Sócio: \"Então nunca...\" 😅'},\n  {tipo:'anedota', msg:'Por que é que o diretor desportivo foi ao médico? Porque não conseguia parar de marcar golos administrativos! ⚽😂'},\n  {tipo:'anedota', msg:'Diferença entre uma reunião de 1 hora e uma de 3 horas? Numa há café. Na outra há café, bolachas E revisão da ata! ☕📋😂'},\n  {tipo:'anedota', msg:'Um sócio liga para a ARCA: \"Posso falar com alguém?\" Resposta: \"Somos voluntários, ninguém está aqui.\" \"Então quem atendeu?\" \"Boa pergunta...\" 😄'},\n  {tipo:'anedota', msg:'Por que é que o vogal ficou calado na reunião toda? Porque quando falou, fizeram-lhe uma ata! 📝😂'},\n  {tipo:'anedota', msg:'Na ARCA, o plano B é igual ao plano A... mas com mais café! ☕💪'},\n  {tipo:'anedota', msg:'Um atleta perguntou ao diretor desportivo: \"Tens algum conselho?\" Resposta: \"Sim, paga as quotas em dia!\" 😂💰'},\n  {tipo:'anedota', msg:'Como sabemos que a reunião correu bem? Quando o presidente diz \"próxima semana\" e ninguém protesta! 😂📅'},\n  // Piadas dirigidas à administrativa (com nome dinâmico)\n  {tipo:'piada_admin', remetente_cargo:'Presidente', msg:'Adivinha: o que é que chega sempre antes do café da manhã, resolve tudo antes das 9h e sabe onde estão todos os papéis? Sim... és tu! 😂☕ (Nota: não te estamos a comparar a uma máquina. As máquinas descansam ao fim de semana.)'},\n  {tipo:'piada_admin', remetente_cargo:'Tesoureiro/a', msg:'Temos um problema no orçamento. Os números não batem certo. Ah espera, és tu a fazer as contas. Tudo bem então! 😅📊 Obrigado por fazeres sentido do que para nós parece chinês!'},\n  {tipo:'piada_admin', remetente_cargo:'Vice-Presidente', msg:'Investigámos o que acontece quando faltas um dia. Resultado: o caos instala-se às 9h01. Às 9h05 já ninguém sabe onde estão os sócios. Às 9h10 o presidente pede para ligar o computador. Conclusão: não fiques doente. Nunca. 🙏😂'},\n  {tipo:'piada_admin', remetente_cargo:'Diretor/a Desportivo/a', msg:'Descobrimos que és a peça mais desportiva da ARCA — corres entre emails, saltas por cima de burocracia e atravessas obstáculos em velocidade recorde. Ouro garantido! 🥇😂'},\n  {tipo:'piada_admin', remetente_cargo:'Secretário/a', msg:'Eu faço as atas. Tu fazes o resto. Claramente um de nós tem um emprego mais fácil... e não és tu! 😅📋 Obrigado pela paciência (infinita) connosco!'},\n  {tipo:'piada_admin', remetente_cargo:'Presidente', msg:'Reunião de direção de hoje: 10 minutos a trabalhar, 50 minutos a perguntar onde está o documento que tu já enviaste por email três vezes. Pedimos desculpa. Obrigado por nos aturares! 📧😂'},\n  {tipo:'piada_admin', remetente_cargo:'Tesoureiro/a', msg:'Sabes qual é a diferença entre eu e tu? Eu peço dinheiro. Tu explicas porque é que não temos. Claramente o trabalho mais difícil é o teu! 💸😄'},\n  {tipo:'piada_admin', remetente_cargo:'Vice-Presidente', msg:'Perguntaram-nos quem manda na ARCA. Dissemos que é a Direção. Depois pensámos melhor... és claramente tu que sabes onde está TUDO! 😅👑 Obrigado!'},\n  {tipo:'piada_admin', remetente_cargo:'Diretor/a Cultural', msg:'Organizámos um evento cultural. Tu fizeste as inscrições, contactaste os participantes, preparaste a documentação e confirmaste tudo. Nós pusemos o nome no cartaz. Parece justo? Não. Obrigado! 🎭😂'},\n  {tipo:'piada_admin', remetente_cargo:'Presidente', msg:'Definição do dia: \"Administrativa\" — pessoa com capacidade sobrehumana de responder a 47 emails, atender 12 chamadas e ainda sorrir. Sinónimo de: ARCA d\\'Ajuda a funcionar! 💫'},\n  {tipo:'piada_admin', remetente_cargo:'Tesoureiro/a', msg:'O meu trabalho é controlar o dinheiro. O teu é controlar tudo o resto. Claramente fiz melhor negócio na divisão de tarefas... 😂 Mas sem ti, o dinheiro não chegava a lado nenhum!'},\n  {tipo:'piada_admin', remetente_cargo:'Vice-Presidente', msg:'Fizemos uma pesquisa interna: 100% da direção concorda que sem ti seríamos apenas um grupo de pessoas bem-intencionadas sem agenda, sem sócios e provavelmente sem sede. Obrigado! 😄🏢'},\n  {tipo:'piada_admin', remetente_cargo:'Secretário/a', msg:'Sabes quando dizes que vais \"só verificar uma coisa\" e acabas a resolver o problema de toda a gente? Isso chama-se talento. Ou talvez seja porque nós pedimos muito... Provavelmente as duas coisas. 😅'},\n  {tipo:'piada_admin', remetente_cargo:'Diretor/a Desportivo/a', msg:'Os atletas treinam para serem os melhores. Tu... já chegaste ao topo sem treinar. Ou treinaste tanto que nem damos conta. De qualquer forma, medalha de ouro da ARCA é tua! 🥇'},\n  {tipo:'piada_admin', remetente_cargo:'Presidente', msg:'Piada do dia: \"Por que é que a ARCA funciona tão bem?\" Resposta: \"Porque a administrativa finge que somos organizados e nós fingimos que ajudamos!\" 😂 Obrigado por tornares a mentira muito convincente!'},\n  {tipo:'piada_admin', remetente_cargo:'Tesoureiro/a', msg:'Hoje o tesoureiro tentou fazer o trabalho administrativo. Ao fim de 20 minutos desistiu, bebeu um café e percebeu porque é que te pagamos... ah, somos uma associação. Mas reconhecemos o teu valor! 💙😄'},\n  {tipo:'piada_admin', remetente_cargo:'Vice-Presidente', msg:'Se a ARCA fosse um avião: o presidente seria o capitão, eu era o copiloto. Tu serias... a pessoa que faz o avião decolar, não bater com nenhum obstáculo e aterrar a tempo. Basicamente a parte importante! ✈️😄'},\n  {tipo:'piada_admin', remetente_cargo:'Diretor/a Cultural', msg:'Sabes qual é a diferença entre cultura e burocracia? A cultura inspira. A burocracia cansa. Tu transformas burocracia em cultura. É um superpoder! 🎨✨'},\n  {tipo:'piada_admin', remetente_cargo:'Presidente', msg:'Hoje de manhã quis resolver uma coisa simples. Precisei de 3 palavras-passe, 2 formulários, 1 carimbo e a tua ajuda. Aqui está a prova de que a burocracia existe para nos manter humildes! 😅 Obrigado por seres o nosso GPS!'},\n  {tipo:'piada_admin', remetente_cargo:'Secretário/a', msg:'Eu escrevo as atas. Tu lembras-me o que aconteceu na reunião antes de eu escrever. Conclusão: tu fazes o trabalho duas vezes. Talvez devesses ser a secretária... ah, já és quase tudo! 😂📝'}\n];\n\n// Build dynamic messages with director names\nfunction getMotivacionais(){\n  const {nome, rem, cargo} = getMsgComNome();\n  return MOTIVACIONAIS_BASE.map(item => {\n    if(item.tipo !== 'piada_admin') return item;\n    // Only show this piada if the remetente_cargo matches a configured member\n    const dir = getDirMembers();\n    const hasMatch = dir.some(d=>d.cargo===item.remetente_cargo&&d.nome);\n    if(!hasMatch) return null; // skip if no one configured for that role\n    const rem2 = dir.find(d=>d.cargo===item.remetente_cargo);\n    const remNome = rem2?.nome ? rem2.nome.split(' ')[0] : item.remetente_cargo;\n    const adminNome = nome && nome !== 'Administrativa' ? nome : 'Colega';\n    // Replace placeholders\n    const msg = `[${remNome} — ${item.remetente_cargo}] ${item.msg}`;\n    return {tipo:'piada_admin', msg};\n  }).filter(Boolean);\n}\n\nlet motivTimer = null;\nlet motivAtivo = LS.get('arca_motiv_ativo') !== false;\nlet lastMotivIdx = -1;\nlet lastShownMsgIds = JSON.parse(LS.get('arca_motiv_seen') || '[]');\nconst appStartTime = Date.now();\n\n// ── Random delay generator ──────────────────────────────────\n// Returns a random ms value from a weighted pool of intervals:\n//   60% chance → 3 h  (3×60×60×1000)\n//   20% chance → 12 h\n//   12% chance → 24 h\n//   8%  chance → anything between 4 h and 48 h (true surprise)\nfunction randomMotivDelay(){\n  const r = Math.random();\n  const h = 60*60*1000;\n  if(r < 0.60) return 3*h  + (Math.random()-0.5)*30*60*1000;   // ~3 h ±15 min\n  if(r < 0.80) return 12*h + (Math.random()-0.5)*60*60*1000;   // ~12 h ±30 min\n  if(r < 0.92) return 24*h + (Math.random()-0.5)*2*h;          // ~24 h ±1 h\n  return (4 + Math.random()*44)*h;                              // 4 h – 48 h wildcard\n}\n\n// ── Session uptime helper ────────────────────────────────────\nfunction sessionMinutes(){ return Math.floor((Date.now()-appStartTime)/60000); }\n\n// ── Pick message based on context ───────────────────────────\nfunction pickMensagem(){\n  const msgs = getMotivacionais();\n  if(!msgs.length) return null;\n  const uptime = sessionMinutes();\n\n  // Context rules:\n  // Long session (>45 min) → prefer motivacional\n  // Short session (<15 min) → prefer piada/anedota (surprise effect)\n  // Otherwise → truly random\n  let pool;\n  if(uptime > 45){\n    pool = msgs.filter(m=>m.tipo==='motiv');\n    if(!pool.length) pool = msgs;\n  } else if(uptime < 15){\n    pool = msgs.filter(m=>m.tipo==='piada_admin'||m.tipo==='anedota');\n    if(!pool.length) pool = msgs;\n  } else {\n    pool = msgs;\n  }\n\n  // Filter out recently seen messages (last 5 shown)\n  const unseenPool = pool.filter((_,i)=>!lastShownMsgIds.includes(i));\n  const finalPool = unseenPool.length >= 3 ? unseenPool : pool;\n\n  // Pick random from final pool, avoiding exact last message\n  let idx;\n  let attempts = 0;\n  do {\n    idx = Math.floor(Math.random()*finalPool.length);\n    attempts++;\n  } while(finalPool[idx]===msgs[lastMotivIdx] && finalPool.length>1 && attempts<10);\n\n  // Track seen\n  const globalIdx = msgs.indexOf(finalPool[idx]);\n  lastMotivIdx = globalIdx;\n  lastShownMsgIds = [globalIdx,...lastShownMsgIds].slice(0,8);\n  try{ LS.set('arca_motiv_seen', JSON.stringify(lastShownMsgIds)); }catch(e){}\n\n  return finalPool[idx];\n}\n\n// ── Schedule next popup (self-rescheduling) ─────────────────\nfunction scheduleNextMotiv(){\n  if(motivTimer){ clearTimeout(motivTimer); motivTimer=null; }\n  if(!motivAtivo) return;\n  const delay = randomMotivDelay();\n  const horas = (delay/3600000).toFixed(1);\n  console.log(`[ARCA Motiv] Próxima mensagem em ${horas} horas`);\n  motivTimer = setTimeout(()=>{\n    showMotivPopup();\n    scheduleNextMotiv(); // schedule the one after\n  }, delay);\n}\n\nfunction startMotivacional(){\n  if(motivTimer){ clearTimeout(motivTimer); motivTimer=null; }\n  if(!motivAtivo) return;\n  // First appearance: between 2 and 8 minutes after opening (feels natural, not instant)\n  const firstDelay = (2 + Math.random()*6) * 60 * 1000;\n  motivTimer = setTimeout(()=>{\n    showMotivPopup();\n    scheduleNextMotiv();\n  }, firstDelay);\n}\n\nfunction showMotivPopup(forced){\n  if(!motivAtivo && !forced) return;\n  const item = pickMensagem();\n  if(!item) return;\n  const existing = document.getElementById('motiv-popup');\n  if(existing) existing.remove();\n\n  const uptime = sessionMinutes();\n  const cor = item.tipo==='motiv'?'var(--teal)':item.tipo==='piada_admin'?'var(--blue)':'var(--amber)';\n  const icon = item.tipo==='motiv'\n    ? (uptime>45?'☕ Pausa motivacional':'💪 Motivação')    : item.tipo==='piada_admin'?'😄 Mensagem da Direção':'😄 Anedota do dia';\n\n  const div = document.createElement('div');\n  div.id = 'motiv-popup';\n  div.style.cssText = 'position:fixed;bottom:80px;right:24px;width:330px;background:var(--bg);border:1px solid #e0e0e0;border-radius:var(--radius-lg);padding:18px 20px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:300;animation:slideUp .35s ease';\n  div.innerHTML = `\n    <style>@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}<\/style>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:11px\">\n      <span style=\"font-size:12px;font-weight:700;color:${cor};letter-spacing:.3px\">${icon}<\/span>\n      <button onclick=\"document.getElementById('motiv-popup').remove()\" title=\"Fechar\"\n        style=\"background:none;border:none;font-size:20px;color:var(--text-3);cursor:pointer;line-height:1;padding:0 2px\">×<\/button>\n    <\/div>\n    <div style=\"font-size:13px;color:var(--text);line-height:1.7;margin-bottom:12px\">${item.msg}<\/div>\n    <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n      <button onclick=\"showMotivPopup(true)\"\n        style=\"font-size:11px;padding:4px 11px;border:var(--border);border-radius:20px;background:var(--bg2);cursor:pointer;color:var(--text-2);transition:background .12s\"\n        onmouseover=\"this.style.background='var(--gray-m)'\" onmouseout=\"this.style.background='var(--bg2)'\">Outra →<\/button>\n      <button onclick=\"document.getElementById('motiv-popup').remove()\"\n        style=\"font-size:11px;padding:4px 11px;border:var(--border);border-radius:20px;background:var(--bg2);cursor:pointer;color:var(--text-2);transition:background .12s\"\n        onmouseover=\"this.style.background='var(--gray-m)'\" onmouseout=\"this.style.background='var(--bg2)'\">Fechar<\/button>\n      <button onclick=\"toggleMotivacional();document.getElementById('motiv-popup')?.remove()\" title=\"Desligar as mensagens motivacionais e anedotas (podes voltar a ligar em Configurações → Dados)\"\n        style=\"font-size:11px;padding:4px 11px;border:var(--border);border-radius:20px;background:var(--bg2);cursor:pointer;color:var(--coral-d);transition:background .12s\"\n        onmouseover=\"this.style.background='var(--coral-l)'\" onmouseout=\"this.style.background='var(--bg2)'\">🔕 Desligar estas mensagens<\/button>\n    <\/div>`;\n  document.body.appendChild(div);\n  // Auto-dismiss after 45 sec\n  setTimeout(()=>{\n    const p=document.getElementById('motiv-popup');\n    if(p){ p.style.opacity='0'; p.style.transition='opacity .5s'; setTimeout(()=>p?.remove(),500); }\n  }, 45000);\n}\n\nfunction toggleMotivacional(){\n  motivAtivo = !motivAtivo;\n  LS.set('arca_motiv_ativo', motivAtivo);\n  if(motivAtivo){ startMotivacional(); toast('Mensagens motivacionais ativadas! 💪'); }\n  else {\n    if(motivTimer){ clearTimeout(motivTimer); clearInterval(motivTimer); motivTimer=null; }\n    toast('Mensagens pausadas.');\n  }\n  renderConfigDados();\n}\n\nfunction renderConfigDados(){\n  const btn = document.getElementById('btn-motiv-toggle');\n  if(btn){ btn.textContent=motivAtivo?'😄 Desativar mensagens':'💪 Ativar mensagens'; btn.className=motivAtivo?'btn-danger':'btn-primary'; }\n  const driveUrl = LS.get('arca_drive_url')||'';\n  const driveEl = document.getElementById('config-drive-url');\n  if(driveEl) driveEl.value = driveUrl;\n  const driveLinkEl = document.getElementById('config-drive-link');\n  if(driveLinkEl) driveLinkEl.style.display = driveUrl ? 'inline-flex' : 'none';\n  const driveMsg = document.getElementById('config-drive-msg');\n  if(driveMsg) driveMsg.innerHTML = driveUrl\n    ? `<span style=\"color:var(--teal)\">✓ Drive configurado — <a href=\"${driveUrl}\" target=\"_blank\" style=\"color:var(--teal)\">${driveUrl.substring(0,50)}...<\/a><\/span>`\n    : '';\n}\n\nfunction saveDriveUrl(){\n  const url = (document.getElementById('config-drive-url')?.value||'').trim();\n  if(url && !url.startsWith('http')){ toast('URL inválido. Começa com https://', false); return; }\n  LS.set('arca_drive_url', url||null);\n  renderConfigDados();\n  toast(url ? '✓ Google Drive configurado!' : 'Google Drive removido.');\n}\n\nfunction abrirDrive(){\n  const url = LS.get('arca_drive_url');\n  if(url) window.open(url, '_blank');\n  else toast('Define primeiro o link do Google Drive.', false);\n}\n\n// ============================================================\n// CONFIGURAÇÃO DIREÇÃO\n// ============================================================\nfunction renderConfigDireccao(){\n  const el = document.getElementById('config-direccao-content');\n  if(!el) return;\n  const membros = getDirMembers();\n\n  const CARGOS_DISPONIVEIS = [\n    'Presidente','Vice-Presidente','Tesoureiro/a','Secretário/a',\n    'Diretor/a Desportivo/a','Diretor/a Cultural','Diretor/a Financeiro/a',\n    'Vogal','Vogal Suplente','Fiscal Único','Outro'\n  ];\n\n  let html = `\n  <div class=\"card\" style=\"margin-bottom:14px\">\n    <div class=\"card-title\">👥 Membros da Direção<\/div>\n    <p style=\"font-size:12px;color:var(--text-2);margin-bottom:16px;line-height:1.6\">\n      Os nomes configurados aqui são usados nas mensagens motivacionais e piadas personalizadas para a administrativa. \n      As piadas são enviadas com o nome e cargo do membro da direção como remetente.\n    <\/p>\n    <div style=\"display:flex;flex-direction:column;gap:8px\" id=\"dir-lista\">`;\n\n  membros.forEach((m,i) => {\n    html += `\n      <div class=\"gestao-item\" id=\"dir-item-${m.id}\" style=\"gap:8px;flex-wrap:wrap\">\n        <select id=\"dir-cargo-${m.id}\" style=\"padding:7px 10px;border:var(--border);border-radius:var(--radius);background:var(--bg2);font-size:13px;min-width:190px\">\n          ${CARGOS_DISPONIVEIS.map(c=>`<option value=\"${c}\" ${c===m.cargo?'selected':''}>${c}<\/option>`).join('')}\n        <\/select>\n        <input type=\"text\" id=\"dir-nome-${m.id}\" value=\"${m.nome||''}\" placeholder=\"Nome completo...\"\n          style=\"flex:1;min-width:160px;padding:7px 10px;border:var(--border);border-radius:var(--radius);background:var(--bg2);font-size:13px\">\n        <div style=\"display:flex;gap:4px\">\n          <button class=\"reorder-btn\" ${i===0?'disabled':''} onclick=\"moveDirMembro(${m.id},-1)\" title=\"Subir\">▲<\/button>\n          <button class=\"reorder-btn\" ${i===membros.length-1?'disabled':''} onclick=\"moveDirMembro(${m.id},1)\" title=\"Descer\">▼<\/button>\n          <button class=\"btn-secondary\" style=\"padding:5px 10px;font-size:12px\" onclick=\"saveDirMembro(${m.id})\">💾<\/button>\n          <button class=\"btn-danger\" style=\"padding:5px 8px;font-size:12px\" onclick=\"deleteDirMembro(${m.id})\">🗑<\/button>\n        <\/div>\n      <\/div>`;\n  });\n\n  html += `\n    <\/div>\n    <div style=\"margin-top:12px;display:flex;gap:8px;flex-wrap:wrap\">\n      <button class=\"btn-primary\" onclick=\"addDirMembro()\">+ Adicionar membro<\/button>\n      <button class=\"btn-secondary\" onclick=\"saveAllDirMembros()\">💾 Guardar todos<\/button>\n    <\/div>\n  <\/div>\n  <div class=\"card\">\n    <div class=\"card-title\">💬 Pré-visualização das piadas<\/div>\n    <div style=\"font-size:12px;color:var(--text-2);margin-bottom:12px\">Com os nomes configurados acima, as piadas ficarão assim:<\/div>\n    <div style=\"display:flex;flex-direction:column;gap:8px\" id=\"piadas-preview\">`;\n\n  const msgs = getMotivacionais().filter(m=>m.tipo==='piada_admin').slice(0,4);\n  if(msgs.length){\n    msgs.forEach(m=>{\n      html += `<div style=\"background:var(--blue-l);border:0.5px solid #B5D4F4;border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--text-2);line-height:1.6\">${m.msg}<\/div>`;\n    });\n  } else {\n    html += `<div style=\"color:var(--text-3);font-size:12px;font-style:italic\">Configura pelo menos um membro da direção com nome para ver a pré-visualização das piadas personalizadas.<\/div>`;\n  }\n\n  html += `<\/div><\/div>`;\n  el.innerHTML = html;\n}\n\nfunction addDirMembro(){\n  const membros = getDirMembers();\n  const newId = Date.now();\n  membros.push({id:newId, cargo:'Vogal', nome:''});\n  saveDirMembers(membros);\n  renderConfigDireccao();\n  setTimeout(()=>document.getElementById('dir-nome-'+newId)?.focus(), 50);\n}\n\nfunction saveDirMembro(id){\n  const membros = getDirMembers();\n  const idx = membros.findIndex(m=>m.id===id);\n  if(idx<0) return;\n  const cargo = document.getElementById('dir-cargo-'+id)?.value||membros[idx].cargo;\n  const nome = document.getElementById('dir-nome-'+id)?.value.trim()||'';\n  membros[idx] = {...membros[idx], cargo, nome};\n  saveDirMembers(membros);\n  toast('Guardado!');\n}\n\nfunction saveAllDirMembros(){\n  const membros = getDirMembers();\n  membros.forEach(m=>{\n    const cargo = document.getElementById('dir-cargo-'+m.id)?.value||m.cargo;\n    const nome = document.getElementById('dir-nome-'+m.id)?.value.trim()||'';\n    m.cargo = cargo; m.nome = nome;\n  });\n  saveDirMembers(membros);\n  toast('Todos os membros guardados!');\n  renderConfigDireccao();\n}\n\nfunction deleteDirMembro(id){\n  let membros = getDirMembers().filter(m=>m.id!==id);\n  saveDirMembers(membros);\n  renderConfigDireccao();\n  toast('Membro removido.');\n}\n\nfunction moveDirMembro(id, dir){\n  const membros = getDirMembers();\n  // Save current values first\n  membros.forEach(m=>{\n    const cargo = document.getElementById('dir-cargo-'+m.id)?.value;\n    const nome = document.getElementById('dir-nome-'+m.id)?.value;\n    if(cargo) m.cargo=cargo;\n    if(nome!==undefined) m.nome=nome.trim();\n  });\n  const idx = membros.findIndex(m=>m.id===id);\n  const other = idx+dir;\n  if(other<0||other>=membros.length) return;\n  [membros[idx],membros[other]] = [membros[other],membros[idx]];\n  saveDirMembers(membros);\n  renderConfigDireccao();\n}\n\n// ============================================================\n// FIX COMPROVATIVO IMPRESSÃO (largura A4 correcta)\n// ============================================================\n\n// ============================================================\n\n\n// ============================================================\n// COFRE / NUMERÁRIO\n// ============================================================\nlet movCofre = LS.get('arca_cofre') || [];\nlet editingCofreId = null;\nlet currentCofreTipo = 'entrada';\n\nfunction saveCofre(){ LS.set('arca_cofre', movCofre); }\n\nfunction getSaldoCofre(){\n  // 1. Lançamentos gerais em Numerário: receitas entram, despesas saem\n  const recNum  = movimentos.filter(m=>m.cat==='receita' &&m.tipmov==='Numerário').reduce((s,m)=>s+m.valor,0);\n  const despNum = movimentos.filter(m=>m.cat==='despesa'&&m.tipmov==='Numerário').reduce((s,m)=>s+m.valor,0);\n  // 2. Pagamentos ATL feitos em Numerário entram no cofre\n  const atlNum  = 0;\n  // 3. Movimentos manuais do módulo Cofre (entradas e saídas directas)\n  const movMan  = movCofre.reduce((s,m)=>m.tipo==='entrada'?s+m.valor:s-m.valor, 0);\n  return recNum - despNum + atlNum + movMan;\n}\n\nfunction updateTopbarCofre(){\n  const saldo = getSaldoCofre();\n  const el = document.getElementById('topbar-saldo-cofre');\n  if(el) el.textContent = fmt(saldo);\n}\n\nfunction openModalDepositoBanco(){\n  const hoje = new Date().toISOString().slice(0,10);\n  const mesAtual = new Date().getMonth()+1;\n  document.getElementById('dep-data').value = hoje;\n  document.getElementById('dep-mes').value = mesAtual;\n  document.getElementById('dep-valor').value = '';\n  document.getElementById('dep-quem').value = getAdminInfo().nome||'';\n  document.getElementById('dep-nota').value = '';\n  updateDepositoPreview();\n  openModal('modal-deposito-banco');\n  setTimeout(()=>document.getElementById('dep-valor').focus(),100);\n}\n\nfunction updateDepositoPreview(){\n  const saldo = getSaldoCofre();\n  const val = parseFloat(document.getElementById('dep-valor')?.value)||0;\n  const depois = saldo - val;\n  document.getElementById('dep-saldo-atual').textContent = fmt(saldo);\n  const depEl = document.getElementById('dep-saldo-depois');\n  if(depEl){\n    depEl.textContent = fmt(depois);\n    depEl.style.color = depois < 0 ? 'var(--coral-d)' : 'var(--teal-d)';\n  }\n}\n\nfunction saveDepositoBanco(){\n  const mes   = parseInt(document.getElementById('dep-mes').value);\n  const data  = document.getElementById('dep-data').value;\n  const valor = parseFloat(document.getElementById('dep-valor').value)||0;\n  const quem  = (document.getElementById('dep-quem').value||'').trim();\n  const nota  = (document.getElementById('dep-nota').value||'').trim();\n  const ano   = getAno();\n\n  if(!valor||valor<=0){ toast('Insere um valor válido.',false); return; }\n  const saldoCofre = getSaldoCofre();\n  if(valor > saldoCofre){\n    if(!confirm(`O cofre tem ${fmt(saldoCofre)} e queres depositar ${fmt(valor)}. O saldo ficaria negativo. Confirmas?`)) return;\n  }\n\n  const desc = `Depósito bancário${quem?' — '+quem:''}${nota?' · '+nota:''}`;\n\n  // 1. Saída do cofre\n  movCofre.push({\n    id: Date.now(),\n    tipo: 'saida',\n    ano, mes, data,\n    cat: 'Transferência para banco',\n    desc,\n    valor,\n    nota: nota||'Depósito bancário'\n  });\n  saveCofre();\n\n  // 2. Lançamento geral — receita por transferência bancária\n  movimentos.push({\n    id: Date.now()+1,\n    cat: 'receita',\n    ano, mes,\n    tipmov: 'Transf. Bancária',\n    categoria: 'Outra Receita',\n    sub: 'Depósito do Cofre',\n    desc,\n    nota: nota||'Proveniente do cofre de numerário',\n    valor\n  });\n  saveAll();\n\n  updateTopbarCofre();\n  updateTopbarSaldo();\n  closeModal('modal-deposito-banco');\n  renderAll();\n  toast(`✓ Depósito de ${fmt(valor)} registado — saiu do cofre e entrou nos lançamentos bancários.`);\n}\n\nfunction openModalCofre(tipo){\n  editingCofreId = null;\n  const t = document.getElementBy
