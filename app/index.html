2'].map(g=>`<option value=\"${g==='—'?'':g}\" ${((c.grupo||'')===(g==='—'?'':g))?'selected':''}>${g}<\/option>`).join('')}<\/select>`)}<\/td>\n        <td class=\"right\">${fmt(val)}<\/td>\n        <td class=\"right\">${fmt(pg)}<\/td>\n        <td>${canc?'<span class=\"chip red\">Cancelada<\/span>':estado}${(!canc&&val>pg)?`<div class=\"muted\" style=\"font-size:11px;margin-top:2px\">Falta: <b style=\"color:var(--coral-d)\">${fmt(val-pg)}<\/b><\/div>`:''}${c.notaInscricao?` <span class=\"tag-nota\" title=\"${esc(c.notaInscricao)}\">📝 Nota<\/span>`:''}${c.lembrete?` <span class=\"tag-lembrete\" title=\"${esc(c.lembrete)}\">🔔 Lembrete<\/span>`:''}<\/td>\n        <td class=\"right\" style=\"white-space:nowrap\"><button class=\"btn-sm btn-neutral\" title=\"Imprimir ficha e declarações\" onclick=\"abrirImprimir('${c.id}')\">🖨️<\/button>${modoAno()?'':` <button class=\"btn-sm btn-neutral${(!canc&&!c.verificado)?' piscar':''}\" title=\"${(!canc&&!c.verificado)?('⚠️ POR VERIFICAR pela administração'+((c.atleta||c.temIrmao)?' — inclui desconto a confirmar':'')):'Gestão administrativa (verificada)'}\" onclick=\"abrirAdminInscricao('${c.id}')\">🗂️<\/button> <button class=\"btn-sm btn-edit\" onclick=\"abrirModalCrianca('${c.id}')\">✏️<\/button> ${canc?`<button class=\"btn-sm btn-add\" title=\"Reativar inscrição\" onclick=\"reativarInscricao('${c.id}')\">↩️ Reativar<\/button>`:`<button class=\"btn-sm btn-neutral\" title=\"Cancelar inscrição (mantém o registo)\" onclick=\"cancelarInscricao('${c.id}')\">🚫<\/button>`} <button class=\"btn-sm btn-del\" title=\"Eliminar definitivamente\" onclick=\"eliminarCrianca('${c.id}')\">🗑️<\/button>`}<\/td>\n      <\/tr>`; }).join('')}\n    <\/tbody><\/table><\/div>`;\n}\nfunction idade(nasc){ if(!nasc) return ''; const b=new Date(nasc); if(isNaN(b)) return ''; const n=new Date(); let a=n.getFullYear()-b.getFullYear(); const m=n.getMonth()-b.getMonth(); if(m<0||(m===0&&n.getDate()<b.getDate()))a--; return a+' anos'; }\nfunction setGrupo(id,val){ if(guardaModoAno()) return; const d=getD(); const c=d.criancas.find(x=>x.id===id); if(c){ c.grupo=val; setD(d); renderCriancasTabela(); } }\n// idade / elegibilidade (6 a 12 anos à data de início do ATL)\nfunction refIdadeISO(){ const ed=getEdicao(); return (ed&&ed.dataInicio)?ed.dataInicio:hoje(); }\nfunction idadeEm(nascIso, refIso){ const b=parseD(nascIso), r=parseD(refIso); if(!b||!r||isNaN(b)||isNaN(r)) return null; let a=r.getFullYear()-b.getFullYear(); const m=r.getMonth()-b.getMonth(); if(m<0||(m===0&&r.getDate()<b.getDate()))a--; return a; }\nfunction limitesNasc(){ const r=parseD(refIdadeISO())||new Date();\n  const max=new Date(r.getFullYear()-6, r.getMonth(), r.getDate());        // idade >= 6\n  const min=new Date(r.getFullYear()-13, r.getMonth(), r.getDate()); min.setDate(min.getDate()+1); // idade <= 12\n  return {min:isoDate(min), max:isoDate(max)}; }\nfunction verIdade(){ const el=$('c-idade-info'); if(!el) return; const nasc=$('c-nasc').value;\n  if(!nasc){ el.innerHTML='<span class=\"muted\">Idade permitida: 6 a 12 anos (à data de início do ATL).<\/span>'; return; }\n  const a=idadeEm(nasc, refIdadeISO()); const ok=a!=null&&a>=6&&a<=12;\n  el.innerHTML = ok? `<span style=\"color:var(--teal);font-weight:600\">✓ ${a} anos — elegível<\/span>` : `<span style=\"color:var(--coral-d);font-weight:600\">⚠️ ${a} anos — fora do limite (6 a 12 à data de início do ATL)<\/span>`; }\n\nlet _cCur=null; // criança em edição (estado temporário do modal)\nlet _valorManual=false; // admin alterou o valor à mão?\nlet _modalCriancaNovo=false; // está aberto o modal de NOVA inscrição?\nlet _listenersRascunho=false;\n// rascunho automático da inscrição nova (só local, temporário)\nfunction capturarRascunhoInsc(){\n  if(!_modalCriancaNovo) return;\n  const g=id=>{ const e=$(id); return e?e.value:''; };\n  const r={ ed:edicaoAtiva, nome:g('c-nome'), nasc:g('c-nasc'), ccTipo:g('c-cctipo'), cc:g('c-cc'), nif:g('c-nif'), ccVal:g('c-ccval'),\n    alergias:g('c-alergias'), obs:g('c-obs'), resp:g('c-resp'), parentesco:g('c-parent'), tel:g('c-tel'), email:g('c-email'), emergencia:g('c-emerg'),\n    dataInscricao:g('c-datains'), valor:g('c-valor'), pago:g('c-pago'), pagamento:g('c-pag'),\n    avulsoDias:_cCur.avulsoDias||[], semanasSel:_cCur.semanasSel||[], mesesSel:_cCur.mesesSel||[], atleta:!!_cCur.atleta, temIrmao:!!_cCur.temIrmao };\n  const algo = r.nome||r.nasc||r.cc||r.nif||r.resp||r.tel||r.avulsoDias.length||r.semanasSel.length||r.mesesSel.length;\n  if(algo) LS.set('atl_rascunho_insc', r);\n}\nfunction verificarRascunho(){\n  const r=LS.get('atl_rascunho_insc');\n  if(!r || r.ed!==edicaoAtiva) return;\n  const resumo = r.nome? `a inscrição de \"${r.nome}\"` : 'uma inscrição por terminar';\n  if(confirm(`Ficou ${resumo} por guardar da última vez.\\n\\nRecuperar o que tinhas escrito?\\n(OK = recuperar · Cancelar = começar em branco)`)) aplicarRascunho(r);\n  else LS.del('atl_rascunho_insc');\n}\nfunction aplicarRascunho(r){\n  const set=(id,v)=>{ const e=$(id); if(e&&v!=null) e.value=v; };\n  set('c-nome',r.nome); set('c-nasc',r.nasc); set('c-cctipo',r.ccTipo); set('c-cc',r.cc); set('c-nif',r.nif); set('c-ccval',r.ccVal);\n  set('c-alergias',r.alergias); set('c-obs',r.obs); set('c-resp',r.resp); set('c-parent',r.parentesco); set('c-tel',r.tel); set('c-email',r.email); set('c-emerg',r.emergencia);\n  set('c-datains',r.dataInscricao); set('c-valor',r.valor); set('c-pago',r.pago); set('c-pag',r.pagamento);\n  _cCur.avulsoDias=r.avulsoDias||[]; _cCur.semanasSel=r.semanasSel||[]; _cCur.mesesSel=r.mesesSel||[]; _cCur.atleta=!!r.atleta; _cCur.temIrmao=!!r.temIrmao;\n  if(r.valor) _valorManual=true;\n  renderBlocosInsc(); verIdade(); refDescontoRadio(); atualizaSugestao(false);\n}\nfunction abrirModalCrianca(id){ if(guardaModoAno()) return;\n  const d=getD(); const p=d.precos;\n  const base = {avulsoDias:[],semanasSel:[],mesesSel:[],autorizados:[],atleta:false,temIrmao:false,grupo:'',descontoVerificado:false,dataInscricao:hoje(),notaInscricao:'',lembrete:'',valor:'',pago:''};\n  _cCur = id? Object.assign(base, d.criancas.find(x=>x.id===id)) : base;\n  const c=_cCur; const lim=limitesNasc();\n  modal(id?'Editar inscrição':'Nova inscrição', `\n    <div class=\"subt\">Criança<\/div>\n    <div class=\"grid2\">\n      <div class=\"fg\"><label>Nome *<\/label><input id=\"c-nome\" value=\"${esc(c.nome||'')}\"><\/div>\n      <div class=\"fg\"><label>Data de nascimento<\/label><input id=\"c-nasc\" type=\"date\" value=\"${esc(c.nasc||'')}\" min=\"${lim.min}\" max=\"${lim.max}\" oninput=\"verIdade()\"><div class=\"muted\" id=\"c-idade-info\" style=\"margin-top:3px\"><\/div><\/div>\n    <\/div>\n    <div class=\"fg\"><label>Tipo de documento<\/label><select id=\"c-cctipo\">${['Cartão de Cidadão','Passaporte','Outro'].map(o=>`<option ${o===c.ccTipo?'selected':''}>${o}<\/option>`).join('')}<\/select><\/div>\n    <div class=\"grid3\">\n      <div class=\"fg\"><label>Nº documento<\/label><input id=\"c-cc\" value=\"${esc(c.cc||'')}\"><\/div>\n      <div class=\"fg\"><label>NIF<\/label><input id=\"c-nif\" value=\"${esc(c.nif||'')}\"><\/div>\n      <div class=\"fg\"><label>Validade<\/label><input id=\"c-ccval\" type=\"date\" value=\"${esc(c.ccVal||'')}\"><\/div>\n    <\/div>\n    ${campoNota('c-alergias','Alergias / intolerâncias', c.alergias)}\n    ${campoNota('c-obs','Observações (medicação, cuidados especiais, etc.)', c.obs)}\n    <div class=\"subt\">Responsável<\/div>\n    <div class=\"grid3\">\n      <div class=\"fg\"><label>Nome<\/label><input id=\"c-resp\" value=\"${esc(c.resp||'')}\"><\/div>\n      <div class=\"fg\"><label>Parentesco<\/label><select id=\"c-parent\">${['','Pai','Mãe','Avó','Avô','Tutor(a)','Outro'].map(o=>`<option ${o===c.parentesco?'selected':''}>${o}<\/option>`).join('')}<\/select><\/div>\n      <div class=\"fg\"><label>Telemóvel<\/label><input id=\"c-tel\" value=\"${esc(c.tel||'')}\"><\/div>\n    <\/div>\n    <div class=\"grid2\">\n      <div class=\"fg\"><label>Email<\/label><input id=\"c-email\" type=\"email\" value=\"${esc(c.email||'')}\"><\/div>\n      <div class=\"fg\"><label>Contacto emergência (nome + tel)<\/label><input id=\"c-emerg\" value=\"${esc(c.emergencia||'')}\"><\/div>\n    <\/div>\n    ${autorizadosHTML()}\n    <div class=\"subt\">Inscrição<\/div>\n    <div class=\"fg\" style=\"max-width:220px\"><label>Data da inscrição<\/label><input id=\"c-datains\" type=\"date\" value=\"${esc(c.dataInscricao||hoje())}\" onchange=\"_cCur.dataInscricao=this.value;atualizaSugestao(true)\"><\/div>\n    <div class=\"muted\" style=\"margin-bottom:8px\">Trabalhamos por semanas: escolhe as semanas inteiras e, se precisar, junta dias avulso (ex.: 1 semana + 2 dias).<\/div>\n    <div id=\"c-blocos\"><\/div>\n    <div class=\"subt\">Descontos<\/div>\n    <div class=\"info\">Os descontos <b>não são acumuláveis<\/b> — aplica-se apenas <b>um<\/b> (o mais vantajoso). Válidos só para <b>atleta da ARCA d'Ajuda<\/b> ou <b>irmão(ã) a frequentar o ATL no mesmo período<\/b>. O desconto é <b>avaliado pela administração<\/b>; se não corresponder à realidade, é solicitado o pagamento do valor do desconto e a <b>inscrição só fica concluída após esse pagamento<\/b>.<\/div>\n    <label class=\"sem-check\"><input type=\"radio\" name=\"c-desc\" value=\"nenhum\" ${!c.atleta&&!c.temIrmao?'checked':''} onchange=\"setDescontoOpcao('nenhum')\"> ✅ Não se aplica (sem desconto)<\/label>\n    <label class=\"sem-check\"><input type=\"radio\" name=\"c-desc\" value=\"atleta\" ${c.atleta?'checked':''} onchange=\"setDescontoOpcao('atleta')\"> 🏅 Atleta da ARCA d'Ajuda<\/label>\n    <label class=\"sem-check\"><input type=\"radio\" name=\"c-desc\" value=\"irmao\" ${c.temIrmao?'checked':''} onchange=\"setDescontoOpcao('irmao')\"> 👧👦 Tem irmão(ã) a frequentar o ATL no mesmo período<\/label>\n    <div class=\"subt\">Pagamento<\/div>\n    <div class=\"grid3\">\n      <div class=\"fg\"><label>Valor a pagar (€) <span class=\"muted\">— calculado automaticamente<\/span><\/label><input id=\"c-valor\" type=\"number\" step=\"0.01\" value=\"${esc(c.valor)}\" oninput=\"_valorManual=true\"><div class=\"muted\" id=\"c-sugestao\" style=\"margin-top:3px\"><\/div><\/div>\n      <div class=\"fg\"><label>Já pago (€)<\/label><input id=\"c-pago\" type=\"number\" step=\"0.01\" value=\"${esc(c.pago)}\"><\/div>\n      <div class=\"fg\"><label>Forma de pagamento<\/label><select id=\"c-pag\">${FORMAS_PAG.map(o=>`<option ${o===c.pagamento?'selected':''}>${o}<\/option>`).join('')}<\/select><\/div>\n    <\/div>\n    <div class=\"subt\">Documentos da inscrição<\/div>\n    <div class=\"muted\" style=\"margin-bottom:8px\">Anexa (ou substitui) os documentos. Ficam guardados na ficha e podem ser abertos/impressos a partir da linha da criança. O <b>CC é o da criança<\/b>.<\/div>\n    <div id=\"c-docs-estado\" style=\"margin-bottom:8px\">${anexosEstadoEdit()}<\/div>\n    <div class=\"grid3\">\n      <div class=\"fg\"><label>💳 Comprovativo de pagamento<\/label><input id=\"c-anexo-comp\" type=\"file\" accept=\"image/*,application/pdf\"><\/div>\n      <div class=\"fg\"><label>🪪 CC da criança — frente<\/label><input id=\"c-anexo-ccf\" type=\"file\" accept=\"image/*,application/pdf\"><\/div>\n      <div class=\"fg\"><label>🪪 CC da criança — verso<\/label><input id=\"c-anexo-ccv\" type=\"file\" accept=\"image/*,application/pdf\"><\/div>\n    <\/div>`,\n    [ {txt:'Guardar', cls:'btn-add', fn:()=>guardarCrianca(id)} ]);\n  _valorManual = !!_cCur.valorManual; _modalCriancaNovo=!id;\n  if(!_listenersRascunho){ $('ov-body').addEventListener('input', capturarRascunhoInsc); $('ov-body').addEventListener('change', capturarRascunhoInsc); _listenersRascunho=true; }\n  renderBlocosInsc(); verIdade(); refDescontoRadio(); atualizaSugestao(true); // auto-preenche o valor calculado (a não ser que tenha sido alterado à mão)\n  if(!id) verificarRascunho();\n}\nfunction renderBlocosInsc(){\n  const box=$('c-blocos'); if(!box) return;\n  const semanas=semanasPeriodo();\n  box.innerHTML = `\n    <div class=\"subt2\">📅 Semanas inteiras<\/div>\n    ${semanas.length? semanas.map(s=>`<label class=\"sem-check\"><input type=\"checkbox\" class=\"ck-sem\" value=\"${s.id}\" ${(_cCur.semanasSel||[]).includes(s.id)?'checked':''} onchange=\"onSemanaSelChange()\"> ${s.label} <span class=\"muted\">(${s.periodo})<\/span><\/label>`).join('') : '<div class=\"muted\">Sem semanas inteiras no período — usa os dias avulso abaixo.<\/div>'}\n    <div class=\"subt2\" style=\"margin-top:14px\">🗓️ Dias avulso <span class=\"muted\">(dias soltos, fora das semanas inteiras)<\/span><\/div>\n    <div class=\"muted\" style=\"margin-bottom:6px;font-size:12px\">Ao marcar uma semana, os dias dessa semana ficam <b>bloqueados<\/b> aqui — assim não se cobra a dobrar. Usa os dias avulso só para dias soltos (ex.: 1 semana + 2 dias).<\/div>\n    <div id=\"c-cal\">${calendarioDias(_cCur.avulsoDias||[])}<\/div>`;\n}\n// dias (iso) já cobertos pelas semanas inteiras selecionadas\nfunction diasDasSemanasSel(){ const sem=semanasPeriodo(); const set=new Set(); (_cCur.semanasSel||[]).forEach(id=>{ const s=sem.find(x=>x.id===id); if(s) s.dias.forEach(d=>set.add(d)); }); return set; }\nfunction onSemanaSelChange(){\n  _cCur.semanasSel=[...document.querySelectorAll('.ck-sem:checked')].map(x=>x.value);\n  const lock=diasDasSemanasSel();\n  _cCur.avulsoDias=(_cCur.avulsoDias||[]).filter(iso=>!lock.has(iso)); // tira avulsos que ficaram dentro de uma semana\n  const cal=$('c-cal'); if(cal) cal.innerHTML=calendarioDias(_cCur.avulsoDias||[]);\n  atualizaSugestao(true);\n}\nfunction calendarioDias(sel){\n  const dias=diasUteisPeriodo(); if(!dias.length) return '<div class=\"muted\">Sem dias úteis — define as datas do período.<\/div>';\n  const porMes={};\n  dias.forEach(d=>{ const k=d.getFullYear()+'-'+d.getMonth(); (porMes[k]=porMes[k]||[]).push(d); });\n  const uteisSet=new Set(dias.map(isoDate));\n  const lock=diasDasSemanasSel();   // dias já incluídos numa semana selecionada → bloqueados\n  let h='<div class=\"cal-flow\">';\n  Object.keys(porMes).forEach(k=>{\n    const arr=porMes[k]; const first=arr[0]; const y=first.getFullYear(), mo=first.getMonth();\n    h+=`<div class=\"cal-block\"><div class=\"cal-mes\">${MESES[mo].slice(0,3)} ${y}<\/div><div class=\"cal mini\">`;\n    for(let i=0;i<7;i++) h+=`<div class=\"h\">${DIAS_SEM[i]}<\/div>`;\n    const primeiro=new Date(y,mo,1); const offset=primeiro.getDay(); const ndias=new Date(y,mo+1,0).getDate();\n    for(let i=0;i<offset;i++) h+='<div class=\"d off\"><\/div>';\n    for(let dia=1;dia<=ndias;dia++){ const iso=y+'-'+pad2(mo+1)+'-'+pad2(dia); const util=uteisSet.has(iso); const on=sel.includes(iso); const locked=lock.has(iso);\n      if(!util){ h+=`<div class=\"d na\">${dia}<\/div>`; }\n      else if(locked){ h+=`<div class=\"d\" style=\"background:#dbe8f7;color:#173F72;cursor:not-allowed;font-weight:700\" title=\"Já incluído na semana selecionada\">${dia}<\/div>`; }\n      else { h+=`<div class=\"d ${on?'on':''}\" onclick=\"toggleDia('${iso}')\">${dia}<\/div>`; } }\n    h+='<\/div><\/div>';\n  });\n  return h+'<\/div>';\n}\nfunction toggleDia(iso){ if(diasDasSemanasSel().has(iso)){ toast('Esse dia já está incluído numa semana selecionada.',false); return; } _cCur.avulsoDias=_cCur.avulsoDias||[]; const i=_cCur.avulsoDias.indexOf(iso); if(i>=0)_cCur.avulsoDias.splice(i,1); else _cCur.avulsoDias.push(iso); $('c-cal').innerHTML=calendarioDias(_cCur.avulsoDias); atualizaSugestao(true); }\n// campo com botão \"Nada a apontar / Sim — indicar\" (alergias, observações)\nfunction campoNota(idBase, label, valor){\n  const tem=!!(valor&&String(valor).trim());\n  return `<div class=\"fg\"><label>${label}<\/label>\n    <div style=\"display:flex;gap:16px;margin:2px 0 6px;font-size:13px;flex-wrap:wrap\">\n      <label style=\"display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:normal\"><input type=\"radio\" name=\"${idBase}-tg\" value=\"nao\" ${tem?'':'checked'} onchange=\"toggleNota('${idBase}',false)\"> Nada a apontar<\/label>\n      <label style=\"display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:normal\"><input type=\"radio\" name=\"${idBase}-tg\" value=\"sim\" ${tem?'checked':''} onchange=\"toggleNota('${idBase}',true)\"> Sim — indicar<\/label>\n    <\/div>\n    <textarea id=\"${idBase}\" rows=\"2\" placeholder=\"Descreve aqui…\" style=\"${tem?'':'display:none'}\">${esc(valor||'')}<\/textarea>\n  <\/div>`;\n}\nfunction toggleNota(idBase, sim){ const t=$(idBase); if(!t) return; t.style.display=sim?'':'none'; if(sim){ t.focus(); } else { t.value=''; } }\n/* ---------- pessoas autorizadas a entregar/levantar a criança ---------- */\nfunction linhaAutorizado(a,i){ a=a||{};\n  return `<div class=\"grid3 au-row\" data-i=\"${i}\" style=\"margin-bottom:6px\">\n    <div class=\"fg\"><input class=\"au-nome\" placeholder=\"Nome\" value=\"${esc(a.nome||'')}\"><\/div>\n    <div class=\"fg\"><input class=\"au-parent\" placeholder=\"Parentesco / relação\" value=\"${esc(a.parentesco||'')}\"><\/div>\n    <div class=\"fg\" style=\"display:flex;gap:6px\"><input class=\"au-doc\" placeholder=\"Nº doc. identificação\" value=\"${esc(a.doc||'')}\"><button type=\"button\" class=\"btn-sm btn-del\" title=\"Remover\" onclick=\"removeAutorizado(${i})\">✕<\/button><\/div>\n  <\/div>`;\n}\nfunction autorizadosHTML(){\n  const arr=(_cCur&&_cCur.autorizados)||[];\n  return `<div class=\"subt\">Pessoas autorizadas a entregar / levantar a criança<\/div>\n    <div class=\"muted\" style=\"margin-bottom:6px;font-size:12px\">Quem, <b>além do encarregado de educação<\/b>, pode entregar ou levantar a criança (ex.: avó, tio, vizinho). Estas pessoas ficam autorizadas e assinam no documento. Acrescenta as que precisares.<\/div>\n    <div id=\"c-autorizados\">${arr.length?arr.map((a,i)=>linhaAutorizado(a,i)).join(''):'<div class=\"muted\" style=\"font-size:12px\">Sem pessoas autorizadas adicionadas.<\/div>'}<\/div>\n    <button type=\"button\" class=\"btn-sm btn-add\" style=\"margin-top:6px\" onclick=\"addAutorizado()\">+ Pessoa autorizada<\/button>`;\n}\nfunction lerAutorizados(){\n  return [...document.querySelectorAll('#c-autorizados .au-row')].map(r=>({ nome:(r.querySelector('.au-nome')||{}).value?.trim()||'', parentesco:(r.querySelector('.au-parent')||{}).value?.trim()||'', doc:(r.querySelector('.au-doc')||{}).value?.trim()||'' })).filter(a=>a.nome||a.parentesco||a.doc);\n}\nfunction pintarAutorizados(){ const el=$('c-autorizados'); if(!el) return; const arr=_cCur.autorizados||[]; el.innerHTML=arr.length?arr.map((a,i)=>linhaAutorizado(a,i)).join(''):'<div class=\"muted\" style=\"font-size:12px\">Sem pessoas autorizadas adicionadas.<\/div>'; }\nfunction addAutorizado(){ _cCur.autorizados=lerAutorizados(); _cCur.autorizados.push({nome:'',parentesco:'',doc:''}); pintarAutorizados(); }\nfunction removeAutorizado(i){ _cCur.autorizados=lerAutorizados(); _cCur.autorizados.splice(i,1); pintarAutorizados(); }\nfunction atualizaSugestao(preencher){\n  const s=$('c-sugestao'); const vi=$('c-valor'); if(!s) return;\n  const b=breakdown(_cCur);\n  // preenche automaticamente o \"valor a pagar\" (a não ser que a admin o tenha alterado à mão)\n  if(preencher && !_valorManual && vi){ vi.value = b.total>0? b.total : ''; }\n  const pub=$('c-valor-pub'); if(pub){ pub.textContent=fmt(b.total); if(vi) vi.value=b.total; }\n  if(b.subtotal<=0 && !b.desconto){ s.innerHTML='<span class=\"muted\">Marca semanas ou dias avulso para calcular.<\/span>'; return; }\n  const parts=['subtotal '+fmt(b.subtotal)];\n  if(b.desconto>0) parts.push('−'+fmt(b.desconto)+' '+b.descontoLabel);\n  if(b.campanhaTxt) parts.push(b.campanhaTxt);\n  const dif = vi && (parseFloat(vi.value)||0)!==b.total;\n  s.innerHTML=`Valor calculado: <b>${fmt(b.total)}<\/b>${dif?` <button type=\"button\" class=\"btn-sm btn-neutral\" style=\"padding:2px 6px\" onclick=\"aplicarSugestao()\">usar este valor<\/button>`:''}<div style=\"margin-top:2px\">${parts.join(' · ')}<\/div>`;\n  if(_modalCriancaNovo) capturarRascunhoInsc();\n}\nfunction aplicarSugestao(){ _valorManual=false; $('c-valor').value = calcValor(_cCur); atualizaSugestao(false); }\nasync function guardarCrianca(id){\n  const nome=$('c-nome').value.trim(); if(!nome){ toast('Indica o nome.',false); return; }\n  const nascV=$('c-nasc').value;\n  if(nascV){ const a=idadeEm(nascV, refIdadeISO()); if(a==null||a<6||a>12){ if(!confirm(`Atenção: à data de início do ATL a criança teria ${a} anos. O limite é 6 a 12 anos (inclusive). Guardar mesmo assim?`)) return; } }\n  const d=getD();\n  _cCur.semanasSel=[...document.querySelectorAll('.ck-sem:checked')].map(x=>x.value);\n  _cCur.mesesSel=[];\n  // documentos: mantém os já anexados e substitui pelos ficheiros novos escolhidos\n  const anexos=Object.assign({}, _cCur.anexos||{});\n  const novos=[]; const fc=$('c-anexo-comp'), ff=$('c-anexo-ccf'), fv=$('c-anexo-ccv');\n  if(fc&&fc.files[0]) novos.push(['comprovativo',fc.files[0]]);\n  if(ff&&ff.files[0]) novos.push(['ccFrente',ff.files[0]]);\n  if(fv&&fv.files[0]) novos.push(['ccVerso',fv.files[0]]);\n  if(novos.length){ toast('A processar documentos…'); for(const [k,f] of novos){ const r=await comprimirFicheiro(f); if(r) anexos[k]=r; } }\n  // documentos OBRIGATÓRIOS: comprovativo de pagamento + CC da criança (frente e verso) — sem eles não guarda\n  { const faltam=[]; if(!(anexos.comprovativo&&anexos.comprovativo.dataUrl)) faltam.push('comprovativo de pagamento'); if(!(anexos.ccFrente&&anexos.ccFrente.dataUrl)) faltam.push('CC da criança (frente)'); if(!(anexos.ccVerso&&anexos.ccVerso.dataUrl)) faltam.push('CC da criança (verso)');\n    if(faltam.length){ toast('Não é possível guardar sem os documentos. Falta: '+faltam.join(', ')+'. Anexa-os primeiro.', false); return; } }\n  // aviso de pagamento: a inscrição só é válida com a pré-inscrição (mín. 50€) ou o total pago\n  { const totalV=parseFloat($('c-valor').value)||0; const pagoV=parseFloat($('c-pago').value)||0;\n    const pagou = pagoV>=50 || (totalV>0 && pagoV>=totalV);\n    if(!pagou){ if(!confirm('⚠️ ATENÇÃO — pagamento\\n\\nA inscrição só é VÁLIDA depois de efetuado o pagamento: pré-inscrição de pelo menos 50€, ou o valor total.\\n\\nAté ao pagamento, a inscrição NÃO fica concluída.\\n\\nGuardar mesmo assim?')) return; } }\n  const numero = id ? (_cCur.numero || proximoNumero()) : proximoNumero();\n  const obj={ id:id||uid(), numero, nome,\n    nasc:$('c-nasc').value, ccTipo:$('c-cctipo').value, cc:$('c-cc').value.trim(), nif:$('c-nif').value.trim(), ccVal:$('c-ccval').value,\n    alergias:$('c-alergias').value.trim(), obs:$('c-obs').value.trim(),\n    resp:$('c-resp').value.trim(), parentesco:$('c-parent').value, tel:$('c-tel').value.trim(), email:$('c-email').value.trim(), emergencia:$('c-emerg').value.trim(),\n    dataInscricao:$('c-datains').value||hoje(), avulsoDias:_cCur.avulsoDias||[], semanasSel:_cCur.semanasSel||[], mesesSel:_cCur.mesesSel||[],\n    autorizados:lerAutorizados(),\n    atleta:!!_cCur.atleta, temIrmao:!!_cCur.temIrmao, grupo:_cCur.grupo||'',\n    descontoVerificado:!!_cCur.descontoVerificado, verificado:!!_cCur.verificado, notaInscricao:_cCur.notaInscricao||'', lembrete:_cCur.lembrete||'',\n    cancelada:!!_cCur.cancelada, dataCancel:_cCur.dataCancel||'', motivoCancel:_cCur.motivoCancel||'',\n    anexos,\n    valor:parseFloat($('c-valor').value)||0, valorManual:!!_valorManual, pago:parseFloat($('c-pago').value)||0, pagamento:$('c-pag').value };\n  if(id){ const i=d.criancas.findIndex(x=>x.id===id); if(i>=0) d.criancas[i]=obj; } else d.criancas.push(obj);\n  setD(d); LS.del('atl_rascunho_insc'); _modalCriancaNovo=false; fecharModal(); renderCriancas(); toast('Inscrição guardada.');\n}\nfunction bloqAnual(){ if(modoAno()){ toast('Estás a ver vários ATL. Para apagar ou alterar, escolhe primeiro o ATL específico no seletor — assim não mexes nos dados de outros ATL por engano.',false); return true; } return false; }\nfunction eliminarCrianca(id){ if(bloqAnual()) return; if(!confirm('Eliminar DEFINITIVAMENTE esta inscrição? (Para manter o registo, usa antes o botão 🚫 Cancelar.)')) return;\n  const d=getD(); d.criancas=d.criancas.filter(x=>x.id!==id); setD(d); renderCriancas(); toast('Inscrição eliminada.'); }\nfunction cancelarInscricao(id){ if(bloqAnual()) return; const d=getD(); const c=d.criancas.find(x=>x.id===id); if(!c) return;\n  const motivo=prompt('Cancelar a inscrição de '+(c.nome||'')+'.\\nMotivo (opcional):', c.motivoCancel||'');\n  if(motivo===null) return; // premiu Cancelar\n  c.cancelada=true; c.dataCancel=hoje(); c.motivoCancel=(motivo||'').trim();\n  setD(d); renderCriancas(); toast('Inscrição cancelada (mantida no registo). Deixa de contar para mapas, listas e custos.');\n}\nfunction reativarInscricao(id){ if(bloqAnual()) return; const d=getD(); const c=d.criancas.find(x=>x.id===id); if(!c) return; if(!confirm('Reativar a inscrição de '+(c.nome||'')+'?')) return; c.cancelada=false; delete c.dataCancel; delete c.motivoCancel; setD(d); renderCriancas(); toast('Inscrição reativada.'); }\n// gestão administrativa da inscrição (só a admin) — verificação + notas\nfunction abrirAdminInscricao(id){ if(guardaModoAno()) return;\n  const d=getD(); const c=d.criancas.find(x=>x.id===id); if(!c) return;\n  const b=breakdown(c); const temDesc=(c.atleta||c.temIrmao);\n  modal('🗂️ Gestão administrativa — '+esc(c.nome), `\n    <div class=\"muted\" style=\"margin-bottom:10px\">Área só para a administração. Não aparece na ficha de inscrição. <b>Todas as inscrições devem ser verificadas.<\/b><\/div>\n    ${temDesc?`<div class=\"info\" style=\"background:#FDECEA;border-color:#F0855F;color:#7a2e12\">⚠️ <b>Esta inscrição pede desconto:<\/b> ${c.atleta?`🏅 atleta da ARCA d'Ajuda `:''}${c.temIrmao?`👧👦 irmão no mesmo período `:''}. Confirma que corresponde à realidade <b>antes<\/b> de verificar. Valor calculado: <b>${fmt(b.total)}<\/b>${b.desconto>0?' (desconto '+fmt(b.desconto)+')':''}.<\/div>`:''}\n    <label class=\"sem-check\" style=\"border-color:var(--amber);background:#FFF8E6\"><input type=\"checkbox\" id=\"ai-verifgeral\" ${c.verificado?'checked':''}> ✅ <b>Inscrição verificada / conferida<\/b> pela administração${temDesc?' <span class=\"muted\">(inclui a confirmação do desconto)<\/span>':''}<\/label>\n    <div class=\"fg\" style=\"margin-top:10px\"><label>📝 Nota da inscrição <span class=\"muted\">(ex.: pagou só os 40€ de pré-inscrição / pago na totalidade)<\/span><\/label><textarea id=\"ai-nota\" rows=\"3\">${esc(c.notaInscricao||'')}<\/textarea><\/div>\n    <div class=\"fg\"><label>🔔 Lembrete administrativo <span class=\"muted\">(situação a ter em conta — editável a qualquer altura)<\/span><\/label><textarea id=\"ai-lembrete\" rows=\"3\">${esc(c.lembrete||'')}<\/textarea><\/div>`,\n    [ {txt:'Guardar', cls:'btn-add', fn:()=>{ const dd=getD(); const cc=dd.criancas.find(x=>x.id===id); if(!cc){ fecharModal(); return; }\n        const ver=$('ai-verifgeral').checked;\n        cc.verificado=ver; cc.descontoVerificado = temDesc ? ver : false; // verificar a inscrição = confirmar também o desconto\n        cc.notaInscricao=$('ai-nota').value.trim(); cc.lembrete=$('ai-lembrete').value.trim(); setD(dd); fecharModal(); renderCriancas(); toast(ver?'Inscrição verificada. ✅':'Gestão administrativa guardada.'); }} ]);\n}\n\n/* ============================================================\n   DESPESAS\n   ============================================================ */\nlet fDesp={cat:''};\nlet fRec={cat:''};\nlet despView='lancamentos';\nfunction renderDespesas(){\n  const el=$('sec-despesas'); if(precisaEdicao(el)) return;\n  const d=getD();\n  const cEquipa=(d.equipa||[]).reduce((s,m)=>s+(+m.remuneracao||0),0);\n  const cAtiv=modoAno()?edicoesFiltradas().reduce((s,e)=>s+custoAtividadesPeriodo(e.id),0):custoAtividadesTotal();\n  const areas=`<div class=\"card\" style=\"margin-bottom:14px\"><div class=\"card-title\" style=\"margin-bottom:8px\">Áreas de despesa do ATL<\/div>\n    <div class=\"muted\" style=\"margin-bottom:8px\">Funcionários e Atividades também são despesas — geres-as aqui.<\/div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <button class=\"btn-sm btn-neutral\" onclick=\"showTab('equipa')\">👥 Funcionários · ${fmt(cEquipa)}<\/button>\n      <button class=\"btn-sm btn-neutral\" onclick=\"showTab('atividades')\">🎟️ Atividades · ${fmt(cAtiv)}<\/button>\n    <\/div><\/div>`;\n  const seg=`<div class=\"seg\" style=\"margin-bottom:14px\">\n    <button class=\"${despView==='lancamentos'?'on':''}\" onclick=\"despView='lancamentos';renderDespesas()\">📋 Lançamentos<\/button>\n    <button class=\"${despView==='alimentacao'?'on':''}\" onclick=\"despView='alimentacao';renderDespesas()\">🍽️ Alimentação (por dia)<\/button>\n    <button class=\"${despView==='resumo'?'on':''}\" onclick=\"despView='resumo';renderDespesas()\">📊 Resumo (dia · semana · mês)<\/button><\/div>`;\n  el.innerHTML = areas + seg + (despView==='resumo'? renderDespesasResumo() : despView==='alimentacao'? renderDespesasAlimentacao() : renderDespesasLista());\n}\nfunction renderDespesasLista(){\n  const d=getD(); const cats=d.categorias||CATEGORIAS_DEFAULT;\n  let lista=d.despesas.slice(); if(fDesp.cat) lista=lista.filter(x=>x.cat===fDesp.cat);\n  const tot=lista.reduce((s,x)=>s+(+x.valor||0),0);\n  const cAlim=modoAno()?edicoesFiltradas().reduce((s,e)=>s+custoAlimentacaoPeriodo(e.id),0):custoAlimentacaoTotal();\n  const cAtiv=modoAno()?edicoesFiltradas().reduce((s,e)=>s+custoAtividadesPeriodo(e.id),0):custoAtividadesTotal();\n  const avisoAuto=`<div class=\"info\" style=\"background:var(--teal-l);border-color:#c9dcf3;color:var(--teal-d)\">\n    ⚙️ <b>Calculadas automaticamente<\/b> (não precisam de lançamento): 🍽️ <b>Alimentação ${fmt(cAlim)}<\/b>${cAlim===0?' <span class=\"muted\">— define os valores em Valores → Alimentação diária<\/span>':''} · 🎟️ <b>Atividades ${fmt(cAtiv)}<\/b>${cAtiv===0?' <span class=\"muted\">— cria em Atividades<\/span>':''}. Já contam no <b>Resumo<\/b> e no <b>Painel<\/b>.<\/div>`;\n  return `${avisoAuto}<div class=\"card\">\n    <div class=\"card-head\"><div class=\"card-title\">Despesas lançadas por ti · ${fmt(tot)}<\/div>\n      <div style=\"display:flex;gap:6px\">${modoAno()?'':'<button class=\"btn-sm btn-neutral\" onclick=\"gerirCategorias()\">🏷️ Categorias<\/button><button class=\"btn-sm btn-add\" onclick=\"abrirModalDespesa()\">+ Nova despesa<\/button>'}<\/div><\/div>\n    <div class=\"muted\" style=\"margin-bottom:8px\">Aqui lanças manualmente: seguros, material, autocarro, professores convidados, etc. (a alimentação e as atividades são automáticas — ver acima).<\/div>\n    <div class=\"filters\"><select onchange=\"fDesp.cat=this.value;renderDespesas()\"><option value=\"\">Todas as categorias<\/option>${cats.map(c=>`<option ${c===fDesp.cat?'selected':''}>${esc(c)}<\/option>`).join('')}<\/select><\/div>\n    ${!lista.length?'<div class=\"empty\">Sem despesas.<\/div>':\n    `<div class=\"table-wrap\"><table><thead><tr><th>Data<\/th><th>Categoria<\/th><th>Descrição<\/th><th>Pagamento<\/th><th class=\"right\">Valor<\/th><th><\/th><\/tr><\/thead><tbody>\n    ${lista.map(x=>`<tr><td>${esc(x.data||'')}<\/td><td><span class=\"chip blue\">${esc(x.cat||'')}<\/span><\/td><td>${esc(x.desc||'')}${modoAno()&&x._ed?`<div class=\"muted\">${esc(x._ed)}<\/div>`:''}<\/td><td class=\"muted\">${esc(x.pagamento||'')}<\/td><td class=\"right\">${fmt(x.valor)}<\/td>\n      <td class=\"right\" style=\"white-space:nowrap\">${modoAno()?'':`<button class=\"btn-sm btn-edit\" onclick=\"abrirModalDespesa('${x.id}')\">✏️<\/button> <button class=\"btn-sm btn-del\" onclick=\"eliminarDespesa('${x.id}')\">🗑️<\/button>`}<\/td><\/tr>`).join('')}\n    <\/tbody><\/table><\/div>`}\n  <\/div>`;\n}\nfunction renderDespesasAlimentacao(){\n  const d=getD(); const p=d.precos.alimentacaoDiaria||{}; const pd=precoDiaAlimentacao();\n  if(modoAno()) return `<div class=\"card\"><div class=\"empty\">A alimentação por dia é por período (as datas variam). Escolhe um período específico no seletor de períodos (menu lateral).<\/div><\/div>`;\n  const dias=diasUteisPeriodo();\n  if(!dias.length) return `<div class=\"card\"><div class=\"empty\">Este período não tem datas. Define-as no período.<\/div><\/div>`;\n  const att=criancasAtivas(d).map(diasDaCrianca);\n  const rows=dias.map(dt=>{ const iso=isoDate(dt); const n=att.filter(s=>s.has(iso)).length; return {iso,n,custo:n*pd}; });\n  const comGente=rows.filter(r=>r.n>0);\n  const total=rows.reduce((s,r)=>s+r.custo,0);\n  const totalCriancasDia=rows.reduce((s,r)=>s+r.n,0);\n  return `\n    <div class=\"cards\">\n      <div class=\"metric\"><div class=\"lbl\">Valor por criança/dia<\/div><div class=\"val\">${fmt(pd)}<\/div><div class=\"sub\">almoço ${fmt(p.almoco)} · l.manhã ${fmt(p.lancheManha)} · l.tarde ${fmt(p.lancheTarde)}<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Presenças (refeições)<\/div><div class=\"val blue\">${totalCriancasDia}<\/div><div class=\"sub\">nº crianças somado por dia<\/div><\/div>\n      <div class=\"metric\" style=\"border-color:var(--coral)\"><div class=\"lbl\">Total alimentação<\/div><div class=\"val red\">${fmt(total)}<\/div><\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\">🍽️ Alimentação por dia<\/div>${pd===0?'<span class=\"chip amber\">Define os valores em Valores → Alimentação diária<\/span>':''}<\/div>\n      <div class=\"muted\" style=\"margin-bottom:10px\">Calcula-se sozinho: <b>nº de crianças presentes nesse dia × ${fmt(pd)}<\/b> (almoço + 2 lanches).<\/div>\n      ${!comGente.length?'<div class=\"empty\">Sem crianças inscritas em nenhum dia ainda.<\/div>':\n      `<div class=\"table-wrap\"><table><thead><tr><th>Dia<\/th><th class=\"right\">Nº crianças<\/th><th class=\"right\">€/criança<\/th><th class=\"right\">Custo do dia<\/th><\/tr><\/thead><tbody>\n      ${comGente.map(r=>`<tr><td>${esc(fmtData(r.iso))} <span class=\"muted\">${DIAS_SEM_FULL[parseD(r.iso).getDay()]}<\/span><\/td><td class=\"right\">${r.n}<\/td><td class=\"right\">${fmt(pd)}<\/td><td class=\"right\"><b>${fmt(r.custo)}<\/b><\/td><\/tr>`).join('')}\n      <tr><td><b>TOTAL<\/b><\/td><td class=\"right\"><b>${totalCriancasDia}<\/b><\/td><td><\/td><td class=\"right\"><b>${fmt(total)}<\/b><\/td><\/tr>\n      <\/tbody><\/table><\/div>`}\n    <\/div>`;\n}\n// junta tudo: Despesas (manual) + Funcionários + Alimentação (calc/dia) + Atividades (calc)\nfunction itensDespesa(){\n  if(modoAno()) return itensDespesaAno();\n  const d=getD(); const out=[];\n  (d.despesas||[]).forEach(x=>out.push({data:x.data||'', valor:+x.valor||0, cat:x.cat||'Outros', desc:x.desc||'', tipo:'Despesa'}));\n  (d.equipa||[]).forEach(m=>{ if(+m.remuneracao||0) out.push({data:'', valor:+m.remuneracao||0, cat:'Funcionários', desc:((m.cargo||'')+' '+(m.nome||'')).trim(), tipo:'Funcionário'}); });\n  const pd=precoDiaAlimentacao();\n  if(pd){ const att=criancasAtivas(d).map(diasDaCrianca); diasUteisPeriodo().forEach(dt=>{ const iso=isoDate(dt); const n=att.filter(s=>s.has(iso)).length; if(n) out.push({data:iso, valor:n*pd, cat:'Alimentação', desc:n+' criança(s) × '+fmt(pd), tipo:'Alimentação'}); }); }\n  (d.atividades||[]).forEach(a=>{ const v=custoAtividade(a); if(v) out.push({data:a.data||'', valor:v, cat:'Atividades / Visitas', desc:(a.nome||'')+' ('+(a.grupo||'Todos')+' · '+nCriancasAtividade(a)+' crianças)', tipo:'Atividade'}); });\n  return out;\n}\nfunction itensDespesaAno(){\n  const out=[];\n  edicoes.forEach(e=>{ const d=LS.get('atl_ed_'+e.id); if(!d) return; const nome=e.nome+(e.ano?(' '+e.ano):'');\n    (d.despesas||[]).forEach(x=>out.push({data:x.data||'', valor:+x.valor||0, cat:x.cat||'Outros', desc:x.desc||'', tipo:'Despesa', _ed:nome}));\n    (d.equipa||[]).forEach(m=>{ if(+m.remuneracao||0) out.push({data:'', valor:+m.remuneracao||0, cat:'Funcionários', desc:((m.cargo||'')+' '+(m.nome||'')).trim(), tipo:'Funcionário', _ed:nome}); });\n    const fa=custoAlimentacaoPeriodo(e.id); if(fa) out.push({data:'', valor:fa, cat:'Alimentação', desc:'(calculado) '+nome, tipo:'Alimentação', _ed:nome});\n    const at=custoAtividadesPeriodo(e.id); if(at) out.push({data:'', valor:at, cat:'Atividades / Visitas', desc:'(calculado) '+nome, tipo:'Atividade', _ed:nome});\n  });\n  return out;\n}\nfunction mesLabel(k){ if(k==='Sem data') return 'Sem data'; const p=k.split('-'); return MESES[(+p[1])-1]+' '+p[0]; }\nfunction renderDespesasResumo(){\n  const itens=itensDespesa();\n  if(!itens.length) return '<div class=\"card\"><div class=\"empty\">Ainda não há despesas lançadas. Regista em Despesas, Atividades ou Funcionários.<\/div><\/div>';\n  const total=itens.reduce((s,x)=>s+x.valor,0);\n  const soma=(arr)=>arr.reduce((s,x)=>s+x.valor,0);\n  // por categoria\n  const porCat={}; itens.forEach(x=>porCat[x.cat]=(porCat[x.cat]||0)+x.valor);\n  const catRows=Object.keys(porCat).sort((a,b)=>porCat[b]-porCat[a]);\n  // por mês\n  const porMes={}; itens.forEach(x=>{ const k=x.data?x.data.slice(0,7):'Sem data'; porMes[k]=(porMes[k]||0)+x.valor; });\n  const mesRows=Object.keys(porMes).sort();\n  // por semana (do período)\n  const semanas=semanasPeriodo();\n  const allWeek=new Set(); semanas.forEach(s=>s.dias.forEach(dd=>allWeek.add(dd)));\n  const semRows=semanas.map(s=>{ const set=new Set(s.dias); return {label:s.label, periodo:s.periodo, v:itens.reduce((a,x)=>a+((x.data&&set.has(x.data))?x.valor:0),0)}; });\n  const semSemData=itens.filter(x=>!x.data||( x.data && !allWeek.has(x.data))).reduce((a,x)=>a+x.valor,0);\n  // por dia\n  const porDia={}; itens.forEach(x=>{ const k=x.data||'Sem data'; porDia[k]=(porDia[k]||0)+x.valor; });\n  const diaRows=Object.keys(porDia).sort((a,b)=> a==='Sem data'?1:b==='Sem data'?-1:a.localeCompare(b));\n  const barra=(v)=>`<div style=\"height:6px;border-radius:4px;background:var(--coral);opacity:.85;width:${total>0?Math.max(3,Math.round(100*v/total)):0}%\"><\/div>`;\n  return `\n    <div class=\"cards\">\n      <div class=\"metric\" style=\"border-color:var(--coral)\"><div class=\"lbl\">Total de despesas<\/div><div class=\"val red\">${fmt(total)}<\/div><div class=\"sub\">${itens.length} lançamento(s)<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Média por dia com gastos<\/div><div class=\"val\">${fmt(diaRows.filter(k=>k!=='Sem data').length? soma(itens.filter(x=>x.data))/diaRows.filter(k=>k!=='Sem data').length : 0)}<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Categorias com gastos<\/div><div class=\"val blue\">${catRows.length}<\/div><\/div>\n    <\/div>\n    <div class=\"card\"><div class=\"card-title\">Por categoria<\/div>\n      <div class=\"table-wrap\"><table><thead><tr><th>Categoria<\/th><th style=\"width:120px\"><\/th><th class=\"right\">Total<\/th><\/tr><\/thead><tbody>\n        ${catRows.map(c=>`<tr><td><span class=\"chip blue\">${esc(c)}<\/span><\/td><td>${barra(porCat[c])}<\/td><td class=\"right\"><b>${fmt(porCat[c])}<\/b><\/td><\/tr>`).join('')}\n        <tr><td><b>TOTAL<\/b><\/td><td><\/td><td class=\"right\"><b>${fmt(total)}<\/b><\/td><\/tr>\n      <\/tbody><\/table><\/div>\n    <\/div>\n    <div class=\"card\"><div class=\"card-title\">Por mês<\/div>\n      <div class=\"table-wrap\"><table><thead><tr><th>Mês<\/th><th class=\"right\">Total<\/th><\/tr><\/thead><tbody>\n        ${mesRows.map(k=>`<tr><td>${esc(mesLabel(k))}<\/td><td class=\"right\"><b>${fmt(porMes[k])}<\/b><\/td><\/tr>`).join('')}\n      <\/tbody><\/table><\/div>\n    <\/div>\n    ${semanas.length?`<div class=\"card\"><div class=\"card-title\">Por semana ${modoAno()?'<span class=\"muted\">(do período selecionado — escolhe um período p/ semanas)<\/span>':''}<\/div>\n      <div class=\"table-wrap\"><table><thead><tr><th>Semana<\/th><th>Período<\/th><th class=\"right\">Total<\/th><\/tr><\/thead><tbody>\n        ${semRows.map(s=>`<tr><td><b>${s.label}<\/b><\/td><td class=\"muted\">${s.periodo}<\/td><td class=\"right\"><b>${fmt(s.v)}<\/b><\/td><\/tr>`).join('')}\n        ${semSemData>0?`<tr><td class=\"muted\">Sem data / fora das semanas<\/td><td><\/td><td class=\"right\">${fmt(semSemData)}<\/td><\/tr>`:''}\n      <\/tbody><\/table><\/div>\n    <\/div>`:''}\n    <div class=\"card\"><div class=\"card-title\">Por dia<\/div>\n      <div class=\"table-wrap\"><table><thead><tr><th>Dia<\/th><th class=\"right\">Total<\/th><\/tr><\/thead><tbody>\n        ${diaRows.map(k=>`<tr><td>${k==='Sem data'?'<span class=\"muted\">Sem data (ex.: funcionários)<\/span>':esc(fmtData(k))}<\/td><td class=\"right\"><b>${fmt(porDia[k])}<\/b><\/td><\/tr>`).join('')}\n      <\/tbody><\/table><\/div>\n    <\/div>`;\n}\nfunction abrirModalDespesa(id){ if(guardaModoAno()) return;\n  const d=getD(); const cats=d.categorias||CATEGORIAS_DEFAULT;\n  const x=id?Object.assign({},d.despesas.find(y=>y.id===id)):{cat:cats[0],data:new Date().toISOString().slice(0,10),valor:''};\n  modal(id?'Editar despesa':'Nova despesa',`\n    <div class=\"grid2\"><div class=\"fg\"><label>Categoria<\/label><select id=\"dp-cat\">${cats.map(c=>`<option ${c===x.cat?'selected':''}>${esc(c)}<\/option>`).join('')}<\/select><\/div>\n      <div class=\"fg\"><label>Data<\/label><input id=\"dp-data\" type=\"date\" value=\"${esc(x.data||'')}\"><\/div><\/div>\n    <div class=\"fg\"><label>Descrição<\/label><input id=\"dp-desc\" value=\"${esc(x.desc||'')}\"><\/div>\n    <div class=\"grid2\"><div class=\"fg\"><label>Valor (€) *<\/label><input id=\"dp-valor\" type=\"number\" step=\"0.01\" value=\"${esc(x.valor)}\"><\/div>\n      <div class=\"fg\"><label>Forma de pagamento<\/label><select id=\"dp-pag\">${FORMAS_PAG.map(o=>`<option ${o===x.pagamento?'selected':''}>${o}<\/option>`).join('')}<\/select><\/div><\/div>\n    <div class=\"fg\"><label>Nota<\/label><input id=\"dp-nota\" value=\"${esc(x.nota||'')}\"><\/div>`,\n    [ {txt:'Guardar',cls:'btn-add',fn:()=>guardarDespesa(id)} ]);\n}\nfunction guardarDespesa(id){\n  const valor=parseFloat($('dp-valor').value); if(isNaN(valor)){ toast('Indica o valor.',false); return; }\n  const d=getD(); const obj={ id:id||uid(), cat:$('dp-cat').value, data:$('dp-data').value, desc:$('dp-desc').value.trim(), valor, pagamento:$('dp-pag').value, nota:$('dp-nota').value.trim() };\n  if(id){ const i=d.despesas.findIndex(y=>y.id===id); if(i>=0)d.despesas[i]=obj; } else d.despesas.push(obj);\n  setD(d); fecharModal(); renderDespesas(); toast('Despesa guardada.');\n}\nfunction eliminarDespesa(id){ if(!confirm('Eliminar esta despesa?'))return; const d=getD(); d.despesas=d.despesas.filter(y=>y.id!==id); setD(d); renderDespesas(); toast('Despesa eliminada.'); }\nfunction gerirCategorias(){\n  const d=getD(); const cats=d.categorias||CATEGORIAS_DEFAULT.slice();\n  modal('Categorias de despesa',`\n    <div id=\"cat-lista\">${cats.map((c,i)=>`<div class=\"sem-check\"><span style=\"flex:1\">${esc(c)}<\/span><button class=\"btn-sm btn-del\" onclick=\"apagarCategoria(${i})\">✕<\/button><\/div>`).join('')||'<div class=\"muted\">Sem categorias.<\/div>'}<\/div>\n    <div class=\"fg\" style=\"margin-top:10px;display:flex;gap:6px\"><input id=\"cat-nova\" placeholder=\"Nova categoria…\"><button class=\"btn-sm btn-add\" onclick=\"addCategoria()\">+<\/button><\/div>`,\n    [ {txt:'Fechar',cls:'btn-neutral',fn:fecharModal} ]);\n}\nfunction addCategoria(){ const v=$('cat-nova').value.trim(); if(!v)return; const d=getD(); d.categorias=d.categorias||CATEGORIAS_DEFAULT.slice(); if(!d.categorias.includes(v))d.categorias.push(v); setD(d); gerirCategorias(); }\nfunction apagarCategoria(i){ const d=getD(); d.categorias=d.categorias||CATEGORIAS_DEFAULT.slice(); d.categorias.splice(i,1); setD(d); gerirCategorias(); }\n\n/* ============================================================\n   RECEITAS\n   ============================================================ */\nfunction renderReceitas(){\n  const el=$('sec-receitas'); if(precisaEdicao(el)) return;\n  const t=totais(); const d=t.d;\n  el.innerHTML=`\n    <div class=\"cards\">\n      <div class=\"metric\"><div class=\"lbl\">Pagamentos das crianças<\/div><div class=\"val green\">${fmt(t.totPago)}<\/div><div class=\"sub\">de ${fmt(t.totInscrito)} previstos<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Outras receitas<\/div><div class=\"val green\">${fmt(t.outrasRec)}<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Total de receitas<\/div><div class=\"val green\">${fmt(t.recTotal)}<\/div><\/div>\n    <\/div>\n    <div class=\"card\"><div class=\"card-head\"><div class=\"card-title\">Outras receitas<\/div>\n      <div style=\"display:flex;gap:6px\"><button class=\"btn-sm btn-neutral\" onclick=\"gerirCategoriasRec()\">🏷️ Categorias<\/button><button class=\"btn-sm btn-add\" onclick=\"abrirModalReceita()\">+ Nova receita<\/button><\/div><\/div>\n      <div class=\"filters\"><select onchange=\"fRec.cat=this.value;renderReceitas()\"><option value=\"\">Todas as categorias<\/option>${(d.categoriasRec||CATEGORIAS_REC_DEFAULT).map(c=>`<option ${c===fRec.cat?'selected':''}>${esc(c)}<\/option>`).join('')}<\/select><\/div>\n      ${(()=>{ let lista=d.receitas.slice(); if(fRec.cat) lista=lista.filter(x=>x.cat===fRec.cat); return !lista.length?'<div class=\"empty\">Sem outras receitas (donativos, apoios, etc.).<\/div>':\n      `<div class=\"table-wrap\"><table><thead><tr><th>Data<\/th><th>Categoria<\/th><th>Descrição<\/th><th>Pagamento<\/th><th class=\"right\">Valor<\/th><th><\/th><\/tr><\/thead><tbody>\n      ${lista.map(r=>`<tr><td>${esc(r.data||'')}<\/td><td>${r.cat?`<span class=\"chip green\">${esc(r.cat)}<\/span>`:''}<\/td><td>${esc(r.desc||'')}${r.origem?`<div class=\"muted\">${esc(r.origem)}<\/div>`:''}<\/td><td class=\"muted\">${esc(r.pagamento||'')}<\/td><td class=\"right\">${fmt(r.valor)}<\/td>\n        <td class=\"right\" style=\"white-space:nowrap\"><button class=\"btn-sm btn-edit\" onclick=\"abrirModalReceita('${r.id}')\">✏️<\/button> <button class=\"btn-sm btn-del\" onclick=\"eliminarReceita('${r.id}')\">🗑️<\/button><\/td><\/tr>`).join('')}\n      <\/tbody><\/table><\/div>`; })()}\n    <\/div>`;\n}\nfunction abrirModalReceita(id){ if(guardaModoAno()) return;\n  const d=getD(); const cats=d.categoriasRec||CATEGORIAS_REC_DEFAULT;\n  const r=id?Object.assign({},d.receitas.find(y=>y.id===id)):{data:new Date().toISOString().slice(0,10),valor:'',cat:cats[0]};\n  modal(id?'Editar receita':'Nova receita',`\n    <div class=\"grid2\"><div class=\"fg\"><label>Categoria<\/label><select id=\"r-cat\">${cats.map(c=>`<option ${c===r.cat?'selected':''}>${esc(c)}<\/option>`).join('')}<\/select><\/div>\n      <div class=\"fg\"><label>Data<\/label><input id=\"r-data\" type=\"date\" value=\"${esc(r.data||'')}\"><\/div><\/div>\n    <div class=\"grid2\"><div class=\"fg\"><label>Valor (€) *<\/label><input id=\"r-valor\" type=\"number\" step=\"0.01\" value=\"${esc(r.valor)}\"><\/div>\n      <div class=\"fg\"><label>Forma de pagamento<\/label><select id=\"r-pag\">${FORMAS_PAG.map(o=>`<option ${o===r.pagamento?'selected':''}>${o}<\/option>`).join('')}<\/select><\/div><\/div>\n    <div class=\"fg\"><label>Descrição<\/label><input id=\"r-desc\" value=\"${esc(r.desc||'')}\"><\/div>\n    <div class=\"fg\"><label>Origem / notas<\/label><input id=\"r-origem\" value=\"${esc(r.origem||'')}\" placeholder=\"Ex: quem doou, nº do apoio…\"><\/div>`,\n    [ {txt:'Guardar',cls:'btn-add',fn:()=>guardarReceita(id)} ]);\n}\nfunction guardarReceita(id){\n  const valor=parseFloat($('r-valor').value); if(isNaN(valor)){ toast('Indica o valor.',false); return; }\n  const d=getD(); const obj={ id:id||uid(), cat:$('r-cat').value, data:$('r-data').value, valor, desc:$('r-desc').value.trim(), origem:$('r-origem').value.trim(), pagamento:$('r-pag').value };\n  if(id){ const i=d.receitas.findIndex(y=>y.id===id); if(i>=0)d.receitas[i]=obj; } else d.receitas.push(obj);\n  setD(d); fecharModal(); renderReceitas(); toast('Receita guardada.');\n}\nfunction eliminarReceita(id){ if(!confirm('Eliminar esta receita?'))return; const d=getD(); d.receitas=d.receitas.filter(y=>y.id!==id); setD(d); renderReceitas(); toast('Receita eliminada.'); }\nfunction gerirCategoriasRec(){\n  const d=getD(); const cats=d.categoriasRec||CATEGORIAS_REC_DEFAULT.slice();\n  modal('Categorias de receita',`\n    <div id=\"catr-lista\">${cats.map((c,i)=>`<div class=\"sem-check\"><span style=\"flex:1\">${esc(c)}<\/span><button class=\"btn-sm btn-del\" onclick=\"apagarCategoriaRec(${i})\">✕<\/button><\/div>`).join('')||'<div class=\"muted\">Sem categorias.<\/div>'}<\/div>\n    <div class=\"fg\" style=\"margin-top:10px;display:flex;gap:6px\"><input id=\"catr-nova\" placeholder=\"Nova categoria…\"><button class=\"btn-sm btn-add\" onclick=\"addCategoriaRec()\">+<\/button><\/div>`,\n    [ {txt:'Fechar',cls:'btn-neutral',fn:fecharModal} ]);\n}\nfunction addCategoriaRec(){ const v=$('catr-nova').value.trim(); if(!v)return; const d=getD(); d.categoriasRec=d.categoriasRec||CATEGORIAS_REC_DEFAULT.slice(); if(!d.categoriasRec.includes(v))d.categoriasRec.push(v); setD(d); gerirCategoriasRec(); }\nfunction apagarCategoriaRec(i){ const d=getD(); d.categoriasRec=d.categoriasRec||CATEGORIAS_REC_DEFAULT.slice(); d.categoriasRec.splice(i,1); setD(d); gerirCategoriasRec(); }\n\n/* ============================================================\n   FUNCIONÁRIOS\n   ============================================================ */\nfunction renderEquipa(){\n  const el=$('sec-equipa'); if(precisaEdicao(el)) return;\n  const d=getD(); const tot=d.equipa.reduce((s,m)=>s+(+m.remuneracao||0),0);\n  el.innerHTML=`<button class=\"btn-sm btn-neutral\" style=\"margin-bottom:12px\" onclick=\"showTab('despesas')\">← Voltar às Despesas<\/button><div class=\"card\">\n    <div class=\"card-head\"><div class=\"card-title\">Funcionários · ${d.equipa.length} · custo ${fmt(tot)}<\/div><button class=\"btn-sm btn-add\" onclick=\"abrirModalEquipa()\">+ Novo funcionário<\/button><\/div>\n    <div class=\"muted\" style=\"margin-bottom:10px\">💡 As remunerações aqui já contam como despesa no Painel — não as lances também em Despesas para não duplicar.<\/div>\n    ${!d.equipa.length?'<div class=\"empty\">Sem funcionários.<\/div>':\n    `<div class=\"table-wrap\"><table><thead><tr><th>Cargo<\/th><th>Nome<\/th><th>Contacto<\/th><th>Horário<\/th><th class=\"right\">Remuneração<\/th><th><\/th><\/tr><\/thead><tbody>\n    ${d.equipa.map(m=>`<tr><td><b>${esc(m.cargo||'')}<\/b><\/td><td>${esc(m.nome||'')}<\/td><td class=\"muted\">${esc(m.tel||'')}${m.email?' · '+esc(m.email):''}<\/td><td class=\"muted\">${esc(m.horario||'')}<\/td><td class=\"right\">${fmt(m.remuneracao)}<\/td>\n      <td class=\"right\" style=\"white-space:nowrap\"><button class=\"btn-sm btn-edit\" onclick=\"abrirModalEquipa('${m.id}')\">✏️<\/button> <button class=\"btn-sm btn-del\" onclick=\"eliminarEquipa('${m.id}')\">🗑️<\/button><\/td><\/tr>`).join('')}\n    <\/tbody><\/table><\/div>`}\n  <\/div>`;\n}\nfunction abrirModalEquipa(id){ if(guardaModoAno()) return;\n  const d=getD(); const m=id?Object.assign({},d.equipa.find(y=>y.id===id)):{cargo:'',remuneracao:''};\n  modal(id?'Editar funcionário':'Novo funcionário',`\n    <div class=\"grid2\"><div class=\"fg\"><label>Cargo<\/label><input id=\"q-cargo\" value=\"${esc(m.cargo||'')}\" placeholder=\"Ex: Monitor, Coordenador\"><\/div><div class=\"fg\"><label>Nome<\/label><input id=\"q-nome\" value=\"${esc(m.nome||'')}\"><\/div><\/div>\n    <div class=\"grid2\"><div class=\"fg\"><label>Telefone<\/label><input id=\"q-tel\" value=\"${esc(m.tel||'')}\"><\/div><div class=\"fg\"><label>Email<\/label><input id=\"q-email\" type=\"email\" value=\"${esc(m.email||'')}\"><\/div><\/div>\n    <div class=\"grid3\"><div class=\"fg\"><label>Remuneração (€)<\/label><input id=\"q-rem\" type=\"number\" step=\"0.01\" value=\"${esc(m.remuneracao)}\"><\/div>\n      <div class=\"fg\"><label>Forma pagamento<\/label><select id=\"q-pag\">${FORMAS_PAG.map(o=>`<option ${o===m.pagamento?'selected':''}>${o}<\/option>`).join('')}<\/select><\/div>\n      <div class=\"fg\"><label>Horário<\/label><input id=\"q-hor\" value=\"${esc(m.horario||'')}\"><\/div><\/div>\n    <div class=\"fg\"><label>Notas<\/label><input id=\"q-notas\" value=\"${esc(m.notas||'')}\"><\/div>`,\n    [ {txt:'Guardar',cls:'btn-add',fn:()=>guardarEquipa(id)} ]);\n}\nfunction guardarEquipa(id){\n  const nome=$('q-nome').value.trim(); const cargo=$('q-cargo').value.trim();\n  if(!nome&&!cargo){ toast('Indica o cargo ou o nome.',false); return; }\n  const d=getD(); const obj={ id:id||uid(), cargo, nome, tel:$('q-tel').value.trim(), email:$('q-email').value.trim(), remuneracao:parseFloat($('q-rem').value)||0, pagamento:$('q-pag').value, horario:$('q-hor').value.trim(), notas:$('q-notas').value.trim() };\n  if(id){ const i=d.equipa.findIndex(y=>y.id===id); if(i>=0)d.equipa[i]=obj; } else d.equipa.push(obj);\n  setD(d); fecharModal(); renderEquipa(); toast('Funcionário guardado.');\n}\nfunction eliminarEquipa(id){ if(!confirm('Eliminar este funcionário?'))return; const d=getD(); d.equipa=d.equipa.filter(y=>y.id!==id); setD(d); renderEquipa(); toast('Funcionário eliminado.'); }\n\n/* ============================================================\n   ATIVIDADES\n   ============================================================ */\nlet atvView='lista';\nfunction renderAtividades(){\n  const el=$('sec-atividades'); if(precisaEdicao(el)) return;\n  const voltar=`<button class=\"btn-sm btn-neutral\" style=\"margin-bottom:12px\" onclick=\"showTab('despesas')\">← Voltar às Despesas<\/button>`;\n  const seg=`<div class=\"seg\" style=\"margin-bottom:14px\">\n    <button class=\"${atvView==='lista'?'on':''}\" onclick=\"atvView='lista';renderAtividades()\">📋 Lista<\/button>\n    <button class=\"${atvView==='mapa'?'on':''}\" onclick=\"atvView='mapa';renderAtividades()\">🗓️ Mapa por dia<\/button><\/div>`;\n  el.innerHTML = voltar + seg + (atvView==='mapa'? renderAtividadesMapa() : renderAtividadesLista());\n}\nfunction renderAtividadesLista(){\n  const d=getD(); const tot=custoAtividadesTotal();\n  return `<div class=\"card\">\n    <div class=\"card-head\"><div class=\"card-title\">Atividades / visitas · custo ${fmt(tot)}<\/div>${modoAno()?'':'<button class=\"btn-sm btn-add\" onclick=\"abrirModalAtividade()\">+ Nova atividade<\/button>'}<\/div>\n    <div class=\"muted\" style=\"margin-bottom:10px\">💡 O custo é calculado automaticamente: <b>preço por criança × nº de crianças do grupo<\/b> que estão presentes na <b>data<\/b> da atividade. Conta como despesa no Painel.<\/div>\n    ${!d.atividades.length?'<div class=\"empty\">Sem atividades ou visitas.<\/div>':\n    `<div class=\"table-wrap\"><table><thead><tr><th>Data<\/th><th>Atividade<\/th><th>Grupo<\/th><th class=\"right\">€/criança<\/th><th class=\"right\">Nº crianças<\/th><th class=\"right\">Custo<\/th><th><\/th><\/tr><\/thead><tbody>\n    ${d.atividades.map(a=>{ const n=nCriancasAtividade(a); return `<tr><td>${esc(fmtData(a.data)||'—')}<\/td><td><b>${esc(a.nome||'')}<\/b>${a.local?`<div class=\"muted\">${esc(a.local)}<\/div>`:''}<\/td><td><span class=\"chip ${a.grupo==='G1'?'blue':a.grupo==='G2'?'amber':'green'}\">${esc(a.grupo||'Todos')}<\/span><\/td><td class=\"right\">${fmt(a.precoCrianca)}<\/td><td class=\"right\">${n}<\/td><td class=\"right\"><b>${fmt(custoAtividade(a))}<\/b><\/td>\n      <td class=\"right\" style=\"white-space:nowrap\">${modoAno()?'':`<button class=\"btn-sm btn-edit\" onclick=\"abrirModalAtividade('${a.id}')\">✏️<\/button> <button class=\"btn-sm btn-del\" onclick=\"eliminarAtividade('${a.id}')\">🗑️<\/button>`}<\/td><\/tr>`; }).join('')}\n    <\/tbody><\/table><\/div>`}\n  <\/div>`;\n}\nfunction renderAtividadesMapa(){\n  const d=getD(); const cols=['G1','G2','Todos'];\n  const datas=[...new Set(d.atividades.filter(a=>a.data).map(a=>a.data))].sort();\n  const semData=d.atividades.filter(a=>!a.data);\n  const cellFor=(dt,g)=> d.atividades.filter(a=>a.data===dt && (a.grupo||'Todos')===g);\n  const cellHTML=(as)=> as.length? as.map(a=>`<div style=\"margin-bottom:3px\"><b>${esc(a.nome||'—')}<\/b><div class=\"muted\">${nCriancasAtividade(a)} cr. × ${fmt(a.precoCrianca)} = <b>${fmt(custoAtividade(a))}<\/b><\/div><\/div>`).join('') : '<span class=\"muted\">—<\/span>';\n  return `<div class=\"card\">\n    <div class=\"card-head\"><div class=\"card-title\">🗓️ Mapa de atividades por dia · total ${fmt(custoAtividadesTotal())}<\/div>${modoAno()?'':'<button class=\"btn-sm btn-add\" onclick=\"abrirModalAtividade()\">+ Nova atividade<\/button>'}<\/div>\n    <div class=\"muted\" style=\"margin-bottom:10px\">Marca por dia o que cada grupo faz (ex.: <b>Grupo 1 → Piscina<\/b>, <b>Grupo 2 → IlhaPark<\/b>). O nº de crianças e o custo calculam-se sozinhos.<\/div>\n    ${!datas.length && !semData.length? '<div class=\"empty\">Sem atividades. Cria uma com data e grupo.<\/div>':\n    `<div class=\"table-wrap\"><table><thead><tr><th>Dia<\/th><th>Grupo 1<\/th><th>Grupo 2<\/th><th>Todos os grupos<\/th><\/tr><\/thead><tbody>\n    ${datas.map(dt=>`<tr><td><b>${esc(fmtData(dt))}<\/b><div class=\"muted\">${DIAS_SEM_FULL[parseD(dt).getDay()]}<\/div><\/td>${cols.map(g=>`<td>${cellHTML(cellFor(dt,g))}<\/td>`).join('')}<\/tr>`).join('')}\n    ${semData.length?`<tr><td class=\"muted\">Sem data<\/td><td colspan=\"3\">${semData.map(a=>`${esc(a.nome)} (${esc(a.grupo||'Todos')})`).join(', ')} <span class=\"muted\">— define a data para calcular<\/span><\/td><\/tr>`:''}\n    <\/tbody><\/table><\/div>`}\n  <\/div>`;\n}\nfunction abrirModalAtividade(id){ if(guardaModoAno()) return;\n  const d=getD(); const cat=d.precos.atividades||[]; const a=id?Object.assign({},d.atividades.find(y=>y.id===id)):{data:'',precoCrianca:'',grupo:'Todos'};\n  modal(id?'Editar atividade':'Nova atividade',`\n    <div class=\"grid2\"><div class=\"fg\"><label>Nome *<\/label><input id=\"a-nome\" value=\"${esc(a.nome||'')}\" list=\"ativ-sug\"><datalist id=\"ativ-sug\">${cat.map(x=>`<option value=\"${esc(x.nome)}\">`).join('')}<\/datalist><\/div>\n      <div class=\"fg\"><label>Data *<\/label><input id=\"a-data\" type=\"date\" value=\"${esc(a.data||'')}\"><\/div><\/div>\n    <div class=\"grid3\">\n      <div class=\"fg\"><label>Preço por criança (€)<\/label><input id=\"a-preco\" type=\"number\" step=\"0.01\" value=\"${esc(a.precoCrianca)}\"><\/div>\n      <div class=\"fg\"><label>Grupo<\/label><select id=\"a-grupo\">${['Todos','G1','G2'].map(g=>`<option ${g===(a.grupo||'Todos')?'selected':''}>${g}<\/option>`).join('')}<\/select><\/div>\n      <div class=\"fg\"><label>Local<\/label><input id=\"a-local\" value=\"${esc(a.local||'')}\"><\/div>\n    <\/div>\n    <div class=\"info\">O custo é calculado sozinho: <b>preço por criança × nº de crianças do grupo<\/b> que estão presentes na data escolhida. Só contam as crianças do grupo que frequentam o ATL nesse dia.<\/div>\n    <div class=\"fg\"><label>Notas<\/label><input id=\"a-notas\" value=\"${esc(a.notas||'')}\"><\/div>`,\n    [ {txt:'Guardar',cls:'btn-add',fn:()=>guardarAtividade(id)} ]);\n}\nfunction guardarAtividade(id){\n  const nome=$('a-nome').value.trim(); if(!nome){ toast('Indica o nome.',false); return; }\n  const d=getD(); const obj={ id:id||uid(), nome, data:$('a-data').value, local:$('a-local').value.trim(), precoCrianca:parseFloat($('a-preco').value)||0, grupo:$('a-grupo').value||'Todos', notas:$('a-notas').value.trim() };\n  if(id){ const i=d.atividades.findIndex(y=>y.id===id); if(i>=0)d.atividades[i]=obj; } else d.atividades.push(obj);\n  setD(d); fecharModal(); renderAtividades(); toast('Atividade guardada.');\n}\nfunction eliminarAtividade(id){ if(!confirm('Eliminar esta atividade?'))return; const d=getD(); d.atividades=d.atividades.filter(y=>y.id!==id); setD(d); renderAtividades(); toast('Atividade eliminada.'); }\n\n/* ============================================================\n   CONTA BANCÁRIA / TESOURARIA (global)\n   ============================================================ */\nfunction getConta(){ const c=LS.get('atl_conta')||{movimentos:[]}; if(!Array.isArray(c.movimentos)) c.movimentos=[]; return c; }\nfunction setConta(c){ save('atl_conta', c); }\nfunction saldoConta(){ return getConta().movimentos.reduce((s,m)=>s+(+m.valor||0),0); }\nconst CONTA_TIPOS=[ {t:'Depósito do cofre', sinal:1}, {t:'Transferência recebida', sinal:1}, {t:'Transferência enviada', sinal:-1}, {t:'Levantamento', sinal:-1}, {t:'Pagamento / débito', sinal:-1}, {t:'Outra entrada', sinal:1}, {t:'Outra saída', sinal:-1} ];\nfunction renderConta(){\n  const el=$('sec-conta'); const c=getConta();\n  const movs=c.movimentos.slice().sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a._i||0)-(b._i||0));\n  let run=0; const linhas=movs.map(m=>{ run+=(+m.valor||0); return {m,saldo:run}; });\n  const saldo=saldoConta();\n  const entradas=movs.filter(m=>(+m.valor||0)>0).reduce((s,m)=>s+m.valor,0);\n  const saidas=movs.filter(m=>(+m.valor||0)<0).reduce((s,m)=>s+m.valor,0);\n  el.innerHTML=`\n    <div class=\"cards\">\n      <div class=\"metric\" style=\"border-color:var(--teal)\"><div class=\"lbl\">Saldo da conta bancária<\/div><div class=\"val ${saldo>=0?'green':'red'}\">${fmt(saldo)}<\/div><div class=\"sub\">${movs.length} movimento(s)<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Entradas<\/div><div class=\"val green\">${fmt(entradas)}<\/div><\/div>\n      <div class=\"metric\"><div class=\"lbl\">Saídas<\/div><div class=\"val red\">${fmt(Math.abs(saidas))}<\/div><\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\">🏦 Conta bancária<\/div>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap\"><button class=\"btn-sm btn-neutral\" onclick=\"acertarSaldo()\">✏️ Acertar saldo<\/button><button class=\"btn-sm btn-add\" onclick=\"abrirModalMovConta()\">+ Movimento<\/button><\/div><\/div>\n      <div class=\"muted\" style=\"margin-bottom:10px\">Regista aqui os <b>depósitos do cofre<\/b> e as <b>transferências<\/b>. Usa <b>“Acertar saldo”<\/b> para pôr o valor que tens neste momento na conta (ex.: pelo extrato do banco).<\/div>\n      ${!movs.length?'<div class=\"empty\">Sem movimentos. Começa por “Acertar saldo” para pôr o valor atual da conta.<\/div>':\n      `<div class=\"table-wrap\"><table><thead><tr><th>Data<\/th><th>Tipo<\/th><th>Nota<\/th><th class=\"right\">Valor<\/th><th class=\"right\">Saldo<\/th><th><\/th><\/tr><\/thead><tbody>\n      ${linhas.slice().reverse().map(({m,saldo})=>`<tr><td>${esc(fmtData(m.data)||'')}<\/td><td>${esc(m.tipo||'')}<\/td><td class=\"muted\">${esc(m.desc||'')}<\/td><td class=\"right\" style=\"color:${(+m.valor||0)>=0?'var(--teal)':'var(--coral)'};font-weight:700\">${(+m.valor||0)>=0?'+':''}${fmt(m.valor)}<\/td><td class=\"right\">${fmt(saldo)}<\/td>\n        <td class=\"right\"><button class=\"btn-sm btn-del\" onclick=\"eliminarMovConta('${m.id}')\">🗑️<\/button><\/td><\/tr>`).join('')}\n      <\/tbody><\/table><\/div>`}\n    <\/div>`;\n}\nfunction acertarSaldo(){\n  const atual=saldoConta();\n  modal('✏️ Acertar saldo da conta', `\n    <div class=\"info\">Escreve o valor que tens <b>neste momento<\/b> na conta bancária (ex.: pelo extrato). O programa cria um ajuste automático para acertar. Saldo atual registado: <b>${fmt(atual)}<\/b>.<\/div>\n    <div class=\"grid2\"><div class=\"fg\"><label>Saldo atual real (€)<\/label><input id=\"ac-valor\" type=\"number\" step=\"0.01\" value=\"${esc(atual)}\"><\/div>\n      <div class=\"fg\"><label>Data<\/label><input id=\"ac-data\" type=\"date\" value=\"${hoje()}\"><\/div><\/div>`,\n    [ {txt:'Guardar',cls:'btn-add',fn:()=>{ const novo=parseFloat($('ac-valor').value); if(isNaN(novo)){ toast('Indica o valor.',false); return; } const dif=Math.round((novo-saldoConta())*100)/100; const c=getConta(); c.movimentos.push({id:uid(),_i:Date.now(),data:$('ac-data').value||hoje(),tipo:'Acerto de saldo',desc:'Saldo definido manualmente',valor:dif}); setConta(c); fecharModal(); renderConta(); toast('Saldo acertado.'); }} ]);\n}\nfunction abrirModalMovConta(){\n  modal('Novo movimento da conta', `\n    <div class=\"grid2\"><div class=\"fg\"><label>Tipo<\/label><select id=\"mv-tipo\" onchange=\"mvSinalAuto()\">${CONTA_TIPOS.map(x=>`<option>${x.t}<\/option>`).join('')}<\/select><\/div>\n      <div class=\"fg\"><label>Data<\/label><input id=\"mv-data\" type=\"date\" value=\"${hoje()}\"><\/div><\/div>\n    <div class=\"grid2\"><div class=\"fg\"><label>Sentido<\/label><select id=\"mv-sinal\"><option value=\"1\">Entrada (+)<\/option><option value=\"-1\">Saída (−)<\/option><\/select><\/div>\n      <div class=\"fg\"><label>Valor (€)<\/label><input id=\"mv-valor\" type=\"number\" step=\"0.01\" min=\"0\"><\/div><\/div>\n    <div class=\"fg\"><label>Nota<\/label><input id=\"mv-nota\" placeholder=\"Ex.: depósito do cofre da semana 1\"><\/div>`,\n    [ {txt:'Guardar',cls:'btn-add',fn:guardarMovConta} ]);\n  mvSinalAuto();\n}\nfunction mvSinalAuto(){ const t=$('mv-tipo').value; const cfg=CONTA_TIPOS.find(x=>x.t===t); const s=$('mv-sinal'); if(cfg&&s) s.value=String(cfg.sinal); }\nfunction guardarMovConta(){\n  const v=parseFloat($('mv-valor').value); if(isNaN(v)||v<0){ toast('Indica um valor.',false); return; }\n  const sinal=parseInt($('mv-sinal').value)||1; const c=getConta();\n  c.movimentos.push({id:uid(),_i:Date.now(),data:$('mv-data').value||hoje(),tipo:$('mv-tipo').value,desc:$('mv-nota').value.trim(),valor:Math.round(v*sinal*100)/100});\n  setConta(c); fecharModal(); renderConta(); toast('Movimento registado.');\n}\nfunction eliminarMovConta(id){ if(!confirm('Eliminar este movimento?'))return; const c=getConta(); c.movimentos=c.movimentos.filter(m=>m.id!==id); setConta(c); renderConta(); toast('Movimento eliminado.'); }\n\n/* ---------- Lembrete de fecho de mês ---------- */\nfunction verificarFimMes(){\n  const t=new Date(); const y=t.getFullYear(), m=t.getMonth(), day=t.getDate();\n  const lastDay=new Date(y,m+1,0).getDate();\n  let alvo=null;\n  if(day>=lastDay-2) alvo={y,m};\n  else if(day<=7){ const pm=new Date(y,m-1,1); alvo={y:pm.getFullYear(),m:pm.getMonth()}; }\n  if(!alvo) return;\n  const key=alvo.y+'-'+pad2(alvo.m+1);\n  if((LS.get('atl_lembreteMes')||'')===key) return;\n  setTimeout(()=>lembreteFimMes(key, alvo), 600);\n}\nfunction lembreteFimMes(key, alvo){\n  modal('📅 Fecho do mês — '+MESES[alvo.m]+' '+alvo.y, `\n    <div class=\"info\">Chegou o fim do mês. Convém <b>imprimir todos os movimentos de ${MESES[alvo.m]} ${alvo.y}<\/b> (receitas e despesas) para arquivo.<\/div>\n    <button class=\"btn btn-primary\" style=\"width:auto;padding:11px 20px\" onclick=\"imprimirMovimentosMes('${key}')\">🖨️ Imprimir movimentos do mês<\/button>`,\n    [ {txt:'✔️ Já tratei (não mostrar até ao próximo mês)',cls:'btn-neutral',fn:()=>{ save('atl_lembreteMes',key); fecharModal(); toast('Ok, até ao próximo mês.'); }} ]);\n}\nfunction imprimirMovimentosMes(key){\n  const ed=getEdicao()||{}; const d=getD();\n  const noMes=x=>((x.data||'').slice(0,7)===key);\n  const desp=(d.despesas||[]).filter(noMes); const rec=(d.receitas||[]).filter(noMes);\n  const tD=desp.reduce((s,x)=>s+(+x.valor||0),0), tR=rec.reduce((s,x)=>s+(+x.valor||0),0);\n  const tabela=(tit,rows,cols)=> `<div class=\"sec\">${tit}<\/div>`+(rows.length?`<table><thead><tr>${cols.map(c=>`<th>${c[0]}<\/th>`).join('')}<\/tr><\/thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody><\/table>`:'<p>Sem registos.<\/p>');\n  const body=`<h1>Movimentos do mês — ${MESES[+key.slice(5,7)-1]} ${key.slice(0,4)}<\/h1>\n    <div style=\"font-size:12px;color:#555;margin-bottom:6px\">${esc(ed.nome||'')}${ed.ano?(' · '+ed.ano):''}<\/div>\n    ${tabela('Receitas ('+fmt(tR)+')', rec, [['Data',r=>esc(fmtData(r.data))],['Categoria',r=>esc(r.cat||'')],['Descrição',r=>esc(r.desc||'')],['Valor',r=>fmt(r.valor)]])}\n    ${tabela('Despesas ('+fmt(tD)+')', desp, [['Data',r=>esc(fmtData(r.data))],['Categoria',r=>esc(r.cat||'')],['Descrição',r=>esc(r.desc||'')],['Valor',r=>fmt(r.valor)]])}\n    <div class=\"sec\">Resumo<\/div><table><tr><th>Total receitas<\/th><td>${fmt(tR)}<\/td><\/tr><tr><th>Total despesas<\/th><td>${fmt(tD)}<\/td><\/tr><\/table>`;\n  abrirImpressao('Movimentos '+key, body);\n}\n\n/* ============================================================\n   DOCUMENTOS / DECLARAÇÕES (modelos editáveis)\n   ============================================================ */\nfunction renderDocumentos(){\n  const el=$('sec-documentos'); const docs=getDocs(); const c=getCfg();\n  el.innerHTML=`\n    ${!c.logo?'<div class=\"info\">💡 Adiciona o <b>logótipo da associação<\/b> em ⚙️ Definições para aparecer no cabeçalho das fichas e declarações.<\/div>':''}\n    <div class=\"card\">\n      <div class=\"card-title\">🖨️ Listas para imprimir (seguradora, cozinha, grupos…)<\/div>\n      <div class=\"muted\" style=\"margin:6px 0 10px\">Estas listas geram-se sozinhas a partir das inscrições. Abrem no separador Mapa, prontas a imprimir (com logótipo e rodapé).<\/div>\n      <div class=\"seg\">\n        <button onclick=\"irListaMapa('nomes')\">🧾 Nomes por semana (seguradora)<\/button>\n        <button onclick=\"irListaMapa('alergias')\">🍽️ Alergias (cozinha)<\/button>\n        <button onclick=\"irListaMapa('obs')\">💊 Observações / medicação<\/button>\n        <button onclick=\"irListaMapa('grupos')\">👥 Grupos (G1 / G2)<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"card-head\"><div class=\"card-title\">📄 Documentos e declarações<\/div><button class=\"btn-sm btn-add\" onclick=\"editarDocumento()\">+ Novo documento<\/button><\/div>\n      <div class=\"muted\" style=\"margin-bottom:12px\">Modelos editáveis para imprimir com o logótipo no cabeçalho. Imprime <b>em branco<\/b> aqui, ou <b>preenchido<\/b> para cada inscrito no botão 🖨️ da lista de inscrições.<\/div>\n      ${!docs.length?'<div class=\"empty\">Sem documentos. Cria o primeiro (ex.: declaração de veracidade, autorização de saída…).<\/div>':\n        docs.map(dc=>`<div class=\"sem-check\" style=\"align-items:flex-start\">\n          <div style=\"flex:1\"><b>${esc(dc.titulo)}<\/b><div class=\"muted\" style=\"margin-top:3px;white-space:pre-wrap;max-height:40px;overflow:hidden\">${esc((dc.corpo||'').slice(0,150))}${(dc.corpo||'').length>150?'…':''}<\/div><\/div>\n          <div style=\"display:flex;gap:5px;flex-wrap:wrap\"><button class=\"btn-sm btn-neutral\" onclick=\"imprimirDocumento('${dc.id}','')\">🖨️ Em branco<\/button><button class=\"btn-sm btn-edit\" onclick=\"editarDocumento('${dc.id}')\">✏️<\/button><button class=\"btn-sm btn-del\" onclick=\"eliminarDocumento('${dc.id}')\">🗑️<\/button><\/div>\n        <\/div>`).join('')}\n    <\/div>`;\n}\nfunction editarDocumento(id){\n  const docs=getDocs(); const dc= id? docs.find(x=>x.id===id) : {titulo:'',corpo:''};\n  modal(id?'Editar documento':'Novo documento', `\n    <div class=\"fg\"><label>Título do documento<\/label><input id=\"doc-tit\" value=\"${esc(dc.titulo||'')}\"><\/div>\n    <div class=\"fg\"><label>Texto<\/label><textarea id=\"doc-corpo\" rows=\"12\" style=\"font-size:13px\">${esc(dc.corpo||'')}<\/textarea><\/div>\n    <div class=\"info\">Marcadores (preenchem-se sozinhos ao imprimir para um inscrito): <b>{{nome}}<\/b>, <b>{{numero}}<\/b>, {{nasc}}, {{doc}}, {{nif}}, <b>{{responsavel}}<\/b>, {{atl}}, {{ano}}. Ao imprimir \"em branco\" ficam com espaço para preencher à mão.<\/div>`,\n    [ {txt:'Guardar',cls:'btn-add',fn:()=>guardarDocumento(id)} ]);\n}\nfunction guardarDocumento(id){\n  const tit=$('doc-tit').value.trim(); if(!tit){ toast('Dá um título ao documento.',false); return; }\n  let docs=getDocs(); const obj={ id:id||uid(), titulo:tit, corpo:$('doc-corpo').value };\n  if(id){ const i=docs.findIndex(x=>x.id===id); if(i>=0)docs[i]=obj; } else docs.push(obj);\n  setDocs(docs); fecharModal(); renderDocumentos(); toast('Documento guardado.');\n}\nfunction eliminarDocumento(id){ if(!confirm('Eliminar este documento?'))return; setDocs(getDocs().filter(x=>x.id!==id)); renderDocumentos(); toast('Documento eliminado.'); }\nfunction irListaMapa(view){ mapaView=view; showTab('mapa'); }\n\n/* ============================================================\n   DEFINIÇÕES\n   ============================================================ */\nfunction renderDefinicoes(){\n  const el=$('sec-definicoes'); const c=getCfg();\n  const contaEmail = (supaSession && supaSession.user && supaSession.user.email) || '';\n  el.innerHTML=`\n    <div class=\"card\">\n      <div class=\"card-title\">🖼️ Logótipo e nome da associação<\/div>\n      <div class=\"muted\" style=\"margin:6px 0 10px\">Aparece no cabeçalho das fichas e declarações impressas.<\/div>\n      ${c.logo?`<img src=\"${c.logo}\" style=\"max-height:90px;max-width:220px;object-fit:contain;display:block;margin:6px 0 10px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff\">`:'<div class=\"muted\" style=\"margin-bottom:8px\">— ainda sem logótipo —<\/div>'}\n      <div class=\"fg\"><label>Carregar / trocar logótipo (imagem)<\/label><input type=\"file\" accept=\"image/*\" onchange=\"carregarLogo(this)\"><\/div>\n      <div class=\"fg\"><label>Nome da associação<\/label><input id=\"cf-assoc\" value=\"${esc(c.assocNome||\"ARCA d'Ajuda\")}\"><\/div>\n      <div class=\"fg\"><label>Morada<\/label><input id=\"cf-morada\" value=\"${esc(c.assocMorada||'')}\" placeholder=\"Rua…, código-postal, localidade\"><\/div>\n      <div class=\"grid2\">\n        <div class=\"fg\"><label>NIF / NIPC<\/label><input id=\"cf-nif\" value=\"${esc(c.assocNif||'')}\"><\/div>\n        <div class=\"fg\"><label>Contactos (tel / email / site)<\/label><input id=\"cf-contacto\" value=\"${esc(c.assocContacto||'')}\" placeholder=\"Tel · email · website\"><\/div>\n      <\/div>\n      <div class=\"muted\" style=\"margin-bottom:8px\">Estes dados aparecem no <b>rodapé<\/b> das fichas e declarações impressas.<\/div>\n      <button class=\"btn-sm btn-add\" onclick=\"guardarAssoc()\">💾 Guardar<\/button>\n      ${c.logo?' <button class=\"btn-sm btn-del\" onclick=\"removerLogo()\">Remover logótipo<\/button>':''}\n    <\/div>\n    <div class=\"card\">\n      <div class=\"card-title\">📧 Emails (editáveis a qualquer momento)<\/div>\n      <div class=\"muted\" style=\"margin:6px 0 12px\">Podem ser o mesmo email nos três campos.<\/div>\n      <div class=\"fg\"><label>Email para <b>enviar<\/b> (remetente)<\/label><input id=\"cf-envio\" type=\"email\" value=\"${esc(c.emailEnvio)}\" placeholder=\"atl.arcakids@gmail.com\"><\/div>\n      <div class=\"fg\"><label>Email para <b>notificações<\/b><\/label><input id=\"cf-notif\" type=\"email\" value=\"${esc(c.emailNotif)}\" placeholder=\"atl.arcakids@gmail.com\"><\/div>\n      <button class=\"btn-sm btn-add\" onclick=\"guardarCfg()\">💾 Guardar emails<\/button>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"card-title\">📁 Cópia de segurança na Google Drive<\/div>\n      <div class=\"muted\" style=\"margin:6px 0 10px\">Guarda uma cópia dos dados e documentos na tua Google Drive, organizada em pastas <b>Ano → ATL<\/b>. Precisa de uma configuração única (Client ID da Google) — vê o guia. Só funciona no site publicado (arca-ajuda.github.io).<\/div>\n      <div class=\"fg\"><label>Google Client ID<\/label><input id=\"cf-driveid\" value=\"${esc(c.driveClientId)}\" placeholder=\"xxxxxx.apps.googleusercontent.com\"><\/div>\n      <div class=\"fg\"><label>Email da conta Drive <span class=\"muted\">(só indicativo)<\/span><\/label><input id=\"cf-drive\" type=\"email\" value=\"${esc(c.emailDrive)}\" placeholder=\"atl.arcakids@gmail.com\"><\/div>\n      <label class=\"sem-check\"><input type=\"checkbox\" id=\"cf-driveauto\" ${c.driveAuto?'checked':''}> Guardar na Drive <b>automaticamente<\/b> ao gravar alterações (depois de ligada)<\/label>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:8px\">\n        <button class=\"btn-sm btn-add\" onclick=\"guardarCfg()\">💾 Guardar definições<\/button>\n        <button class=\"btn-sm btn-neutral\" onclick=\"driveLigar()\">🔗 Ligar Google Drive<\/button>\n        <button class=\"btn-sm btn-neutral\" onclick=\"driveBackupTudo()\">☁️ Guardar cópia na Drive agora<\/button>\n      <\/div>\n      <div class=\"muted\" id=\"drive-estado\" style=\"margin-top:8px\">${driveLigada()?'✅ Google Drive ligada nesta sessão.':'Ainda não ligada nesta sessão.'}${(()=>{const u=LS.get('atl_drive_ultima'); return u?(' · Última cópia: '+new Date(u).toLocaleString('pt-PT')):' · Sem cópia ainda.';})()}<\/div>\n    <\/div>\n    <div class=\"card\" style=\"display:none\">\n      <div class=\"card-title\">🔐 Conta / início de sessão<\/div>\n      <div class=\"muted\" style=\"margin:6px 0 12px\">${modoLocal?'Estás em modo local (sem conta).':'Conta atual: <b>'+esc(contaEmail||'—')+'<\/b>'}<\/div>\n      <div class=\"grid2\"><div class=\"fg\"><label>Novo email de acesso<\/label><input id=\"ac-email\" type=\"email\" value=\"${esc(contaEmail)}\" placeholder=\"atl.arcakids@gmail.com\"><\/div>\n        <div class=\"fg\"><label>Nova palavra-passe (opcional)<\/label><input id=\"ac-pass\" type=\"password\" placeholder=\"deixa vazio p/ manter\"><\/div><\/div>\n      <button class=\"btn-sm btn-add\" onclick=\"atualizarConta()\">💾 Atualizar acesso<\/button>\n      <div class=\"muted\" style=\"margin-top:8px\">A alteração do email pode pedir confirmação por email.<\/div>\n    <\/div>\n    <div class=\"card\">\n      <div class=\"card-title\">🗑️ Eliminar período<\/div>\n      <div class=\"muted\" style=\"margin:6px 0 10px\">Apaga um período e <b>todos<\/b> os seus dados. Pede <b>confirmação dupla<\/b> (aviso + escrever “APAGAR”) para não apagares sem querer.<\/div>\n      ${edicoes.length? edicoes.map(e=>`<div class=\"sem-check\"><span style=\"flex:1\"><b>${esc(e.nome)}<\/b>${e.ano?(' · '+e.ano):''}<\/span><button class=\"btn-sm btn-del\" onclick=\"eliminarEdicao('${e.id}')\">🗑️ Eliminar<\/button><\/div>`).join('') : '<div class=\"muted\">Sem períodos.<\/div>'}\n    <\/div>\n    <div class=\"card\"><div class=\"card-title\">☁️ Cloud<\/div>\n      <div class=\"muted\" style=\"margin:6px 0 10px\">${modoLocal?'Estado: <b>Local<\/b> (só neste dispositivo). Entra com a conta para sincronizar entre dispositivos.':(CLOUD_ON()?'Estado: <b>Ligado à cloud<\/b> com a conta <b>'+esc((supaSession&&supaSession.user&&supaSession.user.email)||'')+'<\/b>. A “cloud” é a tua conta (o teu login), não a Google Drive — os dados sincronizam automaticamente entre dispositivos que entrem com esta conta.':'Estado: Sem sessão iniciada.')}<\/div>\n      <button class=\"btn-sm btn-neutral\" onclick=\"hidratarCloud().then(ok=>{toast(ok===false?'Não consegui sincronizar — verifica a internet e volta a tentar.':'Sincronizado.', ok!==false);renderDefinicoes();})\">🔄 Sincronizar agora<\/button>\n    <\/div>`;\n}\nfunction guardarCfg(){ const c=getCfg(); c.emailEnvio=$('cf-envio').value.trim(); c.emailNotif=$('cf-notif').value.trim(); const cd=$('cf-drive'); if(cd)c.emailDrive=cd.value.trim(); const ci=$('cf-driveid'); if(ci)c.driveClientId=ci.value.trim(); const ca=$('cf-driveauto'); if(ca)c.driveAuto=ca.checked; setCfg(c); atualizaDriveAviso(); toast('Definições guardadas.'); }\nfunction carregarLogo(input){ const f=input.files&&input.files[0]; if(!f) return; if(f.size>2*1024*1024){ toast('Imagem muito grande (máx ~2 MB).',false); input.value=''; return; } const rd=new FileReader(); rd.onload=e=>{ const c=getCfg(); c.logo=e.target.result; setCfg(c); toast('Logótipo guardado.'); renderDefinicoes(); }; rd.readAsDataURL(f); }\nfunction guardarAssoc(){ const c=getCfg(); const a=$('cf-assoc'); if(a) c.assocNome=a.value.trim()||\"ARCA d'Ajuda\"; const m=$('cf-morada'); if(m)c.assocMorada=m.value.trim(); const n=$('cf-nif'); if(n)c.assocNif=n.value.trim(); const ct=$('cf-contacto'); if(ct)c.assocContacto=ct.value.trim(); setCfg(c); toast('Guardado.'); renderDefinicoes(); }\nfunction removerLogo(){ const c=getCfg(); c.logo=''; setCfg(c); toast('Logótipo removido.'); renderDefinicoes(); }\nasync function atualizarConta(){\n  if(modoLocal || !CLOUD_ON()){ toast('Entra numa conta primeiro.',false); return; }\n  const email=$('ac-email').value.trim(), pass=$('ac-pass').value; const body={}; if(email) body.email=email; if(pass
