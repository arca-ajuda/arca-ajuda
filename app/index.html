Id('cofre-modal-title');\n  if(t) t.textContent = tipo==='entrada'?'🏦 Entrada de Caixa':'🏦 Saída de Caixa';\n  setCofreTipo(tipo||'entrada');\n  const hoje = new Date().toISOString().slice(0,10);\n  const dc = document.getElementById('cofre-data'); if(dc) dc.value=hoje;\n  const dm = document.getElementById('cofre-mes'); if(dm) dm.value=getMes()||new Date().getMonth()+1;\n  const dd = document.getElementById('cofre-desc'); if(dd) dd.value='';\n  const dv = document.getElementById('cofre-valor'); if(dv) dv.value='';\n  const dn = document.getElementById('cofre-nota'); if(dn) dn.value='';\n  updateCofrePreview();\n  openModal('modal-cofre');\n}\n\nfunction setCofreTipo(tipo){\n  currentCofreTipo = tipo;\n  const be = document.getElementById('cofre-btn-ent');\n  const bs = document.getElementById('cofre-btn-sai');\n  if(be) be.className='tipo-btn'+(tipo==='entrada'?' rec':'');\n  if(bs) bs.className='tipo-btn'+(tipo==='saida'?' desp':'');\n  const catEl = document.getElementById('cofre-cat');\n  if(catEl){\n    if(tipo==='entrada'){\n      catEl.innerHTML=['Quotas recebidas','Receita atividades','Donativos','Recarregar de banco','Outra entrada'].map(o=>`<option>${o}<\/option>`).join('');\n    } else {\n      catEl.innerHTML=['Recarregar cartão pré-pago','Pagamento fornecedor','Compras material','Despesas correntes','Transferência para banco','Outra saída'].map(o=>`<option>${o}<\/option>`).join('');\n    }\n  }\n  updateCofrePreview();\n}\n\nfunction updateCofrePreview(){\n  const saldo = getSaldoCofre();\n  const vEl = document.getElementById('cofre-valor');\n  const v = parseFloat(vEl?.value)||0;\n  const novo = currentCofreTipo==='entrada'?saldo+v:saldo-v;\n  const pr = document.getElementById('cofre-saldo-pre'); if(pr) pr.textContent=fmt(saldo);\n  const po = document.getElementById('cofre-saldo-pos'); if(po){po.textContent=fmt(novo);po.style.color=novo<0?'var(--coral-d)':'var(--amber-d)';}\n}\n\nfunction saveMovCofre(){\n  const mes=parseInt(document.getElementById('cofre-mes').value);\n  const data=document.getElementById('cofre-data').value;\n  const desc=(document.getElementById('cofre-desc')?.value||'').trim();\n  const cat=document.getElementById('cofre-cat')?.value||'';\n  const valor=parseFloat(document.getElementById('cofre-valor').value)||0;\n  const nota=(document.getElementById('cofre-nota')?.value||'').trim();\n  if(!valor||valor<=0){toast('Insere um valor válido.',false);return;}\n  const novoSaldo=getSaldoCofre()+(currentCofreTipo==='entrada'?valor:-valor);\n  if(novoSaldo<0&&currentCofreTipo==='saida'){\n    if(!confirm(`Atenção: o cofre ficaria com ${fmt(novoSaldo)}. Confirmas?`)) return;\n  }\n  const ano=getAno();\n  if(editingCofreId){\n    const idx=movCofre.findIndex(m=>m.id===editingCofreId);\n    if(idx>=0) movCofre[idx]={id:editingCofreId,tipo:currentCofreTipo,ano,mes,data,desc,cat,valor,nota};\n    toast('Movimento atualizado!');\n  } else {\n    movCofre.push({id:Date.now(),tipo:currentCofreTipo,ano,mes,data,desc,cat,valor,nota});\n    toast(currentCofreTipo==='entrada'?'Entrada registada!':'Saída registada!');\n  }\n  editingCofreId=null;\n  saveCofre(); updateTopbarCofre(); closeModal('modal-cofre'); renderCofre();\n}\n\nfunction editMovCofre(id){\n  const m=movCofre.find(x=>x.id===id);if(!m)return;\n  editingCofreId=id;\n  const t=document.getElementById('cofre-modal-title');if(t)t.textContent='Editar Movimento de Caixa';\n  setCofreTipo(m.tipo);\n  const dm=document.getElementById('cofre-mes');if(dm)dm.value=m.mes;\n  const dd=document.getElementById('cofre-data');if(dd)dd.value=m.data||'';\n  const ds=document.getElementById('cofre-desc');if(ds)ds.value=m.desc||'';\n  const dv=document.getElementById('cofre-valor');if(dv)dv.value=m.valor;\n  const dn=document.getElementById('cofre-nota');if(dn)dn.value=m.nota||'';\n  setTimeout(()=>{const el=document.getElementById('cofre-cat');if(el)el.value=m.cat||el.options[0]?.value;},50);\n  updateCofrePreview();\n  openModal('modal-cofre');\n}\n\nfunction deleteMovCofre(id){\n  const m=movCofre.find(x=>x.id===id);if(!m)return;\n  pendingDelete={type:'cofre',id,label:`${m.tipo==='entrada'?'Entrada':'Saída'} — ${MESES[m.mes-1]} ${m.ano}`,valor:m.valor};\n  document.getElementById('delete-preview').innerHTML=`<strong>${m.tipo==='entrada'?'▲ Entrada':'▼ Saída'} de Caixa<\/strong><br>${MESES[m.mes-1]} ${m.ano}${m.data?' — '+m.data:''}<br><span style=\"color:var(--text-2);font-size:12px\">${m.cat||''}${m.desc?' · '+m.desc:''}<\/span><br><strong style=\"font-size:16px;color:${m.tipo==='entrada'?'#085041':'#712B13'}\">${fmt(m.valor)}<\/strong>`;\n  openModal('modal-confirma-delete');\n}\n\nfunction imprimirMovCofre(id){\n  const m=movCofre.find(x=>x.id===id);if(!m)return;\n  document.getElementById('cp-nome').value=m.desc||'';\n  document.getElementById('cp-ref').value='COF-'+String(m.id).slice(-6);\n  document.getElementById('cp-descricao').value=(m.tipo==='entrada'?'Entrada':'Saída')+' de Caixa — '+(m.cat||'');\n  document.getElementById('cp-valor').value=m.valor.toFixed(2);\n  document.getElementById('cp-data').value=m.data||new Date().toISOString().slice(0,10);\n  document.getElementById('cp-modo').value='Numerário';\n  document.getElementById('cp-obs').value=m.nota||'';\n  openModal('modal-comprovativo');\n}\n\nfunction renderCofre(){\n  const ano=getAno(), mes=getMes();\n\n  // ── 1. Lançamentos gerais em Numerário ──────────────────────\n  const movNum = movimentos.filter(m=>m.tipmov==='Numerário').map(m=>({\n    id: 'mov_'+m.id,\n    tipo: m.cat==='receita'?'entrada':'saida',\n    ano: m.ano, mes: m.mes, data: '',\n    cat: m.categoria,\n    desc: m.desc||(m.sub?m.sub+' — ':'')+m.tipmov,\n    valor: m.valor,\n    origem: '🏦 Lançamento',\n    _raw: m\n  }));\n\n  // ── 2. Pagamentos ATL em Numerário ───────────────────────────\n  // ── 3. Movimentos manuais do cofre ───────────────────────────\n  const movMan = movCofre.map(m=>({...m, id:'man_'+m.id, origem:'📝 Manual'}));\n\n  // ── Juntar tudo e ordenar ───────────── " data-v=\"mais\" aria-selected=\"false\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 6h16M4 12h16M4 18h16\"/><\/svg>Menu<\/button>\n  <\/nav>\n<\/div>\n\n<div id=\"boot\" class=\"loading\">A abrir…<\/div>\n\n<!-- ========== FORMULÁRIO ========== -->\n<div class=\"sheet hidden\" id=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sh-title\">\n  <div class=\"pane\">\n    <div class=\"pane-head\"><h2 id=\"sh-title\">Nova fatura<\/h2><button class=\"x\" id=\"sh-x\" aria-label=\"Fechar\">×<\/button><\/div>\n    <form id=\"f-fat\" autocomplete=\"off\">\n      <div class=\"trim-pick\" id=\"trim-pick\"><\/div>\n      <div class=\"grid2\">\n        <label class=\"fld\"><span>Tipo de documento<\/span><input id=\"c-tipo_doc\" list=\"dl-tipo\" placeholder=\"FT, FR, FS…\"><\/label>\n        <label class=\"fld\"><span>Nº do documento<\/span><input id=\"c-numero_doc\"><\/label>\n        <label class=\"fld\"><span>Data do documento<\/span><input type=\"date\" id=\"c-data_doc\"><\/label>\n        <label class=\"fld\"><span>Data de vencimento<\/span><input type=\"date\" id=\"c-data_vencimento\"><\/label>\n        <label class=\"fld\"><span>NIF do fornecedor<\/span><input id=\"c-nif_fornecedor\" inputmode=\"numeric\" list=\"dl-nif\"><div class=\"hint hidden\" id=\"nif-hint\">NIF com formato invulgar<\/div><\/label>\n        <label class=\"fld\"><span>Valor (€)<\/span><input id=\"c-valor_doc\" inputmode=\"decimal\" placeholder=\"0,00\"><\/label>\n      <\/div>\n      <label class=\"fld\"><span>Nome do fornecedor<\/span><input id=\"c-nome_fornecedor\" list=\"dl-forn\"><\/label>\n      <label class=\"fld\"><span>Tipo de despesa<\/span><input id=\"c-tipo_despesa\" list=\"dl-desp\"><\/label>\n      <label class=\"fld\"><span>Descrição<\/span><input id=\"c-descricao\" list=\"dl-descr\"><\/label>\n      <div class=\"pag-box\">\n        <h3>Pagamento<\/h3>\n        <div class=\"grid2\">\n          <label class=\"fld\"><span>Data de pagamento<\/span><input type=\"date\" id=\"c-data_pagamento\"><\/label>\n          <label class=\"fld\"><span>Forma / observação<\/span><input id=\"c-obs_pagamento\" list=\"dl-obs\" placeholder=\"Débito direto, numerário…\"><\/label>\n        <\/div>\n      <\/div>\n      <label class=\"fld\"><span>Notas<\/span><textarea id=\"c-notas\" rows=\"2\"><\/textarea><\/label>\n      <div class=\"acoes\">\n        <button class=\"btn red hidden\" type=\"button\" id=\"b-apagar\">Apagar<\/button>\n        <button class=\"btn\" type=\"submit\" id=\"b-guardar\">Guardar<\/button>\n      <\/div>\n      <div class=\"meta\" id=\"sh-meta\"><\/div>\n    <\/form>\n  <\/div>\n<\/div>\n\n<datalist id=\"dl-tipo\"><\/datalist><datalist id=\"dl-forn\"><\/datalist><datalist id=\"dl-nif\"><\/datalist>\n<datalist id=\"dl-desp\"><\/datalist><datalist id=\"dl-descr\"><\/datalist><datalist id=\"dl-obs\"><\/datalist>\n<input type=\"file\" id=\"file-imp\" accept=\".xlsx,.xls\" class=\"hidden\">\n\n<script>\n/* =========================================================\n   CONFIGURAÇÃO\n   ========================================================= */\nconst SB_URL = 'https://yfsyifypsrqnwkqkfrnm.supabase.co';\nconst SB_KEY = 'sb_publishable_AkzlMeHlYHDyl0HzeC7_qg__j_Y6C9W';\nconst EMAIL_ARCA = 'arcadajuda@gmail.com';\nconst G_CLIENT = '853058400861-ih32rr8mhqah7b59tgv3tfjkme1s6plg.apps.googleusercontent.com';\nconst G_SCOPE = 'https://www.googleapis.com/auth/drive.file';\nconst DRIVE_PASTA = 'ARCA Faturas (cópia automática)';\nconst TRIM_NOMES = ['janeiro a Março', 'Abril a Junho', 'Julho, Agosto e Setembro', 'Outubro a Dezembro'];\nconst TRIM_CURTO = ['Jan–Mar', 'Abr–Jun', 'Jul–Set', 'Out–Dez'];\nconst TRIM_COR = ['var(--t1)', 'var(--t2)', 'var(--t3)', 'var(--t4)'];\nconst MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];\nconst TIPOS_DOC = {\n  FT:['Fatura','#1E4FB8'], FR:['Fatura-recibo','#139A5B'], FS:['Fatura simplificada','#E08E0B'],\n  R:['Recibo','#7C4DDB'], REC:['Recibo','#7C4DDB'], RC:['Recibo','#7C4DDB'],\n  NC:['Nota de crédito','#D13A5C'], DEV:['Devolução','#D13A5C'],\n  PE:['Pagamento ao Estado','#0E8E8C'], RV:['Recibo de vencimento','#EF6C22'],\n  CA:['Cartão alimentação','#C43FC9'], FA:['Fatura (FA)','#51607A']\n};\nconst corTipo = t => (TIPOS_DOC[(t||'').toUpperCase()]||[,'#8A95AA'])[1];\nconst CAMPOS = ['tipo_doc','numero_doc','data_doc','data_vencimento','nif_fornecedor','nome_fornecedor','tipo_despesa','descricao','valor_doc','data_pagamento','obs_pagamento','notas'];\n\nlet VEIO_RECUP = /type=recovery/.test(location.hash);\nconst __inflight = new Set();\nfunction __pendentes(){ return Promise.allSettled([...__inflight]); }\nconst sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },\n  global: { fetch: async (url, opt) => {\n    const tok = await parent.ARCA.freshToken();\n    const hd = new Headers((opt && opt.headers) || {}); hd.set('Authorization', 'Bearer ' + tok);\n    const p = fetch(url, Object.assign({}, opt, { headers: hd }));\n    __inflight.add(p); const d = () => __inflight.delete(p); p.then(d, d); return p;\n  } } });\nsb.auth = {\n  getSession: async () => { const t = parent.ARCA.token(); return { data: { session: t ? { access_token: t, user: parent.ARCA.user } : null }, error: null }; },\n  getUser: async () => ({ data: { user: parent.ARCA.user }, error: null }),\n  onAuthStateChange: () => ({ data: { subscription: { unsubscribe(){} } } }),\n  signOut: async () => { try{ parent.ARCA.logout(); }catch(e){} return { error: null }; },\n  signInWithPassword: async () => ({ error: { message: 'Entre na app ARCA.' } }),\n  resetPasswordForEmail: async () => ({ error: { message: 'Indisponível aqui.' } }),\n  updateUser: async (o) => { try { await parent.ARCA.api('/auth/v1/user', { method: 'PUT', body: { password: o.password } }); return { error: null }; } catch (e) { return { error: { message: e.message } }; } }\n};\n\n/* =========================================================\n   ESTADO\n   ========================================================= */\nlet TODAS = [];            // todas as faturas (todos os anos)\nlet ANO = new Date().getFullYear();\nlet VISTA = 'painel';\nlet FILTRO = { trim: 0, q: '', tipo: '', desp: '', pag: '' };\nlet EDITAR = null;         // registo em edição\nlet TRIM_FORM = 1, trimManual = false;\nlet emRecuperacao = false;\nlet deferredInstall = null;\n\n/* =========================================================\n   UTILITÁRIOS\n   ========================================================= */\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst eur = v => (Number(v)||0).toLocaleString('pt-PT', { style:'currency', currency:'EUR' });\nconst eurC = v => { const n = Number(v)||0; return n >= 10000 ? (n/1000).toLocaleString('pt-PT',{maximumFractionDigits:1})+' mil €' : eur(n); };\nconst dPT = iso => iso ? iso.split('-').reverse().join('/') : '';\nconst norm = s => String(s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim();\nconst temPag = f => !!(f.data_pagamento || (f.obs_pagamento && f.obs_pagamento.trim()));\nfunction toast(t, ms = 2600){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; d.setAttribute('role','status'); document.body.appendChild(d); setTimeout(() => d.remove(), ms); }\nfunction msgLogin(t, tipo = 'err'){ $('#login-msg').innerHTML = t ? `<div class=\"msg ${tipo}\">${esc(t)}<\/div>` : ''; }\nfunction nifValido(n){\n  const s = String(n||'').replace(/\\D/g,'');\n  if (s.length !== 9) return false;\n  let soma = 0; for (let i = 0; i < 8; i++) soma += (+s[i]) * (9 - i);\n  let c = 11 - (soma % 11); if (c >= 10) c = 0;\n  return c === +s[8];\n}\nfunction paraNumero(v){\n  if (v === '' || v == null) return null;\n  const n = parseFloat(String(v).replace(/\\s|€/g,'').replace(/\\.(?=\\d{3}(\\D|$))/g,'').replace(',','.'));\n  return isNaN(n) ? null : Math.round(n*100)/100;\n}\n\n/* =========================================================\n   AUTENTICAÇÃO\n   ========================================================= */\nsb.auth.onAuthStateChange((ev, sess) => {\n  if (ev === 'PASSWORD_RECOVERY') { emRecuperacao = true; mostrarNovaPassword(); }\n  if (ev === 'SIGNED_OUT') mostrarLogin();\n});\n\nfunction mostrarLogin(){ $('#boot').classList.add('hidden'); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#f-login').classList.add('hidden'); $('#f-nova').classList.add('hidden'); $('#login-sub').textContent='Esta conta não tem acesso às Faturas. Peça à direção para a autorizar.'; return;\n  $('#boot').classList.add('hidden'); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');\n  $('#f-login').classList.remove('hidden'); $('#f-nova').classList.add('hidden');\n  $('#login-sub').textContent = 'Entre com o email e a password da associação.';\n}\nfunction mostrarNovaPassword(){\n  $('#boot').classList.add('hidden'); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');\n  $('#f-login').classList.add('hidden'); $('#f-nova').classList.remove('hidden');\n  $('#login-sub').textContent = 'Escolha uma nova password para entrar na aplicação.';\n  msgLogin('');\n}\n\n$('#f-login').addEventListener('submit', async e => {\n  e.preventDefault(); msgLogin('');\n  const b = $('#b-entrar'); b.disabled = true; b.textContent = 'A entrar…';\n  const { error } = await sb.auth.signInWithPassword({ email: $('#l-email').value.trim(), password: $('#l-pass').value });\n  b.disabled = false; b.textContent = 'Entrar';\n  if (error) { msgLogin(/invalid/i.test(error.message) ? 'Email ou password errados.' : 'Não foi possível entrar: ' + error.message); return; }\n  arrancar();\n});\n\n$('#b-esqueci').addEventListener('click', async () => {\n  const email = $('#l-email').value.trim() || EMAIL_ARCA;\n  if (!confirm(`Enviar um email para ${email} com o link para criar uma nova password?`)) return;\n  const destino = location.origin + location.pathname;\n  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: destino });\n  if (error) msgLogin('Não foi possível enviar o email: ' + error.message);\n  else msgLogin(`Email enviado para ${email}. Abra o link recebido neste aparelho para definir a nova password.`, 'ok');\n});\n\n$('#f-nova').addEventListener('submit', async e => {\n  e.preventDefault();\n  const p1 = $('#n-pass1').value, p2 = $('#n-pass2').value;\n  if (p1.length < 8) return msgLogin('A password tem de ter pelo menos 8 caracteres.');\n  if (p1 !== p2) return msgLogin('As duas passwords não são iguais.');\n  const { error } = await sb.auth.updateUser({ password: p1 });\n  if (error) return msgLogin('Não foi possível guardar: ' + error.message);\n  emRecuperacao = false; VEIO_RECUP = false; history.replaceState(null, '', location.pathname);\n  toast('Password alterada.'); arrancar();\n});\n\nasync function arrancar(){\n  const { data: { session } } = await sb.auth.getSession();\n  if (emRecuperacao || VEIO_RECUP) { emRecuperacao = true; return mostrarNovaPassword(); }\n  if (!session) return mostrarLogin();\n  const { data: ok, error } = await sb.rpc('faturas_tem_acesso');\n  if (!error && !ok) return semAcesso(session.user.email); /* sem rede: continua com a cópia local */\n  $('#login').classList.add('hidden'); $('#boot').classList.add('hidden'); $('#app').classList.remove('hidden');\n  await carregar();\n  driveIniciar();\n}\n\n/* Acesso retirado: limpa os dados guardados neste aparelho e termina a sessão */\nfunction semAcesso(email){\n  ['faturas_cache_v1','faturas_fila_v1','faturas_rascunho_v1','faturas_drive_tok'].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });\n  TODAS = [];\n  mostrarLogin();\n  msgLogin(`A conta ${email} não tem acesso a esta aplicação.`);\n}\nsetInterval(async () => {\n  if ($('#app').classList.contains('hidden') || !navigator.onLine) return;\n  const { data: { session } } = await sb.auth.getSession(); if (!session) return;\n  const { data: ok, error } = await sb.rpc('faturas_tem_acesso');\n  if (!error && !ok) semAcesso(session.user.email);\n}, 120000);\n\n/* =========================================================\n   DADOS (SUPABASE)\n   ========================================================= */\nfunction estadoSB(t, cls){ const b = $('#st-sb'); b.textContent = t; b.className = 'sync ' + (cls||''); }\n\nasync function carregar(silencioso){\n  if (!silencioso) estadoSB('Dados…', 'warn');\n  const todas = []; let de = 0;\n  while (true) {\n    const { data, error } = await sb.from('faturas').select('*').order('ano').order('trimestre').order('ordem').order('criado_em').range(de, de + 999);\n    if (error) { estadoSB('Dados: erro', 'bad'); toast('Erro ao carregar: ' + error.message, 5000); return; }\n    todas.push(...data); if (data.length < 1000) break; de += 1000;\n  }\n  TODAS = todas;\n  estadoSB('Dados ✓', 'ok');\n  montarAnos(); montarListas(); render();\n}\n\nfunction doAno(){ return TODAS.filter(f => f.ano === ANO); }\n\nfunction montarAnos(){\n  const anos = new Set(TODAS.map(f => f.ano)); anos.add(new Date().getFullYear()); anos.add(ANO);\n  const s = $('#sel-ano');\n  s.innerHTML = [...anos].sort().map(a => `<option ${a===ANO?'selected':''}>${a}<\/option>`).join('');\n}\n$('#sel-ano').addEventListener('change', e => { ANO = +e.target.value; FILTRO.trim = 0; montarListas(); render(); });\n\nfunction unicos(campo, lista = TODAS){\n  const m = new Map();\n  lista.forEach(f => { const v = (f[campo]||'').trim(); if (v) { const k = norm(v); m.set(k, (m.get(k)||{v, n:0})); m.get(k).n++; } });\n  return [...m.values()].sort((a,b) => b.n - a.n).map(x => x.v);\n}\nfunction montarListas(){\n  const opt = arr => arr.map(v => `<option value=\"${esc(v)}\">`).join('');\n  const tipos = [...new Set([...Object.keys(TIPOS_DOC), ...unicos('tipo_doc').map(t => t.toUpperCase())])];\n  $('#dl-tipo').innerHTML = tipos.map(t => `<option value=\"${esc(t)}\">${esc((TIPOS_DOC[t]||[''])[0])}<\/option>`).join('');\n  $('#dl-forn').innerHTML = opt(unicos('nome_fornecedor'));\n  $('#dl-nif').innerHTML = opt(unicos('nif_fornecedor'));\n  $('#dl-desp').innerHTML = opt(unicos('tipo_despesa'));\n  $('#dl-descr').innerHTML = opt(unicos('descricao').slice(0, 300));\n  $('#dl-obs').innerHTML = opt(unicos('obs_pagamento').slice(0, 80));\n  const ano = doAno();\n  $('#f-tipo').innerHTML = '<option value=\"\">Todos os tipos<\/option>' + [...new Set(ano.map(f => (f.tipo_doc||'').toUpperCase()).filter(Boolean))].sort().map(t => `<option ${FILTRO.tipo===t?'selected':''} value=\"${esc(t)}\">${esc(t)}${TIPOS_DOC[t]?' – '+TIPOS_DOC[t][0]:''}<\/option>`).join('');\n  $('#f-desp').innerHTML = '<option value=\"\">Todas as despesas<\/option>' + unicos('tipo_despesa', ano).sort((a,b)=>a.localeCompare(b,'pt')).map(t => `<option ${norm(FILTRO.desp)===norm(t)?'selected':''} value=\"${esc(t)}\">${esc(t)}<\/option>`).join('');\n}\n\nasync function guardarRegisto(reg, id){\n  estadoSB('A gravar…', 'warn');\n  let res;\n  if (id) res = await sb.from('faturas').update(reg).eq('id', id).select().single();\n  else res = await sb.from('faturas').insert(reg).select().single();\n  if (res.error) { estadoSB('Dados: erro', 'bad'); throw res.error; }\n  const i = TODAS.findIndex(f => f.id === res.data.id);\n  if (i >= 0) TODAS[i] = res.data; else TODAS.push(res.data);\n  estadoSB('Dados ✓', 'ok');\n  alterado();\n  return res.data;\n}\nasync function apagarRegisto(id){\n  estadoSB('A apagar…', 'warn');\n  const { error } = await sb.from('faturas').delete().eq('id', id);\n  if (error) { estadoSB('Dados: erro', 'bad'); throw error; }\n  TODAS = TODAS.filter(f => f.id !== id);\n  estadoSB('Dados ✓', 'ok');\n  alterado();\n}\nfunction alterado(){ montarAnos(); montarListas(); render(); driveAgendar(); }\n\n/* =========================================================\n   VISTAS\n   ========================================================= */\ndocument.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => irPara(b.dataset.v)));\nfunction irPara(v){\n  VISTA = v;\n  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));\n  ['painel','lista','fornec','mais'].forEach(x => $('#v-'+x).classList.toggle('hidden', x !== v));\n  $('#fab').classList.toggle('hidden', v === 'mais');\n  render(); window.scrollTo(0, 0);\n}\nfunction render(){\n  if (VISTA === 'painel') renderPainel();\n  else if (VISTA === 'lista') renderLista();\n  else if (VISTA === 'fornec') renderFornec();\n  else renderMais();\n}\n\n/* ---------- Painel ---------- */\nfunction renderPainel(){\n  const ano = doAno();\n  const total = ano.reduce((s,f) => s + (+f.valor_doc||0), 0);\n  const porTrim = [1,2,3,4].map(t => ano.filter(f => f.trimestre === t).reduce((s,f) => s + (+f.valor_doc||0), 0));\n  const maxT = Math.max(...porTrim, 1);\n  const semPag = ano.filter(f => !temPag(f) && (+f.valor_doc||0) > 0);\n  const hoje = new Date().toISOString().slice(0,10);\n  const vencidas = semPag.filter(f => f.data_vencimento && f.data_vencimento < hoje);\n\n  const porMes = Array(12).fill(0);\n  ano.forEach(f => { if (f.data_doc && +f.data_doc.slice(0,4) === ANO) porMes[+f.data_doc.slice(5,7)-1] += (+f.valor_doc||0); });\n  const maxM = Math.max(...porMes, 1);\n\n  const agrupar = campo => {\n    const m = new Map();\n    ano.forEach(f => { const v = (f[campo]||'').trim(); if (!v) return; const k = norm(v); const o = m.get(k) || { nome: v, v: 0, n: 0 }; o.v += (+f.valor_doc||0); o.n++; m.set(k, o); });\n    return [...m.values()].sort((a,b) => b.v - a.v);\n  };\n  const desp = agrupar('tipo_despesa').slice(0, 8), dMax = desp[0]?.v || 1;\n  const forn = agrupar('nome_fornecedor').slice(0, 6), fMax = forn[0]?.v || 1;\n  const cores = ['var(--t1)','var(--t2)','var(--t3)','var(--t4)','var(--arca)','#7C4DDB','#0E8E8C','#EF6C22'];\n\n  $('#v-painel').innerHTML = `\n    <div class=\"hero\">\n      <div class=\"lbl\">Valor total dos documentos de ${ANO}<\/div>\n      <div class=\"big\">${eur(total)}<\/div>\n      <div class=\"fita\" role=\"group\" aria-label=\"Valor por trimestre\">\n        ${porTrim.map((v,i) => `<button class=\"q${i+1}\" style=\"flex:${Math.max(v/maxT, .14)} 1 0\" data-t=\"${i+1}\" aria-label=\"${TRIM_CURTO[i]}: ${eur(v)}\"><small>T${i+1}<\/small><\/button>`).join('')}\n      <\/div>\n      <div class=\"fita-legenda\">${porTrim.map((v,i) => `<button data-t=\"${i+1}\" style=\"--c:${TRIM_COR[i]}\"><small>${TRIM_CURTO[i]}<\/small><b>${eurC(v)}<\/b><\/button>`).join('')}<\/div>\n    <\/div>\n    <div class=\"kpis\">\n      <div class=\"kpi\"><b>${ano.length}<\/b><span>documentos<\/span><\/div>\n      <div class=\"kpi ${semPag.length?'alert':''}\"><b>${semPag.length}<\/b><span>sem pagamento registado<\/span><\/div>\n      <div class=\"kpi ${vencidas.length?'alert':''}\"><b>${vencidas.length}<\/b><span>já vencidos por pagar<\/span><\/div>\n    <\/div>\n    <section class=\"bloco\">\n      <h2>Por mês (data do documento)<\/h2>\n      <div class=\"meses\">${porMes.map((v,i) => `<div title=\"${MESES[i]}: ${eur(v)}\"><i style=\"height:${Math.round(v/maxM*100)}%;background:${TRIM_COR[Math.floor(i/3)]}\"><\/i><span>${MESES[i]}<\/span><\/div>`).join('')}<\/div>\n    <\/section>\n    <section class=\"bloco barras\">\n      <h2>Tipos de despesa com mais valor<\/h2>\n      ${desp.length ? desp.map((d,i) => `<button class=\"linha\" data-desp=\"${esc(d.nome)}\"><span class=\"n\">${esc(d.nome)} <small style=\"color:var(--ink2)\">(${d.n})<\/small><\/span><span class=\"v\">${eur(d.v)}<\/span><span class=\"b\"><i style=\"width:${Math.max(d.v/dMax*100,2)}%;background:${cores[i%cores.length]}\"><\/i><\/span><\/button>`).join('') : '<p class=\"vazio\">Ainda não há faturas neste ano.<\/p>'}\n    <\/section>\n    <section class=\"bloco barras\">\n      <h2>Fornecedores com mais valor<\/h2>\n      ${forn.map((d,i) => `<div class=\"linha\"><span class=\"n\">${esc(d.nome)}<\/span><span class=\"v\">${eur(d.v)}<\/span><span class=\"b\"><i style=\"width:${Math.max(d.v/fMax*100,2)}%;background:${cores[(i+2)%cores.length]}\"><\/i><\/span><\/div>`).join('')}\n    <\/section>`;\n  $('#v-painel').querySelectorAll('.fita button, .fita-legenda button').forEach(b => b.onclick = () => { FILTRO = { trim:+b.dataset.t, q:'', tipo:'', desp:'', pag:'' }; limparFiltrosUI(); irPara('lista'); });\n  $('#v-painel').querySelectorAll('[data-desp]').forEach(b => b.onclick = () => { FILTRO = { trim:0, q:'', tipo:'', desp:b.dataset.desp, pag:'' }; limparFiltrosUI(); montarListas(); irPara('lista'); });\n}\nfunction limparFiltrosUI(){ $('#q').value = FILTRO.q; $('#f-pag').value = FILTRO.pag; montarListas(); }\n\n/* ---------- Lista ---------- */\nfunction filtradas(){\n  const q = norm(FILTRO.q);\n  return doAno().filter(f =>\n    (!FILTRO.trim || f.trimestre === FILTRO.trim) &&\n    (!FILTRO.tipo || (f.tipo_doc||'').toUpperCase() === FILTRO.tipo) &&\n    (!FILTRO.desp || norm(f.tipo_despesa) === norm(FILTRO.desp)) &&\n    (!FILTRO.pag || (FILTRO.pag === 'sem' ? !temPag(f) : temPag(f))) &&\n    (!q || norm([f.nome_fornecedor, f.nif_fornecedor, f.numero_doc, f.descricao, f.tipo_despesa, f.obs_pagamento, f.notas, f.tipo_doc, String(f.valor_doc??'').replace('.',',')].join(' ')).includes(q))\n  );\n}\nfunction renderLista(){\n  $('#trims').innerHTML = [0,1,2,3,4].map(t => `<button data-t=\"${t}\" aria-pressed=\"${FILTRO.trim===t}\" style=\"--c:${t?TRIM_COR[t-1]:'var(--ink)'}\">${t ? TRIM_CURTO[t-1] : 'Todo o ano'}<\/button>`).join('');\n  $('#trims').querySelectorAll('button').forEach(b => b.onclick = () => { FILTRO.trim = +b.dataset.t; renderLista(); });\n  const lista = filtradas().sort((a,b) => (b.trimestre - a.trimestre) || ((b.ordem||0) - (a.ordem||0)) || String(b.criado_em).localeCompare(String(a.criado_em)));\n  $('#res-n').textContent = `${lista.length} ${lista.length === 1 ? 'documento' : 'documentos'} · mais recentes primeiro`;\n  $('#res-v').textContent = eur(lista.reduce((s,f) => s + (+f.valor_doc||0), 0));\n  if (!lista.length) { $('#lista').innerHTML = `<div class=\"vazio\">Nenhuma fatura corresponde a estes filtros.<br><br><button class=\"btn ghost small\" id=\"b-limpa\">Limpar filtros<\/button><\/div>`; $('#b-limpa').onclick = () => { FILTRO = { trim:0,q:'',tipo:'',desp:'',pag:'' }; limparFiltrosUI(); renderLista(); }; return; }\n  const hoje = new Date().toISOString().slice(0,10);\n  $('#lista').innerHTML = lista.map(f => {\n    let pg;\n    if (f.data_pagamento) pg = `<span class=\"pg ok\">Pago ${dPT(f.data_pagamento).slice(0,5)}<\/span>`;\n    else if (f.obs_pagamento) pg = `<span class=\"pg obs\" title=\"${esc(f.obs_pagamento)}\">${esc(f.obs_pagamento)}<\/span>`;\n    else pg = `<span class=\"pg no\">${f.data_vencimento && f.data_vencimento < hoje ? 'Vencida' : 'Sem pagamento'}<\/span>`;\n    return `<button class=\"fatura\" data-id=\"${f.id}\" style=\"--dc:${corTipo(f.tipo_doc)}\">\n      <span class=\"cor\"><\/span>\n      <span class=\"mid\">\n        <span class=\"forn\">${esc(f.nome_fornecedor || '(sem fornecedor)')}<\/span>\n        <span class=\"det\"><span class=\"tag\">${esc(f.tipo_doc || '—')}<\/span>${esc(f.numero_doc || 's/ nº')} · ${dPT(f.data_doc) || 'sem data'}<\/span>\n        <span class=\"det\">${esc([f.tipo_despesa, f.descricao].filter(Boolean).join(' – ') || '—')}${f.notas ? ' 📝' : ''}<\/span>\n      <\/span>\n      <span class=\"dir\"><span class=\"val\">${f.valor_doc == null ? '—' : eur(f.valor_doc)}<\/span>${pg}<\/span>\n    <\/button>`;\n  }).join('');\n  $('#lista').querySelectorAll('.fatura').forEach(b => b.onclick = () => abrirForm(TODAS.find(f => f.id === b.dataset.id)));\n  __destacar(false);\n}\n/* realça (e mostra) a fatura que acabou de ser lançada */\nwindow.__ULT = null;\nfunction __destacar(rolar){\n  if (!window.__ULT) return;\n  const el = document.querySelector('#lista .fatura[data-id=\"' + window.__ULT + '\"]');\n  if (!el) return;\n  el.classList.add('novo');\n  if (rolar) { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} }\n}\n$('#q').addEventListener('input', e => { FILTRO.q = e.target.value; renderLista(); });\n$('#f-tipo').addEventListener('change', e => { FILTRO.tipo = e.target.value; renderLista(); });\n$('#f-desp').addEventListener('change', e => { FILTRO.desp = e.target.value; renderLista(); });\n$('#f-pag').addEventListener('change', e => { FILTRO.pag = e.target.value; renderLista(); });\n\n/* ---------- Fornecedores ---------- */\nfunction renderFornec(){\n  const m = new Map();\n  doAno().forEach(f => {\n    const nome = (f.nome_fornecedor||'').trim(); if (!nome) return;\n    const k = (f.nif_fornecedor||'').replace(/\\D/g,'').slice(-9) || norm(nome);\n    const o = m.get(k) || { nome, nif: f.nif_fornecedor, v: 0, n: 0, semPag: 0 };\n    o.v += (+f.valor_doc||0); o.n++; if (!temPag(f)) o.semPag++; m.set(k, o);\n  });\n  const arr = [...m.values()].sort((a,b) => b.v - a.v);\n  $('#v-fornec').innerHTML = `<div class=\"resumo\"><span>${arr.length} fornecedores em ${ANO}<\/span><\/div>` + arr.map(o =>\n    `<button class=\"fatura\" data-q=\"${esc(o.nif || o.nome)}\" style=\"--dc:var(--arca)\"><span class=\"cor\"><\/span>\n      <span class=\"mid\"><span class=\"forn\">${esc(o.nome)}<\/span><span class=\"det\">NIF ${esc(o.nif || '—')} · ${o.n} ${o.n===1?'documento':'documentos'}<\/span><\/span>\n      <span class=\"dir\"><span class=\"val\">${eur(o.v)}<\/span>${o.semPag ? `<span class=\"pg no\">${o.semPag} sem pagamento<\/span>` : '<span class=\"pg ok\">tudo registado<\/span>'}<\/span><\/button>`).join('');\n  $('#v-fornec').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { FILTRO = { trim:0, q:b.dataset.q, tipo:'', desp:'', pag:'' }; limparFiltrosUI(); irPara('lista'); });\n}\n\n/* ---------- Mais ---------- */\nfunction renderMais(){\n  const tok = driveTokenValido();\n  const ult = localStorage.getItem('faturas_drive_ultima');\n  $('#v-mais').innerHTML = `\n    <section class=\"bloco\"><h2>Cópia no Google Drive<\/h2>\n      <p style=\"margin:0 0 10px;color:var(--ink2)\">Depois de cada alteração, a app grava um Excel atualizado na pasta “${esc(DRIVE_PASTA)}” da conta ${EMAIL_ARCA}.<\/p>\n      <p style=\"margin:0 0 12px\"><b>${tok ? 'Drive ligado.' : 'Drive por ligar.'}<\/b> ${ult ? 'Última cópia: ' + esc(ult) : 'Ainda sem cópias feitas neste aparelho.'}<\/p>\n      <div class=\"linha-btns\"><button class=\"btn small\" id=\"m-drive\">${tok ? 'Gravar cópia agora' : 'Ligar Google Drive'}<\/button><\/div>\n    <\/section>\n    <section class=\"bloco\"><h2>Excel<\/h2>\n      <p style=\"margin:0 0 12px;color:var(--ink2)\">Exporta o ano ${ANO} no mesmo formato da folha original, com uma folha por trimestre.<\/p>\n      <div class=\"linha-btns\"><button class=\"btn small\" id=\"m-exp\">Descarregar Excel ${ANO}<\/button><button class=\"btn ghost small\" id=\"m-imp\">Importar Excel<\/button><\/div>\n    <\/section>\n    <section class=\"bloco\"><h2>Aplicação no telemóvel<\/h2>\n      <p style=\"margin:0 0 12px;color:var(--ink2)\">Instala a app no ecrã principal do Android, com ícone próprio.<\/p>\n      <div class=\"linha-btns\"><button class=\"btn small\" id=\"m-inst\" ${deferredInstall ? '' : 'disabled'}>${deferredInstall ? 'Instalar app' : 'Já instalada ou use o menu ⋮ → Instalar app'}<\/button><\/div>\n    <\/section>\n    <section class=\"bloco\"><h2>Conta<\/h2>\n      <p style=\"margin:0 0 12px;color:var(--ink2)\" id=\"m-user\"><\/p>\n      <div class=\"linha-btns\"><button class=\"btn ghost small\" id=\"m-pass\">Alterar password<\/button><button class=\"btn ghost small\" id=\"m-rec\">Recarregar dados<\/button><button class=\"btn red small\" id=\"m-sair\">Terminar sessão<\/button><\/div>\n    <\/section>`;\n  sb.auth.getUser().then(({ data }) => { const el = $('#m-user'); if (el) el.textContent = 'Sessão iniciada com ' + (data.user?.email || ''); });\n  $('#m-drive').onclick = () => driveGravarAgora(true);\n  $('#m-exp').onclick = () => { const wb = construirExcel(ANO); XLSX.writeFile(wb, `Faturas_${ANO}_ARCA.xlsx`); };\n  $('#m-imp').onclick = () => $('#file-imp').click();\n  $('#m-inst').onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; renderMais(); };\n  $('#m-pass').onclick = async () => {\n    const p = prompt('Nova password (mínimo 8 caracteres):'); if (!p) return;\n    if (p.length < 8) return toast('A password tem de ter pelo menos 8 caracteres.');\n    const { error } = await sb.auth.updateUser({ password: p });\n    toast(error ? 'Erro: ' + error.message : 'Password alterada.');\n  };\n  $('#m-rec').onclick = () => carregar();\n  $('#m-sair').onclick = async () => { if (confirm('Terminar sessão neste aparelho?')) { await sb.auth.signOut(); localStorage.removeItem('faturas_drive_tok'); } };\n}\n\n/* =========================================================\n   FORMULÁRIO\n   ========================================================= */\nfunction pintarTrimPick(){\n  $('#trim-pick').innerHTML = [1,2,3,4].map(t => `<button type=\"button\" data-t=\"${t}\" aria-pressed=\"${TRIM_FORM===t}\" style=\"--c:${TRIM_COR[t-1]}\" title=\"${TRIM_NOMES[t-1]}\">${TRIM_CURTO[t-1]}<\/button>`).join('');\n  $('#trim-pick').querySelectorAll('button').forEach(b => b.onclick = () => { TRIM_FORM = +b.dataset.t; trimManual = true; pintarTrimPick(); });\n}\nfunction abrirForm(f){\n  EDITAR = f || null; trimManual = !!f;\n  $('#sh-title').textContent = f ? 'Editar fatura' : 'Nova fatura';\n  $('#b-apagar').classList.toggle('hidden', !f);\n  const hojeISO = new Date().toISOString().slice(0,10);\n  CAMPOS.forEach(c => {\n    let v = f ? f[c] : '';\n    if (c === 'valor_doc' && v != null && v !== '') v = String(v).replace('.', ',');\n    $('#c-'+c).value = v ?? '';\n  });\n  if (!f) {\n    $('#c-data_doc').value = ANO === +hojeISO.slice(0,4) ? hojeISO : '';\n    TRIM_FORM = FILTRO.trim || (ANO === +hojeISO.slice(0,4) ? Math.ceil((new Date().getMonth()+1)/3) : 1);\n  } else TRIM_FORM = f.trimestre;\n  pintarTrimPick(); verNif();\n  $('#sh-meta').textContent = f ? `Última alteração: ${new Date(f.atualizado_em).toLocaleString('pt-PT')}${f.atualizado_por ? ' por ' + f.atualizado_por : ''}` : '';\n  $('#sheet').classList.remove('hidden'); document.body.style.overflow = 'hidden';\n  setTimeout(() => (f ? $('#b-guardar') : $('#c-tipo_doc')).focus(), 60);\n}\nfunction fecharForm(){ $('#sheet').classList.add('hidden'); document.body.style.overflow = ''; EDITAR = null; }\n$('#sh-x').onclick = fecharForm;\n$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') fecharForm(); });\ndocument.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').classList.contains('hidden')) fecharForm(); });\n$('#fab').onclick = () => abrirForm(null);\n\n$('#c-data_doc').addEventListener('change', e => {\n  if (trimManual || !e.target.value) return;\n  TRIM_FORM = Math.ceil((+e.target.value.slice(5,7))/3); pintarTrimPick();\n});\nfunction verNif(){ const v = $('#c-nif_fornecedor').value.trim(); $('#nif-hint').classList.toggle('hidden', !v || nifValido(v)); }\n$('#c-nif_fornecedor').addEventListener('input', verNif);\n$('#c-nif_fornecedor').addEventListener('change', e => {\n  const nif = e.target.value.trim(); if (!nif || $('#c-nome_fornecedor').value.trim()) return;\n  const r = [...TODAS].reverse().find(f => (f.nif_fornecedor||'').trim() === nif);\n  if (r) { $('#c-nome_fornecedor').value = r.nome_fornecedor || ''; if (!$('#c-tipo_despesa').value) $('#c-tipo_despesa').value = r.tipo_despesa || ''; }\n});\n$('#c-nome_fornecedor').addEventListener('change', e => {\n  const nome = norm(e.target.value); if (!nome || $('#c-nif_fornecedor').value.trim()) return;\n  const r = [...TODAS].reverse().find(f => norm(f.nome_fornecedor) === nome && f.nif_fornecedor);\n  if (r) { $('#c-nif_fornecedor').value = r.nif_fornecedor; verNif(); if (!$('#c-tipo_despesa').value) $('#c-tipo_despesa').value = r.tipo_despesa || ''; }\n});\n$('#c-tipo_doc').addEventListener('blur', e => { e.target.value = e.target.value.trim().toUpperCase(); });\n\n$('#f-fat').addEventListener('submit', async e => {\n  e.preventDefault();\n  driveGarantirToken(); // pede o acesso ao Drive dentro do toque (evita bloqueio do popup)\n  const reg = { ano: ANO, trimestre: TRIM_FORM };\n  CAMPOS.forEach(c => { const v = $('#c-'+c).value.trim(); reg[c] = v === '' ? null : v; });\n  reg.valor_doc = paraNumero($('#c-valor_doc').value);\n  if ($('#c-valor_doc').value.trim() && reg.valor_doc == null) return toast('O valor não é um número válido.');\n  if (!reg.nome_fornecedor && !reg.numero_doc) return toast('Preencha pelo menos o nº do documento ou o fornecedor.');\n  if (EDITAR) { reg.ano = EDITAR.ano; }\n  else {\n    const doTrim = TODAS.filter(f => f.ano === reg.ano && f.trimestre === reg.trimestre);\n    reg.ordem = doTrim.reduce((m,f) => Math.max(m, f.ordem||0), 0) + 1;\n    const dup = TODAS.find(f => f.ano === reg.ano && reg.numero_doc && norm(f.numero_doc) === norm(reg.numero_doc) && norm(f.nif_fornecedor) === norm(reg.nif_fornecedor));\n    if (dup && !confirm(`Já existe o documento ${reg.numero_doc} deste fornecedor (${eur(dup.valor_doc)}). Guardar mesmo assim?`)) return;\n  }\n  const b = $('#b-guardar'); b.disabled = true; b.textContent = 'A guardar…';\n  try { const __g = await guardarRegisto(reg, EDITAR?.id); window.__ULT = __g && __g.id; fecharForm(); toast('Fatura guardada.'); __destacar(true); clearTimeout(window.__ULTt); window.__ULTt = setTimeout(() => { window.__ULT = null; const e = document.querySelector('#lista .fatura.novo'); if (e) e.classList.remove('novo'); }, 12000); }\n  catch (err) { toast('Não foi possível guardar: ' + err.message, 5000); }\n  finally { b.disabled = false; b.textContent = 'Guardar'; }\n});\n$('#b-apagar').onclick = async () => {\n  if (!EDITAR) return;\n  if (!confirm(`Apagar o documento ${EDITAR.numero_doc || ''} de ${EDITAR.nome_fornecedor || ''}? Esta ação não se pode desfazer.`)) return;\n  driveGarantirToken();\n  try { await apagarRegisto(EDITAR.id); fecharForm(); toast('Fatura apagada.'); }\n  catch (err) { toast('Não foi possível apagar: ' + err.message, 5000); }\n};\n\n/* =========================================================\n   EXCEL (exportar / importar)\n   ========================================================= */\nfunction construirExcel(ano){\n  const wb = XLSX.utils.book_new();\n  const cab = ['TipoDoc','NumeroDoc','DataDoc','DataVencimento','NifFornecedor','NomeFornecedor','TipoDespesa','Descricao','ValorDoc','Data Pagamento','Notas'];\n  const dt = iso => iso ? new Date(iso + 'T00:00:00') : null;\n  [1,2,3,4].forEach(t => {\n    const regs = TODAS.filter(f => f.ano === ano && f.trimestre === t).sort((a,b) => (a.ordem||0) - (b.ordem||0));\n    if (t === 4 && !regs.length) return;\n    const linhas = regs.map(f => {\n      let pag = f.data_pagamento ? dt(f.data_pagamento) : (f.obs_pagamento || null);\n      const notas = [f.data_pagamento && f.obs_pagamento ? f.obs_pagamento : null, f.notas].filter(Boolean).join(' | ') || null;\n      return [f.tipo_doc, f.numero_doc, dt(f.data_doc), dt(f.data_vencimento), f.nif_fornecedor, f.nome_fornecedor, f.tipo_despesa, f.descricao, f.valor_doc == null ? null : +f.valor_doc, pag, notas];\n    });\n    const tot = regs.reduce((s,f) => s + (+f.valor_doc||0), 0);\n    const ws = XLSX.utils.aoa_to_sheet([cab, ...linhas, [], [null,null,null,null,null,null,null,'TOTAL', Math.round(tot*100)/100]], { cellDates: true, dateNF: 'dd/mm/yyyy' });\n    ws['!cols'] = [6,20,11,14,13,32,24,28,11,24,40].map(w => ({ wch: w }));\n    Object.keys(ws).forEach(k => { if (k[0] === '!') return; const c = ws[k]; if (c.t === 'd') c.z = 'dd/mm/yyyy'; if (c.t === 'n' && /^I\\d+$/.test(k)) c.z = '#,##0.00 €'; });\n    XLSX.utils.book_append_sheet(wb, ws, TRIM_NOMES[t-1].slice(0,31));\n  });\n  if (!wb.SheetNames.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([cab]), TRIM_NOMES[0]);\n  return wb;\n}\n\n$('#file-imp').addEventListener('change', async e => {\n  const file = e.target.files[0]; e.target.value = ''; if (!file) return;\n  try {\n    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });\n    const novos = [];\n    const iso = v => {\n      if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() - v.getTimezoneOffset()*60000); return d.toISOString().slice(0,10); }\n      if (typeof v === 'string') { const m = v.trim().match(/^(\\d{1,2})\\/(\\d{1,2})\\/+(\\d{4})$/); if (m) { const d = new Date(+m[3], m[2]-1, +m[1]); if (d.getMonth() === m[2]-1) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; } }\n      return null;\n    };\n    const txt = v => { if (v == null) return null; if (typeof v === 'number' && Number.isInteger(v)) return String(v); const s = String(v).trim(); return s || null; };\n    wb.SheetNames.slice(0, 4).forEach((nome, idx) => {\n      const n = norm(nome);\n      let t = idx + 1;\n      if (/jan|mar/.test(n)) t = 1; else if (/abr|jun/.test(n)) t = 2; else if (/jul|ago|set/.test(n)) t = 3; else if (/out|nov|dez/.test(n)) t = 4;\n      const rows = XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: null }).slice(1);\n      const notas = {}; const dados = [];\n      rows.forEach(r => {\n        if (!r.some(x => x != null && x !== '')) return;\n        if (typeof r[0] === 'string' && r[0].trim().startsWith('*')) { const m = r[0].trim().match(/^(\\*+)/); notas[m[1]] = r[0].trim().replace(/^\\*+/, '').trim(); return; }\n        if (norm(r[7]) === 'total' && r[0] == null) return;\n        dados.push(r);\n      });\n      dados.forEach((r, i) => {\n        const pagD = r[9] instanceof Date ? iso(r[9]) : null;\n        const obs = pagD ? null : txt(r[9]);\n        const venc = iso(r[3]);\n        const extra = [];\n        if (r[3] != null && !venc) extra.push('Vencimento original: ' + txt(r[3] instanceof Date ? r[3].toLocaleDateString('pt-PT') : r[3]));\n        const mk = obs && obs.match(/(\\*+)\\s*$/); if (mk && notas[mk[1]]) extra.push(notas[mk[1]]);\n        if (r[10]) extra.push(txt(r[10]));\n        novos.push({ ano: ANO, trimestre: t, tipo_doc: txt(r[0]), numero_doc: txt(r[1]), data_doc: iso(r[2]), data_vencimento: venc,\n          nif_fornecedor: txt(r[4]), nome_fornecedor: txt(r[5]), tipo_despesa: txt(r[6]), descricao: txt(r[7]),\n          valor_doc: typeof r[8] === 'number' ? Math.round(r[8]*100)/100 : paraNumero(r[8]), data_pagamento: pagD, obs_pagamento: obs, notas: extra.join(' | ') || null });\n      });\n    });\n    const chave = f => [norm(f.numero_doc), norm(f.nif_fornecedor), Number(f.valor_doc||0).toFixed(2), f.data_doc||''].join('|');\n    const existentes = new Set(TODAS.filter(f => f.ano === ANO).map(chave));\n    const aInserir = novos.filter(f => !existentes.has(chave(f)));\n    if (!aInserir.length) return toast(`Nada a importar: os ${novos.length} registos já existem em ${ANO}.`, 4000);\n    if (!confirm(`Encontrados ${novos.length} registos. ${novos.length - aInserir.length} já existem. Acrescentar ${aInserir.length} novos ao ano ${ANO}?`)) return;\n    driveGarantirToken();\n    const porTrim = {}; TODAS.filter(f => f.ano === ANO).forEach(f => porTrim[f.trimestre] = Math.max(porTrim[f.trimestre]||0, f.ordem||0));\n    aInserir.forEach(f => { porTrim[f.trimestre] = (porTrim[f.trimestre]||0) + 1; f.ordem = porTrim[f.trimestre]; });\n    estadoSB('A importar…', 'warn');\n    for (let i = 0; i < aInserir.length; i += 200) {\n      const { error } = await sb.from('faturas').insert(aInserir.slice(i, i + 200));\n      if (error) throw error;\n    }\n    toast(`${aInserir.length} faturas importadas.`);\n    await carregar(true); driveAgendar();\n  } catch (err) { estadoSB('Dados: erro', 'bad'); toast('Erro na importação: ' + err.message, 6000); }\n});\n\n/* =========================================================\n   GOOGLE DRIVE (cópia automática)\n   ========================================================= */\nlet tokenClient = null, driveTimer = null, drivePendente = false, driveOcupado = false;\nfunction estadoDR(t, cls){ const b = $('#st-dr'); b.textContent = t; b.className = 'sync ' + (cls||''); }\nfunction driveTokenValido(){\n  try { const o = JSON.parse(localStorage.getItem('faturas_drive_tok') || 'null'); return o && o.exp > Date.now() + 60000 ? o.t : null; } catch { return null; }\n}\nfunction driveIniciar(){ return;\n  if (!window.google?.accounts?.oauth2) { setTimeout(driveIniciar, 500); return; }\n  if (tokenClient) return;\n  tokenClient = google.accounts.oauth2.initTokenClient({\n    client_id: G_CLIENT, scope: G_SCOPE, login_hint: EMAIL_ARCA,\n    callback: r => {\n      if (r.error) { estadoDR('Drive: ligar', 'bad'); toast('O Google Drive não foi ligado.'); return; }\n      localStorage.setItem('faturas_drive_tok', JSON.stringify({ t: r.access_token, exp: Date.now() + (r.expires_in||3600)*1000 }));\n      localStorage.setItem('faturas_drive_consent', '1');\n      estadoDR('Drive ✓', 'ok');\n      if (drivePendente) driveAgendar(300);\n      if (VISTA === 'mais') renderMais();\n    },\n    error_callback: () => estadoDR('Drive: ligar', 'bad')\n  });\n  estadoDR(driveTokenValido() ? 'Drive ✓' : 'Drive: ligar', driveTokenValido() ? 'ok' : 'warn');\n}\nfunction driveGarantirToken(){\n  if (driveTokenValido() || !tokenClient) return;\n  tokenClient.requestAccessToken({ prompt: localStorage.getItem('faturas_drive_consent') ? '' : 'consent' });\n}\n$('#st-dr').onclick = () => { if (driveTokenValido()) driveGravarAgora(true); else { drivePendente = true; driveGarantirToken(); } };\n$('#st-sb').onclick = () => carregar();\n\nfunction driveAgendar(ms = 2500){ return;\n  drivePendente = true;\n  if (!driveTokenValido()) { estadoDR('Drive: ligar', 'warn'); return; }\n  estadoDR('Drive…', 'warn');\n  clearTimeout(driveTimer); driveTimer = setTimeout(() => driveGravarAgora(false), ms);\n}\nasync function driveGravarAgora(manual){\n  const tok = driveTokenValido();\n  if (!tok) { drivePendente = true; driveGarantirToken(); return; }\n  if (driveOcupado) { driveAgendar(2000); return; }\n  driveOcupado = true; drivePendente = false; estadoDR('Drive ↑', 'warn');\n  try {\n    const pasta = await driveObterPasta(tok);\n    const anos = [...new Set(TODAS.map(f => f.ano))];\n    for (const ano of anos) {\n      const out = XLSX.write(construirExcel(ano), { bookType: 'xlsx', type: 'array' });\n      const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });\n      await driveGuardarFicheiro(tok, pasta, `ARCA_Faturas_${ano}.xlsx`, blob);\n    }\n    const agora = new Date().toLocaleString('pt-PT');\n    localStorage.setItem('faturas_drive_ultima', agora);\n    estadoDR('Drive ✓', 'ok'); if (manual) toast('Cópia gravada no Google Drive.');\n    if (VISTA === 'mais') renderMais();\n  } catch (err) {\n    if (err.status === 401) { localStorage.removeItem('faturas_drive_tok'); drivePendente = true; estadoDR('Drive: ligar', 'warn'); }\n    else { estadoDR('Drive: erro', 'bad'); drivePendente = true; }\n    if (manual) toast('Erro no Google Drive: ' + err.message, 5000);\n  } finally { driveOcupado = false; }\n}\nasync function gapi(tok, url, opt = {}){\n  const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + tok, ...(opt.headers||{}) } });\n  if (!r.ok) { const e = new Error('Google respondeu ' + r.status); e.status = r.status; throw e; }\n  return r.json();\n}\nasync function driveObterPasta(tok){\n  let id = localStorage.getItem('faturas_drive_pasta');\n  if (id) { try { const f = await gapi(tok, `https://www.googleapis.com/drive/v3/files/${id}?fields=id,trashed`); if (!f.trashed) return id; } catch (e) { if (e.status === 401) throw e; } }\n  const q = encodeURIComponent(`name='${DRIVE_PASTA.replace(/'/g,\"\\\\'\")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);\n  const l = await gapi(tok, `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);\n  if (l.files?.length) id = l.files[0].id;\n  else id = (await gapi(tok, 'https://www.googleapis.com/drive/v3/files', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: DRIVE_PASTA, mimeType: 'application/vnd.google-apps.folder' }) })).id;\n  localStorage.setItem('faturas_drive_pasta', id);\n  return id;\n}\nasync function driveGuardarFicheiro(tok, pasta, nome, blob){\n  const q = encodeURIComponent(`name='${nome}' and '${pasta}' in parents and trashed=false`);\n  const l = await gapi(tok, `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);\n  if (l.files?.length) {\n    return gapi(tok, `https://www.googleapis.com/upload/drive/v3/files/${l.files[0].id}?uploadType=media`, { method: 'PATCH', body: blob });\n  }\n  const fd = new FormData();\n  fd.append('metadata', new Blob([JSON.stringify({ name: nome, parents: [pasta] })], { type: 'application/json' }));\n  fd.append('file', blob);\n  return gapi(tok, 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', { method: 'POST', body: fd });\n}\n\n/* =========================================================\n   ARRANQUE, PWA E ATUALIZAÇÃO\n   ========================================================= */\nwindow.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (VISTA === 'mais') renderMais(); });\ndocument.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#app').classList.contains('hidden') && $('#sheet').classList.contains('hidden')) carregar(true); });\nwindow.addEventListener('offline', () => estadoSB('Sem internet', 'bad'));\nwindow.addEventListener('online', () => carregar(true));\nif (/error_description=/.test(location.hash)) {\n  const p = new URLSearchParams(location.hash.slice(1));\n  setTimeout(() => { mostrarLogin(); msgLogin('O link expirou ou já foi usado. Peça um novo em “Esqueci-me da password”.'); }, 300);\n  history.replaceState(null, '', location.pathname);\n} else {\n  setTimeout(arrancar, 150);\n}\n<\/script>\n<script>/*__RELATORIO__*/<\/script>\n<\/body>\n<\/html>\n\n";
